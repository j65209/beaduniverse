<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>꿀꿀집 카드뉴스 템플릿</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<!--
  꿀꿀집 카드뉴스 템플릿 (1080×1350 · 인스타 4:5)
  render.mjs 가 이 파일을 헤드리스 Edge 로 열어 window.render(data) → window.only(i) → 한 장씩 JPG 로 찍는다.
  브라우저로 template.html?demo=1 을 열면 예시 데이터로 전체 카드를 미리 볼 수 있다.
  데이터 모양은 아래 DEMO 참고. 글자는 전부 이스케이프하고, ==강조== 와 줄바꿈만 꾸민다.
-->
<style>
  :root{
    --cream:#f8f1e7; --cream2:#f1e6d6; --paper:#fffdf9; --line:#eadcc8;
    --pink:#f3a39c; --pink2:#e9837b; --pinkwash:#fde3df;
    --honey:#ffc94a; --honey2:#f5b10a; --honeywash:#fff1c7;
    --ink:#3b2d27; --sub:#7c6a60; --mute:#a8978a; --hot:#ef5d50;
    --font:'Pretendard','Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e9e2d8}
  body{font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
  #root{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}
  body.capture #root{display:block;padding:0;gap:0}
  body.capture{background:var(--cream);overflow:hidden}
  body.capture .slide{display:none}
  body.capture .slide.on{display:flex}
  body.demo .slide{zoom:.5}

  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--cream);display:flex;flex-direction:column;padding:72px 80px 64px}
  .slide::before{content:'';position:absolute;right:-180px;top:-200px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,var(--pinkwash) 0%,rgba(253,227,223,0) 70%);pointer-events:none}
  .slide::after{content:'';position:absolute;left:-220px;bottom:-260px;width:640px;height:640px;border-radius:50%;background:radial-gradient(circle,var(--honeywash) 0%,rgba(255,241,199,0) 70%);pointer-events:none}
  .slide > *{position:relative;z-index:1}

  .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:44px}
  .brand{display:inline-flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:12px 28px 12px 20px;font-size:34px;font-weight:800;letter-spacing:-.5px;box-shadow:6px 6px 0 var(--ink)}
  .brand i{font-style:normal;font-size:38px}
  .page{font-size:30px;font-weight:700;color:var(--sub);letter-spacing:1px}

  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:27px;color:var(--sub);font-weight:600;padding-top:28px}
  .clist + .sticker + .foot{margin-top:0}
  .foot b{color:var(--ink);font-weight:800}

  mark{background:linear-gradient(transparent 58%,var(--honey) 58%,var(--honey) 92%,transparent 92%);color:inherit;padding:0 4px}

  /* 표지 */
  .kicker{display:inline-flex;align-self:flex-start;align-items:center;gap:10px;background:var(--honey);border-radius:16px;padding:12px 26px;font-size:40px;font-weight:900;letter-spacing:-.5px;margin-bottom:26px}
  .date{font-size:42px;font-weight:700;color:var(--sub);margin-bottom:18px}
  .ctitle{font-size:112px;line-height:1.14;font-weight:900;letter-spacing:-4px;white-space:pre-line;max-height:262px;overflow:hidden}
  .csub{font-size:36px;color:var(--sub);font-weight:600;margin:20px 0 0}
  .clist{margin-top:auto;background:var(--paper);border:3px solid var(--ink);border-radius:36px;padding:20px 40px;box-shadow:10px 10px 0 var(--ink);display:flex;flex-direction:column}
  .clist div{display:flex;align-items:center;gap:22px;padding:11px 0;border-bottom:2px dashed var(--line);font-size:35px;font-weight:700;letter-spacing:-.5px;white-space:nowrap;overflow:hidden}
  .clist div:last-child{border-bottom:0}
  .clist .n{flex:none;width:54px;height:54px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900}
  .clist .t{overflow:hidden;text-overflow:ellipsis;flex:1}
  .clist .p{flex:none;color:var(--pink2);font-weight:900}
  .clist .g{flex:none;font-size:23px;font-weight:900;color:#fff;background:var(--hot);border-radius:10px;padding:5px 10px;letter-spacing:0}
  .sticker{position:absolute;right:70px;top:150px;width:200px;height:200px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;text-align:center;font-size:34px;font-weight:900;line-height:1.15;transform:rotate(10deg);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);white-space:pre-line}
  .sticker span{font-size:72px;display:block;line-height:1}
  /* 딜 카드 오른쪽 위 특가 스티커 */
  .flag{position:absolute;right:66px;top:150px;width:196px;height:196px;border-radius:50%;background:var(--hot);color:#fff;display:grid;place-items:center;text-align:center;font-size:40px;font-weight:900;line-height:1.08;letter-spacing:-1px;transform:rotate(12deg);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);white-space:pre-line;padding:18px}

  /* 딜 카드 */
  .dhead{display:flex;align-items:center;gap:20px;margin-bottom:30px}
  .num{width:104px;height:104px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-size:52px;font-weight:900;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
  .cat{background:var(--paper);border:3px solid var(--ink);border-radius:999px;padding:10px 26px;font-size:34px;font-weight:800}
  .dbrand{font-size:44px;font-weight:800;color:var(--sub);letter-spacing:1px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dbody{margin:auto 0;display:flex;flex-direction:column}
  .dbody + .foot{margin-top:0}
  .dname{font-size:112px;line-height:1.12;font-weight:900;letter-spacing:-4px;max-height:252px;overflow:hidden;margin-bottom:36px}
  .dbrand{padding-right:230px}
  .pricebox{background:var(--paper);border:3px solid var(--ink);border-radius:40px;padding:30px 44px 28px;box-shadow:10px 10px 0 var(--ink);margin-bottom:32px}
  .plabel{font-size:36px;font-weight:900;color:var(--hot);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow{display:flex;align-items:flex-end;gap:24px;flex-wrap:nowrap}
  .price{font-size:128px;line-height:1;font-weight:900;letter-spacing:-4px;white-space:nowrap;background:linear-gradient(transparent 62%,var(--honey) 62%,var(--honey) 94%,transparent 94%);padding:0 6px}
  .off{flex:none;background:var(--pink2);color:#fff;font-size:44px;font-weight:900;border-radius:18px;padding:8px 18px;margin-bottom:14px}
  .was{font-size:32px;color:var(--sub);margin-top:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .was s{color:var(--mute);font-weight:600}
  .was b{color:var(--ink)}
  .was em{font-style:normal;color:var(--hot);font-weight:900}
  /* 제품 사진 (판매처 대표 이미지) — 있으면 딜 카드 위쪽에 */
  .photo{position:relative;height:360px;background:#fff;border:3px solid var(--ink);border-radius:36px;box-shadow:10px 10px 0 var(--ink);margin-bottom:30px;overflow:hidden}
  .photo .ph{position:absolute;inset:18px;display:grid;place-items:center;overflow:hidden;border-radius:20px}
  .photo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .photo img.cropped{position:absolute;max-width:none;max-height:none}
  /* 딜마다 재치 있는 한 줄 제목 (친근한 말투, 2026-11-11 사용자 예시) */
  .hook{font-size:40px;font-weight:900;color:var(--hot);letter-spacing:-1px;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:200px}
  .has-photo .hook{font-size:36px;margin-bottom:6px;padding-right:0}
  .has-photo .dname{font-size:84px;max-height:189px;margin-bottom:24px;letter-spacing:-3px}
  .has-photo .dbrand{font-size:36px;margin-bottom:4px}
  .has-photo .pricebox{padding:22px 40px 20px;margin-bottom:24px}
  .has-photo .plabel{font-size:32px;margin-bottom:4px}
  .has-photo .price{font-size:104px}
  .has-photo .was{margin-top:10px;font-size:30px}
  .has-photo .info{margin-bottom:20px}
  .info{display:flex;flex-direction:column;gap:14px;margin-bottom:28px}
  .info div{font-size:36px;font-weight:700;display:flex;gap:14px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .info i{font-style:normal;flex:none;width:52px;text-align:center}
  .tip{display:flex;gap:22px;align-items:flex-start}
  .tip .pig{flex:none;font-size:80px;line-height:1}
  .tip p{position:relative;background:var(--pinkwash);border-radius:30px;padding:24px 30px;font-size:34px;line-height:1.42;font-weight:600;max-height:184px;overflow:hidden}
  .tip p::before{content:'';position:absolute;left:-16px;top:30px;border:14px solid transparent;border-right-color:var(--pinkwash);border-left:0}

  /* 마지막 장 */
  .otitle{font-size:116px;line-height:1.15;font-weight:900;letter-spacing:-4px;white-space:pre-line;margin:40px 0 28px}
  .osub{font-size:42px;color:var(--sub);font-weight:700;line-height:1.45;white-space:pre-line;margin-bottom:56px}
  .acts{display:flex;gap:22px;margin-bottom:56px}
  .acts div{flex:1;background:var(--paper);border:3px solid var(--ink);border-radius:30px;padding:30px 0;text-align:center;font-size:38px;font-weight:800;box-shadow:7px 7px 0 var(--ink)}
  .acts div span{display:block;font-size:64px;margin-bottom:10px}
  .cta{background:var(--honey);border:3px solid var(--ink);border-radius:32px;padding:30px 38px;font-size:42px;font-weight:900;line-height:1.32;letter-spacing:-1px;white-space:pre-line;box-shadow:8px 8px 0 var(--ink);margin-bottom:48px;max-height:250px;overflow:hidden}
  .cta mark{background:linear-gradient(transparent 58%,#fff 58%,#fff 92%,transparent 92%)}
  .handle{align-self:flex-start;background:var(--ink);color:var(--cream);border-radius:999px;padding:16px 36px;font-size:44px;font-weight:800;margin-bottom:30px}
  .warn{font-size:30px;color:var(--sub);line-height:1.5;font-weight:600}
  .bigpig{position:absolute;right:60px;bottom:150px;font-size:230px;line-height:1;transform:rotate(-8deg)}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  'use strict';
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  // ==강조== → 꿀색 밑줄, 나머지는 글자 그대로
  var rich = function (s) { return esc(s).replace(/==([^=\n]{1,40})==/g, '<mark>$1</mark>'); };
  var plain = function (s) { return String(s == null ? '' : s).replace(/==/g, ''); };

  // 넘치면 글자를 줄인다 (상자 크기는 CSS 가 정함).
  // 줄 간격이 좁으면 글꼴 위아래가 몇 px 삐져나와 scrollHeight 가 늘 조금 크다 → 글자 크기의 18% 까지는 넘친 걸로 안 친다
  function fit(el, min) {
    var size = parseFloat(getComputedStyle(el).fontSize);
    var guard = 60;
    while (guard-- > 0 && size > min && (el.scrollHeight > el.clientHeight + Math.max(2, size * 0.18) || el.scrollWidth > el.clientWidth + 2)) {
      size -= 3;
      el.style.fontSize = size + 'px';
    }
  }

  function top(i, n) {
    return '<div class="top"><span class="brand"><i>🐷</i>꿀꿀집</span><span class="page">' + (i + 1) + ' / ' + n + '</span></div>';
  }
  // 아래 줄 — 왼쪽 계정, 오른쪽 짧은 안내 (정보 출처는 넣지 않는다 — 2026-11-11 사용자 결정)
  function foot(d, noHandle, note) {
    // 수집 시각이 있으면 '오후 5시 기준 가격이에요' (사용자 요청 2026-11-11 '현재 시각 기준으로')
    var def = d.footNote || (d.asOfLabel ? d.asOfLabel + ' 가격이에요' : '가격 · 재고는 수시로 바뀌어요');
    return '<div class="foot"><span><b>' + (noHandle ? '' : esc(d.handle || '@ggul.ggul.zip')) + '</b></span><span>' + esc(note == null ? def : note) + '</span></div>';
  }
  // '20%' 처럼 숫자만 온 할인율은 '20%↓' 로
  var offText = function (s) { s = String(s || '').trim(); return /^\d+(\.\d+)?%$/.test(s) ? s + '↓' : s; };
  // '62,900원' · '10.1만원' · '정가 83,900원' → 숫자. '18,000원~' 처럼 '부터' 가격이거나 모르면 null
  function won(s) {
    s = String(s || '').replace(/정가|판매가|\s/g, '');
    if (!s || /[~～]|부터|최대|%/.test(s)) return null;
    var m = s.match(/^([\d,.]+)만(\d{1,4})?원?$/);
    if (m) return Math.round(parseFloat(m[1].replace(/,/g, '')) * 10000) + (m[2] ? Number(m[2]) : 0);
    m = s.match(/^([\d,]+)원?$/);
    return m ? Number(m[1].replace(/,/g, '')) : null;
  }
  var fmtWon = function (n) { return n.toLocaleString('ko-KR') + '원'; };
  // 정가 대비 할인율 — 정가 · 판매가가 둘 다 숫자로 확인될 때만, 내림한 정수 (사용자 요청 2026-11-11)
  function discount(x) {
    var was = won(x.was), now = won(x.price);
    if (!was || !now || now >= was) return null;
    return { was: was, now: now, pct: Math.floor((was - now) / was * 100) };
  }

  function cover(d, n) {
    var c = d.cover || {};
    var rows = (d.deals || []).slice(0, 6).map(function (x, k) {
      var dc = discount(x), tag = x.tag || (dc ? dc.pct + '%↓' : ''); // 태그가 없으면 정가 대비 할인율
      return '<div><span class="n">' + String(k + 1).padStart(2, '0') + '</span><span class="t">' + esc(plain(x.short || x.name)) + '</span>' +
        (tag ? '<span class="g">' + esc(tag) + '</span>' : '') + '<span class="p">' + esc(x.price || '') + '</span></div>';
    }).join('');
    return '<section class="slide">' + top(0, n) +
      '<div class="kicker">' + esc(c.kicker || '🍯 오늘의 꿀딜') + '</div>' +
      '<div class="date">' + esc(d.dateLabel || '') + (d.asOfLabel ? ' · ' + esc(d.asOfLabel) : '') + '</div>' +
      '<h1 class="ctitle" data-fit="70">' + rich(c.title || '') + '</h1>' +
      (c.sub ? '<p class="csub">' + esc(c.sub) + '</p>' : '') +
      '<div class="clist">' + rows + '</div>' +
      '<div class="sticker"><div><span>🐷</span>' + esc(c.sticker || '저장\n필수!') + '</div></div>' +
      foot(d) + '</section>';
  }

  function deal(d, x, k, n) {
    var info = [];
    if (x.store) info.push(['🛒', x.store]);
    (x.info || []).slice(0, 2).forEach(function (t) { info.push([t.icon || '✔️', t.text || t]); });
    var dc = discount(x);
    // 할인율 배지: 정가로 계산되면 그 값, 아니면 직접 준 off
    var offBadge = dc ? dc.pct + '%↓' : (x.off ? offText(x.off) : '');
    // 정가 줄: '정가 83,900원 → 판매가 67,120원 (20%↓)'. 정가를 모르면 줄 자체를 안 그린다
    var wasLine = dc ? '<div class="was">정가 <s>' + fmtWon(dc.was) + '</s> → ' + esc(x.nowLabel || '판매가') + ' <b>' + fmtWon(dc.now) + '</b> <em>(' + dc.pct + '%↓)</em></div>'
      : (x.was ? '<div class="was">정가 <s>' + esc(String(x.was).replace(/^정가\s*/, '')) + '</s></div>' : '');
    return '<section class="slide' + (x.image ? ' has-photo' : '') + '">' + top(k + 1, n) +
      (x.flag ? '<div class="flag" data-fit="26">' + esc(x.flag) + '</div>' : '') +
      '<div class="dhead"><span class="num">' + String(k + 1).padStart(2, '0') + '</span><span class="cat">' + esc((x.emoji ? x.emoji + ' ' : '') + (x.category || '')) + '</span></div>' +
      '<div class="dbody">' +
      (x.image ? '<div class="photo"><div class="ph"><img alt="" src="' + esc(x.image) + '"' +
        (Array.isArray(x.imageCrop) && x.imageCrop.length === 4 ? ' data-crop="' + x.imageCrop.map(Number).join(',') + '"' : '') +
        ' onload="window.applyCrop && window.applyCrop(this)"></div></div>' : '') +
      (x.hook ? '<div class="hook">' + esc(x.hook) + '</div>' : '') +
      // 브랜드가 상품 이름과 같으면(만석닭강정 같은) 한 번만
      (x.brand && x.brand.replace(/\s/g, '') !== plain(x.name).replace(/\s/g, '') ? '<div class="dbrand">' + esc(x.brand) + '</div>' : '') +
      '<h2 class="dname" data-fit="56">' + rich(x.name || '') + '</h2>' +
      '<div class="pricebox"><div class="plabel">' + esc(x.priceLabel || '꿀딜가') + '</div>' +
      '<div class="prow"><span class="price" data-fit="70">' + esc(x.price || '') + '</span>' + (offBadge ? '<span class="off">' + esc(offBadge) + '</span>' : '') + '</div>' +
      wasLine + '</div>' +
      '<div class="info">' + info.map(function (r) { return '<div><i>' + esc(r[0]) + '</i><span>' + esc(r[1]) + '</span></div>'; }).join('') + '</div>' +
      (x.tip ? '<div class="tip"><span class="pig">🐷</span><p>' + rich(x.tip) + '</p></div>' : '') +
      '</div>' + foot(d) + '</section>';
  }

  // 판매처 화면 캡처에서 상품 사진 부분만 보여 주기 — imageCrop = [왼, 위, 오른, 아래] (0~1 비율)
  window.applyCrop = function (img) {
    var c = (img.getAttribute('data-crop') || '').split(',').map(Number);
    var box = img.parentNode;
    if (c.length !== 4 || c.some(isNaN) || !img.naturalWidth || !box.clientWidth) return;
    var W = img.naturalWidth, H = img.naturalHeight, bw = box.clientWidth, bh = box.clientHeight;
    var cw = Math.max(1, (c[2] - c[0]) * W), ch = Math.max(1, (c[3] - c[1]) * H);
    var s = Math.min(bw / cw, bh / ch);
    img.classList.add('cropped');
    img.style.width = W * s + 'px'; img.style.height = H * s + 'px';
    img.style.left = (bw - cw * s) / 2 - c[0] * W * s + 'px';
    img.style.top = (bh - ch * s) / 2 - c[1] * H * s + 'px';
    // 자른 범위 밖(앱 버튼 · 가격표)이 옆으로 보이지 않게 가린다
    img.style.clipPath = 'inset(' + c[1] * H * s + 'px ' + (1 - c[2]) * W * s + 'px ' + (1 - c[3]) * H * s + 'px ' + c[0] * W * s + 'px)';
  };
  window.applyCrops = function () { document.querySelectorAll('img[data-crop]').forEach(function (im) { if (im.complete) window.applyCrop(im); }); };

  // 딜 카드에 글이 많아 아래가 넘치면 상품명 → 한마디 → 가격 글자 순으로 줄이고, 그래도 넘치면 덧붙인 정보 줄을 뺀다
  function squeeze(slide) {
    if (!slide || !slide.clientHeight) return;
    // 배경 동그라미(::before · ::after)가 카드 밖까지 뻗어 있어 scrollHeight 로는 늘 넘친다 → 아래 줄이 안쪽 여백을 넘었는지로 본다
    var foot = slide.querySelector('.foot');
    var padB = parseFloat(getComputedStyle(slide).paddingBottom) || 0;
    var over = function () {
      if (!foot) return false;
      var r = slide.getBoundingClientRect(), scale = r.height / 1350; // 미리보기는 zoom .5
      return foot.getBoundingClientRect().bottom > r.bottom - padB * scale + 1;
    };
    var name = slide.querySelector('.dname'), tip = slide.querySelector('.tip p'), price = slide.querySelector('.price');
    var guard = 50;
    while (over() && guard-- > 0) {
      var ns = name ? parseFloat(getComputedStyle(name).fontSize) : 0;
      if (ns > 70) { name.style.fontSize = (ns - 6) + 'px'; name.style.maxHeight = Math.ceil((ns - 6) * 1.12 * 2) + 'px'; continue; }
      var ts = tip ? parseFloat(getComputedStyle(tip).fontSize) : 0;
      if (ts > 28) { tip.style.fontSize = (ts - 2) + 'px'; continue; }
      var ps = price ? parseFloat(getComputedStyle(price).fontSize) : 0;
      if (ps > 96) { price.style.fontSize = (ps - 8) + 'px'; continue; }
      var rows = slide.querySelectorAll('.info div');
      if (rows.length > 1) { rows[rows.length - 1].remove(); continue; }
      // 사진 카드: 한마디 빼기 → 사진 칸 300px 까지 낮추기 → 한 줄 제목 빼기 → 사진 칸 240px 까지
      var ph = slide.querySelector('.photo');
      var tipBox = slide.querySelector('.tip');
      if (tipBox && ph) { tipBox.remove(); tip = null; continue; }
      if (ph && ph.offsetHeight > 300) { ph.style.height = (ph.offsetHeight - 20) + 'px'; continue; }
      var hookEl = slide.querySelector('.has-photo .hook');
      if (hookEl) { hookEl.remove(); continue; }
      if (ph && ph.offsetHeight > 240) { ph.style.height = (ph.offsetHeight - 20) + 'px'; continue; }
      break;
    }
  }

  function outro(d, n) {
    var o = d.outro || {};
    return '<section class="slide">' + top(n - 1, n) +
      '<h2 class="otitle">' + rich(o.title || '오늘의 꿀딜은\n여기까지!') + '</h2>' +
      '<p class="osub">' + esc(o.sub || '매일 아침 세일 정보를 모아 드려요') + '</p>' +
      // 댓글 → 링크 DM 이 실제로 될 때만(cta 를 줄 때만) 저장 · 공유 · 팔로우 자리에 안내 상자
      (d.cta ? '<div class="cta">' + rich(d.cta) + '</div>'

      '<div class="handle">' + esc(d.handle || '@ggul.ggul.zip') + '</div>' +
      '<p class="warn">' + (d.asOfLabel ? esc(d.asOfLabel) + ' 가격이에요. ' : '') + '가격 · 재고 · 쿠폰은 수시로 바뀌어요.<br>구매 전에 판매처에서 꼭 확인하세요!</p>' +
      '<div class="bigpig">🐷</div>' +
      foot(d, true, '') + '</section>';
  }

  window.render = function (d) {
    var deals = (d.deals || []).slice(0, 6); // 표지 목록에 6개까지 들어간다 (표지 + 6 + 마무리 = 8장)
    var n = deals.length + 2;
    var html = cover(d, n) + deals.map(function (x, k) { return deal(d, x, k, n); }).join('') + outro(d, n);
    document.getElementById('root').innerHTML = html;
    document.querySelectorAll('[data-fit]').forEach(function (el) { fit(el, Number(el.getAttribute('data-fit'))); });
    document.querySelectorAll('.slide').forEach(squeeze); // 미리보기(?demo=1)처럼 전부 보일 때만 효과가 있다
    return n;
  };
  // 찍을 때 한 장만 보이게
  window.only = function (i) {
    document.body.classList.add('capture');
    var s = document.querySelectorAll('.slide');
    for (var k = 0; k < s.length; k++) s[k].classList.toggle('on', k === i);
    // 숨겨져 있던 장은 크기가 0이라 맞추기가 안 됐다 → 보일 때 다시 맞춘다
    s[i].querySelectorAll('[data-fit]').forEach(function (el) { el.style.fontSize = ''; el.style.maxHeight = ''; fit(el, Number(el.getAttribute('data-fit'))); });
    squeeze(s[i]);
    return s.length;
  };
  window.allText = function () { return document.getElementById('root').innerText; };

      { category: '생활', emoji: '🧺', brand: '스너글', name: '건조기 드라이시트 40매', short: '스너글 드라이시트 40매', tag: '⚡NEW', flag: '방금\n떴어요!', priceLabel: '⚡ 지금 바로 뜬 특가', price: '2,710원', store: '쿠팡', info: [{ icon: '💡', text: '한 장에 약 68원꼴' }], tip: '이 가격이면 무조건 ==쟁여 두기==!' },
      { category: '패션', emoji: '👓', brand: 'C-27', name: '티타늄 경량 독서 안경', short: 'C-27 티타늄 독서 안경', tag: '🚨긴급', flag: '긴급\n특가!', priceLabel: '🚨 긴급 특가', price: '67,120원', was: '정가 83,900원', off: '20%', store: '네이버 스마트스토어', tip: '가볍고 튼튼한 ==티타늄== 테가 이 가격!' },
    ],

  };
  window.DEMO = DEMO;
