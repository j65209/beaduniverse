<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>시딩 마스터 · 비드유니버스</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="시딩 마스터">
<script>
  /* 오피스 안 화면(iframe, index.html 의 TOOL_PAGES 'seeding')으로 열렸으면 '← 오피스 홈' 은 그 화면을 닫는다 (bbToolClose).
     혼자 열면(독립 프로그램 · 앱으로 설치) 이 페이지의 잠금 화면에서 오피스 접속 코드를 받는다 — 아래 스크립트 '잠금'. */
  (function () {
    var inOffice = false, home = '';
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    window.__seedInOffice = inOffice;
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
    });
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  /* 시딩 마스터 — 오피스 업무용 툴 · 독립 프로그램 (2026-11-20)
     · 1판(같은 날 오전): 구글시트 'x시딩 및 시호님시딩' 을 ERP전산팀 화면으로 보기만.
     · 2판: 사용자 "구글시트는 이제 버릴거야. 시딩마스터 엑셀 함수 기능 다 넣어주고, 수정 가능하게, 독립적인 프로그램으로"
       + "텍스트 컬러 수정 가능하게" + "주의사항 또한 추가할 수 있게, 이모지 최대한 많이"
       → 자료는 오피스 슈퍼베이스 seeding_tabs · seeding_rows (시트에서 15:27 에 옮김), 엑셀처럼 칸을 고치고(수식 · 복사 붙여넣기 · 채우기 ·
         되돌리기 · 칸 색 · 글자 색 · 굵게 · 행 · 열 넣기/지우기 · 정렬 · 필터), 여럿이 같이 고치면 몇 초 안에 서로 보인다.
     · 화면 뼈대 · 색 · 표 모양은 erp/index.html 과 같은 CSS 를 그대로 쓴다 (아래 '시딩 마스터만' 부분만 더함). */
  :root{
    --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --bg:#f3f5f8; --card:#fff; --line:#e3e8ef; --line-2:#edf1f5; --head:#f7f9fb;
    --text:#0f172a; --text-2:#334155; --text-3:#64748b; --text-4:#94a3b8;
    --accent:#16a34a; --accent-ink:#15803d; --accent-soft:#ecfdf3;
    --danger:#dc2626; --warn:#d97706; --info:#2563eb;
    --row-h:34px; --detail-w:400px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  /* 휴대폰: 두 번 눌러 확대 · 누를 때 회색 번쩍임 막기 (두 손가락 확대는 그대로), 끌어내려 새로고침 · 오피스 화면으로 스크롤이 넘어가는 것 막기 (overscroll) */
  html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit}
  .app{height:100vh;height:100dvh;display:flex;overflow:hidden;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  .logo{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 2px 10px rgba(34,197,94,.35)}
  .logo svg{width:16px;height:16px;color:#fff}
  .dscrim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:39}   /* 상세 창(40) 아래 — 전엔 45 라 휴대폰에서 상세 창 위를 덮어, 창을 누르면 그냥 닫혔다 (2026-11-20) */

  /* ── 본문 ── 2026-11-23 왼쪽 어두운 메뉴를 없애고 위 탭으로 (표가 화면 폭을 다 씀) */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:8px;height:54px;padding:0 14px 0 16px;background:var(--card);border-bottom:1px solid var(--line-2)}
  .brand{flex:none;display:flex;align-items:center;gap:9px;margin-right:10px}
  .brand .logo{width:28px;height:28px}
  .brand b{font-size:15.5px;font-weight:800;letter-spacing:-.025em;white-space:nowrap}

  /* ── 위 탭 ── 누르면 바로 그 탭 (점 = 브랜드 색, 숫자 = 아이디 채운 사람 수) */
  .tabs{flex:none;display:flex;align-items:stretch;height:46px;padding:0 10px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;overscroll-behavior-x:contain}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;position:relative;z-index:0;display:inline-flex;align-items:center;gap:7px;padding:0 14px;font-size:14px;font-weight:600;color:var(--text-3);white-space:nowrap}
  .tab:hover{color:var(--text)}
  .tab:hover::before{content:'';position:absolute;inset:6px 3px;border-radius:8px;background:#f3f5f8;z-index:-1}
  .tab .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#cbd5e1}
  .tab small{font-size:11px;font-weight:600;color:var(--text-4)}
  .tab em{flex:none;min-width:22px;height:20px;padding:0 7px;border-radius:999px;display:inline-grid;place-items:center;background:#f1f4f8;color:var(--text-3);font-style:normal;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
  .tab.on{color:var(--text);font-weight:800}
  .tab.on::after{content:'';position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
  .tab.on em{background:var(--accent-soft);color:var(--accent-ink)}
  .tab.on small{color:var(--text-3)}
  .tab:focus-visible{outline:2px solid #93c5fd;outline-offset:-6px;border-radius:10px}
  .tabs .tsep{align-self:center;height:18px;margin:0 6px}
  .tab-add{flex:none;align-self:center;width:32px;height:32px;margin-left:4px;border-radius:8px;display:grid;place-items:center;color:var(--text-4)}
  .tab-add:hover{background:#f1f4f8;color:var(--text)}
  .tab-add svg{width:17px;height:17px}
  .find{flex:0 1 420px;min-width:0;display:flex;align-items:center;gap:7px;height:38px;padding:0 8px 0 13px;border-radius:10px;background:#f1f4f8;border:1px solid transparent;cursor:text}
  .find:focus-within{background:#fff;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .find svg{flex:none;width:16px;height:16px;color:var(--text-4)}
  .find input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:13.5px;color:var(--text)}
  .find input::-webkit-search-cancel-button{display:none}
  .qn{flex:none;font-size:12px;font-weight:700;color:var(--info);white-space:nowrap;font-variant-numeric:tabular-nums}
  .qx{flex:none;width:24px;height:24px;border-radius:50%;color:var(--text-4);font-size:12px}
  .qx:hover{background:#e2e8f0;color:var(--text)}
  .sp{flex:1;min-width:0}
  .st{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .st:hover{background:#f1f4f8;color:var(--text)}
  .st .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .st.is-load .dot{background:transparent;box-shadow:none;width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--accent);animation:spin .8s linear infinite}
  .st.is-stored{color:#b45309;background:#fffbeb}
  .st.is-err{color:#b91c1c}
  .st.is-err .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ib{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);text-decoration:none}
  .ib:hover{background:#f1f4f8;color:var(--text)}
  .ib.on{background:#e8f0fe;color:var(--info)}
  .ib svg{width:18px;height:18px}

  .head{flex:none;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
  .trow h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.025em}
  .date{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid #bbf7d0;border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .dates{display:flex;gap:6px;flex-wrap:wrap}
  .dates button{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .dates button:hover{border-color:#cbd5e1}
  .dates button.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
  .tools{display:flex;align-items:center;gap:8px;margin-left:auto}
  .etog{height:30px;padding:0 12px;border-radius:999px;border:1px dashed #cbd5e1;background:#fff;font-size:12px;color:var(--text-3);white-space:nowrap}
  .etog:hover{border-color:#94a3b8;color:var(--text)}
  .parts{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#f1f4f8}
  .parts button{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .parts button:hover{color:var(--text)}
  .parts button.on{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.12)}
  .alert{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px;padding:7px 12px;border-radius:9px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;line-height:1.55}
  .alert svg{flex:none;width:16px;height:16px;margin-top:2px;color:#d97706}
  .alert ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:1px 0}
  .alert li+li::before{content:'·';margin:0 9px;color:#d97706;font-weight:800}
  .al-more{display:none}   /* 휴대폰에서만 — 안내는 첫 줄만, 누르면 전부 */
  /* 요약 숫자 · 책임자 칩 · 단추를 한 줄로 (2026-11-23 — 전엔 큰 카드 줄 + 칩 줄 따로라 표가 아래로 밀렸다) */
  .hrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .hrow .tools{margin-left:auto}
  .kpis{display:flex;gap:6px;flex-wrap:wrap}
  .kpis:empty{display:none}
  .kpi{flex:none;display:inline-flex;align-items:baseline;gap:5px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;text-align:left;cursor:default;white-space:nowrap;line-height:30px}
  .kpi b{font-size:15px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--text)}
  .kpi b small{font-size:11px;font-weight:700;margin-left:1px;color:var(--text-3)}
  .kpi span{font-size:12px;color:var(--text-3)}
  .kpi.click{cursor:pointer}
  .kpi.click:hover{border-color:#cbd5e1;background:#fafbfc}
  .kpi.red b{color:var(--danger)}
  .kpi.amber b{color:var(--warn)}
  .kpi.blue b{color:var(--info)}
  .kpi.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(22,163,74,.18);background:#f6fef9}
  .kpi.on span{color:var(--text);font-weight:700}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:8px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);white-space:nowrap}
  .chip:hover{border-color:#cbd5e1}
  .chip em{font-style:normal;font-size:11.5px;color:var(--text-4);font-variant-numeric:tabular-nums}
  .chip.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
  .chip.on em{color:#cbd5e1}

  /* ── 표 ── */
  .gwrap{flex:1;min-height:0;position:relative;background:var(--card)}
  .grid{position:absolute;inset:0;overflow:auto;outline:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .tbl{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;color:var(--text)}
  .tbl th{position:sticky;top:0;z-index:3;height:44px;padding:5px 8px;background:var(--head);color:var(--text-3);font-size:12px;font-weight:700;line-height:1.3;text-align:left;vertical-align:middle;white-space:normal;text-wrap:balance;overflow:hidden;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);cursor:pointer;user-select:none}
  .tbl th.ka{word-break:keep-all}   /* 띄어 쓴 머리글은 낱말 사이에서만 줄바꿈 ('남은 / 재고') */
  .tbl th:hover{color:var(--text)}
  .tbl th.sk{z-index:4}
  .tbl th .ar{margin-left:4px;font-size:9px;color:var(--accent)}
  .tbl th.fill,.tbl td.fill{padding:0;border-right:0;cursor:default}
  .tbl td{height:var(--row-h);padding:0 8px;background:#fff;border-bottom:1px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app.dense .tbl td{height:28px}
  .tbl .cl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal;line-height:1.25;word-break:keep-all;overflow-wrap:break-word}
  .app.dense .tbl .cl{-webkit-line-clamp:1}
  .tbl .r{text-align:left;font-variant-numeric:tabular-nums}   /* 2026-11-19 사용자 "전체 모두 좌측정렬" — 숫자 · 체크 · 사진 칸도 왼쪽 */
  .tbl .c{text-align:left}
  .tbl td.r,.tbl td.c,.tbl th.r,.tbl th.c{padding-left:6px;padding-right:6px}   /* 숫자 · 체크 칸은 좁게 (fitCols 의 여백과 같게) */
  .tbl .b{font-weight:700}
  .tbl .z{color:#c3cad4}
  .tbl .neg{color:var(--danger);font-weight:700}
  .tbl .rn{color:var(--text-4);font-size:11.5px;text-align:left;font-variant-numeric:tabular-nums;padding:0 7px 0 3px}
  .tbl .sk{position:sticky;z-index:1}
  .tbl .skl{border-right:1px solid #d5dce5}
  .tbl tbody tr{cursor:pointer}
  @media (hover:hover){ .tbl tbody tr:not(.vsp):hover td{box-shadow:inset 0 0 0 999px rgba(15,23,42,.035)} }   /* 휴대폰은 누른 뒤 회색이 남지 않게 */
  /* 줄이 많은 탭은 보이는 줄 근처만 그리고, 위 · 아래는 빈 줄 하나(높이만)로 채운다 (renderGrid · paintRows) */
  .tbl tbody tr.vsp{cursor:default}
  .tbl tbody tr.vsp td{padding:0;border:0;background:transparent}
  .tbl tbody tr.on td{box-shadow:inset 0 0 0 999px rgba(37,99,235,.075)}
  .tbl tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--info),inset 0 0 0 999px rgba(37,99,235,.075)}
  .tbl tr.empty td{height:120px;text-align:center;color:var(--text-4);cursor:default;box-shadow:none!important}
  .tbl tfoot td{position:sticky;bottom:0;z-index:2;height:36px;background:#f1f5f9;border-top:1px solid #cbd5e1;border-bottom:0;font-weight:700;font-variant-numeric:tabular-nums}
  .tbl tfoot td.sk{z-index:3}
  .tbl tfoot .ft{font-size:12px;color:var(--text-3);font-weight:700}
  .tag{display:inline-block;max-width:100%;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.4;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag+.tag{margin-left:4px}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.4;vertical-align:middle}
  .pill.red{background:#fef2f2;color:#b91c1c}
  .pill.gray{background:#f1f5f9;color:#475569}
  .pill.blue{background:#eff6ff;color:#1d4ed8}
  .pill-sub{margin-left:6px;font-size:12px;color:var(--text-3);vertical-align:middle}
  .pill-sub:first-child{margin-left:0}
  .ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#dcfce7;color:#15803d;vertical-align:middle}
  .ck svg{width:12px;height:12px}
  .ck0{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid #d5dce5;vertical-align:middle}
  .thumb{display:block;margin:2px 0;width:30px;height:30px;border-radius:6px;object-fit:cover;background:#f1f5f9;cursor:zoom-in}
  .app.dense .thumb{width:24px;height:24px;margin:1px 0}
  .lnk{color:var(--info);text-decoration:none}
  .lnk:hover{text-decoration:underline}
  mark{background:#fef08a;color:inherit;border-radius:2px;padding:0 1px}
  .skel{padding:6px 0}
  .skel div{display:flex;gap:22px;align-items:center;height:34px;padding:0 16px;border-bottom:1px solid var(--line-2)}
  .skel i{display:block;height:9px;border-radius:5px;background:#edf1f5}
  .msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));padding:22px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 12px 34px rgba(15,23,42,.14);font-size:13.5px;line-height:1.6;color:var(--text-2);z-index:20;text-align:center}
  .msg b{display:block;font-size:15.5px;color:var(--text);margin-bottom:6px}
  .msg button{margin-top:14px;height:36px;padding:0 18px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}

  /* ── 상세 창 (줄을 누르면) ── */
  .detail{position:fixed;top:0;right:0;bottom:0;z-index:40;width:var(--detail-w);max-width:100%;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 34px rgba(15,23,42,.1)}
  @media (min-width:1280px){ .app.has-detail .main{margin-right:var(--detail-w)} .detail{box-shadow:none} }
  .dh{flex:none;padding:14px 18px 14px;border-bottom:1px solid var(--line)}
  .dgrab{display:none;width:40px;height:5px;margin:0 auto 8px;border-radius:3px;background:#cbd5e1}   /* 휴대폰 — 잡고 끌어내리면 닫힘 */
  .dh-top{display:flex;align-items:center;gap:8px}
  .dh-cap{flex:1;font-size:12px;font-weight:700;color:var(--text-3)}
  .dh-top button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
  .dh-top button:hover{background:#f1f4f8;color:var(--text)}
  .dh-top svg{width:17px;height:17px}
  .d-title{margin-top:6px;font-size:18px;font-weight:800;line-height:1.35;letter-spacing:-.02em;word-break:break-word}
  .d-sub{margin-top:4px;font-size:12.5px;color:var(--text-3);line-height:1.5}
  .d-sheet{display:inline-flex;align-items:center;gap:5px;margin-top:10px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-2);text-decoration:none}
  .d-sheet:hover{border-color:#cbd5e1;color:var(--text)}
  .dbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 18px 22px}
  .dl{display:grid;grid-template-columns:118px 1fr;margin:0}
  .dl dt{padding:10px 0;font-size:12.5px;color:var(--text-3);border-bottom:1px solid var(--line-2)}
  .dl dd{margin:0;padding:10px 0 10px 12px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line-2);word-break:break-word;white-space:pre-wrap}
  .dl dd.r{font-variant-numeric:tabular-nums;font-weight:700}
  .dl .none{color:var(--text-4)}
  .dl .ckt{margin-left:4px;color:#15803d;font-weight:700}
  .dimg{display:block;max-width:100%;max-height:220px;border-radius:10px;background:#f1f5f9;cursor:zoom-in}
  .lb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(15,23,42,.82);cursor:zoom-out;padding:24px}
  .lb img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}

  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:80;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:#0f172a;color:#fff;font-size:13px;font-weight:600;line-height:1.45;box-shadow:0 12px 30px rgba(15,23,42,.25)}
  .toast.err{background:#b91c1c}
  /* 아이폰 · 아이패드는 16px 보다 작은 입력 칸을 누르면 화면을 확대해 버린다 (찾기 · 고치기 칸) */
  @media (max-width:720px),(pointer:coarse){ .find input,.edbox input,.edbox textarea{font-size:16px} }

  /* 휴대폰 (세로) · 가로로 눕힌 휴대폰 — 위쪽은 작게, 표는 넓게. 탭 줄은 옆으로 밀어 넘긴다 */
  @media (max-width:720px),(max-height:520px){
    .bar{height:52px;padding:0 6px 0 10px;gap:4px}
    .brand{margin-right:4px}
    .brand b{display:none}
    .find{flex:1 1 auto;height:38px}
    .st{padding:0 8px}
    .st #stText,#btnFull,#btnDense{display:none}
    .st.is-err #stText,.st.is-stored #stText{display:inline;font-size:11.5px}
    .tabs{height:44px;padding:0 4px}
    .tab{padding:0 12px;font-size:14px}
    .tab small{display:none}
    .head{padding:8px 12px}
    .alert{margin-bottom:8px;padding:7px 11px;font-size:12px;line-height:1.5;cursor:pointer}
    .alert ul{flex:1;min-width:0;display:block}
    .alert li+li::before{content:none}
    .alert.fold li+li{display:none}
    .alert.fold li{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
    .al-more{display:block;flex:none;align-self:center;font-size:11.5px;font-weight:700;color:#b45309;white-space:nowrap}
    /* 요약 숫자 · 칩 · 단추 = 한 줄, 옆으로 밀어 넘김 */
    .hrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:1px 12px;overscroll-behavior-x:contain}
    .hrow::-webkit-scrollbar{display:none}
    .kpis,.chips{flex:none;flex-wrap:nowrap;overflow:visible}
    .hrow .tools{flex:none;margin-left:6px;gap:6px}
    .etog{height:30px;padding:0 11px;font-size:12px}
    .kpi{height:32px;padding:0 11px}
    .chip{height:32px}
    /* 표를 아래로 넘기면 위쪽(안내 · 요약 숫자 · 칩)을 접어 표를 넓게 — 맨 위로 오면 다시 편다 (headScroll). 탭 줄은 그대로 */
    .app.hmin .head{display:none}
  }
  @media (max-width:720px){
    :root{--row-h:42px}
    /* 상세 창 = 아래에서 올라오는 판 — 위 손잡이를 끌어내리면 닫힘 */
    .detail{top:auto;left:0;width:100%;height:80vh;height:80dvh;border-left:0;border-radius:18px 18px 0 0;box-shadow:0 -14px 34px rgba(15,23,42,.2);padding-bottom:env(safe-area-inset-bottom);animation:sheetUp .22s cubic-bezier(.2,.8,.2,1)}
    .dh{padding:8px 16px 12px;touch-action:none}
    .dgrab{display:block}
    .dh-top button{width:38px;height:38px}
    .d-title{font-size:17px}
    .dbody{padding:2px 16px 20px}
    .dl{grid-template-columns:104px 1fr}
    .dl dt{padding:12px 0}
    .dl dd{padding:12px 0 12px 12px}
  }
  @keyframes sheetUp{from{transform:translateY(100%)}}
  @media (prefers-reduced-motion:reduce){ .detail{animation:none} }
  @media (pointer:coarse){   /* 손가락으로 누르기 좋게 */
    .ib{width:40px;height:40px}
  }

  /* ── 시딩 마스터만 (위는 erp/index.html 과 같은 CSS) ── */
  .main{min-height:0}
  .pill.sent{background:#fef3c7;color:#92400e}
  .tbl td .pill.sent{margin-left:6px;padding:1px 7px;font-size:11px}
  .bd{display:inline-flex;align-items:center;gap:7px;font-weight:600}
  .bd i{flex:none;width:8px;height:8px;border-radius:50%}
  .kpi.gold b{color:#b45309}
  .kpi.green b{color:var(--accent-ink)}
  .kpi.on.gold{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.16)}
  .etog.solid{border-style:solid;font-weight:700;color:var(--text-2)}
  .d-hint{margin-top:9px;font-size:11.5px;line-height:1.45;color:var(--text-4)}
  .dacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .dacts .d-sheet{margin-top:0;background:#fff;cursor:pointer}
  .dacts button.d-sheet:disabled{opacity:.45;cursor:default}
  .dl dd .ln+.ln{margin-top:5px;padding-top:5px;border-top:1px dashed var(--line-2)}
  .dl dd.ed-ok{cursor:text;position:relative;padding-right:52px}
  @media (hover:hover){
    .dl dd.ed-ok:hover{background:#f6f9ff;box-shadow:inset 0 0 0 1px #c7d7fe;border-radius:6px}
    .dl dd.ed-ok:hover::after{content:'✎ 고치기';position:absolute;right:6px;top:10px;font-size:11px;font-weight:700;color:var(--info);white-space:nowrap}
  }
  @media (hover:none){ .dl dd.ed-ok{padding-right:0} }

  /* ── 도구 막대 (엑셀 리본 대신 한 줄) + 수식 입력줄 ── */
  .tbar{flex:none;display:flex;align-items:center;gap:2px;min-height:46px;padding:5px 12px;background:var(--card);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
  .tbar::-webkit-scrollbar{display:none}
  .tb{flex:none;position:relative;height:32px;min-width:32px;padding:0 8px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:5px;color:var(--text-2);font-size:12.5px;font-weight:600;white-space:nowrap}
  .tb:hover{background:#f1f4f8;color:var(--text)}
  .tb:disabled{opacity:.32;cursor:default;background:none}
  .tb svg{width:17px;height:17px}
  .tb b{font-size:15px;font-weight:900;font-family:Georgia,'Times New Roman',serif}
  .tb.on{background:#e8f0fe;color:var(--info)}
  .tb.cl i{position:absolute;left:9px;right:9px;bottom:4px;height:3px;border-radius:2px;background:#0f172a}
  .tb .em{font-size:16px;line-height:1}
  .tsep{flex:none;width:1px;height:20px;margin:0 5px;background:var(--line)}
  .fbar{flex:1 1 300px;min-width:220px;display:flex;align-items:center;height:32px;margin-left:8px;border:1px solid var(--line);border-radius:8px;background:#fff;overflow:hidden}
  .fbar:focus-within{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .fref{flex:none;min-width:54px;height:100%;padding:0 8px;display:grid;place-items:center;border-right:1px solid var(--line);font-size:12px;font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums;background:#f8fafc}
  .ffx{flex:none;height:100%;padding:0 9px;font:italic 700 14px Georgia,'Times New Roman',serif;color:var(--text-4)}
  .ffx:hover{color:var(--info);background:#f1f4f8}
  .fin{flex:1;min-width:0;height:100%;padding:0 8px;border:0;outline:0;font:inherit;font-size:13px;background:transparent;color:var(--text)}
  .fin:disabled{background:#f8fafc}

  /* ── 엑셀 같은 표 (열 글자 · 행 번호 · 칸 고르기 · 채우기 손잡이) ── */
  .grid.xlg{outline:0}
  .tbl.xl td{border-right:1px solid var(--line-2);cursor:cell;user-select:none;-webkit-user-select:none}
  .tbl.xl td.rn{cursor:pointer;background:#f8fafc;border-right:1px solid #d5dce5}
  .tbl.xl thead th{cursor:pointer}
  .tbl.xl thead tr.lt th{top:0;height:22px;padding:0 4px;background:#f8fafc;color:var(--text-4);font-size:11px;font-weight:600;text-align:center;border-bottom:1px solid var(--line-2)}
  .tbl.xl thead tr.hd th{top:22px;position:sticky;padding-right:22px}
  .tbl.xl thead tr.hd th.rn{padding-right:7px}
  .tbl.xl thead th.hl,.tbl.xl td.rn.hl{background:#dbeafe;color:#1d4ed8}
  .tbl.xl thead th .hm{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--text-4);font-size:10px;opacity:0}
  .tbl.xl thead th:hover .hm,.tbl.xl thead th .hm.on{opacity:1}
  .tbl.xl thead th .hm:hover{background:#e2e8f0;color:var(--text)}
  .tbl.xl thead th .hm.on{color:var(--info)}
  .tbl.xl thead th .rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2}
  .tbl.xl thead th .rz:hover,.tbl.xl thead th .rz.on{background:rgba(37,99,235,.35)}
  .tbl.xl thead th .ph{margin-left:3px;font-size:10px;color:#b45309}
  @media (hover:hover){ .tbl.xl tbody tr:hover td{box-shadow:none} .tbl.xl tbody tr:not(.addr):hover td:not(.sel):not(.rn){background-image:linear-gradient(rgba(15,23,42,.025),rgba(15,23,42,.025))} }
  .tbl.xl td.sel{background-image:linear-gradient(rgba(37,99,235,.11),rgba(37,99,235,.11))}
  .tbl.xl td.act{box-shadow:inset 0 0 0 2px var(--info)!important}
  .tbl.xl td.fh:not(.sk){position:relative}
  .tbl.xl td.fh::after{content:'';position:absolute;right:0;bottom:0;width:7px;height:7px;background:var(--info);border:1px solid #fff;border-radius:1px;z-index:2;cursor:crosshair}
  .tbl.xl td.fl{background-image:linear-gradient(rgba(37,99,235,.06),rgba(37,99,235,.06));box-shadow:inset 0 0 0 1px rgba(37,99,235,.45)!important}
  .tbl.xl td .lnk{color:var(--info);text-decoration:none}
  .tbl.xl td .lnk:hover{text-decoration:underline}
  .tbl.xl td .ferr{color:var(--danger);font-weight:700}
  .tbl.xl td .msk{color:var(--text-3)}
  .tbl.xl td .dd{float:right;margin-left:4px;color:var(--text-4);font-size:10px;line-height:var(--row-h)}
  .tbl.xl tr.addr td{height:36px;padding:0 12px;color:var(--text-4);font-size:12.5px;cursor:pointer;background:#fff;border-right:0}
  .tbl.xl tr.addr td:hover{color:var(--info);background:#f8fbff}
  .tbl.xl tr.addr td.rn{background:#f8fafc}
  .tbl.xl .ck0,.tbl.xl .ck{cursor:pointer}

  /* 칸 고치기 상자 — 쉴 때는 보이지 않게 그 칸 위에 있다가(한글 입력이 바로 되도록) 글자를 치면 그 자리에서 열린다 */
  #ed{position:fixed;z-index:60;left:-9999px;top:0;width:40px;height:30px;margin:0;padding:7px 8px;border:2px solid var(--info);border-radius:2px;background:#fff;color:var(--text);font:400 13px/1.4 var(--ui);resize:none;outline:0;box-shadow:0 8px 22px rgba(15,23,42,.18);overflow:hidden;white-space:pre-wrap;word-break:break-word}
  #ed.idle{opacity:0;pointer-events:none;caret-color:transparent;box-shadow:none}
  .ddl,.cmenu,.pal{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 18px 44px rgba(15,23,42,.2);font-size:13px}
  .ddl{min-width:170px;max-width:380px;max-height:300px;overflow:auto;padding:5px}
  .ddl .it{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
  .ddl .it.on,.ddl .it:hover{background:#eff6ff}
  .ddl .it small{flex:1;min-width:0;color:var(--text-3);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
  .ddl .it code{font:600 12px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text)}
  .ddl .hint{padding:6px 9px 4px;font-size:11.5px;color:var(--text-4)}
  .ddl .grp{padding:8px 9px 3px;font-size:11px;font-weight:800;color:var(--text-3)}
  .cmenu{min-width:210px;padding:5px}
  .cmenu button{width:100%;display:flex;align-items:center;gap:9px;height:32px;padding:0 10px;border-radius:7px;text-align:left;color:var(--text)}
  .cmenu button:hover{background:#f1f4f8}
  .cmenu button:disabled{opacity:.4;cursor:default;background:none}
  .cmenu button kbd{margin-left:auto;font:500 11px var(--ui);color:var(--text-4)}
  .cmenu button.dng{color:var(--danger)}
  .cmenu hr{margin:4px 6px;border:0;border-top:1px solid var(--line-2)}
  /* 위 막대 ⋯ (더 보기) — 새 탭 · 엑셀 · 도움말 · 오피스 홈 (예전 왼쪽 메뉴 아래 단추들) */
  .cmenu.more{min-width:220px}
  .cmenu.more a{display:flex;align-items:center;gap:9px;height:34px;padding:0 10px;border-radius:7px;color:var(--text);text-decoration:none}
  .cmenu.more a:hover{background:#f1f4f8}
  .cmenu.more button{height:34px}
  .cmenu.more svg{flex:none;width:16px;height:16px;color:var(--text-3)}
  @media (pointer:coarse){ .cmenu.more button,.cmenu.more a{height:42px;font-size:14px} }
  .pal{padding:10px;width:258px}
  .pal .pt{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .pal .pt b{flex:1;font-size:12.5px}
  .pal .pt button{height:26px;padding:0 9px;border-radius:7px;border:1px solid var(--line);font-size:12px;color:var(--text-2)}
  .pal .sw{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
  .pal .sw button{aspect-ratio:1;border-radius:4px;border:1px solid rgba(15,23,42,.12)}
  .pal .sw button:hover{transform:scale(1.18);box-shadow:0 2px 6px rgba(15,23,42,.25)}
  .pal .sw button.on{outline:2px solid var(--info);outline-offset:1px}
  .pal .cu{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:12px;color:var(--text-3)}
  .pal .cu input{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff}
  .emo{position:fixed;z-index:75;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 44px rgba(15,23,42,.22);overflow:hidden}
  .emo emoji-picker{--num-columns:9;--emoji-size:1.5rem;--emoji-padding:.35rem;--border-size:0;--background:#fff;--outline-color:#93c5fd;width:min(372px,calc(100vw - 16px));height:min(410px,calc(100vh - 80px))}
  .emo .efb{width:min(372px,calc(100vw - 16px));max-height:min(410px,calc(100vh - 80px));overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(9,1fr);gap:2px;font-size:22px}
  .emo .efb button{aspect-ratio:1;border-radius:8px}
  .emo .efb button:hover{background:#f1f4f8}
  .emo .ehd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line-2);font-size:12px;color:var(--text-3)}
  .emo .ehd b{flex:1;color:var(--text)}
  .emo .ehd button{width:28px;height:28px;border-radius:7px}
  .emo .ehd button:hover{background:#f1f4f8}
  .emo .equick{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line-2);font-size:20px}
  .emo .equick button{width:34px;height:34px;border-radius:8px}
  .emo .equick button:hover{background:#f1f4f8}

  /* ── 창 (탭 · 열 설정 · 주의사항 쓰기 · 가져오기) ── */
  .modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(15,23,42,.45)}
  .mbox{width:min(560px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;padding:20px 22px;background:#fff;border-radius:16px;box-shadow:0 30px 70px rgba(15,23,42,.35)}
  .mbox.wide{width:min(760px,100%)}
  .mbox h3{margin:0 0 4px;font-size:17px;font-weight:800;letter-spacing:-.02em}
  .mbox .sub{margin:0 0 12px;font-size:12.5px;color:var(--text-3);line-height:1.55}
  .fld{display:block;margin:12px 0}
  .fld>span{display:block;margin-bottom:5px;font-size:12px;font-weight:700;color:var(--text-3)}
  .fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:14px;color:var(--text);background:#fff;outline:0}
  .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--info);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .fld textarea{min-height:240px;resize:vertical;line-height:1.65}
  .frow{display:flex;gap:10px}
  .frow>.fld{flex:1;min-width:0}
  .mact{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:18px}
  .mact .sp{flex:1}
  .btn{height:36px;padding:0 15px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text-2);font-size:13px;font-weight:700;white-space:nowrap}
  .btn:hover{border-color:#cbd5e1;color:var(--text)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:var(--accent-ink)}
  .btn.dng{border-color:#fecaca;color:var(--danger)}
  .btn:disabled{opacity:.45;cursor:default}
  .emobar{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-top:6px}
  .emobar button{width:32px;height:32px;border-radius:8px;font-size:18px}
  .emobar button:hover{background:#f1f4f8}
  .emobar .more{width:auto;padding:0 10px;font-size:12.5px;font-weight:700;color:var(--info);border:1px solid #bfdbfe;background:#eff6ff}
  .opts{display:flex;flex-direction:column;gap:6px}
  .opt{display:flex;align-items:center;gap:6px}
  .opt input[type=text]{flex:1}
  .opt .chipv{flex:none;min-width:64px;padding:3px 10px;border-radius:999px;font-size:12px;text-align:center;cursor:pointer;border:1px solid rgba(15,23,42,.08)}
  .opt .x{flex:none;width:30px;height:30px;border-radius:8px;color:var(--text-4)}
  .opt .x:hover{background:#fef2f2;color:var(--danger)}
  .imp{width:100%;border-collapse:collapse;font-size:13px}
  .imp th,.imp td{padding:7px 8px;border-bottom:1px solid var(--line-2);text-align:left}
  .imp select{padding:5px 8px;border:1px solid var(--line);border-radius:7px;font:inherit}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  .keys kbd{justify-self:start;padding:1px 7px;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;background:#f8fafc;font:600 12px var(--ui);white-space:nowrap}

  /* ── 안내 (주의사항) 카드 — 쓰기 · 고치기 · 지우기 · 복사 ── */
  .grid.is-guide{background:var(--bg)}
  .guide{padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;align-items:start}
  .gcard{border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden}
  .gcard.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
  .gcard.rule{border-color:#fde68a;background:#fffdf5}
  .gc-h{display:flex;align-items:center;gap:8px;min-height:48px;padding:7px 8px 7px 14px;border-bottom:1px solid var(--line-2);background:var(--head)}
  .gcard.rule .gc-h{background:#fffbeb;border-color:#fde68a}
  .gc-h .dot{flex:none;width:9px;height:9px;border-radius:50%;background:#94a3b8}
  .gc-h b{font-size:13.5px;font-weight:800;color:var(--text)}
  .gc-h span{font-size:12px;color:var(--text-3)}
  .gc-h .gb{margin-left:auto;display:flex;gap:4px}
  .gc-h .gb button{height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--text-2)}
  .gc-h .gb button:hover{border-color:#cbd5e1;color:var(--text)}
  .gc-h .gb button.ic{width:30px;padding:0}
  .gc-b{padding:12px 14px 15px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-word;color:var(--text-2)}
  .gc-f{padding:0 14px 10px;font-size:11px;color:var(--text-4)}
  .gadd{min-height:150px;border:2px dashed #cbd5e1;border-radius:14px;display:grid;place-items:center;align-content:center;gap:4px;color:var(--text-3);font-size:14px;font-weight:800;background:transparent}
  .gadd small{font-size:12px;font-weight:500;color:var(--text-4)}
  .gadd:hover{border-color:var(--accent);color:var(--accent-ink);background:#f0fdf4}
  .gempty{grid-column:1/-1;padding:40px 0;text-align:center;font-size:13px;color:var(--text-4)}

  /* ── 아래 상태 줄 (저장 · 고른 칸 합계 · 편집자) ── */
  .sbar{flex:none;display:flex;align-items:center;gap:14px;height:30px;padding:0 14px;background:#f8fafc;border-top:1px solid var(--line);font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;padding-bottom:env(safe-area-inset-bottom)}
  .sbar .sv{flex:none;display:inline-flex;align-items:center;gap:6px}
  .sbar .sv i{width:7px;height:7px;border-radius:50%;background:#22c55e}
  .sbar .sv b{font-weight:600}
  .sbar .sv.busy i{background:#f59e0b}
  .sbar .sv.err{color:var(--danger);cursor:pointer}
  .sbar .sv.err i{background:var(--danger)}
  .sbar .stat{flex:1;min-width:0;text-align:center;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
  .sbar .stat b{color:var(--text);font-weight:700}
  .sbar .rowinfo{flex:none;color:var(--text-4)}
  .sbar .me{flex:none;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:11.5px;font-weight:700;color:var(--text-2)}
  .sbar .me:hover{border-color:#cbd5e1}

  /* ── 잠금 (혼자 열었을 때 — 오피스 접속 코드) ── */
  .lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 50% 20%,#1e293b,#0b1220 70%)}
  .lock-box{width:min(360px,100%);padding:30px 24px 24px;border-radius:20px;background:rgba(15,23,42,.92);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.45);color:#e2e8f0;text-align:center}
  .lock-box .logo{margin:0 auto 14px;width:52px;height:52px;border-radius:14px}
  .lock-box .logo svg{width:26px;height:26px}
  .lock-box h2{margin:0;font-size:20px;font-weight:800;color:#fff}
  .lock-box p{margin:6px 0 18px;font-size:13px;color:#94a3b8}
  .lock-box input{width:100%;height:48px;border-radius:12px;border:1px solid #334155;background:#0b1324;color:#fff;font-size:22px;letter-spacing:.35em;text-align:center;outline:0}
  .lock-box input:focus{border-color:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.22)}
  .lock-box .lock-err{min-height:20px;margin-top:8px;font-size:12.5px;color:#fca5a5}
  .lock-box button{width:100%;height:46px;margin-top:6px;border-radius:12px;background:#16a34a;color:#fff;font-size:15px;font-weight:800}
  .lock-box button:hover{background:#15803d}

  @media (max-width:720px){
    .tbar{padding:4px 8px;min-height:44px}

    .mbox{padding:18px 16px}

    #ed{font-size:16px}
    .fin{font-size:16px}
  }
  @media (pointer:coarse){ .tb{height:38px;min-width:38px} }
  /* 휴대폰 · 태블릿 맨 위 막대를 또렷하게 (2026-11-23 사장님 "상품찾기 최상단 흐리다고 — 안 흐리게" → "싹다 흐리지않게", ERP 와 똑같이) —
     찾기 칸은 흰 바탕 + 진한 테두리 + 검정 굵은 글씨, 메뉴 단추도 검정 */
  @media (max-width:1000px),(max-height:520px){
    .bar{background:#fff;border-bottom:1px solid #94a3b8}
    .find,.find:focus-within{background:#fff;border:2px solid #0f172a}
    .find:focus-within{border-color:var(--info);box-shadow:0 0 0 3px rgba(37,99,235,.18)}
    .find svg{width:18px;height:18px;color:#0f172a;stroke-width:2.8}
    .find input{font-weight:600;color:#0f172a}
    .find input::placeholder{color:#0f172a;-webkit-text-fill-color:#0f172a;font-weight:600;opacity:1}
    .qx{color:#0f172a;font-size:14px;font-weight:700}
    .bar .ib{color:#0f172a}
    .bar .ib svg{stroke-width:2.5}
  }
  @media (max-width:720px){ .bar{height:54px} .find{height:40px} }
  /* 아이폰 맨 위 흐림 막기 (2026-11-23 사장님 "아이폰으로 봤을때 위가 흐려" → "싹다 흐리지않게") — 아이폰 사파리는 화면 맨 위에 흐림 효과를 덮고,
     화면에 고정된(position:fixed) 단색 막대가 맨 위에 닿아 있을 때만 단색으로 바꾼다 (ERP 에서 확인). */
  :root{--top-in:0px;--bar-h:58px}
  html.ios-solo{--top-in:calc(env(safe-area-inset-top,0px) + 14px)}
  @media (max-width:1000px){
    html.ios-solo .bar{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--bar-h) + var(--top-in));padding-top:var(--top-in)}
    html.ios-solo .main{padding-top:calc(var(--bar-h) + var(--top-in))}
  }
  @media (max-width:1000px) and (max-height:520px){ html.ios-solo{--bar-h:52px;--top-in:env(safe-area-inset-top,0px)} }
  @media (max-width:720px){ html.ios-solo{--bar-h:54px} }
  /* 아래쪽도 같은 까닭으로 — 사파리 아래 막대가 합계 줄을 흐리지 않게 아래 끝에 단색 띠 */
  .ios-bot{display:none}
  html.ios-solo .ios-bot{display:block;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(env(safe-area-inset-bottom,0px) + 6px);background:#f1f5f9}
  html.ios-solo .app{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px)}
</style>

  /* ── 수식 주소 고치기 ──

  /* ══════════════════════ 화면 상태 ══════════════════════ */
  const S = {

  /* ── 지금 표의 칸 (view column) — 보통 탭은 그 탭 칸 그대로, '전체'는 맨 앞 브랜드 + 브랜드 탭 칸을 이름끼리 묶음 ── */
  function viewCols() {

  /* ── 요약 카드 · 칩 (시트에 적힌 것만 센다: 아이디 노란색 = 보냄, 비고 '회신', 업로드 칸, 주소 칸) ── */
  const findVc = (vcols, re) => vcols.find(c => !c.brand && re.test(low(c.name)));

  const catVal = (row, vc) => textOf(row, vc) || '미지정';
  function buildCat(vcols, rows) {

    const vc = S.cur === ALL ? findVc(vcols, /^(책임자|담당자?)$/) : kind === 'ship' ? (findVc(vcols, /^브랜드$/) || findVc(vcols, /^(책임자|담당자?)$/)) : (findVc(vcols, /^(책임자|담당자?)$/) || findVc(vcols, /^브랜드$/));

  /* ── 걸러보기 · 정렬 (보기만 바뀜 — 시트 순서 · 행 번호는 그대로) ── */
  function sortKey(row, vc) {

  /* ── 칸 너비 — 처음 열 때 들어간 글자에 맞춰 재고(ERP전산팀과 같은 규칙), 끌어서 바꾸면 그 폭을 모두에게 저장 ── */
  const PAD = 17;

  function headMin(name) {

    if (!words.length) return 30;

  const shortUrl = s => String(s).replace(/^https?:\/\/(www\.)?/i, '').replace(/[?#].*$/, '').replace(/\/$/, '');
  function measureCols(vcols, rows) {
    return vcols.map(vc => {

  }

  /* ══════════════════════ 고치기 · 되돌리기 (모든 수정은 action 하나) ══════════════════════

  function doAction(a, opt) {
    if (!a) return;

  }
  // 칸 너비 다시 재기 — 줄 · 칸이 늘거나 줄었을 때, 또는 지금 너비보다 긴 글을 넣었을 때만 (고칠 때마다 칸이 출렁이지 않게)

    if ((a.ins || []).length || (a.del || []).length || (a.tabs || []).length) { S.wcache = {}; return; }
    const key = Object.keys(S.wcache).find(k => k.startsWith((S.cur || '') + '|'));

    const m = S.wcache[key];

  /* ══════════════════════ 채우기 (Ctrl+D · Ctrl+R · 오른쪽 아래 손잡이 끌기) ══════════════════════ */

  /* ══════════════════════ 행 넣기 · 지우기 (수식 주소도 엑셀처럼 따라감) ══════════════════════ */

    else if (e.key === 'Escape') { qIn.value = ''; setQuery(''); focusEd(); }
  });
  $('qx').addEventListener('click', () => { qIn.value = ''; setQuery(''); qIn.focus(); });
  qIn.addEventListener('focus', () => { if (compactMQ.matches) setHmin(true); });

  /* ── 줄 간격 · 전체 화면 ── */
  function setDense(on, save) {
    S.dense = !!on;
    app.classList.toggle('dense', S.dense);
    $('btnDense').classList.toggle('on', S.dense);
    $('btnDense').title = S.dense ? '줄 간격 넓게' : '줄 간격 촘촘하게';
    if (save) { lsSet(LS.dense, S.dense ? '1' : '0'); renderGrid(); }
  }
  $('btnDense').addEventListener('click', () => setDense(!S.dense, true));
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('btnFull').hidden = true;
  $('btnFull').addEventListener('click', () => {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  });

  /* ── 전체 키 · 창 크기 ── */
  document.addEventListener('keydown', e => {
    const mod = e.ctrlKey || e.metaKey;
    if (e.key === 'Escape') {
      if (S.emoOpen) { e.preventDefault(); closeEmoji(); return; }
      if (!$('modal').hidden) { e.preventDefault(); closeModal(); focusEd(); return; }
      if (!CM.hidden || !PAL.hidden) { e.preventDefault(); CM.hidden = true; PAL.hidden = true; focusEd(); return; }
      if (!$('detail').hidden && !(S.ed && S.ed.on)) { closeDetail(); focusEd(); return; }
    }
    if (mod && !e.shiftKey && (e.key === 'f' || e.key === 'F') && document.activeElement !== ed) { e.preventDefault(); qIn.focus(); qIn.select(); return; }
    const a = document.activeElement;
    if ((a === document.body || a === grid) && !isGuideView() && S.sel && $('modal').hidden && $('lock').hidden) {
      if (/^(Arrow|Tab$|Enter$|F2$|Delete$|Backspace$|Page|Home$|End$)/.test(e.key) || (mod && /^[zyabdr]$/i.test(e.key))) { focusEd(); idleKey(e, mod); }
    }
  });
  let rzT = 0;
  window.addEventListener('resize', () => {
    placeEd();
    clearTimeout(rzT);
    rzT = setTimeout(() => { if (sizeKey() !== S.size) renderGrid(); placeEd(); }, 150);
  });
  narrow.addEventListener && narrow.addEventListener('change', () => { $('dscrim').hidden = !narrow.matches || $('detail').hidden; renderGrid(); });
  compactMQ.addEventListener && compactMQ.addEventListener('change', () => { if (!compactMQ.matches) setHmin(false); });
  if (document.fonts && document.fonts.addEventListener) {
    let ft = 0;
    document.fonts.addEventListener('loadingdone', () => { clearTimeout(ft); ft = setTimeout(() => { MW.clear(); S.wcache = {}; renderGrid(); }, 250); });
  }

  /* ══════════════════════ 시작 ══════════════════════ */
  function start2() {
    renderGrid();
    paintConn();
    loadAll().then(() => {
      let id = null, want = null;
      try { want = new URLSearchParams(location.search).get('tab'); } catch (e) { want = null; }
      if (want) {
        if (low(want) === 'all' || want === '전체') id = ALL;
        else { const t = tabByName(want) || tabById(want) || tabList().find(x => { const b = brandOf(x.brand, true) || brandOf(x.name, true); return b && b.names.includes(low(want)); }); if (t) id = t.id; }
      }
      if (!id) { const saved = lsGet(LS.tab); if (saved === ALL ? xTabs().length : tabById(saved)) id = saved; }
      if (!id) id = xTabs().length ? ALL : (tabList()[0] || {}).id;
      paintConn();
      paintSave();
      openTab(id);
      pollLoop();
    }).catch(e => { D.syncErr = e; paintConn(); showErr(e); });
  }
  function start() {
    if (S.started) return;
    S.started = true;
    S.mask = lsGet(LS.mask) !== '0';
    $('tbar').querySelector('[data-cmd="mask"]').classList.toggle('on', !S.mask);
    setDense(lsGet(LS.dense) === '1', false);
    paintMe();
    paintColorBars();
    paintUndo();
    paintSave();
    if (document.fonts && document.fonts.load) { try { document.fonts.load(F_CELL, '시딩ABC123'); document.fonts.load(F_BOLD, '시딩ABC123'); } catch (e) { /* noop */ } }
    start2();
  }
  if (isUnlocked()) start();
  else { $('lock').hidden = false; setTimeout(() => $('lockPin').focus(), 60); }
})();
</script>
</body>
</html>
