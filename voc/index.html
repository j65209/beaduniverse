<title>VOC 전산 · CS팀 · 비드유니버스 오피스</title>
<script src="../boss-guard.js?v=2"></script><script>window.BossGuard||document.write('<script src="../boss-guard.js?r='+Date.now()+'"><\/script>')</script><!-- 대표 이름은 대표 PIN 으로만 (boss-guard.js) -->
<script src="../office-undo.js?v=1"></script><script src="../office-thumb.js?v=1" defer></script><!-- 어디서든 되돌리기 (office-undo.js) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script>
  /* 오피스 잠금 연동 (erp/ · models/ 와 같은 방식) — 오피스에서 PIN 을 넣은 브라우저만 들어올 수 있음.
     보통은 오피스 CS팀 맨 아래 iframe(index.html '#vocEmbed')으로 열린다. 주소 /voc/ 로 바로 열면 혼자 뜨지만,
     VOC 코드표 · 오피스 VOC 기록은 오피스(부모 창)의 bbVocShare() 에서 받으므로 오피스 안에서 열어야 다 보인다. */
  (function () {
    var inOffice = false, home = '';
    try { inOffice = window.parent !== window && typeof window.parent.bbVocShare === 'function'; } catch (e) { /* 다른 출처 */ }
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    try { if (window.parent === window && localStorage.getItem('brightbeed_unlocked') !== '1') { location.replace(home + '?from=voc'); return; } } catch (e) { /* noop */ }
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) { a.href = home; });
    });
  })();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  /* VOC 전산 — CS팀 맨 아래 (2026-11-20 사장님 "구글 시트에 있는 자료들 erp 전산 디자인으로해서 cs팀 하단에 넣어줘.
     기존에 있던 분석자료나 voc 깔끔하게 다 합쳐줘")
     · 자료 = 구글시트 '비드유니버스 VOC'(CS 직원이 매일 적는 브랜드별 '데일리' 탭 · 불량건 탭 · 반품 분석 탭)를 '웹 보기'로 바로 읽는다
       (링크 보기 공개 시트, CORS 허용, 서버 · 키 없음 — erp/ 와 같은 방식). 고치기는 없고 보기 · 분석만.
     · 합친 것: 날짜 · 브랜드마다 따로 적힌 표(옛 줄 양식 11/3~11/11 + 날짜 블록 양식 11/11~)를 한 줄 = 한 사유로 풀어 한 표로,
       사유 글로 오피스 VOC 코드(📖 VOC 코드표 — index.html CSI_CODES)를 '추정'해 붙이고, 오피스 VOC 기록(Supabase cs_issues)과
       같은 건은 그 코드를 '확정'으로. 불량건 탭 · 반품 분석 탭(코페리 · 아페티) · 시트에 붙은 사진도 같은 화면 메뉴로.
     · 디자인은 ERP전산팀(erp/)과 같다 — 어두운 왼쪽 메뉴 · 요약 카드 · 칸 너비 자동 표 · 줄을 누르면 상세 창. 색만 CS팀 파랑.
     · 이름 · 연락처 칸은 읽을 때 가린다(배○○ · 010-****-0729) — 이 브라우저 저장본에도 가린 채로.
     · 2026-11-20 사장님 "cs업무에 반품교환분석, 사유채널 상품분석 반품교환목록 이런거 싹다 하단 voc랑 합쳐주고. 중복된거 지워주고 완벽하게 만들어줘.
       가독성 좋게" → 오피스 CS 업무의 '↩️ 반품·교환 분석' 탭을 걷어 여기 메뉴 맨 위 '반품 · 교환 (자동 수집)'으로 옮김
       (한눈에 보기 · 사유 · 채널 · 상품 분석 · 처리 현황 · 목록). 시트로 만든 예전 대시보드 카드(브랜드별 · 사유 분류 · 많이 나온 상품 ·
       최근 회사 사유 · 쇼핑몰별)는 자동 수집과 겹쳐 지우고, 시트에만 있는 '일지 입력 현황'만 한눈에 보기 아래에 남김.
       색은 아낌 — 회사 사유 = 빨강, 고객 사유 = 회색, 사유 없음 = 연회색.
     · 같은 날 저녁 "문의, 리뷰 목록도 같이 voc에 넣어줘" · "카카오톡 채널을 제외한 cs에 관한건 voc 전산에서 다 관리하게 해줘" →
       '문의 · 리뷰 (자동 수집)' 메뉴(한눈에 · 목록)를 새로, 편집이 있는 개선 요청 · CS 작업 보드 · 메모장 · 자주 묻는 질문은 오피스 화면을 그대로
       본문 자리에 띄움(메뉴 'CS 업무'). "voc 코드표, 기존 자료는 숨김처리 해주고. 시트 또한 숨김해줘" → SHEET_ON = false (걷어내지 않고 숨김만).
     · 같은 날 밤 "제품의 불량 이미지가 채팅으로 유입되면 자동으로 채팅내용을 보고 상품명을 보고 상품 분석에 넣어줘. 이미지" →
       상품 분석에 '📷 카톡 불량' 칸 · '상품 확인 필요' 목록 · 상세 창 사진 (맥미니 kakao-defects → /cs/kakao-defects, bbVocShare().defects · csImg).
     · 2026-11-25 "플랫폼 문의들을 플레이오토에서 불러와서 에이전트로 처리가 가능한가" → "네, 만들어줘" → 문의 상세에 답 초안 · [보내기] · [다른 곳에서 답했어요],
       목록에 '답' 칸 · '답할 문의' (맥미니 inq-agent 15분 → /cs/inq-drafts, bbVocShare().inqDrafts · inqSend · inqDone — 사무실 인터넷만, 저절로 보내지 않음). */
  :root{
    --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --bg:#f3f5f8; --card:#fff; --line:#e3e8ef; --line-2:#edf1f5; --head:#f7f9fb;
    --text:#0f172a; --text-2:#334155; --text-3:#64748b; --text-4:#94a3b8;
    --accent:#0284c7; --accent-ink:#0369a1; --accent-soft:#e0f2fe;
    --side:#0f172a; --side-text:#cbd5e1; --side-mute:#64748b;
    --danger:#dc2626; --warn:#d97706; --info:#2563eb;
    --row-h:34px; --side-w:224px; --detail-w:420px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit}
  .app{height:100vh;height:100dvh;display:flex;overflow:hidden}

  /* ── 왼쪽 메뉴 ── */
  .side{flex:none;width:var(--side-w);display:flex;flex-direction:column;background:var(--side);color:var(--side-text)}
  .side-top{flex:none;display:flex;align-items:center;gap:11px;height:58px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
  .logo{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#38bdf8,#0369a1);box-shadow:0 2px 10px rgba(14,165,233,.35)}
  .logo svg{width:16px;height:16px;color:#fff}
  .side-top b{display:block;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .side-top small{display:block;margin-top:1px;font-size:11px;color:var(--side-mute)}
  .side-fold{flex:none;margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--side-mute)}
  .side-fold:hover{background:rgba(255,255,255,.08);color:#fff}
  .side-fold svg{width:17px;height:17px}
  .app.side-off .menu{display:grid}
  @media (min-width:1001px){ .app.side-off .side{display:none} }
  .nav{flex:1;min-height:0;overflow:auto;padding:6px 10px 16px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
  .nav-sec{margin:16px 0 6px;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--side-mute)}
  .nav-item{position:relative;width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;text-align:left;color:var(--side-text)}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.on{background:rgba(14,165,233,.18);color:#fff;font-weight:700}
  .nav-item.on::before{content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#38bdf8}
  .nav-item .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#475569}
  .nav-item .ic{flex:none;width:16px;text-align:center;font-size:13px;line-height:1}
  .nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item .nd{flex:none;font-size:11px;color:var(--side-mute);font-variant-numeric:tabular-nums}
  .nav-item .nd.warn{color:#fbbf24}
  .nav-item.on .nd{color:#7dd3fc}
  .side-foot{flex:none;padding:10px 10px 14px;border-top:1px solid rgba(255,255,255,.07)}
  .side-link{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--side-text);text-decoration:none}
  .side-link:hover{background:rgba(255,255,255,.06);color:#fff}
  .side-link svg{width:15px;height:15px;opacity:.8}
  .scrim,.dscrim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:45}
  .dscrim{z-index:39}   /* 상세 창(40)보다 아래 — 휴대폰에서 막이 창을 덮어 단추가 안 눌리던 것 (2026-11-25) */

  /* ── 본문 ── */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:8px;height:58px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .menu{display:none}
  .find{flex:0 1 420px;min-width:0;display:flex;align-items:center;gap:7px;height:38px;padding:0 8px 0 13px;border-radius:10px;background:#f1f4f8;border:1px solid transparent;cursor:text}
  .find:focus-within{background:#fff;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .find svg{flex:none;width:16px;height:16px;color:var(--text-4)}
  .find input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:13.5px;color:var(--text)}
  .find input::-webkit-search-cancel-button{display:none}
  .qn{flex:none;font-size:12px;font-weight:700;color:var(--info);white-space:nowrap;font-variant-numeric:tabular-nums}
  .qx{flex:none;width:24px;height:24px;border-radius:50%;color:var(--text-4);font-size:12px}
  .qx:hover{background:#e2e8f0;color:var(--text)}
  .sp{flex:1;min-width:0}
  .st{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .st:hover{background:#f1f4f8;color:var(--text)}
  .st .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#0ea5e9;box-shadow:0 0 0 3px rgba(14,165,233,.18)}
  .st.is-load .dot{background:transparent;box-shadow:none;width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--accent);animation:spin .8s linear infinite}
  .st.is-stored{color:#b45309;background:#fffbeb}
  .st.is-err{color:#b91c1c}
  .st.is-err .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ib{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);text-decoration:none}
  .ib:hover{background:#f1f4f8;color:var(--text)}
  .ib.on{background:#e8f0fe;color:var(--info)}
  .ib svg{width:18px;height:18px}

  .head{flex:none;padding:14px 18px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
  .trow h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.025em}
  .date{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid #bae6fd;border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .fpill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 6px 0 11px;border-radius:999px;background:var(--text);color:#fff;font-size:12px;font-weight:700;white-space:nowrap}
  .fpill button{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#cbd5e1}
  .fpill button:hover{background:rgba(255,255,255,.15);color:#fff}
  .tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
  .etog{height:30px;padding:0 12px;border-radius:999px;border:1px dashed #cbd5e1;background:#fff;font-size:12px;color:var(--text-3);white-space:nowrap}
  .etog:hover{border-color:#94a3b8;color:var(--text)}
  .etog.on{border-style:solid;border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft);font-weight:700}
  .parts{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#f1f4f8}
  .parts button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .parts button:hover{color:var(--text)}
  .parts button.on{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.12)}
  .alert{margin-top:12px;display:flex;gap:10px;padding:10px 13px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;line-height:1.6}
  .alert.info{background:#f0f9ff;border-color:#bae6fd;color:#075985}
  .alert svg{flex:none;width:17px;height:17px;margin-top:1px;color:#d97706}
  .alert.info svg{color:#0284c7}
  .alert b{font-weight:700}
  .kpis{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  .kpi{min-width:118px;height:62px;display:flex;flex-direction:column;justify-content:center;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;cursor:default}
  .kpi b{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--text)}
  .kpi b small{font-size:12px;font-weight:700;margin-left:3px;color:var(--text-3)}
  .kpi span{margin-top:3px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
  .kpi.click{cursor:pointer}
  .kpi.click:hover{border-color:#cbd5e1;background:#fafbfc}
  .kpi.red b{color:var(--danger)}
  .kpi.amber b{color:var(--warn)}
  .kpi.blue b{color:var(--info)}
  .kpi.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(2,132,199,.14);background:#fff}
  .chips{margin-top:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);white-space:nowrap}
  .chip:hover{border-color:#cbd5e1}
  .chip i{flex:none;width:8px;height:8px;border-radius:50%}
  .chip em{font-style:normal;font-size:11.5px;color:var(--text-4);font-variant-numeric:tabular-nums}
  .chip.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
  .chip.on em{color:#cbd5e1}
  .chip-sep{flex:none;width:1px;height:18px;margin:6px 4px 0;background:var(--line)}

  /* ── 표 (ERP 와 같은 모양) ── */
  .gwrap{flex:1;min-height:0;position:relative;background:var(--card)}
  .grid{position:absolute;inset:0;overflow:auto;outline:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .grid.bd-mode{background:var(--bg)}
  .tbl{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;color:var(--text)}
  .tbl th{position:sticky;top:0;z-index:3;height:42px;padding:5px 8px;background:var(--head);color:var(--text-3);font-size:12px;font-weight:700;line-height:1.3;text-align:left;vertical-align:middle;white-space:normal;word-break:keep-all;overflow:hidden;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);cursor:pointer;user-select:none}
  .tbl th:hover{color:var(--text)}
  .tbl th .ar{margin-left:4px;font-size:9px;color:var(--accent)}
  .tbl td{height:var(--row-h);padding:0 8px;background:#fff;border-bottom:1px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app.dense .tbl td{height:28px}
  .tbl .cl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal;line-height:1.25;word-break:keep-all;overflow-wrap:break-word}
  .app.dense .tbl .cl{-webkit-line-clamp:1}
  .tbl .r{font-variant-numeric:tabular-nums}
  .tbl .rn{color:var(--text-4);font-size:11.5px;font-variant-numeric:tabular-nums;padding:0 7px 0 10px}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover td{box-shadow:inset 0 0 0 999px rgba(15,23,42,.035)}
  .tbl tbody tr.on td{box-shadow:inset 0 0 0 999px rgba(37,99,235,.075)}
  .tbl tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--info),inset 0 0 0 999px rgba(37,99,235,.075)}
  .tbl tbody tr.co td:first-child{box-shadow:inset 3px 0 0 #fca5a5}
  .tbl tbody tr.dim td{color:var(--text-4)}
  .tbl tr.empty td{height:120px;text-align:center;color:var(--text-4);cursor:default;box-shadow:none!important}
  .tbl tfoot td{position:sticky;bottom:0;z-index:2;height:36px;background:#f1f5f9;border-top:1px solid #cbd5e1;border-bottom:0;font-weight:700;font-variant-numeric:tabular-nums}
  .tbl tfoot .ft{font-size:12px;color:var(--text-3)}
  .z{color:#c3cad4}
  .none{color:var(--text-4)}
  mark{background:#fef08a;color:inherit;border-radius:2px;padding:0 1px}
  .bdot{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .tp{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.4;vertical-align:middle;white-space:nowrap}
  .tp.ret{background:#fef2f2;color:#b91c1c}
  .tp.exc{background:#eff6ff;color:#1d4ed8}
  .tp.etc{background:#fffbeb;color:#b45309}
  .tp.zero{background:#f1f5f9;color:#64748b}
  .tp.blank{background:#fff7ed;color:#c2410c}
  .ctag{display:inline-block;max-width:100%;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.4;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .code{font-weight:700;font-variant-numeric:tabular-nums}
  .code.est{color:var(--text-3);font-weight:600}
  .code-n{margin-left:5px;font-weight:400;color:var(--text-2)}
  .sure{display:inline-block;margin-left:5px;padding:0 5px;border-radius:4px;background:#dcfce7;color:#15803d;font-size:10.5px;font-weight:700;vertical-align:1px}
  .est-b{display:inline-block;margin-left:5px;padding:0 5px;border-radius:4px;background:#f1f5f9;color:#64748b;font-size:10.5px;font-weight:700;vertical-align:1px}
  .cam{margin-left:5px;font-size:11.5px}
  .skel{padding:6px 0}
  .skel div{display:flex;gap:22px;align-items:center;height:34px;padding:0 16px;border-bottom:1px solid var(--line-2)}
  .skel i{display:block;height:9px;border-radius:5px;background:#edf1f5}
  .msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));padding:22px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 12px 34px rgba(15,23,42,.14);font-size:13.5px;line-height:1.6;color:var(--text-2);z-index:20;text-align:center}
  .msg b{display:block;font-size:15.5px;color:var(--text);margin-bottom:6px}
  .msg button{margin-top:14px;height:36px;padding:0 18px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
  .msg button.ghost{background:#f1f4f8;color:var(--text-2)}
  .msg input{display:block;width:100%;margin-top:14px;height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;font:inherit;font-size:13px;color:var(--text);outline:0}
  .msg input:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .msg-btns{display:flex;justify-content:center;gap:8px}

  /* ── 대시보드 · 보고서 카드 ── */
  .board{padding:16px 18px 30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,470px),1fr));gap:14px;align-content:start}
  .card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card.wide{grid-column:1/-1}
  .card-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:13px 16px 11px;border-bottom:1px solid var(--line-2)}
  .card-h b{font-size:14px;font-weight:800;letter-spacing:-.02em}
  .card-h span{font-size:12px;color:var(--text-3)}
  .card-h .more{margin-left:auto;font-size:12px;font-weight:600;color:var(--info)}
  .card-h .more:hover{text-decoration:underline}
  .card-b{overflow:auto}
  .card-e{padding:22px 16px;font-size:13px;color:var(--text-4);text-align:center}
  .mt{width:100%;border-collapse:collapse;font-size:13px}
  .mt th{position:sticky;top:0;z-index:1;background:var(--head);padding:8px 12px;font-size:11.5px;font-weight:700;color:var(--text-3);text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  .mt td{padding:8px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;font-variant-numeric:tabular-nums;vertical-align:middle}
  .mt td.wrap{white-space:normal;min-width:160px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere}
  .mt tr:last-child td{border-bottom:0}
  .mt tr.click,.mt td.click{cursor:pointer}
  .mt tr.click:hover td,.mt td.click:hover{background:#f8fafc}
  .mt .sub{color:var(--text-3);font-size:12px}
  .mt .b{font-weight:700}
  .mt .rv{color:#b91c1c;font-weight:700}
  .mt .ev{color:#1d4ed8;font-weight:700}
  .mt .ok{color:#15803d;font-weight:700}
  .mt .na{color:#c2410c;font-weight:700;font-size:12px}
  .mt .sticky{position:sticky;left:0;z-index:1;background:#fff}
  .mt th.sticky{z-index:2;background:var(--head)}
  .mx td{font-size:12.5px}
  .bars{padding:8px 0 10px}
  .bar-row{width:100%;display:grid;grid-template-columns:minmax(96px,150px) 1fr 86px;align-items:center;gap:10px;padding:6px 16px;font-size:13px;text-align:left}
  .bar-row:hover{background:#f8fafc}
  .bar-l{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar-l i{flex:none;width:8px;height:8px;border-radius:50%}
  .bar-t{height:10px;border-radius:5px;background:#f1f5f9;overflow:hidden}
  .bar-f{height:100%;border-radius:5px;min-width:2px}
  .bar-v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bar-v small{margin-left:4px;font-weight:500;color:var(--text-3);font-size:11.5px}
  .legend{display:flex;gap:12px;flex-wrap:wrap;padding:0 16px 12px;font-size:11.5px;color:var(--text-3)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
  .rep-lines{padding:6px 18px 16px}
  .rep-h{margin:16px 0 4px;font-size:13px;font-weight:800;color:var(--accent-ink)}
  .rep-h:first-child{margin-top:8px}
  .rep-line{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px;line-height:1.5}
  .rep-line b{flex:none;min-width:140px;font-weight:700;color:var(--text)}
  .rep-line span{color:var(--text-2);white-space:pre-wrap;overflow-wrap:anywhere}
  .rep-line.sub{padding-left:16px}
  .rep-line.sub b{min-width:124px;font-weight:600}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;padding:14px 16px 16px}
  .gal figure{margin:0;min-width:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f8fafc;cursor:zoom-in}
  .gal img{display:block;width:100%;height:150px;object-fit:cover;background:#f1f5f9}
  .gal.big{grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr))}
  .gal.big img{height:auto;max-height:560px;object-fit:contain;background:#fff}
  .gal img,.dthumbs img{color:transparent}   /* 받는 동안 alt 글자가 비치지 않게 */
  .gal.big img:not([src]){height:260px}
  img.broken{opacity:.45}
  .gal figcaption{padding:7px 10px;font-size:12px;color:var(--text-2);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sop{display:grid;grid-template-columns:110px 1fr;font-size:13px}
  .sop dt{padding:8px 16px;color:var(--text-3);border-bottom:1px solid var(--line-2)}
  .sop dd{margin:0;padding:8px 16px 8px 0;line-height:1.5;border-bottom:1px solid var(--line-2);overflow-wrap:anywhere}

  /* ── 상세 창 (줄을 누르면) ── */
  .detail{position:fixed;top:0;right:0;bottom:0;z-index:40;width:var(--detail-w);max-width:100%;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 34px rgba(15,23,42,.1)}
  @media (min-width:1280px){ .app.has-detail .main{margin-right:var(--detail-w)} .detail{box-shadow:none} }
  .dh{flex:none;padding:14px 18px 14px;border-bottom:1px solid var(--line)}
  .dh-top{display:flex;align-items:center;gap:8px}
  .dh-cap{flex:1;font-size:12px;font-weight:700;color:var(--text-3)}
  .dh-top button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
  .dh-top button:hover{background:#f1f4f8;color:var(--text)}
  .dh-top svg{width:17px;height:17px}
  .d-title{margin-top:6px;font-size:18px;font-weight:800;line-height:1.35;letter-spacing:-.02em;word-break:break-word}
  .d-sub{margin-top:4px;font-size:12.5px;color:var(--text-3);line-height:1.5}
  .d-sheet{display:inline-flex;align-items:center;gap:5px;margin-top:10px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-2);text-decoration:none}
  .d-sheet:hover{border-color:#cbd5e1;color:var(--text)}
  .dbody{flex:1;min-height:0;overflow:auto;padding:4px 18px 22px}
  .dl{display:grid;grid-template-columns:104px 1fr;margin:0}
  .dl dt{padding:10px 0;font-size:12.5px;color:var(--text-3);border-bottom:1px solid var(--line-2)}
  .dl dd{margin:0;padding:10px 0 10px 12px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line-2);word-break:break-word;white-space:pre-wrap}
  .dl dd.r{font-variant-numeric:tabular-nums;font-weight:700}
  .dl .muted{color:var(--text-3);font-size:12.5px}
  .dthumbs{display:flex;flex-wrap:wrap;gap:6px;white-space:normal}
  .dthumbs img{width:76px;height:76px;border-radius:8px;object-fit:cover;cursor:zoom-in;background:#f1f5f9}
  .ia{white-space:normal;display:grid;gap:8px}
  .ia textarea{width:100%;min-height:132px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;line-height:1.55;color:var(--text);background:#fff;resize:vertical}
  .ia textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  .ia .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .ia .go{padding:7px 14px;border-radius:8px;background:var(--text);color:#fff;font-weight:700;font-size:13px}
  .ia .go[disabled]{opacity:.45;cursor:default}
  .ia .sub2{padding:7px 12px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text-2)}
  .ia .why{font-size:12.5px;color:var(--text-3);line-height:1.5}
  .ia .bad{font-size:12.5px;color:var(--danger);font-weight:600;line-height:1.5}
  .ia .ref{border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.5;color:var(--text-2)}
  .ia .ref b{display:block;color:var(--text-3);font-weight:600}
  .ia .ref button{margin-top:4px;font-weight:700;color:var(--accent-ink)}
  .hist{display:grid;gap:2px;white-space:normal}
  .hist button{display:grid;grid-template-columns:62px 44px 1fr;gap:8px;align-items:baseline;width:100%;text-align:left;padding:5px 6px;border-radius:6px;font-size:12.5px;line-height:1.4}
  .hist button:hover{background:#f1f5f9}
  .hist button.on{background:var(--accent-soft)}
  .hist .hd{font-weight:700;color:var(--text-2);font-variant-numeric:tabular-nums}
  .hist .hr{color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(15,23,42,.82);cursor:zoom-out;padding:24px}
  .lb img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}
  .toast{position:fixed;left:50%;bottom:22px;z-index:80;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:#0f172a;color:#fff;font-size:13px;font-weight:600;line-height:1.45;box-shadow:0 12px 30px rgba(15,23,42,.25)}

  /* ── 반품 · 교환 자동 수집 (2026-11-20 오피스 CS 업무 '↩️ 반품·교환 분석'을 합침) — 회사 사유 빨강 · 고객 사유 회색 · 없음 연회색 ── */
  .kpi i{margin-top:3px;font-style:normal;font-size:11px;line-height:1.2;color:var(--text-4);white-space:nowrap;font-variant-numeric:tabular-nums}
  .kpi i.up{color:#b91c1c}
  .kpis.tall .kpi{height:76px}
  .upd{font-size:12px;color:var(--text-4);white-space:nowrap;font-variant-numeric:tabular-nums}
  .mut{color:var(--text-3);font-size:12px;font-weight:500}
  .fd{display:inline-block;flex:none;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px;background:#d1d5db}
  .fd.co{background:#ef4444}
  .fd.cu{background:#94a3b8}
  .hot{color:#b91c1c}
  .new{display:inline-block;margin-left:6px;padding:0 6px;border-radius:4px;background:#0f172a;color:#fff;font-size:10.5px;font-weight:700;line-height:1.6;vertical-align:1px}
  .mix{display:flex;width:100%;min-width:96px;height:8px;border-radius:4px;overflow:hidden;background:#f1f5f9}
  .mix i{display:block;height:100%}
  .mix .co{background:#ef4444}
  .mix .cu{background:#94a3b8}
  .mix .na{background:#e2e8f0}
  .rb{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end;vertical-align:middle}
  .rb b{display:block;width:64px;height:6px;border-radius:3px;background:#f1f5f9;overflow:hidden}
  .rb b i{display:block;height:100%;border-radius:3px;background:#64748b}
  .rb.hi b i{background:#dc2626}
  .rb.hi span{color:#b91c1c}
  .rb span{min-width:40px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .bar-f.co{background:#ef4444}
  .bar-f.cu{background:#94a3b8}
  .bar-f.na{background:#cbd5e1}
  .mt td.n,.mt th.n{text-align:right}
  .mt td.c,.mt th.c{text-align:center}
  .mt.heat td.c{font-weight:600}
  .mt.heat td .sub{display:block;font-size:11px;font-weight:500}
  .mt tr.tot td{background:#f8fafc;font-weight:700;border-top:1px solid var(--line)}
  .card-h .parts{margin-left:auto}
  .card-h .parts button{height:26px;padding:0 10px;font-size:12px}
  .note{padding:8px 16px 12px;font-size:12px;color:var(--text-3);line-height:1.6}
  .note b{color:var(--text-2);font-weight:700}
  .voice{display:grid;gap:14px;padding:12px 16px 16px}
  .voice h4{margin:0 0 2px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:0}
  .quote{display:block;width:100%;text-align:left;margin-top:6px;padding:8px 11px;border-radius:9px;background:#f8fafc;font-size:13px;line-height:1.5;color:var(--text-2);cursor:pointer;word-break:break-word;white-space:normal}
  .quote:hover{background:#f1f5f9}
  .quote small{display:block;margin-top:3px;font-size:11.5px;color:var(--text-4)}
  .trend{display:block;width:100%;height:auto}
  .trend text{font-size:10.5px;fill:#94a3b8;font-family:var(--ui)}
  .trend .pt{font-size:11px;font-weight:700;fill:#64748b}
  .trend .gl{stroke:#eef2f6;stroke-width:1}
  .trend .ax{stroke:#cbd5e1;stroke-width:1}
  .trend .co{fill:#ef4444}
  .trend .cu{fill:#94a3b8}
  .trend .na{fill:#e2e8f0}
  .trend .rl{fill:none;stroke:#0f172a;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
  .trend .rd{fill:#0f172a}
  .trend .hit{fill:transparent}
  .trend g.col:hover .hit{fill:rgba(15,23,42,.045)}
  .stage{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:600;line-height:1.4;white-space:nowrap;background:#f1f5f9;color:#64748b}
  .stage.open{background:#f1f5f9;color:var(--text)}
  .stage.late{background:#fef2f2;color:#b91c1c}
  .reqb{height:28px;padding:0 10px;border-radius:8px;border:1px solid #fecaca;background:#fff;color:#b91c1c;font-size:12px;font-weight:700;white-space:nowrap}
  .reqb:hover{background:#fef2f2}
  .dbtn{height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:600;color:var(--text-2)}
  .dbtn:hover{border-color:#cbd5e1;color:var(--text)}
  .chsel{height:30px;padding:0 8px;border-radius:9px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;color:var(--text-2);cursor:pointer}
  .chsel:focus{outline:0;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .chsel.on{border-color:var(--text);color:var(--text);font-weight:700}
  .parts{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .parts::-webkit-scrollbar{display:none}

  /* ── 좁은 화면 ── */
  @media (max-width:1000px){
    .side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);transition:transform .18s ease}
    .app.nav-open .side{transform:none;box-shadow:12px 0 34px rgba(15,23,42,.3)}   /* 닫혀 있을 땐 그림자도 없게 (좁은 화면 왼쪽 끝에 비침) */
    .menu{display:grid}
  }
  @media (max-width:720px){
    :root{--row-h:42px}
    .bar{height:54px;padding:0 8px;gap:4px}
    .find{flex:1 1 auto;height:38px}
    .st{padding:0 8px}
    .st #stText,#btnFull,#btnDense,#cCopy{display:none}
    .st.is-err #stText,.st.is-stored #stText{display:inline;font-size:11.5px}
    .head{padding:12px 12px 10px}
    .trow h1{font-size:17px}
    .tools{margin-left:0;width:100%}
    .kpis{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-12px;margin-right:-12px;padding:0 12px}
    .kpis::-webkit-scrollbar{display:none}
    .kpi{flex:none;min-width:100px;height:56px;padding:0 12px}
    .kpi b{font-size:18px}
    .chips{margin-left:-12px;margin-right:-12px;padding:0 12px}
    .board{padding:12px 10px 24px;gap:10px}
    .detail{top:auto;left:0;width:100%;height:82vh;height:82dvh;border-left:0;border-radius:18px 18px 0 0;box-shadow:0 -14px 34px rgba(15,23,42,.2);padding-bottom:env(safe-area-inset-bottom)}
    .dl{grid-template-columns:96px 1fr}
    .rep-line{flex-direction:column;gap:2px}
  }
  /* ── 휴대폰 글씨 한 단계 작게 (2026-11-21 사용자 "모바일에서 글씨가 커서 가독성이 떨어져") — ERP전산(erp/) · MD팀 시트와 같은 값 ──
     표 13 → 12px · 머리글 12 → 11px · 줄 높이 42 → 36px · 칸 좌우 여백 8 → 6px (칸 너비를 재는 setFonts 와 같은 값).
     위쪽(제목 · 요약 카드 · 칩), 대시보드 · 보고서 카드, 상세 창도 같이 줄인다. PC 는 그대로.
     입력 칸(찾기 · 이름 넣기)은 16px — 아이폰은 16px 보다 작은 입력 칸을 누르면 화면을 확대해 버린다. */
  @media (max-width:720px){
    :root{--row-h:36px}
    .find input,.msg input{font-size:16px}
    /* 표 */
    .tbl{font-size:12px}
    .tbl th{height:36px;padding:3px 6px;font-size:11px;line-height:1.25}
    .tbl td{padding:0 6px}
    .tbl .rn{font-size:10.5px;padding:0 5px 0 8px}
    .tbl tfoot td{height:32px}
    .tbl tfoot .ft{font-size:11px}
    .tp,.stage{padding:1px 7px;font-size:11px}
    .ctag{padding:1px 8px;font-size:11px}
    .sure,.est-b,.new{font-size:10px}
    .cam{font-size:10.5px}
    .mut,.upd{font-size:11px}
    /* 위쪽 */
    .bar{height:48px}
    .find{height:34px}
    .st #stText{font-size:11px}
    .head{padding:8px 12px}
    .trow h1{font-size:15px}
    .date{padding:1px 7px;font-size:11px}
    .fpill{height:24px;font-size:11px}
    .etog{height:26px;padding:0 9px;font-size:11px}
    .parts button{height:24px;padding:0 9px;font-size:11.5px}
    .dbtn,.chsel{height:28px;font-size:11.5px}
    .reqb{height:26px;font-size:11px}
    .alert{margin-top:8px;padding:7px 10px;font-size:11.5px;line-height:1.5}
    .alert svg{width:15px;height:15px}

  }
  const imgTag = (p, size, o) => `<img data-img="${esc(sized(p.src, size))}"${p.id ? ` data-key="${esc(p.id + ':' + size)}"` : ''} data-src="${esc(p.src)}"${p.id ? ` data-sid="${esc(p.id)}"` : ''} alt="${esc((o && o.alt) || '')}">`;

  /* ── 개인정보 가리기 — 머리글(위 8줄 안)이 이름 · 연락처 · 주소인 칸, 그리고 어느 칸이든 휴대폰 번호 ── */
  const PII = [
    ['name', /^(이름|성명|고객명|주문자|수령인|수취인|구매자|주문인|받는(분|사람|이)|고객|보내는(분|사람|이)|발송인)(이름|명|성명)?$/],

  /* ── 탭 종류 — '데일리 ○○' = 브랜드별 일지 · '○○_불량건' = 불량 · 그 밖(코페리 · 아페티) = 반품 분석 ── */

  /* ── VOC 코드 추정 — 사유 글 → 오피스 VOC 코드 (📖 VOC 코드표). 오피스 기록과 같은 건은 그 코드가 '확정' ── */
  function guessCode(text, type, brand) {
    const s = String(text || '').replace(/\s+/g, ' ').trim();

    if (/피부\s*(트러블|발진|이상|자극|염|가려|따가|붉)|알레르기|알러지|가려움|가렵|두드러기|붉어졌|발진/.test(s)) return 'S22';
    if (/오배송|다른\s*(상품|옵션|색|제품)/.test(s)) return 'D11';
    if (/누락|안\s*왔|오지\s*않|빠져\s*있|안\s*들어/.test(s)) return /수량/.test(s) ? 'D13' : 'D12';
    if (/(택배|배송\s*중).{0,10}(파손|찌그|젖)/.test(s)) return 'D22';
    if (/분실/.test(s)) return 'D23';
    if (/배송\s*(이\s*)?지연|늦게\s*(와|도착|옴)|지연/.test(s)) return 'D21';
    if (/(끈|손잡이|스트랩|이음새|연결부?).{0,12}(끊|뜯|떨어)/.test(s)) return 'Q12';
    if (/끊어|끊김|끊겼|끊긴/.test(s)) return jewel ? 'Q43' : 'Q12';   // '제품 끊어짐' — 반지 · 목걸이는 부러짐, 가방은 끈 연결부
    if (/박음질|바느질|실밥|봉제|재봉/.test(s)) return 'Q11';
    if (/찢|구멍|해짐/.test(s)) return 'Q21';
    if (jewel && /변색|까맣|검게|착색|색\s*빠|녹\s*슬/.test(s)) return 'Q41';
    if (/오염|얼룩|물\s*빠|이물질|머리카락|냄새|비린내|색\s*빠|변색/.test(s)) return 'Q22';
    if (/지퍼|자석|버클|똑딱/.test(s)) return 'Q31';
    if (/도금/.test(s)) return 'Q42';
    if (/부러|휘어|휨/.test(s) || (jewel && /파손|큐빅|장식.{0,6}(빠|없)/.test(s))) return 'Q43';
    if (/(고리|부자재|장식).{0,8}(없|빠|떨어)/.test(s)) return 'Q32';
    if (/꺼끌|날카|거칠|따가/.test(s)) return 'Q51';
    if (/스크래치|흠집|찍힘|본드|기스/.test(s)) return 'Q52';
    if (/작동|충전|인식\s*(이\s*)?안|안\s*켜/.test(s)) return 'Q61';
    if (/측정|재는\s*기준|치수|(길이|사이즈).{0,8}(설명|표기|정보|기준)/.test(s)) return 'I21';
    if (/색(상|이)?.{0,8}(다르|달라)/.test(s)) return 'I11';
    if (/상세\s*(페이지|이미지|사진)|실물|사진(과|이랑)|이미지(와|랑)/.test(s)) return 'I12';
    if (/은이\s*아닌|진짜\s*은|소재/.test(s)) return 'I22';
    if (/불량|파손|하자|털.{0,8}빠/.test(s)) return 'Q91';

    if (/사이즈|호수/.test(s)) return /(크|커|헐렁)/.test(s) ? 'S12' : 'S11';

    if (type === '교환' && /컬러|색상/.test(s)) return 'C12';
    if (/기대|별로|마음에\s*안|맘에\s*안|생각(과|보다)/.test(s)) return 'C13';

  }

  /* ── 시트 → 한 표로 풀기 ──
     케이스(case) = 한 날 · 한 브랜드 · 한 쇼핑몰 · 반품/교환 · 사유 한 줄. 사유 줄과 상품 줄이 같은 수면 줄끼리 짝짓고,
     상품 칸의 ' / ' 는 상품 여러 개. 건수는 시트 숫자 그대로 (사유 줄마다 나눌 땐 상품 수 → 줄 수 → 나머지 순).
     슬롯(slot) = 날 · 브랜드 · 쇼핑몰 한 칸 (입력했는지 · 0건인지) — 대시보드 '입력 현황'. */
  const lines = s => String(s || '').split(/\n+/).map(x => x.trim()).filter(Boolean);
  const itemsOf = s => String(s || '').split(/\s*\/\s*/).map(x => x.trim()).filter(Boolean);
  const pkey = s => String(s || '').toLowerCase().replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/_.*$/, '').replace(/[^a-z0-9가-힣]+/g, ' ').trim();
  const pmatch = (a, b) => !!a && !!b && Math.min(a.length, b.length) >= 4 && (a.includes(b) || b.includes(a));
  function pairUp(reasons, plines) {
    if (!reasons.length && !plines.length) return [{reason: '', items: []}];
    if (reasons.length <= 1) return [{reason: reasons[0] || '', items: plines.flatMap(itemsOf)}];
    if (plines.length === reasons.length) return reasons.map((r, i) => ({reason: r, items: itemsOf(plines[i])}));
    if (plines.length <= 1) {
      const it = plines.length ? itemsOf(plines[0]) : [];
      if (it.length === reasons.length) return reasons.map((r, i) => ({reason: r, items: [it[i]]}));
      return reasons.map((r, i) => ({reason: r, items: i === 0 ? it : []}));
    }
    const g = reasons.map((r, i) => ({reason: r, items: i < plines.length ? itemsOf(plines[i]) : []}));
    plines.slice(reasons.length).forEach(pl => g[g.length - 1].items.push(...itemsOf(pl)));

  }
  function splitN(groups, n) {
    if (groups.length === 1) { groups[0].n = n; return; }
    const tot = groups.reduce((a, g) => a + Math.max(1, g.items.length), 0);
    if (tot === n) { groups.forEach(g => { g.n = Math.max(1, g.items.length); }); return; }
    if (groups.length === n) { groups.forEach(g => { g.n = 1; }); return; }
    groups.forEach((g, i) => { g.n = i < groups.length - 1 ? 1 : Math.max(1, n - (groups.length - 1)); });
  }
  let CID = 0;
  function mkCase(o) {
    return Object.assign({kind: 'case', id: ++CID, brand: '', date: '', ch: '', chRaw: '', type: '', n: 1, reason: '', items: [], action: '', note: '',
      src: 'daily', gid: '', r: -1, code: '', sure: null, cat: '', fault: '', photos: [], blockKey: ''}, o);
  }
  function typeOfAct(a, note) {
    const t = String(a || '') || String(note || '');   // 처리 칸이 비면 특이사항 글에서 ('…끊어짐/재발송')
    if (/교환/.test(t)) return '교환';
    if (/반품|환불/.test(t)) return '반품';

  }
  const CH_RE = /^(공홈|지그재그|에이블리|스마트스토어|29\s*CM|W\s*컨셉|오늘의집|EQL|쿠팡|한섬|카카오톡?|네이버페이)[^/>]*\/\s*/i;
  function parseNote(s) {
    let ch = '', rest = String(s || '').trim();
    const m = rest.match(CH_RE);
    if (m) { ch = chLabel(m[1]); rest = rest.slice(m[0].length); }
    let prod = '', reason = rest;
    const k = rest.indexOf('>');
    if (k > 0) { prod = rest.slice(0, k).trim(); reason = rest.slice(k + 1).trim(); }
    else {
      const mm = rest.match(/^([A-Za-z0-9][A-Za-z0-9 .'()&+#\/\-]*?)\s+(?=[가-힣])/);

  function idxOf(c, re) { return c.findIndex(x => re.test(norm(x))); }
  function hdrNew(c) {
    const h = {ch: 0, rn: -1, rr: -1, rp: -1, en: -1, er: -1, ep: -1};
    c.forEach((x, i) => {
      const t = norm(x);
      if (t === '반품') h.rn = i; else if (t === '교환') h.en = i;

    });

  }
  const cellAt = (c, i) => i >= 0 ? String(c[i] || '').trim() : '';

  function parseDaily(m, D) {
    const b = m.brand;
    if (!b) return;
    const blocks = [], olds = [];
    let cur = null, oldH = null;
    for (const row of m.rows) {
      const c = row.c, f = String(c[0] || '').trim();
      const dm = f.match(/^(\d{4})\s*\.\s*(\d{1,2})\s*\.\s*(\d{1,2})/);
      if (dm) { cur = {date: ymd(+dm[1], +dm[2], +dm[3]), r: row.r, end: row.r, h: null, rows: [], closed: false}; blocks.push(cur); oldH = null; continue; }
      if (!c.some(x => x)) { if (cur && cur.rows.length) cur.closed = true; continue; }
      if (norm(f) === '쇼핑몰' && cur && !cur.h) { cur.h = hdrNew(c); cur.end = row.r; continue; }
      if (norm(f) === '날짜') { oldH = {note: idxOf(c, /^(특이사항|비고|메모|내용)/), act: idxOf(c, /^처리/)}; cur = null; continue; }
      if (oldH && /^\d{1,2}\s*\/\s*\d{1,2}$/.test(f)) { olds.push({row, h: oldH}); continue; }
      if (cur && cur.h && !cur.closed) {

        cur.rows.push({r: row.r, chRaw: cellAt(c, h.ch), ch: chLabel(cellAt(c, h.ch)), ret: side(h.rn, h.rr, h.rp), exc: side(h.en, h.er, h.ep)});

    }
    // 사진 → 그 줄이 든 날짜 블록 (블록 앞 = 옛 양식 11/3~11/11 쪽)
    const firstBlockR = blocks.length ? blocks[0].r : Infinity;
    const photosOf = {};
    m.imgs.forEach(im => {
      let key = 'old', label = '옛 양식 기록';
      if (im.row >= firstBlockR) {
        let bk = blocks[0];
        blocks.forEach(x => { if (x.r <= im.row) bk = x; });
        key = bk.date; label = dlabel(bk.date) + ' 기록';
      }
      const ph = {src: im.src, id: im.id, brand: b.id, gid: m.gid, row: im.row, key, label: `${b.name} · ${label}`};
      (photosOf[key] = photosOf[key] || []).push(ph);
      D.photos.push(ph);
    });
    // 날짜 블록 → 슬롯 · 케이스
    blocks.forEach(bk => {
      if (!bk.h) return;
      bk.rows.forEach(rw => {
        D.slots.push({brand: b.id, date: bk.date, ch: rw.ch, ret: rw.ret.n, exc: rw.exc.n, filled: rw.ret.n != null || rw.exc.n != null, gid: m.gid, r: rw.r});
        [['반품', rw.ret], ['교환', rw.exc]].forEach(([type, sd]) => {
          if (!sd.n || sd.n < 0) return;
          const g = pairUp(lines(sd.reason), lines(sd.prod));
          splitN(g, sd.n);
          g.forEach(x => {
            // 사유 칸에 '상품>사유'로 적은 줄 ('cobaltiny bag (Teal blue)>주머니안쪽 구멍 생김') — 상품 부분은 떼어 상품 칸으로
            let reason = x.reason, items = x.items;
            const k = reason.indexOf('>');
            if (k > 0 && reason[k - 1] !== '=' && reason[k - 1] !== '-') {
              const left = reason.slice(0, k).trim(), lk = pkey(left);
              if (/^[A-Za-z0-9]/.test(left) && lk && (!items.length || items.some(p => pmatch(pkey(p), lk)))) { if (!items.length) items = [left]; reason = reason.slice(k + 1).trim(); }
            }
            D.cases.push(mkCase({brand: b.id, date: bk.date, ch: rw.ch, chRaw: rw.chRaw, type, n: x.n, reason, items,
              src: 'daily', gid: m.gid, r: rw.r, photos: photosOf[bk.date] || [], blockKey: bk.date}));
          });
        });
      });
    });
    // 옛 줄 양식 (날짜 · 반품 수 · 교환 수 · 특이사항 · 처리) — 숫자 칸은 머리글이 밀려 있어도 숫자가 든 앞 두 칸 = 반품 · 교환
    if (olds.length) {
      const h = olds[0].h, lim = h.note > 0 ? h.note : 6, numCols = [];
      for (let i = 1; i < lim; i++) if (olds.some(o => numOf(o.row.c[i]) != null && String(o.row.c[i]).trim() !== '')) numCols.push(i);
      const [ri, ei] = numCols;
      // 옛 줄과 날짜 블록에 같은 날이 둘 다 적혔으면(코페리 11/11) 날짜 블록만 센다 — 두 번 세지 않게
      const blockDates = new Set(blocks.filter(x => x.h).map(x => x.date));
      olds.forEach(o => {
        const c = o.row.c, date = mdToYmd(c[0]);
        if (!date || blockDates.has(date)) return;
        const ret = ri != null && cellAt(c, ri) !== '' ? numOf(c[ri]) : null, exc = ei != null && cellAt(c, ei) !== '' ? numOf(c[ei]) : null;
        const note = cellAt(c, h.note), act = cellAt(c, h.act);
        D.slots.push({brand: b.id, date, ch: '', ret, exc, filled: ret != null || exc != null || !!note, gid: m.gid, r: o.row.r, old: 1});
        let usedR = 0, usedE = 0;
        const base = {brand: b.id, date, src: 'old', gid: m.gid, r: o.row.r, photos: photosOf.old || [], blockKey: 'old'};
        if (note && !/^(없음|-|x|해당\s*없음)$/i.test(note)) {
          const p = parseNote(note), type = typeOfAct(act, note);
          D.cases.push(mkCase(Object.assign({}, base, {ch: p.ch, chRaw: p.ch, type, n: 1, reason: p.reason || note, items: p.prod ? [p.prod] : [], action: act, note})));
          if (type === '반품') usedR = 1;
          if (type === '교환') usedE = 1;
        }
        if (ret > usedR) D.cases.push(mkCase(Object.assign({}, base, {type: '반품', n: ret - usedR})));
        if (exc > usedE) D.cases.push(mkCase(Object.assign({}, base, {type: '교환', n: exc - usedE})));
      });
    }
    D.daily.push({brand: b, gid: m.gid, name: m.name, blocks: blocks.length, first: olds.length ? mdToYmd(olds[0].row.c[0]) : (blocks[0] ? blocks[0].date : '')});
  }

  function parseDefect(m, D) {
    let h = null;
    const out = {gid: m.gid, name: m.name, brand: m.brand, head: [], rows: []};
    for (const row of m.rows) {
      const c = row.c;
      if (!h) {

        date: dm ? mdToYmd(dm[0]) : '', photos: m.imgs.filter(im => im.row === row.r).map(im => ({src: im.src, id: im.id, label: `${m.name} · ${row.r + 1}줄`})), code: '', sure: null, case: null};
      rec.code = guessCode(rec.reason, typeOfAct(act), rec.brand);

    m.imgs.forEach(im => D.photos.push({src: im.src, id: im.id, brand: m.brand ? m.brand.id : '', gid: m.gid, row: im.row, key: 'defect', label: `${m.name} · ${im.row + 1}줄`}));

  function rebuild() {

        items: it.product ? [it.product + (it.option_text ? ` (${it.option_text})` : '')] : [], action: it.action || '', src: 'office', code: it.code || '', sure: it}));
    });

    const dayGap = (a, b) => Math.abs((dObj(a) - dObj(b)) / 864e5);
    D.defects.forEach(df => df.rows.forEach(rec => {

      rec.cat = rec.code ? rec.code[0] : ''; rec.fault = faultOf(rec.cat);

    D.cases.sort((a, b) => (b.date > a.date ? 1 : b.date < a.date ? -1 : 0) || bOrder(a.brand) - bOrder(b.brand) || a.r - b.r || a.id - b.id);

  /* ── 불러오기 ── */

  function setSheet(id) { SHEET_ID = id || ''; BASE = SHEET_ID ? `https://docs.google.com/spreadsheets/d/${SHEET_ID}` : ''; }

  /* ── 반품 · 교환 받기 — 오피스(부모 창)가 비공개 레포에서 받아 둔 것을 빌려 온다 (5분 지난 것만 다시) ── */

  /* ── 반품 · 교환 계산 (예전 오피스 _clm* 그대로) ── */
  const isCView = v => v === 'dash' || /^[cix]:/.test(v);   // 시트 없이 보이는 화면 — c: 반품 · 교환, i: 문의 · 리뷰, x: 개선 요청 · 작업 보드

  // 상품 이름 키 — 공백 · 대소문자에 더해 꾸밈 부호도 뗀다 (야르 주문에 'd֑r֑e֑s֑d֑e֑n֑ S֑9֑2֑5֑…' 같은 이름이 섞여 반품 줄이 둘로 갈리던 것, 11-20)

  function cRows(from, to, o) {

  // 지금 처리 중 (날짜와 상관없이 — 브랜드 · 채널 · 구분만). 접수 30일 안 = 처리 중, 넘으면 확인 필요
  const cOpenAll = () => C.lines.filter(l => OPEN.has(l.stage) && (!V.ct || l.type === V.ct) && (!V.cc || l.channel === V.cc) && (!V.cb || l.brand === V.cb));

  /* ── 칸 너비 자동 (erp/ 처럼 — 들어간 글자 길이로, 화면 폭에 맞춤) ── */
  let CTX = null;

  function widths(cols, cells) {
    const ws = cols.map((c, j) => {
      const head = Math.min(tw(c.l, F_HEAD), c.max || 150) + W_HEAD;
      // 빈 칸은 빼고 잰다 — 드문 칸(처리 · 액션)이 머리글 폭으로 줄어 글이 다 잘리지 않게
      const vals = cells.slice(0, 800).filter(r => String(r[j].t || '') !== '').map(r => { const x = r[j]; return Math.max(0, ...String(x.t || '').split('\n').map(s => tw(s, x.f || F_CELL))) + (x.pad || 0); }).sort((a, b) => a - b);
      const p = vals.length ? vals[Math.min(vals.length - 1, Math.floor(vals.length * 0.9))] : 0;
      let w = Math.max(head, p + W_CELL, c.min || 44);
      if (c.max) w = Math.min(w, c.max);

    const tot = ws.reduce((a, b) => a + b, 0);
    if (avail > 0 && tot < avail) {
      const flex = cols.map((c, j) => c.flex ? j : -1).filter(j => j >= 0);
      const add = Math.floor((avail - tot) / (flex.length || 1));
      if (flex.length) flex.forEach(j => { ws[j] += add; }); else ws[ws.length - 1] += avail - tot;

    }
    return ws;
  }
  // cols: [{k, l, get(row) → {t, h, s, f, pad}, min, max, flex, wrap, num}] — rows 는 S.list 에 넣고 줄 번호로 상세 창

  function cReasonCard(cur) {

      const tip = `${R.l} ${n}건 · ${F_L[R.f]} · 채널: ${ch}${src ? ` · 몰 사유: ${src}` : ''}${k === 'none' ? ' · 공홈 11/13 전 완료 건 · W컨셉은 몰이 사유를 안 줘요' : ''} — 누르면 목록`;

  function cHeatCard() {
    const what = cByBrand() ? '브랜드' : '채널', P0 = P;

      rowCls: c => c.kind === 'slot' ? 'dim' : c.fault === 'co' ? 'co' : '',
      foot: (c, list) => c.k === 'n' ? String(sumN(list.filter(x => x.kind === 'case'))) : c.k === 'reason' ? `<span class="ft">${list.filter(x => x.kind === 'case').length}줄</span>` : '',
    });
  }

  /* ── 🧷 불량 · 재발송 ── */
  function renderDefect() {
    const gid = V.view.split(':')[1], df = S.D.defects.find(x => x.gid === gid);
    if (!df) { go('dash'); return; }
    const t = terms();
    const rows = df.rows.filter(r => !t.length || t.every(x => (r.cells.join(' ') + ' ' + codeText(r.code)).toLowerCase().includes(x)));
    head(`불량 · 재발송 · ${df.name.replace(/_/g, ' ')}`, {date: `${df.rows.length}건 · 시트 그대로`});
    const ph = df.rows.reduce((a, r) => a + r.photos.length, 0);
    const byCh = {};
    df.rows.forEach(r => { if (r.ch) byCh[r.ch] = (byCh[r.ch] || 0) + 1; });
    kpis([
      {v: fmt(df.rows.length), u: '건', l: '불량 · 재발송'},
      {v: fmt(df.rows.filter(r => r.cat === 'Q').length), u: '건', l: '제품 불량 (VOC Q)', cls: 'red'},
      {v: fmt(ph), u: '장', l: '사진'},
    ].concat(Object.entries(byCh).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => ({v: fmt(n), u: '건', l: k}))));
    alertBox('이름 · 연락처는 가려서 보여요 (시트 원본은 그대로). 이 탭은 링크가 있는 누구나 볼 수 있는 시트라 <b>고객 이름 · 전화번호는 시트에서도 지우거나 오피스로 옮기는 것</b>을 권해요.', true);
    const cols = df.head.map((hname, i) => {
      const n = norm(hname);
      if (/^사진/.test(n)) return {k: 'c' + i, l: hname || '사진', get: r => ({t: r.photos.length ? `📷 ${r.photos.length}` : '', h: r.photos.length ? `📷 ${r.photos.length}장` : '<span class="none">—</span>'})};
      const wrap = /증상|사유|처리|제품|상품|메모/.test(n);
      return {k: 'c' + i, l: hname || '', wrap, flex: /증상|사유|제품|상품/.test(n) ? 1 : 0, max: wrap ? 320 : 220, num: /주문번호/.test(n) ? false : false,
        get: r => ({t: r.cells[i] || '', h: r.cells[i] ? hl(r.cells[i]) : '<span class="none">—</span>'})};
    }).filter((c, i) => df.head[i] || df.rows.some(r => r.cells[i]));
    cols.push({k: 'code', l: 'VOC 코드', max: 220, get: r => ({t: codeText(r.code), s: r.code || 'zz', h: codeHtml(r.code, !!r.sure) + (r.sure ? '<span class="sure">확정</span>' : ''), pad: r.sure ? 34 : 0})});
    drawTable(cols, rows, {empty: '찾는 말이 든 줄이 없어요', rowCls: r => r.cat === 'Q' ? 'co' : ''});
  }

  /* ── 📈 반품 분석 탭 (코페리 · 아페티) — 시트 글 + 시트에 붙인 그래프 · 표 캡처 ── */
  function renderReport() {
    const gid = V.view.split(':')[1], m = S.D.reports.find(x => x.gid === gid);
    if (!m) { go('dash'); return; }
    head(m.brand ? `${m.brand.name} 반품 분석` : m.name, {date: '시트 ' + m.name + ' 탭'});
    grid.classList.add('bd-mode');
    const rows = m.rows.filter(r => r.c.some(x => x));
    let h = '<div class="board" style="grid-template-columns:minmax(0,1fr)">';
    let lh = '<div class="rep-lines">', first = true;
    rows.forEach((row, i) => {
      const cells = row.c.map((x, p) => ({x, p})).filter(o => o.x);
      if (first && cells.length === 1 && i === 0 && m.brand && brandOf(cells[0].x)) { first = false; return; }   // 맨 위 브랜드 이름 줄
      first = false;
      if (cells.length === 1 && /^>/.test(cells[0].x)) { lh += `<div class="rep-line sub"><span>${esc(cells[0].x)}</span></div>`; return; }
      if (cells.length === 1 && cells[0].x.length <= 14 && !/\d/.test(cells[0].x)) { lh += `<div class="rep-h">${esc(cells[0].x)}</div>`; return; }
      const sub = cells[0].p >= 3 || /^>/.test(cells[0].x);
      const k = cells[0].x, rest = cells.slice(1).map(o => o.x).join('  ·  ');
      lh += `<div class="rep-line${sub ? ' sub' : ''}"><b>${esc(k)}</b><span>${esc(rest)}</span></div>`;
    });
    lh += '</div>';
    h += `<section class="card"><div class="card-h"><b>시트에 적힌 내용</b><span>${esc(m.name)} 탭 · 줄 순서 그대로</span>${secretOk() ? `<a class="more" href="${sheetUrl(m.gid)}" target="_blank" rel="noopener">시트에서 보기 ↗</a>` : ''}</div>${rows.length ? lh : '<div class="card-e">적힌 글이 없어요</div>'}</section>`;
    if (m.imgs.length) h += `<section class="card"><div class="card-h"><b>시트에 붙인 그래프 · 표</b><span>${m.imgs.length}장 · 누르면 크게</span></div><div class="gal big">${m.imgs.map((im, i) => `<figure data-src="${esc(im.src)}" data-sid="${esc(im.id || '')}">${imgTag(im, 1600, {alt: `${m.name} ${i + 1}`})}<figcaption>${esc(m.name)} · ${i + 1}</figcaption></figure>`).join('')}</div></section>`;
    // 같은 브랜드의 데일리 일지에서 지금 기간 많이 나온 상품 (이어 보기)
    if (m.brand) {
      const cs = S.D.cases.filter(c => c.brand === m.brand.id && inP(c.date));
      const pr = productRank(cs).slice(0, 8);
      if (pr.length) h += `<section class="card"><div class="card-h"><b>지금 데일리 일지에서 많이 나온 상품</b><span>${esc(P.l)} · ${esc(m.brand.name)}</span></div><div class="card-b"><table class="mt"><thead><tr><th>상품</th><th>건수</th><th>반품 · 교환</th><th>사유</th></tr></thead><tbody>` +
        pr.map(p => `<tr class="click" data-go='${esc(JSON.stringify({view: 'log:' + p.brand, q: p.name}))}'><td class="wrap"><b>${esc(p.name)}</b></td><td class="b">${p.n}</td><td><span class="rv">${p.r}</span> · <span class="ev">${p.e}</span></td><td>${Object.entries(p.cats).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([k]) => catTag(k === '-' ? '' : k)).join(' ')}</td></tr>`).join('') + '</tbody></table></div></section>';
    }
    grid.innerHTML = h + '</div>';
    hydrate(grid);
  }

  /* ── 📖 VOC 코드표 (오피스 CSI_CODES 그대로) + 이 기간 건수 ── */
  function renderCodes() {
    head('VOC 코드표', {date: CODES.length ? `코드 ${CODES.length}개 · 건수는 ${P.l}` : '', period: V.part === 'codes',
      tools: `<div class="parts" role="group" aria-label="보기">${[['codes', '코드'], ['sop', '처리 기준'], ['sev', '심각도']].map(([k, l]) => `<button type="button" data-part="${k}" class="${V.part === k ? 'on' : ''}">${l}</button>`).join('')}</div>`});
    if (!CODES.length) {
      alertBox('VOC 코드표는 오피스 안(CS팀 화면 맨 아래)에서 열면 보여요 — 코드표 원본이 오피스에 있어요.', true);
      grid.innerHTML = '';
      return;
    }
    const cnt = {}, cases = S.D.cases.filter(c => inP(c.date));
    cases.forEach(c => { if (c.code) cnt[c.code] = (cnt[c.code] || 0) + c.n; });
    const used = Object.keys(cnt).length;
    kpis([
      {v: fmt(CODES.length), u: '개', l: 'VOC 코드'},
      {v: fmt(used), u: '개', l: '이 기간 쓰인 코드'},
      {v: fmt(sumN(cases, c => !!c.sure)), u: '건', l: '확정 (오피스 기록)', cls: 'blue'},
      {v: fmt(sumN(cases, c => c.code && !c.sure)), u: '건', l: '추정 (사유 글로)'},
    ]);
    if (V.part === 'sop') {
      grid.classList.add('bd-mode');
      const F = [['first', '첫 응대'], ['proof', '받을 증빙'], ['how', '처리'], ['fee', '배송비'], ['due', '기한'], ['report', '전달 · 보고'], ['law', '법 기준']];
      grid.innerHTML = '<div class="board">' + CAT_ORDER.filter(k => SOP[k]).map(k => `<section class="card"><div class="card-h"><b><i class="bdot" style="background:${CAT[k].c}"></i>${k} · ${esc(CAT[k].l)}</b><span>${COMPANY.has(k) ? '회사 사유' : k === 'C' ? '고객 사유' : ''}</span></div><dl class="sop">${F.filter(([f]) => SOP[k][f]).map(([f, l]) => `<dt>${l}</dt><dd>${esc(SOP[k][f])}</dd>`).join('')}</dl></section>`).join('') + '</div>';
      return;
    }
    if (V.part === 'sev') {
      S.list = [];
      grid.innerHTML = '<table class="tbl" style="width:100%"><colgroup><col style="width:90px"><col><col></colgroup><thead><tr><th>심각도</th><th>기준</th><th>처리</th></tr></thead><tbody>' +
        SEV.map(s => `<tr><td><b>${esc(s[0])}</b></td><td><div class="cl" style="-webkit-line-clamp:3">${esc(s[1])}</div></td><td><div class="cl" style="-webkit-line-clamp:3">${esc(s[2])}</div></td></tr>`).join('') + '</tbody></table>';
      return;
    }
    const byCat = {};
    CODES.forEach(c => { byCat[c.cat] = (byCat[c.cat] || 0) + 1; });
    $('chips').hidden = false;
    $('chips').innerHTML = [`<button type="button" class="chip${!V.cat ? ' on' : ''}" data-cat="">전체 <em>${CODES.length}</em></button>`, `<button type="button" class="chip${V.cat === 'used' ? ' on' : ''}" data-cat="used">이 기간 쓰인 코드 <em>${used}</em></button>`, '<span class="chip-sep"></span>']
      .concat(CAT_ORDER.filter(k => byCat[k]).map(k => `<button type="button" class="chip${V.cat === k ? ' on' : ''}" data-cat="${k}"><i style="background:${CAT[k].c}"></i>${k} ${esc(CAT[k].l)} <em>${byCat[k]}</em></button>`)).join('');
    const t = terms();
    const rows = CODES.filter(c => (!V.cat || (V.cat === 'used' ? cnt[c.code] : c.cat === V.cat)) &&
      (!t.length || t.every(x => [c.code, c.mid, c.name, c.def, c.likely, c.basic, c.ex, CAT[c.cat] ? CAT[c.cat].l : ''].join(' ').toLowerCase().includes(x))))
      .map(c => Object.assign({kind: 'code', n: cnt[c.code] || 0}, c));
    const sevRank = {긴급: 0, 높음: 1, 보통: 2, 낮음: 3};
    drawTable([
      {k: 'code', l: '코드', min: 58, get: c => ({t: c.code, h: `<b>${hl(c.code)}</b>`})},
      {k: 'cat', l: '대분류', get: c => ({t: CAT[c.cat] ? CAT[c.cat].l : c.cat, s: CAT_ORDER.indexOf(c.cat), h: catTag(c.cat), f: F_TAG, pad: 18})},
      {k: 'mid', l: '중분류', get: c => ({t: c.mid})},
      {k: 'name', l: '증상', max: 240, wrap: true, get: c => ({t: c.name})},
      {k: 'n', l: '건수', num: true, min: 50, get: c => ({t: String(c.n), s: c.n, h: c.n ? `<b>${c.n}</b>` : '<span class="z">0</span>'})},
      {k: 'team', l: '전달 팀', get: c => ({t: TEAMS[c.team] || c.team || ''})},
      {k: 'sev', l: '심각도', get: c => ({t: c.sev, s: sevRank[c.sev] != null ? sevRank[c.sev] : 9, h: c.sev === '긴급' || c.sev === '높음' ? `<b style="color:${c.sev === '긴급' ? '#b91c1c' : '#c2410c'}">${esc(c.sev)}</b>` : esc(c.sev)})},
      {k: 'def', l: '판단 기준', wrap: true, flex: 1, min: 180, max: 420, get: c => ({t: c.def})},
      {k: 'basic', l: '기본 처리', wrap: true, flex: 1, min: 160, max: 360, get: c => ({t: c.basic})},
      {k: 'ex', l: '실제 사례', wrap: true, min: 140, max: 320, get: c => ({t: c.ex || '', h: c.ex ? hl(c.ex) : '<span class="none">—</span>'})},
    ], rows, {empty: '해당하는 코드가 없어요', rowCls: c => c.n ? '' : 'dim'});
  }

  /* ── 📷 시트 사진 ── */
  function renderPhotos() {
    const ph = S.D.photos;
    head('시트 사진', {date: `${ph.length}장 · 누르면 크게`});
    grid.classList.add('bd-mode');
    const groups = {};
    ph.forEach(p => { (groups[p.label] = groups[p.label] || []).push(p); });
    grid.innerHTML = '<div class="board" style="grid-template-columns:minmax(0,1fr)">' + Object.entries(groups).map(([label, arr]) =>
      `<section class="card"><div class="card-h"><b>${esc(label)}</b><span>${arr.length}장</span>${secretOk() ? `<a class="more" href="${sheetUrl(arr[0].gid, arr[0].row)}" target="_blank" rel="noopener">시트에서 보기 ↗</a>` : ''}</div><div class="gal${arr[0].big ? ' big' : ''}">${arr.map((p, i) => `<figure data-src="${esc(p.src)}" data-sid="${esc(p.id || '')}">${imgTag(p, p.big ? 1600 : 400, {alt: `${label} ${i + 1}`})}<figcaption>${esc(label)} · ${i + 1}</figcaption></figure>`).join('')}</div></section>`).join('') + '</div>';
    hydrate(grid);
  }

  /* ── 상세 창 ── */
  function dlRow(k, v, o) { return v === '' || v == null ? '' : `<dt>${esc(k)}</dt><dd${o && o.r ? ' class="r"' : ''}>${o && o.html ? v : esc(v)}</dd>`; }
  function codeBlock(code, sure) {
    if (!code) return '';
    const c = CODE[code], sop = SOP[code[0]];
    let h = dlRow('VOC 코드', `${codeHtml(code, !!sure)}${sure ? '<span class="sure">확정</span>' : '<span class="est-b">사유 글로 추정</span>'}`, {html: true});
    if (c) {
      h += dlRow('판단 기준', c.def);
      h += dlRow('기본 처리', c.basic);
      h += dlRow('전달 팀', `${TEAMS[c.team] || c.team} · 심각도 ${c.sev}`);
    }
    if (sop) h += dlRow('처리 기준', [sop.fee ? `배송비: ${sop.fee}` : '', sop.due ? `기한: ${sop.due}` : '', sop.report ? `전달: ${sop.report}` : ''].filter(Boolean).join('\n'));
    return h;
  }
  const thumbs = arr => arr && arr.length ? `<div class="dthumbs">${arr.map(p => imgTag(p, 240)).join('')}</div>` : '';
  function openDetail(i, keep) {
    const it = S.list[i];
    if (!it) return;
    S.sel = i; S.selObj = it;
    // 답을 적는 중이면 다시 그리지 않는다 (글자가 사라지지 않게)
    if (keep && it.kind === 'inq' && document.activeElement && document.activeElement.id === 'iaText' && document.activeElement.dataset.iaid === String(it.id)) return;
    const d = $('detail');
    d.hidden = false; app.classList.add('has-detail');
    $('dscrim').hidden = !matchMedia('(max-width:720px)').matches;
    $('dCap').textContent = `${i + 1} / ${S.list.length}`;
    let title = '', sub = '', dl = '', gid = '', r = -1;
    if (it.kind === 'case' || it.kind === 'slot') {
      title = it.items.join(', ') || it.reason || (it.kind === 'slot' ? `${it.ch} · ${it.type}` : '(상품 미기재)');
      sub = `${dlabel(it.date)} · ${bName(it.brand)}${it.ch ? ' · ' + it.ch : ''} · ${it.type}${it.n ? ' ' + it.n + '건' : ''}`;
      gid = it.gid; r = it.r;
      dl += dlRow('구분', typePill(it.type), {html: true});
      if (it.kind === 'case') dl += dlRow('건수', it.n + '건', {r: 1});
      dl += dlRow('쇼핑몰', it.chRaw || it.ch || '');
      if (it.kind === 'case') dl += dlRow('사유', it.reason || '사유 안 적음 (숫자만 적힘)');
      if (it.note && it.note !== it.reason) dl += dlRow('시트 원문', it.note);
      if (it.kind === 'case') dl += dlRow('분류', `${catTag(it.cat)} <span class="muted">${FAULT_L[it.fault] || ''}</span>`, {html: true});
      dl += codeBlock(it.code, it.sure);
      if (it.items.length) dl += dlRow('상품', it.items.join('\n'));
      dl += dlRow('처리', it.action);
      if (it.sure) {
        const o = it.sure;
        dl += dlRow('오피스 기록', [o.sub ? `증상: ${o.sub}` : '', o.cause ? `원인: ${o.cause}` : '', o.action ? `처리: ${o.action}` : '', o.detail ? `내용: ${o.detail}` : ''].filter(Boolean).join('\n'));
      }
      if (it.photos && it.photos.length) dl += dlRow(it.blockKey === 'old' ? '시트 사진' : '이날 시트 사진', thumbs(it.photos) + (it.blockKey === 'old' ? '<div class="muted">옛 양식(11/3~11/11) 칸에 붙은 사진이에요</div>' : ''), {html: true});
      const src = {daily: '데일리 일지', old: '데일리 일지 (옛 줄 양식)', defect: '불량건 탭', office: '오피스 VOC 기록 (시트에 없음)', slot: '데일리 일지'}[it.src] || '';
      const tab = S.D.tabs.find(x => x.gid === it.gid);
      dl += dlRow('원본', `${src}${tab ? ` · ${tab.name} 탭 ${it.r + 1}줄` : ''}`);
      // 같은 상품 다른 기록
      if (it.kind === 'case' && it.items.length) {
        const keys = it.items.map(pkey).filter(Boolean);
        const others = S.D.cases.filter(c => c !== it && c.brand === it.brand && c.items.some(p => keys.some(k => pmatch(pkey(p), k))));
        if (others.length) dl += dlRow(`같은 상품 ${others.length}건`, `<div class="hist">${others.slice(0, 12).map(c => `<button type="button" data-case="${c.id}"><span class="hd">${esc(md(c.date))}</span>${typePill(c.type)}<span class="hr">${esc(c.reason || '사유 안 적음')}${c.items.length ? ' · ' + esc(c.items.join(', ')) : ''}</span></button>`).join('')}</div>`, {html: true});
      }
    } else if (it.kind === 'defect') {
      const df = S.D.defects.find(x => x.gid === it.gid);
      title = it.prod || '(제품명 없음)';
      sub = `${bName(it.brand)}${it.ch ? ' · ' + it.ch : ''}${it.act ? ' · ' + it.act : ''}`;
      gid = it.gid; r = it.r;
      (df ? df.head : []).forEach((hn, j) => { if (!/^사진/.test(norm(hn))) dl += dlRow(hn || `${j + 1}번 칸`, it.cells[j] || ''); });
      dl += codeBlock(it.code, it.sure);
      if (it.photos.length) dl += dlRow('사진', thumbs(it.photos), {html: true});
      const keys = [pkey(it.prod)];
      const others = S.D.cases.filter(c => c.brand === it.brand && c.items.some(p => keys.some(k => pmatch(pkey(p), k))));
      if (others.length) dl += dlRow(`데일리 일지 ${others.length}건`, `<div class="hist">${others.slice(0, 12).map(c => `<button type="button" data-case="${c.id}"><span class="hd">${esc(md(c.date))}</span>${typePill(c.type)}<span class="hr">${esc(c.reason || '사유 안 적음')}</span></button>`).join('')}</div>`, {html: true});
    } else if (it.kind === 'claim') {
      // 반품 · 교환 자동 수집 한 줄
      const o = OPEN.has(it.stage), q = Number(it.qty) || 1;
      title = it.product || '(상품 이름 없음)';
      sub = `${dlabel(it.date)} · ${bName(it.brand)} · ${chL(it.channel)}${it.route ? ' ' + it.route : ''} · ${typeKo(it)}${q > 1 ? ` ${q}개` : ''}`;

  function openCase(id) {

    openDetail(i);
  }
  function openClaim(id) {
    const c = C.lines.find(l => l.id === id);
    if (!c) return;
    let i = S.list.findIndex(x => x.kind === 'claim' && x.id === id);
    if (i < 0) { S.list = [c]; i = 0; }
    openDetail(i);
  }

  $('nav').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) go(b.dataset.v); });
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]');
    if (g && !e.target.closest('.nav')) {
      let o = {};
      try { o = JSON.parse(g.dataset.go); } catch (err) { return; }
      if (o.view) go(o.view, o);
      else {
        ['type', 'cat', 'pf', 'cf', 'cr', 'qtopic'].forEach(k => { if (k in o) V[k] = o[k]; });
        if ('ct' in o) { V.ct = o.ct; savePrefs(); }
        if ('qt' in o) { V.qt = o.qt; savePrefs(); }
        closeDetail(); render(true);
      }
      return;
    }
    const cs = e.target.closest('[data-case]');
    if (cs) { openCase(cs.dataset.case); return; }
    // 반품 · 교환 — 상품 🛠 개선 요청 · 줄 상세 · 브랜드 · 채널 · 구분 · 비교 기준 · 요약 복사
    const rq = e.target.closest('[data-req]');
    if (rq) { makeReq(rq.dataset.req); return; }
    const cl0 = e.target.closest('[data-claim]');
    if (cl0) { openClaim(cl0.dataset.claim); return; }
    const iq0 = e.target.closest('[data-inq]');
    if (iq0) { openInq(iq0.dataset.inq); return; }
    const ia0 = e.target.closest('[data-iacopy],[data-iasure],[data-iano],[data-iasend],[data-iadone],[data-iaundo],[data-iaref]');
    if (ia0) {
      const D = ia0.dataset;
      if (D.iacopy) { const t = $('iaText'); if (t && t.value.trim()) copyText(t.value.trim()); else toast('복사할 글이 없어요'); }
      else if (D.iasure) { IA.sure = D.iasure; IA.msg[D.iasure] = ''; iaRedraw(); }
      else if (D.iano) { IA.sure = ''; iaRedraw(); }
      else if (D.iasend) iaAct(D.iasend, 'send');
      else if (D.iadone) iaAct(D.iadone, 'done');
      else if (D.iaundo) iaAct(D.iaundo, 'done', true);
      else if (D.iaref) { const dr = IA.map.get(D.iafor), f = dr && dr.refs[+D.iaref]; if (f) { IA.text[D.iafor] = f.a; IA.sure = ''; iaRedraw(); } }
      return;
    }
    const kd0 = e.target.closest('[data-kdef]');
    if (kd0) { openKdef(kd0.dataset.kdef); return; }
    const csf = e.target.closest('img[data-csfull]');
    if (csf) { openCsFull(csf.dataset.csfull); return; }

    if (ch0) { if (SH && typeof SH.openChat === 'function') SH.openChat(ch0.dataset.chat); return; }
    const qtb = e.target.closest('[data-qt]');
    if (qtb) { V.qt = qtb.dataset.qt; savePrefs(); closeDetail(); render(true); return; }
    const cb = e.target.closest('[data-cb]');
    if (cb) { V.cb = cb.dataset.cb; savePrefs(); closeDetail(); render(true); return; }
    const cc = e.target.closest('[data-cc]');
    if (cc) { V.cc = cc.dataset.cc; savePrefs(); closeDetail(); render(true); return; }
    const ctb = e.target.closest('[data-ct]');
    if (ctb) { V.ct = ctb.dataset.ct; savePrefs(); closeDetail(); render(true); return; }
    const cmp = e.target.closest('[data-cmp]');
    if (cmp) { V.cmp = cmp.dataset.cmp; savePrefs(); render(true); return; }

    const pt = e.target.closest('[data-part]');
    if (pt) { V.part = pt.dataset.part; V.cat = ''; savePrefs(); render(); return; }
    const ct = e.target.closest('#chips [data-cat]');
    if (ct) { V.cat = ct.dataset.cat; render(true); return; }
    const cl = e.target.closest('[data-clear]');
    if (cl) { if (cl.dataset.clear === 'date') V.date = ''; if (cl.dataset.clear === 'cr') V.cr = ''; render(); return; }
    if (e.target.closest('#zeroTog')) { V.zero = !V.zero; savePrefs(); render(true); return; }

      saveSheet(i ? i.value : '').then(ok => { if (ok) { S.askSheet = false; $('msg').innerHTML = ''; renderMsg(); } });
      return;

      render(true); return;
    }
    const tr = e.target.closest('tbody tr[data-i]');
    if (tr) openDetail(+tr.dataset.i);
  });
  $('kpis').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-go]')) { e.preventDefault(); e.target.click(); } });
  $('dClose').onclick = closeDetail;
  $('dscrim').onclick = closeDetail;
  $('dPrev').onclick = () => { if (S.sel > 0) openDetail(S.sel - 1); };
  $('dNext').onclick = () => { if (S.sel < S.list.length - 1) openDetail(S.sel + 1); };
  $('lb').onclick = () => { $('lb').hidden = true; $('lbImg').removeAttribute('src'); };
  $('st').onclick = () => { if (SHEET_ON) { loadAll(); loadOffice(true); } loadClaims(true); loadInq(true); loadDefects(true); };
  let qT = null;
  qIn.addEventListener('input', () => {
    $('qx').hidden = !qIn.value;
    clearTimeout(qT);
    qT = setTimeout(() => {
      V.q = qIn.value;
      if (!V.q) $('qn').textContent = '';
      // 찾기 — 시트 화면(일지 · 불량 · 코드표)은 그 자리에서, 반품 · 교환 화면은 목록(상품 분석은 그 자리)으로
      if (V.q && !(V.view === 'log' || /^log:|^defect:/.test(V.view) || V.view === 'codes' || V.view === 'c:list' || V.view === 'c:prod' || V.view === 'i:list')) {
        V.view = /^i:/.test(V.view) ? 'i:list' : C.data || !S.D || !SHEET_ON ? 'c:list' : 'log'; V.type = ''; V.cat = ''; V.date = ''; V.cf = ''; V.cr = ''; V.qtopic = ''; V.sort = null; savePrefs();
      }
      render();
    }, 160);
  });
  $('qx').onclick = () => { qIn.value = ''; V.q = ''; $('qx').hidden = true; $('qn').textContent = ''; render(); qIn.focus(); };
  $('btnMenu').onclick = () => {
    if (matchMedia('(min-width:1001px)').matches) { app.classList.remove('side-off'); lsSet(LS_SIDE, ''); render(true); return; }
    app.classList.add('nav-open'); $('scrim').hidden = false;
    extSync();
  };
  $('scrim').onclick = () => { app.classList.remove('nav-open'); $('scrim').hidden = true; extSync(); };
  $('btnFold').onclick = () => {
    if (!matchMedia('(min-width:1001px)').matches) { app.classList.remove('nav-open'); $('scrim').hidden = true; extSync(); return; }
    app.classList.add('side-off'); lsSet(LS_SIDE, '1'); render(true);
  };
  $('btnDense').onclick = () => { const on = !app.classList.contains('dense'); app.classList.toggle('dense', on); $('btnDense').classList.toggle('on', on); lsSet(LS_DENSE, on ? '1' : ''); };
  // 고치는 글을 기억 — 다시 그려도 그대로, 고치면 '이대로 올리기'는 다시 물음
  document.addEventListener('input', e => {
    if (e.target.id !== 'iaText') return;
    IA.text[e.target.dataset.iaid] = e.target.value;
    if (IA.sure) { IA.sure = ''; const b = document.querySelector('[data-iasend]'), n = document.querySelector('[data-iano]'); if (n) n.remove(); if (b) { b.dataset.iasure = b.dataset.iasend; delete b.dataset.iasend; b.textContent = '보내기'; } }
  });
  $('btnFull').onclick = () => {
    try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { /* noop */ }
  };
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); qIn.focus(); qIn.select(); return; }
    if (e.key === 'Escape') {
      if (!$('lb').hidden) { $('lb').hidden = true; return; }
      if (!$('detail').hidden) { closeDetail(); return; }
      if (document.activeElement === qIn && qIn.value) { $('qx').click(); return; }
    }
    if (e.key === 'Enter' && document.activeElement && document.activeElement.id === 'sheetIn') { e.preventDefault(); const b = $('sheetSave'); if (b) b.click(); return; }
    if (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
    if (!$('detail').hidden && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) {
      e.preventDefault();
      if (e.key === 'ArrowDown' && S.sel < S.list.length - 1) openDetail(S.sel + 1);
      if (e.key === 'ArrowUp' && S.sel > 0) openDetail(S.sel - 1);
    }
  });
  let rT = null;
  window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => { setFonts(); render(true); }, 180); });   // 휴대폰 ↔ PC 폭이 바뀌면 칸 너비 글자 크기도
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.D) render(true); });   // Pretendard 가 늦게 오면 칸 너비 다시 재기

  // 화면이 보일 때만 다시 읽기 — 오피스 CS팀 화면이 숨으면(다른 팀 화면) iframe 이 숨어 멈춘다
  function shown() {
    if (document.visibilityState !== 'visible') return false;
    try { const fe = window.frameElement; if (fe && !fe.offsetParent && !document.fullscreenElement) return false; } catch (e) { /* noop */ }
    return true;
  }
  setInterval(() => {
    if (!shown()) return;
    if (SHEET_ON && !S.busy && Date.now() - S.at > REFRESH_MS) { loadAll(); loadOffice(false); }
    loadClaims(false); loadInq(false); loadDefects(false);   // 5분 지난 것만 오피스에 다시 물음 (오피스도 5분 안이면 받아 둔 것을 그대로 줌)
  }, 20e3);
  document.addEventListener('visibilitychange', () => { if (!shown()) return; if (SHEET_ON && Date.now() - S.at > REFRESH_MS) loadAll(); loadClaims(false); loadInq(false); loadDefects(false); });

  /* ── 시작 ── */
  if (EMBED) $('sideHome').hidden = true;
  setSheet(/^[A-Za-z0-9_-]{20,}$/.test(lsGet(LS_SHEET) || '') ? lsGet(LS_SHEET) : '');   // 기억해 둔 주소로 먼저 (오피스 값은 loadAll 이 확인)
  if (lsGet(LS_SIDE) === '1') app.classList.add('side-off');
  if (lsGet(LS_DENSE) === '1') { app.classList.add('dense'); $('btnDense').classList.add('on'); }
  loadPrefs();
  if (SHEET_ON && loadCache()) { rebuild(); setSt('stored'); }
  render();   // 시트가 아직이면 시트 화면은 빈 표 모양(SKEL), 반품 · 교환 화면은 '불러오는 중'
  if (SHEET_ON) { loadAll(); loadOffice(false); }
  loadClaims(false);
  loadInq(false);
  loadDefects(false);
  setAutoSt();
})();
</script>
</body>
</html>
