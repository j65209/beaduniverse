<script>
  /* 오피스 안 화면(iframe, index.html 의 TOOL_PAGES 'adlib')이면 '← 오피스' 는 그 화면을 닫는다 (bbToolClose). 혼자 열면 이 페이지의 잠금 화면. */
  (function () {
    var inOffice = false, home = '';
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    window.__inOffice = inOffice;
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
    });
  })();

  function help() {
    overlay(`<h3>숫자 읽는 법</h3><p>메타는 남의 <b>광고비 · 매출 · ROAS 를 공개하지 않아요.</b> 아래 점수는 공개된 것(광고 개수 · 기간 · 노출 순서)으로 브랜드끼리 견준 <b>추정</b>이에요 (0~100, 높을수록 앞).</p>
      <ul><li><b>광고비 추정</b> — 최근 30일 동안 돌린 광고 수 × 날짜 반, 주얼리 낱말을 메타에서 '노출 많은 순'으로 찾았을 때 앞에 나온 정도 반</li><li><b>효율 추정</b> — 30일 넘게 안 끄고 노출 상위에 남은 주력 광고가 많고, 비율이 높고, 상위 광고가 오래된 곳 (잘 안 되는 광고는 보통 빨리 끄니까요). 소재 6개 미만 · 거의 안 쓰는 곳은 점수를 안 매겨요</li><li><b>잘 되는 광고</b> — 오래 돌고(50) 브랜드 안 노출 순위가 높고(35) 같은 소재를 여러 개로 돌리는(15) 광고. 2주 안 된 광고는 '새 광고'로만</li><li>브랜드는 <b>무신사 · 에이블리 · 지그재그 · 아몬즈 · 29CM · EQL · W컨셉 가운데 한 곳이라도 입점이 확인된 패션 · 주얼리 브랜드와, 29CM 리빙 베스트 · 스마트스토어에서 파는 리빙 브랜드</b>만 실어요(직접 넣은 브랜드는 그대로). 주얼리 · 패션 낱말로 찾은 광고주를 입점 명단과 맞추고, 순위권 브랜드는 이름으로도 찾아요. <b>지금 메타 광고 라이브러리에 떠 있는 소재만, 전부</b> 실어요(두 주 동안 다시 못 본 소재는 빼요)</li><li><b>세일 소재</b> — 문구나 <b>사진 속 글자</b>에 할인 · 특가 · 블랙프라이데이 · 00% 가 있는 이미지 · 영상이에요(영상은 첫 장면 글자). 왼쪽에서 브랜드를 누르면 그 브랜드 세일 소재만 보여요</li><li><b>카테고리</b> — 주얼리가 아닌 무신사 · 지그재그 · 에이블리 · 29CM 입점 브랜드도 같이 있어요. 카테고리는 광고 글 · 사진 글자로 저절로 나눈 것이고, 점수는 주얼리와 나머지를 따로 견줘요</li><li><b>좋아요 · 댓글 · 공유</b> — 메타 광고 라이브러리가 광고마다의 숫자를 공개하지 않아 볼 수 없어요. 공개되는 건 브랜드 페이지 좋아요뿐이라 브랜드 머리글에 넣었어요</li><li><b>판매 신호 (29CM)</b> — 광고 추정이 실제 판매와 맞는지 보는 숫자예요. 29CM 여성 · 남성 주얼리 <b>주간 베스트 100위</b>에 든 정도 반, 브랜드 상품 <b>리뷰가 일주일에 늘어난 수</b> 반 (첫 7일은 쌓인 리뷰 수로). 29CM 에 있는 브랜드끼리 견준 0~100 이고, 29CM 에 없는 곳은 '검증 못 함'으로 둬요(0점이 아니에요). 지그재그 · 무신사 · W컨셉 · 에이블리는 자동 수집을 막아 두어 29CM 만 봐요. 매일 새벽 2시 40분</li><li><b>검증 한 마디</b> — 초록 = 광고도 많고 판매도 강함(추정이 맞는 쪽) · 주황 = 광고만 많고 29CM 판매는 약함 · 파랑 = 광고는 적은데 잘 팔림 · 회색 = 중간이거나 검증 못 함. 브랜드를 잘못 이었으면 [연결 바꾸기] · [29CM 아님]</li><li>상품 목록이 자동으로 나오는 카탈로그 광고는 소재에서 뺐어요</li><li>하루 12번 조금씩 모아요(한꺼번에 많이 읽으면 메타가 막아요). 꺼진 광고는 빠지고, ☆ 즐겨찾기한 것만 즐겨찾기 탭에 남아요</li><li>사진 · 문구는 참고용이에요 — 그대로 쓰면 저작권 문제가 생겨요</li></ul>`, true);
  }
  function addDlg() {
    const rows = Object.values(S.marks).filter(m => m.st === 'add' && m.v && m.v.q), hid = Object.values(S.marks).filter(m => m.st === 'hide');
    const stOf = m => { const s = (S.d.adds || {})[m.id]; return !s ? '다음 차례에 모아요' : s.pid ? '모으는 중' : s.why || '못 찾음'; };
    const ov = overlay(`<h3>브랜드 넣기</h3><p>자동으로 안 잡힌 브랜드를 적어 두면 다음 차례(하루 12번)부터 같이 모아요. 메타 라이브러리 광고주 주소가 가장 정확하고, 인스타 주소나 브랜드 이름도 돼요.</p><form class="row2"><input class="inp" id="addQ" maxlength="300" placeholder="메타 라이브러리 주소 · 인스타 주소 · 이름" style="flex:1"><button class="btn pri">넣기</button></form>
      <div class="adds">${rows.map(m => `<div><b>${esc(m.v.q.slice(0, 60))}</b><span>${esc(stOf(m))}</span><button class="btn" data-del="${esc(m.id)}">지우기</button></div>`).join('')}${hid.length ? `<div><b>뺀 브랜드 ${hid.length}</b></div>` + hid.map(m => `<div>${esc((m.v || {}).name || m.id.slice(3))}<button class="btn" data-unhide="${esc(m.id)}">다시 보기</button></div>`).join('') : ''}</div>`, true);
    ov.querySelector('form').addEventListener('submit', e => { e.preventDefault(); const q = $('addQ').value.trim(); if (!q) return; mark('add:' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8), { st: 'add', v: { q } }); toast('넣었어요 — 다음 차례부터 모아요'); addDlg(); });
    ov.addEventListener('click', e => { const d = e.target.closest('[data-del]'), u = e.target.closest('[data-unhide]'); if (d) { mark(d.dataset.del, { deleted_at: new Date().toISOString() }); addDlg(); } if (u) { mark(u.dataset.unhide, { st: '' }); paint(true); addDlg(); } });
  }

  /* ── 누르기 ── */
  const seg = (id, fn) => $(id).addEventListener('click', e => { const b = e.target.closest('button'); if (b) { fn(b.dataset.v ?? b.dataset.m); } });
  seg('rankSeg', v => { S.rank = v; lsSet('adlib_rank', v); paintSegs(); paintBrands(); });
  seg('catSeg', v => { S.cat = v; S.pid = ''; S.bn = 200; paint(); });
  seg('itemSeg', v => { S.item = v; paint(); });
  seg('viewSeg', v => { S.view = v; paint(); });
  seg('fmtSeg', v => { S.fmt = v; paint(); });
  seg('mtabs', v => mtab(v));
  $('blist').addEventListener('click', e => { if (e.target.closest('[data-bmore]')) { S.bn += 300; paintBrands(); return; } const b = e.target.closest('.brow'); if (b) pickBrand(b.dataset.pid); });
  $('bhead').addEventListener('click', e => {
    const b = S.byPid[S.pid], act = (e.target.closest('[data-act]') || { dataset: {} }).dataset.act; if (!b || !act) return;
    if (act === 'clear') { S.pid = ''; paint(); }
    if (act === 'hide') { b.pids.forEach(p => mark('pg:' + p, { st: 'hide', v: { name: b.name } })); S.pid = ''; paint(); toast(`${b.name} 을(를) 뺐어요`, false, () => { b.pids.forEach(p => mark('pg:' + p, { st: '' })); paint(); }); }
    // 29CM 연결: 손으로 잇기 · '29CM 아님' · 자동으로 되돌리기 → adlib_marks pg:{광고주}.v.c29 (맥미니 c29.mjs 가 다음 새벽에 읽음)
    const k29 = 'pg:' + b.pid, set29 = (v, msg) => { mark(k29, { v: Object.assign({}, (S.marks[k29] || {}).v, { c29: v, name: b.name }) }); paintHead(); toast(msg); };
    if (act === 'c29link') c29Dlg(b);
    if (act === 'c29none') set29('none', '29CM 아님으로 표시했어요 — 다음 새벽부터 판매 신호에서 빠져요');
    if (act === 'c29auto') set29('auto', '자동 찾기로 되돌렸어요 — 다음 새벽에 다시 찾아요');
  });
  $('grid').addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c) return; const a = S.list[+c.dataset.i];
    if (e.target.closest('.star')) { toggleStar(a); if (S.view === 'star') paintGrid(); else e.target.closest('.star').classList.toggle('on', isStar(a)); return; }
    openAd(a);
  });
  $('more').addEventListener('click', () => { S.n += PAGE; paintGrid(); });
  let qt = 0; $('q').addEventListener('input', e => { S.q = e.target.value; clearTimeout(qt); qt = setTimeout(() => { S.n = PAGE; paintGrid(); }, 180); });
  $('bq').addEventListener('input', e => { S.bq = e.target.value; paintBrands(); });
  $('helpBtn').addEventListener('click', help); $('addBtn').addEventListener('click', addDlg);
  window.addEventListener('online', flush); window.addEventListener('pagehide', () => { if (Object.keys(dirty).length) flush(); });

  /* ── 잠금 · 시작 ── */
  function isUnlocked() { if (window.__inOffice) return true; return lsGet('brightbeed_unlocked') === '1' && (lsGet('brightbeed_role') === 'master' || lsGet('brightbeed_viewer_ver') === '2') && lsGet('brightbeed_auth_ver') === AUTH_VERSION && !(lsGet('brightbeed_role') === 'master' && lsGet('brightbeed_master_ver') !== MASTER_PIN_VER); }
  async function sha256hex(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault(); const v = $('lockPin').value.trim(); let role = null;
    try { role = PIN_HASH[await sha256hex(v)] || null; } catch (err) { role = null; }
    if (!role) { $('lockErr').textContent = '접속 코드가 올바르지 않아요'; $('lockPin').value = ''; $('lockPin').focus(); return; }
    if (role !== 'master' && window.BossGuard) BossGuard.drop();
    if (role !== 'master') lsSet('brightbeed_viewer_ver', '2'); lsSet('brightbeed_role', role); lsSet('brightbeed_auth_ver', AUTH_VERSION); if (role === 'master') lsSet('brightbeed_master_ver', MASTER_PIN_VER); lsSet('brightbeed_unlocked', '1');
    $('lock').hidden = true; start();
  });
  async function start() {
    try {
      await Promise.all([loadList(), loadMarks().catch(e => toast('보관 · 메모를 못 불러왔어요: ' + e.message, true))]);
      $('app').hidden = false; paint(); if (Object.keys(dirty).length) flush();
    } catch (e) {
      $('stamp').className = 'stamp bad'; $('stamp').innerHTML = '자료를 못 불러왔어요 — ' + esc(e.message) + ' <button class="btn" id="retry" type="button">다시</button>'; $('retry').onclick = () => { $('stamp').textContent = '불러오는 중…'; start(); }; return;
    }
    const live = () => { if (!window.OfficeLive || live.on) return; live.on = true; OfficeLive.on(['adlib_marks'], async () => { if (flushing || Object.keys(dirty).length) return; try { await loadMarks(); paint(true); } catch (e) { /* 다음에 */ } }); };
    live(); setTimeout(live, 1500);
    setInterval(() => { if (!document.hidden && S.d && Date.now() - S.d.at > 20 * 36e5 && Date.now() - (start.at || 0) > 30 * 6e4) { start.at = Date.now(); const at = S.d.at; loadList().then(() => { if (S.d.at !== at) paint(true); }).catch(() => {}); } }, 60e3);
  }
  if (isUnlocked()) start(); else { $('lock').hidden = false; setTimeout(() => $('lockPin').focus(), 50); }
})();
</script>
<script src="../office-live.js?v=1" defer></script>
</body>
</html>
