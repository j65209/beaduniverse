<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>여행 자료 · 비드유니버스</title>
<script src="../boss-guard.js?v=2"></script><script>window.BossGuard||document.write('<script src="../boss-guard.js?r='+Date.now()+'"><\/script>')</script><!-- 대표 이름은 대표 PIN 으로만 (boss-guard.js) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<!-- 여행 자료 — 대표 전용 (2026-11-25). 이 파일에는 화면만 있고 일정 · 편 · 날짜는 하나도 없다:
     내용 = 비공개 brightbeed-reports office/exec/trip.json (오피스 부모 창의 ghFetch = PIN 프록시로만). 마지막으로 받은 내용은 이 기기에 남겨 인터넷이 끊겨도 본다.
     체크 표시는 이 기기에만 (localStorage bb_trip_check_v1). -->
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --line:#e5e7eb; --text:#0f172a; --t2:#475569; --t3:#7c8798; --bad:#c81e1e; --bad-bg:#fdf1f1;
    --font: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif }
  * { box-sizing:border-box }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 var(--font); -webkit-font-smoothing:antialiased; word-break:keep-all; overflow-wrap:anywhere }
  [hidden] { display:none !important }
  a { color:inherit; text-underline-offset:3px; text-decoration-color:#b6bfcc }
  .top { position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid var(--line) }
  .top-in { display:flex; align-items:center; gap:10px; padding:10px 16px; max-width:1180px; margin:0 auto }
  .back { font-weight:600; font-size:13px; color:var(--t2); text-decoration:none; white-space:nowrap; padding:6px 0 }
  .top b { font-size:15px }
  .nav { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:0 16px 10px; max-width:1180px; margin:0 auto }
  .nav::-webkit-scrollbar { display:none }
  .nav a { flex:none; font-size:13px; font-weight:600; color:var(--t2); text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:5px 12px; background:#fff }
  main { max-width:1180px; margin:0 auto; padding:20px 16px 60px }
  h1 { margin:0; font-size:26px; line-height:1.25; letter-spacing:-.5px }
  .sub { color:var(--t2); margin:4px 0 18px }
  .grid { columns:2; column-gap:14px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px; margin:0 0 14px; scroll-margin-top:104px; break-inside:avoid }
  section.wide { column-span:all }
  h2 { margin:0 0 10px; font-size:17px; letter-spacing:-.3px }
  h3 { margin:16px 0 4px; font-size:14.5px }
  p { margin:0 0 8px } p:last-child { margin-bottom:0 }
  .lead { font-size:18px; font-weight:700; line-height:1.45; letter-spacing:-.3px }
  .warn { background:var(--bad-bg); color:var(--bad); border-radius:8px; padding:10px 12px; margin:10px 0; font-weight:600; font-size:14px }
  .note { color:var(--t3); font-size:13px }
  ul { margin:0 0 8px; padding-left:18px } li { margin:3px 0 }
  .steps { list-style:none; margin:4px 0 8px; padding:0 }
  .steps li { display:grid; grid-template-columns:92px 1fr; gap:12px; padding:9px 0; border-top:1px solid var(--line); margin:0 }
  .steps li:first-child { border-top:0 }
  .steps .w { font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap }
  .steps small, td small { display:block; color:var(--t3); font-size:13px; line-height:1.5 }
  .bad { color:var(--bad); font-weight:700 }
  .tw { overflow-x:auto; margin:4px 0 8px }
  table { border-collapse:collapse; width:100%; font-size:14px }
  th, td { text-align:left; vertical-align:top; padding:8px 10px 8px 0; border-top:1px solid var(--line) }
  tr:first-child > th { border-top:0; color:var(--t3); font-size:12.5px; font-weight:600; white-space:nowrap }
  td:first-child { font-weight:600; min-width:92px }
  td { min-width:72px; font-variant-numeric:tabular-nums }
  label.ck { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); cursor:pointer }
  label.ck:first-of-type { border-top:0 }
  label.ck input { width:20px; height:20px; margin:2px 0 0; flex:none; accent-color:var(--text) }
  label.ck small { display:block; color:var(--t3); font-size:13px; line-height:1.5 }
  label.ck input:checked + span { color:var(--t3); text-decoration:line-through }
  .links { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px }
  .links a { font-size:13px; font-weight:600; text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; color:var(--t2) }
  .msg { color:var(--t2); padding:60px 16px; text-align:center }
  @media (max-width:860px) { .grid { columns:1 } h1 { font-size:22px } section { padding:16px } .steps li { grid-template-columns:78px 1fr; gap:10px }
    table { font-size:13px } td { min-width:0 } td:first-child { min-width:0 } th, td { padding-right:6px } .c3 td:nth-child(1) { width:37% } .c3 td:nth-child(2) { width:21% } .c5 { letter-spacing:-.4px } .c5 td:nth-child(1) { width:30% } .c5 th { white-space:normal } td small { font-size:12px } }
  @media print { .top { display:none } body { background:#fff } section { border:0; padding:8px 0 } }
</style>
</head>
<body>
<header class="top"><div class="top-in"><a class="back" id="back" href="../">← 오피스</a><b>여행 자료</b></div><nav class="nav" id="nav" hidden></nav></header>
<main id="main"><div class="msg">불러오는 중…</div></main>
<script>
(function () {
  'use strict';
  var SRC = 'https://api.github.com/repos/j65209/brightbeed-reports/contents/office/exec/trip.json?ref=main';
  var CACHE = 'bb_trip_v1', CHECK = 'bb_trip_check_v1', ALLOWED = ['전승훈', '전수빈'];   // 오피스 index.html EXEC_ALLOWED 와 같게
  var main = document.getElementById('main'), nav = document.getElementById('nav'), back = document.getElementById('back');
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* noop */ } }
  var P = null;
  try { if (window.parent !== window && typeof window.parent.ghFetch === 'function') P = window.parent; } catch (e) { P = null; }
  back.addEventListener('click', function (e) {
    if (e.metaKey || e.ctrlKey || e.shiftKey) return;
    try { if (P && typeof P.bbToolClose === 'function') { e.preventDefault(); P.bbToolClose(); } } catch (err) { /* noop */ }
  });
  function msg(t) { main.replaceChildren(el('div', 'msg', t)); nav.hidden = true; }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  // 글 안의 **굵게** · !!빨강!! · [글](https://…) 만 — 나머지는 글자 그대로
  function rich(n, s) {
    String(s == null ? '' : s).split(/(\*\*[^*]+\*\*|!![^!]+!!|\[[^\]]+\]\(https?:[^\s]+?\)(?!\)))/).forEach(function (x) {
      var m;
      if (!x) return;
      if ((m = /^\*\*(.+)\*\*$/.exec(x))) n.appendChild(el('strong', '', m[1]));
      else if ((m = /^!!(.+)!!$/.exec(x))) n.appendChild(el('span', 'bad', m[1]));
      else if ((m = /^\[([^\]]+)\]\((https?:.+)\)$/.exec(x))) n.appendChild(link(m[1], m[2]));
      else n.appendChild(document.createTextNode(x));
    });
    return n;
  }
  function link(t, u) { var a = el('a', '', t); a.href = /^(https?:|tel:)/.test(u) ? u : '#'; if (/^http/.test(u)) { a.target = '_blank'; a.rel = 'noopener noreferrer'; } return a; }
  function cell(n, v) { if (v && typeof v === 'object') { rich(n, v.a); n.appendChild(rich(el('small'), v.b)); return n; } return rich(n, v); }
  var ck = {}; try { ck = JSON.parse(get(CHECK) || '{}') || {}; } catch (e) { ck = {}; }
  function block(b) {
    var n;
    if (b.t === 'list') { n = el('ul'); b.v.forEach(function (x) { n.appendChild(rich(el('li'), x)); }); return n; }
    if (b.t === 'steps') {
      n = el('ul', 'steps');
      b.v.forEach(function (x) { var li = el('li'); li.appendChild(rich(el('span', 'w'), x[0])); var d = rich(el('div'), x[1]); if (x[2]) d.appendChild(rich(el('small'), x[2])); li.appendChild(d); n.appendChild(li); });
      return n;
    }
    if (b.t === 'table') {
      n = el('table', 'c' + b.h.length); var tr = el('tr'); b.h.forEach(function (x) { tr.appendChild(el('th', '', x)); }); n.appendChild(tr);
      b.v.forEach(function (r) { tr = el('tr'); r.forEach(function (x) { tr.appendChild(cell(el('td'), x)); }); n.appendChild(tr); });
      var w = el('div', 'tw'); w.appendChild(n); return w;
    }
    if (b.t === 'check') {
      n = el('div');
      b.v.forEach(function (x) {
        var l = el('label', 'ck'), i = el('input'), s = rich(el('span'), x[1]); i.type = 'checkbox'; i.checked = !!ck[x[0]];
        i.addEventListener('change', function () { if (i.checked) ck[x[0]] = 1; else delete ck[x[0]]; set(CHECK, JSON.stringify(ck)); });
        if (x[2]) s.appendChild(rich(el('small'), x[2])); l.appendChild(i); l.appendChild(s); n.appendChild(l);
      });
      return n;
    }
    if (b.t === 'links') { n = el('div', 'links'); b.v.forEach(function (x) { n.appendChild(link(x[0], x[1])); }); return n; }
    if (b.t === 'h') return el('h3', '', b.v);
    return rich(el('p', b.t === 'lead' || b.t === 'warn' || b.t === 'note' ? b.t : ''), b.v);
  }
  var shown = '';
  function draw(txt) {
    if (txt === shown) return; var d = JSON.parse(txt); shown = txt;
    var y = window.scrollY, f = document.createDocumentFragment(), g = el('div', 'grid');
    f.appendChild(el('h1', '', d.title)); f.appendChild(el('p', 'sub', d.sub));
    nav.replaceChildren();
    d.sections.forEach(function (s, i) {
      var n = el('section', s.wide ? 'wide' : ''); n.id = 's' + i; n.appendChild(el('h2', '', s.title));
      s.blocks.forEach(function (b) { n.appendChild(block(b)); }); g.appendChild(n);
      var a = el('a', '', s.nav || s.title); a.href = '#s' + i;
      a.addEventListener('click', function (e) { e.preventDefault(); n.scrollIntoView({ block: 'start' }); });   // 주소 해시(오피스 화면 이름)를 건드리지 않게
      nav.appendChild(a);
    });
    f.appendChild(g); f.appendChild(el('p', 'note', d.foot || '')); nav.hidden = false;
    main.replaceChildren(f); window.scrollTo(0, y);
  }
  function load() {
    if (ALLOWED.indexOf((get('brightbeed_diary_me') || '').trim()) < 0 || get('brightbeed_role') !== 'master') { try { localStorage.removeItem(CACHE); } catch (e) { /* noop */ } msg('대표 전용 화면이에요'); return; }
    var old = get(CACHE); if (old) { try { draw(old); } catch (e) { old = ''; shown = ''; } }
    if (!P) { if (!old) { msg('오피스 홈 → 관리자 전용 → 여행 자료에서 열어 주세요'); } return; }
    P.ghFetch(SRC, { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status); return r.json();
    }).then(function (j) {
      if (j && typeof j.content === 'string' && j.encoding === 'base64') j = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, '')), function (c) { return c.charCodeAt(0); })));
      if (!j || !Array.isArray(j.sections)) throw new Error('bad');
      var t = JSON.stringify(j); draw(t); set(CACHE, t);
    }).catch(function () { if (!shown) msg('자료를 못 읽었어요 · 잠시 뒤 다시 열어 주세요'); });
  }
  load();
})();
</script>
</body>
</html>
