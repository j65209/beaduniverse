<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>인스타 피드 시뮬레이터 · 비드유니버스</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<script>
  /* 오피스 안 화면(iframe, index.html 의 TOOL_PAGES 'feed')으로 열렸으면 '← 오피스' 는 그 화면을 닫는다 (bbToolClose).
     혼자 열면 이 페이지의 잠금 화면에서 오피스 접속 코드를 받는다. */
  (function () {
    var inOffice = false, home = '';
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    window.__feedInOffice = inOffice;
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
    });
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  /* 인스타 피드 시뮬레이터 — 오피스 업무용 툴 (2026-11-20)
     사장님 요청: 브랜드별로 피드에 올렸을 때 어떤 느낌일지 레이아웃 짜기 (예전엔 구글 슬라이드에 프로필 캡처 + 사진을 얹어서 봄).
     · 가운데 = 휴대폰 속 인스타 프로필. 위에서부터 [고정 게시물] → [예정 게시물(우리가 놓는 것)] → [지금 피드(인스타에서 받음)].
     · 왼쪽 = 후보 사진 (끌어 놓기 · 붙여넣기 · 사진 추가). 가운데 그리드로 끌어다 놓거나 누르면 맨 앞에 들어간다.
     · 오른쪽 = 고른 칸 설정 (칸 안 위치 맞추기 · 종류 · 메모 · 날짜 · 고정 · 숨겨 보기).
     · 저장 = 오피스 슈퍼베이스 feed_plans (브랜드마다 한 줄, rpc feed_plan_save), 사진 = 공개 버킷 feed-sim (1440px · 480px JPEG).
     · 지금 피드 = 함수 ig-feed (페이스북 페이지 연결 토큰으로 브랜드 인스타 최근 30개, 사진은 버킷 ig-feed 에 복사). */
  :root {
    --bg: #f3f5f8; --panel: #fff; --line: #e5e7eb; --line2: #d5dae2; --text: #0f172a; --t2: #475569; --t3: #94a3b8;
    --acc: #4f7fcf; --acc-d: #2f5ea8; --acc-t: rgba(79, 127, 207, .11); --red: #e11d48; --ok: #16a34a;
    --top: 58px; --r: 12px;
    --font: Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased }
  body.dragging, body.dragging * { cursor: grabbing !important; user-select: none !important }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit }
  a { color: var(--acc-d) }
  [hidden] { display: none !important }

  /* ── 상단 ── */
  .top { position: sticky; top: 0; z-index: 30; min-height: var(--top); display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line) }
  .back { color: var(--t2); text-decoration: none; font-weight: 600; font-size: 13px; white-space: nowrap; padding: 6px 8px; border-radius: 8px }
  .back:hover { background: var(--bg) }
  .ttl { font-weight: 800; font-size: 15px; letter-spacing: -.2px; white-space: nowrap; display: flex; align-items: center; gap: 8px }
  .ttl svg { width: 20px; height: 20px; color: var(--acc) }
  .brands { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px }
  .brands::-webkit-scrollbar { display: none }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
    background: #fff; font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; color: var(--t2); flex: none }
  .chip:hover { border-color: var(--line2) }
  .chip .dot { width: 8px; height: 8px; border-radius: 50% }
  .chip.on { background: var(--acc-t); border-color: rgba(79, 127, 207, .45); color: var(--acc-d) }
  .chip .n { font-size: 11px; color: var(--acc); font-weight: 700 }
  .top-r { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none }
  .save-st { font-size: 12px; color: var(--t3); white-space: nowrap }
  .save-st.err { color: var(--red); font-weight: 600 }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 13px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; color: var(--text) }
  .btn:hover { border-color: var(--line2); background: #fafbfc }
  .btn.pri { background: var(--acc); border-color: var(--acc); color: #fff }
  .btn.pri:hover { background: var(--acc-d); border-color: var(--acc-d) }
  .btn.danger { color: var(--red) }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px }
  .btn.ico { width: 32px; padding: 0 }
  .btn:disabled { opacity: .45; cursor: default }
  .btn svg { width: 16px; height: 16px; flex: none }
  .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--t3); flex: none }
  .cdot.ok { background: var(--ok) }
  .cdot.bad { background: var(--red) }

  /* ── 본문 3단 ── */
  #app { display: grid; grid-template-columns: 272px minmax(0, 1fr) 300px; gap: 16px; padding: 16px; align-items: start; max-width: 1400px; margin: 0 auto }
  .pane { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); position: sticky; top: calc(var(--top) + 16px);
    max-height: calc(100vh - var(--top) - 32px); display: flex; flex-direction: column; overflow: hidden }
  .pane-h { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex: none }
  .pane-h b { font-size: 14px }
  .pane-h .sub { color: var(--t3); font-size: 12px; font-weight: 600 }
  .pane-h .btn { margin-left: auto }
  .pane-b { padding: 12px 14px; overflow: auto; flex: 1; min-height: 0 }
  .drop { border: 1.5px dashed var(--line2); border-radius: 10px; padding: 14px 10px; text-align: center; color: var(--t3); font-size: 12px; line-height: 1.55; cursor: pointer; margin-bottom: 10px }
  .drop:hover { border-color: var(--acc); color: var(--acc-d) }
  .tray.over .drop, .tray.over .pool { border-color: var(--acc); background: var(--acc-t) }
  .pool { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; border-radius: 8px; min-height: 40px; border: 1.5px solid transparent }
  .pool-empty { grid-column: 1 / -1; color: var(--t3); font-size: 12px; text-align: center; padding: 10px 0 }
  .pthumb { position: relative; aspect-ratio: 4 / 5; border-radius: 6px; overflow: hidden; background: #eef1f5; cursor: grab; user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation }
  .pthumb img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none }
  .pthumb .x { position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: rgba(15, 23, 42, .62);
    color: #fff; font-size: 13px; line-height: 22px; display: none; cursor: pointer; padding: 0; text-align: center }
  .pthumb:hover .x { display: block }
  .pthumb.dragsrc { opacity: .35 }
  .hint { color: var(--t3); font-size: 12px; line-height: 1.55; margin: 10px 0 0 }
  .spin { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(255, 255, 255, .45) }
  .spin::after { content: ''; width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(79, 127, 207, .25); border-top-color: var(--acc); animation: sp .8s linear infinite }
  .bad-up { position: absolute; left: 4px; bottom: 4px; right: 4px; background: rgba(225, 29, 72, .9); color: #fff; font-size: 10px; font-weight: 700; border-radius: 4px; padding: 1px 4px; text-align: center }
  @keyframes sp { to { transform: rotate(360deg) } }

  /* ── 가운데 무대 ── */
  .stage { display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 0 }
  .stage-bar { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: #fff; flex: none }
  .seg button { height: 30px; padding: 0 10px; border: 0; background: transparent; font-weight: 600; font-size: 12.5px; color: var(--t2); cursor: pointer }
  .seg button + button { border-left: 1px solid var(--line) }
  .seg button.on { background: var(--acc-t); color: var(--acc-d) }
  .tg { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 12.5px; color: var(--t2);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex: none }
  .stage-bar .btn { flex: none }
  .tg .box { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line2); display: inline-flex; align-items: center; justify-content: center }
  .tg.on { color: var(--acc-d); border-color: rgba(79, 127, 207, .45) }
  .tg.on .box { background: var(--acc); border-color: var(--acc) }
  .tg.on .box::after { content: ''; width: 7px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: translateY(-1px) rotate(-45deg) }
  .addr { display: flex; align-items: center; gap: 6px; width: 404px; max-width: 100%; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 4px 4px 4px 12px }
  .addr:focus-within { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-t) }
  .addr label { font-size: 12px; font-weight: 700; color: var(--t2); white-space: nowrap }
  .addr input { flex: 1; min-width: 0; border: 0; outline: none; height: 30px; font-size: 13px; background: transparent }
  .addr .btn { flex: none }
  .live-st { font-size: 12px; color: var(--t3); text-align: center; min-height: 18px }
  .live-st.err { color: var(--red) }
  .live-st button { border: 0; background: none; color: var(--acc-d); font-weight: 700; cursor: pointer; padding: 0 2px; font-size: 12px }
  .phone { width: 404px; max-width: 100%; height: min(880px, calc(100vh - var(--top) - 120px)); min-height: 520px; border-radius: 44px; border: 10px solid #111827;
    background: #fff; box-shadow: 0 24px 60px rgba(15, 23, 42, .16); overflow: hidden; position: relative }
  .phone-scroll { height: 100%; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none }
  .phone-scroll::-webkit-scrollbar { display: none }

  /* ── 인스타 프로필 (2025 · 세로 4:5 그리드) ── */
  .ig { background: #fff; color: #000; font: 14px/1.34 -apple-system, BlinkMacSystemFont, 'Segoe UI', Pretendard, 'Apple SD Gothic Neo', sans-serif; padding-bottom: 24px }
  .ig-nav { position: sticky; top: 0; z-index: 3; background: #fff; display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 14px }
  .ig-nav .u { font-size: 17px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .ig-nav svg { width: 24px; height: 24px; flex: none }
  .ig-head { display: flex; align-items: center; gap: 22px; padding: 6px 16px 10px }
  .ig-av { width: 86px; height: 86px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden;
    border: 1px solid #dbdbdb; font-weight: 800; font-size: 22px; color: #fff }
  .ig-av img { width: 100%; height: 100%; object-fit: cover; display: block }
  .ig-meta { flex: 1; min-width: 0 }
  .ig-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .ig-stats { display: flex; gap: 20px }
  .ig-stats div { display: flex; flex-direction: column; min-width: 0 }
  .ig-stats b { font-size: 16px; font-weight: 700; line-height: 1.2 }
  .ig-stats span { font-size: 13px; color: #000 }
  .ig-stats .plus { font-size: 11px; color: var(--acc); font-weight: 700; margin-left: 3px }
  .ig-bio { padding: 0 16px; white-space: pre-line; font-size: 14px; word-break: break-word }
  .ig-bio.muted { color: #8e8e8e; font-size: 13px }
  .ig-web { padding: 2px 16px 0; color: #00376b; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 4px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis }
  .ig-btns { display: flex; gap: 6px; padding: 12px 16px 14px }
  .ig-btns span { flex: 1; height: 32px; border-radius: 8px; background: #efefef; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px }
  .ig-btns span.f { background: #0095f6; color: #fff }
  .ig-btns span.s { flex: none; width: 34px }
  .ig-tabs { display: flex; border-bottom: 1px solid #dbdbdb; position: sticky; top: 46px; background: #fff; z-index: 3 }
  .ig-tabs span { flex: 1; height: 44px; display: flex; align-items: center; justify-content: center; color: #8e8e8e }
  .ig-tabs span.on { color: #000; box-shadow: inset 0 -1px 0 #000 }
  .ig-tabs svg { width: 24px; height: 24px }
  .ig-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: #fff }
  .cell { position: relative; aspect-ratio: 4 / 5; background: #efefef; overflow: hidden; -webkit-touch-callout: none; user-select: none }
  .ig-grid.r11 .cell { aspect-ratio: 1 / 1 }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none }
  .cell .ic { position: absolute; top: 7px; right: 7px; width: 19px; height: 19px; color: #fff; filter: drop-shadow(0 0 2px rgba(0, 0, 0, .45)); z-index: 2 }
  .cell .ic svg { width: 100%; height: 100%; display: block }
  .cell .tag { position: absolute; left: 6px; top: 6px; height: 19px; padding: 0 7px; border-radius: 10px; background: var(--acc); color: #fff; font: 700 10.5px/19px var(--font);
    white-space: nowrap; z-index: 2; box-shadow: 0 1px 3px rgba(0, 0, 0, .2) }
  .ig.marks .cell.plan::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px rgba(79, 127, 207, .55); pointer-events: none; z-index: 1 }
  .cell.plan { cursor: grab }
  .cell.live { cursor: pointer }
  .cell.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #8e8e8e; font-size: 12px; padding: 6px; text-align: center;
    background: #f6f7f9; background-image: repeating-linear-gradient(135deg, transparent 0 9px, rgba(0, 0, 0, .035) 9px 18px) }
  .cell.empty svg { width: 22px; height: 22px }
  .cell.empty small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11.5px }
  .cell.ph { background: #f3f3f3; display: flex; align-items: center; justify-content: center; color: #b3b3b3; font-size: 11.5px; text-align: center; line-height: 1.4 }
  .cell.hid { opacity: .5 }
  .cell.sel { outline: 3px solid var(--acc); outline-offset: -3px; z-index: 2 }
  .cell.dragsrc { opacity: .3 }
  .cell.drop-before::before, .cell.drop-after::before { content: ''; position: absolute; top: 0; bottom: 0; width: 4px; background: var(--acc); z-index: 4; border-radius: 2px }
  .cell.drop-before::before { left: 0 }
  .cell.drop-after::before { right: 0 }
  .cell.drop-fill { outline: 3px dashed var(--acc); outline-offset: -3px }
  .ig-more { padding: 18px 16px 4px; text-align: center; color: #8e8e8e; font-size: 12px }

  /* ── 오른쪽 ── */
  .side .pane-b { display: flex; flex-direction: column; gap: 14px }
  .side-close { display: none }
  .prev { position: relative; flex: none; width: 100%; aspect-ratio: 4 / 5; border-radius: 10px; overflow: hidden; background: #eef1f5; touch-action: none; cursor: move }
  .prev.r11 { aspect-ratio: 1 / 1 }
  .prev img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; -webkit-user-drag: none }
  .prev .cap { position: absolute; left: 8px; bottom: 8px; background: rgba(15, 23, 42, .62); color: #fff; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; pointer-events: none }
  .prev.static { cursor: default; touch-action: auto }
  .fld { display: flex; flex-direction: column; gap: 5px }
  .fld > span { font-size: 12px; font-weight: 700; color: var(--t2) }
  .fld input, .fld textarea, .fld select { height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; background: #fff; outline: none }
  .fld textarea { height: auto; min-height: 64px; padding: 8px 10px; resize: vertical; line-height: 1.45 }
  .fld input:focus, .fld textarea:focus, .fld select:focus { border-color: var(--acc); box-shadow: 0 0 0 3px var(--acc-t) }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
  .row .btn { flex: 1 }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px }
  .kv dt { color: var(--t3); font-weight: 600 }
  .kv dd { margin: 0; font-weight: 600; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .note { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; color: var(--t2); line-height: 1.6 }
  .note b { color: var(--text) }
  .note ol, .note ul { margin: 4px 0 0; padding-left: 18px }
  .h3 { font-size: 13px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 6px }
  .cap-txt { font-size: 12.5px; color: var(--t2); white-space: pre-line; max-height: 120px; overflow: auto; line-height: 1.5 }
  .muted { color: var(--t3) }

  /* ── 전체 보기 ── */
  #overview { padding: 16px; max-width: 1400px; margin: 0 auto }
  .ov-head { display: flex; align-items: baseline; gap: 10px; margin: 2px 2px 14px; flex-wrap: wrap }
  .ov-head h2 { margin: 0; font-size: 17px }
  .ov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px }
  .ov-card { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; text-align: left; padding: 0 }
  .ov-card:hover { border-color: rgba(79, 127, 207, .5); box-shadow: 0 6px 20px rgba(15, 23, 42, .07) }
  .ov-top { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 13.5px }
  .ov-top .dot { width: 9px; height: 9px; border-radius: 50% }
  .ov-top .sub { margin-left: auto; font-size: 12px; color: var(--t3); font-weight: 600 }
  .ov-card .ig { pointer-events: none; padding-bottom: 0 }
  .ig.mini { font-size: 12px }
  .ig.mini .ig-nav { height: 38px; position: static }
  .ig.mini .ig-nav .u { font-size: 14px }
  .ig.mini .ig-nav svg { width: 20px; height: 20px }
  .ig.mini .ig-head { gap: 16px; padding: 2px 12px 8px }
  .ig.mini .ig-av { width: 60px; height: 60px; font-size: 16px }
  .ig.mini .ig-stats { gap: 12px }
  .ig.mini .ig-stats b { font-size: 13.5px }
  .ig.mini .ig-stats span { font-size: 11px }
  .ig.mini .ig-name { font-size: 12.5px; margin-bottom: 3px }
  .ig.mini .ig-bio, .ig.mini .ig-web, .ig.mini .ig-btns { display: none }
  .ig.mini .ig-tabs { position: static }
  .ig.mini .ig-tabs span { height: 34px }
  .ig.mini .ig-tabs svg { width: 18px; height: 18px }
  .ig.mini .cell .tag { font-size: 9.5px; height: 16px; line-height: 16px; padding: 0 5px; left: 4px; top: 4px }
  .ig.mini .cell .ic { width: 14px; height: 14px; top: 5px; right: 5px }

  /* ── 끌기 · 창 · 알림 ── */
  .ghost { position: fixed; z-index: 200; width: 74px; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; box-shadow: 0 12px 32px rgba(0, 0, 0, .28);
    pointer-events: none; transform: translate(-50%, -62%) rotate(-3deg); background: #eef1f5; border: 2px solid #fff }

  const findIn = (p, id) => {

  /* ══════════════════════ 고치기 · 되돌리기 · 저장 ══════════════════════ */
  const snapOf = p => JSON.stringify({items: p.items, pool: p.pool, opts: p.opts});
  function edit(mut, opt) {
    const b = S.brand, p = plan(b);
    const before = snapOf(p);
    mut(p);

    S.hist.push(before); if (S.hist.length > 80) S.hist.shift(); S.fut = [];
    render();
    scheduleSave(b);

  }
  function commitFrom(before) {   // 미리 바꾼 뒤(칸 위치 끌기) 기록만 남길 때

    S.hist.push(before); if (S.hist.length > 80) S.hist.shift(); S.fut = [];
    scheduleSave(b);
  }
  function restoreSnap(s) {
    const p = plan(S.brand), o = JSON.parse(s);

  }

  }
  function redo() {
    if (!S.fut.length || S.brand === ALL) return;

  }
  function scheduleSave(b) {
    S.dirty[b] = true; paintSave();

  }
  async function save(b) {
    clearTimeout(S.saveT[b]);

    const p = plan(b);
    S.saving[b] = true; paintSave();
    const body = {
      p_brand: b,
      p_items: p.items.filter(i => i.empty || i.path).map(cleanItem),
      p_pool: p.pool.filter(i => i.path).map(cleanItem),
      p_opts: {pins: p.opts.pins || [], hide: p.opts.hide || []},
      p_base_rev: p.rev,
      p_by: ME() || null,
    };
    let retry = false;
    try {
      const r = await rest('rpc/feed_plan_save', {method: 'POST', body: JSON.stringify(body)});
      if (r && r.ok) {
        p.rev = r.rev; p.updated_at = r.updated_at; p.updated_by = ME() || null;
        S.dirty[b] = S.saveAgain[b] || false; S.saveErr = '';

        conflict(b, r.row);

  function conflict(b, row) {

      <p class="sub">${row && row.updated_at ? esc(ago(row.updated_at)) + ' 저장된 내용이 있어요. ' : ''}그 내용을 불러올까요, 지금 내 화면으로 덮어쓸까요?</p>
      <div class="mact"><button class="btn" type="button" id="cfMine">내 화면으로 덮어쓰기</button><button class="btn pri" type="button" id="cfTheirs">그 내용 불러오기</button></div>`, () => {

  function paintSave() {

  /* ══════════════════════ 사진 올리기 ══════════════════════ */
  async function decode(f) {
    try { return await createImageBitmap(f, {imageOrientation: 'from-image'}); } catch (e) { /* 아래로 */ }
    return await new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('이 사진 형식은 못 읽어요 — JPG · PNG 로 바꿔 주세요'));
      im.src = URL.createObjectURL(f);
    });
  }
  function toJpeg(src, max, q) {
    const w0 = src.width || src.naturalWidth, h0 = src.height || src.naturalHeight;
    const s = Math.min(1, max / Math.max(w0, h0));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w0 * s)); c.height = Math.max(1, Math.round(h0 * s));
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
    x.imageSmoothingQuality = 'high';
    x.drawImage(src, 0, 0, c.width, c.height);
    return new Promise((res, rej) => c.toBlob(bl => bl ? res(bl) : rej(new Error('사진 변환 실패')), 'image/jpeg', q));
  }
  async function putObj(path, blob) {
    const r = await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`, {
      method: 'POST',
      headers: {apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'image/jpeg', 'x-upsert': 'false', 'cache-control': 'max-age=31536000'},
      body: blob,
    });
    if (!r.ok) throw new Error('올리기 실패 (' + r.status + ')');
  }
  function newItem(local) {
    return {id: uid(), local, up: true, fx: 50, fy: 50, kind: 'photo', by: ME() || null, at: new Date().toISOString()};
  }
  // at: null = 피드 맨 앞(방금 올린 것처럼, 2026-11-20 사장님 "후보 사진 넣으면 바로 피드 업로드된 것처럼") ·
  //     숫자 = 예정 피드 그 자리 · {fill: id} = 빈 칸 채우기 · 'pool' = 후보 칸에만
  function addFiles(files, at) {
    if (S.brand === ALL) return toast('브랜드를 먼저 골라 주세요', true);
    const list = [...files].filter(f => /^image\//.test(f.type) || /\.(heic|heif)$/i.test(f.name || ''));
    if (!list.length) return toast('사진 파일만 넣을 수 있어요', true);
    const b = S.brand;
    const made = list.map(f => ({f, it: newItem(URL.createObjectURL(f))}));
    edit(p => {
      const its = made.map(m => m.it);
      if (at && at.fill) {
        const k = p.items.findIndex(x => x.id === at.fill);
        if (k >= 0) { const e = p.items[k]; its[0].note = e.note; its[0].date = e.date; p.items.splice(k, 1, ...its); }
        else p.items.unshift(...its);
      } else if (typeof at === 'number') p.items.splice(clamp(at, 0, p.items.length), 0, ...its);
      else if (at === 'pool') p.pool.unshift(...its);
      else p.items.unshift(...its);
    });
    made.forEach(m => uploadOne(b, m.it.id, m.f));
    render();
    if (at == null) { showFeedTop(); toast(`피드 맨 앞에 ${made.length}장 올렸어요 · 끌어서 순서 바꾸기`); }
  }
  // 그리드 맨 위(가장 최근 자리)가 보이게 — 방금 올린 게시물 확인
  function showFeedTop() {

      if (narrow.matches) { g.scrollIntoView({block: 'start', behavior: 'smooth'}); return; }
      const sc = $('phoneScroll'), nav = sc.querySelector('.ig-nav'), tabs = sc.querySelector('.ig-tabs');
      sc.scrollTo({top: Math.max(0, g.offsetTop - (nav ? nav.offsetHeight : 0) - (tabs ? tabs.offsetHeight : 0)), behavior: 'smooth'});
    });
  }
  async function uploadOne(b, id, f) {
    S.uploads++; paintSave();
    try {
      const img = await decode(f);
      const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;
      const [full, th] = await Promise.all([toJpeg(img, FULL_PX, 0.9), toJpeg(img, THUMB_PX, 0.84)]);
      try { img.close && img.close(); } catch (e) { /* noop */ }
      const d = new Date(), key = uid().replace(/[^0-9a-z-]/gi, '');
      const base = `${b}/${d.getFullYear()}${pad2(d.getMonth() + 1)}/${key}`;
      await Promise.all([putObj(base + '.jpg', full), putObj(base + '_t.jpg', th)]);
      const hit = findIn(plan(b), id);
      if (hit) {

  }

  // 다른 사람이 고친 것 받아 오기

  function cellsOf(b, opt) {

  function loadImg(url) {
    return new Promise(res => {
      if (!url) return res(null);
      const im = new Image();
      if (!/^blob:/.test(url)) im.crossOrigin = 'anonymous';
      im.onload = () => res(im); im.onerror = () => res(null);
      im.src = url;
    });
  }
  function drawCover(x, img, dx, dy, w, h, fx, fy) {
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    const s = Math.max(w / iw, h / ih), dw = iw * s, dh = ih * s;
    x.save(); x.beginPath(); x.rect(dx, dy, w, h); x.clip();
    x.drawImage(img, dx + (w - dw) * (fx == null ? 50 : fx) / 100, dy + (h - dh) * (fy == null ? 50 : fy) / 100, dw, dh);
    x.restore();
  }
  function wrapLines(x, text, maxW) {
    const out = [];
    String(text || '').split('\n').forEach(par => {
      let line = '';
      for (const ch of [...par]) {
        if (x.measureText(line + ch).width > maxW && line) { out.push(line); line = ch; }
        else line += ch;
      }
      out.push(line);
    });
    return out;
  }
  async function exportPng() {

      const all = cellsOf(b).filter(c => c.t !== 'ph' || !(L.media || []).length);
      const lead = all.findIndex(c => c.t === 'live' && !c.pinned);
      const want = Math.max(12, (lead < 0 ? all.length : lead) + 6);
      const cells = all.slice(0, Math.min(all.length, Math.ceil(want / 3) * 3, 36));
      const W = 1080, k = W / 400, F = "-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,'Apple SD Gothic Neo',sans-serif";
      const gap = 4, cw = (W - gap * 2) / 3, ch = cw * (S.ratio === '11' ? 1 : 1.25);
      const c0 = document.createElement('canvas').getContext('2d');
      c0.font = `400 ${14 * k}px ${F}`;
      const bioLines = pr.biography ? wrapLines(c0, pr.biography, W - 32 * k) : [];
      const navH = 46 * k, headH = 104 * k, lineH = 19 * k;
      const webH = pr.website ? 20 * k : 0, btnH = 58 * k, tabH = 45 * k;
      const headerH = navH + headH + bioLines.length * lineH + webH + btnH + tabH;
      const rows = Math.ceil(cells.length / 3);
      const H = Math.round(headerH + rows * (ch + gap));
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const x = cv.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
      x.textBaseline = 'middle'; x.fillStyle = '#000';
      // 상단 이름
      const user = pr.username || L.ig_username || B.name;
      x.font = `700 ${17 * k}px ${F}`; x.fillText(user, 46 * k, navH / 2);
      x.strokeStyle = '#000'; x.lineWidth = 2.2 * k; x.lineCap = 'round'; x.lineJoin = 'round';
      x.beginPath(); x.moveTo(24 * k, navH / 2 - 7 * k); x.lineTo(17 * k, navH / 2); x.lineTo(24 * k, navH / 2 + 7 * k); x.stroke();
      [0, 7, 14].forEach(d => { x.beginPath(); x.arc(W - (16 + 14 - d) * k - 10 * k, navH / 2, 1.8 * k, 0, Math.PI * 2); x.fill(); });
      // 프로필 사진
      let y = navH;
      const av = 86 * k, ax = 16 * k, ay = y + 6 * k;
      const pic = await loadImg(pr.pic);
      x.save(); x.beginPath(); x.arc(ax + av / 2, ay + av / 2, av / 2, 0, Math.PI * 2); x.clip();
      if (pic) drawCover(x, pic, ax, ay, av, av, 50, 50);
      else { x.fillStyle = B.dot; x.fillRect(ax, ay, av, av); x.fillStyle = '#fff'; x.font = `800 ${24 * k}px ${F}`; x.textAlign = 'center'; x.fillText(B.name.slice(0, 1), ax + av / 2, ay + av / 2); x.textAlign = 'left'; }
      x.restore();
      x.strokeStyle = '#dbdbdb'; x.lineWidth = 1 * k; x.beginPath(); x.arc(ax + av / 2, ay + av / 2, av / 2, 0, Math.PI * 2); x.stroke();
      // 이름 · 숫자
      const mx = ax + av + 22 * k;
      x.fillStyle = '#000'; x.font = `600 ${14 * k}px ${F}`; x.fillText(pr.name || B.name, mx, ay + 16 * k);
      const media = L.media || [];
      const hidden = (p.opts.hide || []).filter(id => media.some(m => m.id === id)).length;
      const posts = Math.max(0, (pr.posts != null ? pr.posts : media.length) - hidden) + p.items.length;
      [[fmtN(posts), '게시물'], [fmtN(pr.followers), '팔로워'], [fmtN(pr.follows), '팔로잉']].reduce((sx, [n, l]) => {
        x.font = `700 ${16 * k}px ${F}`; x.fillText(n, sx, ay + 44 * k);
        x.font = `400 ${13 * k}px ${F}`; x.fillText(l, sx, ay + 64 * k);
        return sx + Math.max(x.measureText(l).width, (x.font = `700 ${16 * k}px ${F}`, x.measureText(n).width)) + 20 * k;
      }, mx);
      y += headH;
      x.font = `400 ${14 * k}px ${F}`; x.fillStyle = '#000';
      bioLines.forEach(l => { x.fillText(l, 16 * k, y + lineH / 2); y += lineH; });
      if (pr.website) { x.fillStyle = '#00376b'; x.font = `600 ${14 * k}px ${F}`; x.fillText(String(pr.website).replace(/^https?:\/\//, '').replace(/\/$/, ''), 16 * k, y + webH / 2); y += webH; }
      // 버튼
      const bw = (W - 32 * k - 34 * k - 12 * k) / 2, by = y + 12 * k, bh = 32 * k;
      const rr = (rx, ry, rw, rh, r, fill) => { x.fillStyle = fill; x.beginPath(); x.roundRect ? x.roundRect(rx, ry, rw, rh, r) : x.rect(rx, ry, rw, rh); x.fill(); };
      rr(16 * k, by, bw, bh, 8 * k, '#0095f6'); rr(16 * k + bw + 6 * k, by, bw, bh, 8 * k, '#efefef'); rr(16 * k + bw * 2 + 12 * k, by, 34 * k, bh, 8 * k, '#efefef');
      x.textAlign = 'center'; x.font = `600 ${14 * k}px ${F}`;
      x.fillStyle = '#fff'; x.fillText('팔로우', 16 * k + bw / 2, by + bh / 2);
      x.fillStyle = '#000'; x.fillText('메시지', 16 * k + bw * 1.5 + 6 * k, by + bh / 2);
      x.fillText('+', 16 * k + bw * 2 + 12 * k + 17 * k, by + bh / 2);
      x.textAlign = 'left';
      y += btnH;
      // 탭
      x.fillStyle = '#dbdbdb'; x.fillRect(0, y + tabH - 1, W, 1);
      x.fillStyle = '#000'; x.fillRect(0, y + tabH - 2, W / 3, 2);
      const gx = W / 6, gy = y + tabH / 2, gs = 10 * k;
      x.strokeStyle = '#000'; x.lineWidth = 1.9 * k; x.strokeRect(gx - gs, gy - gs, gs * 2, gs * 2);
      x.beginPath(); [-1 / 3, 1 / 3].forEach(t => { x.moveTo(gx + t * 2 * gs, gy - gs); x.lineTo(gx + t * 2 * gs, gy + gs); x.moveTo(gx - gs, gy + t * 2 * gs); x.lineTo(gx + gs, gy + t * 2 * gs); }); x.stroke();
      x.strokeStyle = '#8e8e8e'; [W / 2, W * 5 / 6].forEach(cx => { x.beginPath(); x.roundRect ? x.roundRect(cx - gs, gy - gs, gs * 2, gs * 2, 4 * k) : x.rect(cx - gs, gy - gs, gs * 2, gs * 2); x.stroke(); });
      y += tabH;
      // 그리드
      const imgs = await Promise.all(cells.map(c => c.t === 'plan' ? (c.it.empty ? null : loadImg(thumbOf(c.it))) : c.t === 'live' ? loadImg(c.m.img) : null));
      cells.forEach((c, i) => {
        const cx = (i % 3) * (cw + gap), cy = y + Math.floor(i / 3) * (ch + gap);
        x.fillStyle = c.t === 'plan' && c.it.empty ? '#f3f4f6' : '#efefef'; x.fillRect(cx, cy, cw, ch);
        const im = imgs[i];
        if (im) { try { drawCover(x, im, cx, cy, cw, ch, c.t === 'plan' ? c.it.fx : 50, c.t === 'plan' ? c.it.fy : 50); } catch (e) { /* 다른 출처 사진 */ } }
        if (c.t === 'plan' && c.it.empty) { x.fillStyle = '#9ca3af'; x.font = `600 ${30}px ${F}`; x.textAlign = 'center'; x.fillText(c.it.note ? c.it.note.slice(0, 14) : '빈 칸', cx + cw / 2, cy + ch / 2); x.textAlign = 'left'; }
        if (c.t === 'plan' && S.marks) {
          const label = `예정 ${c.n}${md(c.it.date) ? ' · ' + md(c.it.date) : ''}`;
          x.font = `700 ${28}px ${F}`; const tw = x.measureText(label).width + 28;
          rr(cx + 14, cy + 14, tw, 48, 24, '#4f7fcf'); x.fillStyle = '#fff'; x.fillText(label, cx + 28, cy + 38);
          x.strokeStyle = 'rgba(79,127,207,.75)'; x.lineWidth = 6; x.strokeRect(cx + 3, cy + 3, cw - 6, ch - 6);
        }
      });
      const blob = await new Promise((res, rej) => { try { cv.toBlob(bl => bl ? res(bl) : rej(new Error('저장 실패')), 'image/png'); } catch (e) { rej(e); } });
      const a = document.createElement('a');
      const d = new Date();
      a.download = `${B.name}_피드_${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}.png`;
      a.href = URL.createObjectURL(blob);
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('이미지로 저장했어요');
    } catch (e) {
      console.warn('png', e);
      toast('이미지를 만들지 못했어요: ' + (e.message || e), true);
    } finally { btn.disabled = false; }
  }

  /* ══════════════════════ 잠금 · 시작 ══════════════════════ */
  function isUnlocked() {
    if (window.__feedInOffice) return true;
    return lsGet('brightbeed_unlocked') === '1' && lsGet('brightbeed_auth_ver') === AUTH_VERSION
      && !(lsGet('brightbeed_role') === 'master' && lsGet('brightbeed_master_ver') !== MASTER_PIN_VER);
  }
  async function sha256hex(s) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('lockPin').value.trim();
    let role = null;
    try { role = PIN_HASH[await sha256hex(v)] || null; } catch (err) { role = null; }
    if (!role) { $('lockErr').textContent = '접속 코드가 올바르지 않아요'; $('lockPin').value = ''; $('lockPin').focus(); return; }
    lsSet('brightbeed_unlocked', '1'); lsSet('brightbeed_role', role); lsSet('brightbeed_auth_ver', AUTH_VERSION);
    if (role === 'master') lsSet('brightbeed_master_ver', MASTER_PIN_VER);
    $('lock').hidden = true;
    start();
  });

  async function start() {
    paintMe();
    const h = (location.hash || '').slice(1);
    const want = BMAP[h] || h === ALL ? h : (BMAP[lsGet(LS.brand)] || lsGet(LS.brand) === ALL ? lsGet(LS.brand) : 'kop');
    S.brand = null;
    $('app').hidden = false;
    await Promise.all([loadAllPlans().catch(e => toast('피드 계획을 못 불러왔어요: ' + e.message, true)), loadAllLiveRows().catch(() => {})]);
    setBrand(want);
    loadStatus();
    pollLoop();
  }
  if (isUnlocked()) start(); else { $('lock').hidden = false; setTimeout(() => $('lockPin').focus(), 50); }
})();
</script>
