<script>
  /* 오피스 잠금 연동 (erp/ 와 같은 방식) — 오피스에서 PIN 을 넣은 브라우저만 들어올 수 있음.
     오피스 MD팀 화면 맨 위(iframe, data-embed="md")에 들어가 있으면 '← 오피스 홈' 은 숨긴다 (오피스의 '홈' 단추가 바로 위에 있음).
     회사 주소(beaduniverse.kr/office/)에선 오피스가 이 HTML 을 받아 빈 iframe 에 직접 쓰므로 홈 주소는 부모(오피스)에서 얻는다. */
  (function () {
    var inOffice = false, home = '', emb = false;
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    try { emb = !!(window.frameElement && window.frameElement.getAttribute('data-embed') === 'md'); } catch (e) { /* 다른 출처 */ }
    if (emb) document.documentElement.classList.add('emb');
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    try { if (window.parent === window && localStorage.getItem('brightbeed_unlocked') !== '1') { location.replace(home + '?from=mdsheet'); return; } } catch (e) { /* noop */ }
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
    });
  })();
</script>

<style>
  /* MD팀 시트 — MD팀 구글시트들(주얼리 MD · MD 코페리 · MD 코즈미 · 에이블리 · 지그재그 가격표 · 발주 · 광고 · 디자인 · 벤더)을
     ERP전산팀(erp/)과 같은 업무 프로그램 화면으로. 오피스 MD팀 화면(#md) 맨 위 iframe (index.html mdxMount) · 이 주소를 바로 열어도 된다.
     · 2026-11-20 사용자 "주얼리엠디, 엠디코페리, 엠디코즈미 구글시트안에 있는 모든정보를 erp 전산팀과 동일한 디자인으로 오피스앱 엠디팀 최상단에" → 첫 판(구글 웹 보기를 바로 읽음).
     · 같은 날 "겹치는건 빼고 나머지는 위로" · "시트별로 즐겨찾기" · "함수 기능" · "구글시트 이제 안쓰고 엠디팀 시트를 쓸 수 있게" ·
       "구글시트 전부 이전이야. 1:1 뷰어 시스템은 이제 없앨거야" → 2판: erp/ 오피스 저장소판을 그대로 가져와
       · 자료는 오피스 저장소(Supabase mdx_books · mdx_tabs · mdx_rows)에서만 읽는다. 맥미니 md-db-sync(sixshop-collector md/md-db-sync.mjs)가
         1분마다 돌며 MD 시트는 3분 · 나머지는 15분마다 바뀐 줄만 맞춘다. 화면은 8초마다 바뀐 탭만 확인해 바뀐 줄만 받는다.
       · 원가 · 판매가 · 광고비가 들어 있어 저장소는 공개 anon 키로 못 읽는다 — 열쇠(비공개 brightbeed-reports office/mdx-key.json)를
         오피스의 PIN 프록시(ghFetch)로 받아 함수(mdx_meta · mdx_rows_get · mdx_poll · mdx_cell_edit)로만 읽고 쓴다. 이 브라우저에 기억.
       · 왼쪽 메뉴 = 즐겨찾기(★) → 묶음(MD 기본 시트 · 플랫폼 가격표 · 재고 · 발주 · 광고 · 디자인 · 벤더) → 시트(접기 · 펴기) → 탭.
         ERP MASTER 는 ERP전산팀 화면으로 바로 간다. 전략팀 시트 링크는 대표 둘(전승훈 · 전수빈) PC 에만.
       · 기밀(같은 날 "단가, 가격, 링크정보 같은 기밀은 희선이랑 대표 2명만"): 명단 밖 PC 는 원가 · 단가 · 판매가 · 위안 · 마진 · 공급처 열과
         구글시트 · 공급처 링크를 표 · 상세 창 · 찾기 · 요약 카드 · 함수 줄에서 아예 뺀다 (매출 · 광고비는 그대로).
       · 2026-11-20 18:05 MD 시트 5개 구글 끊음 → 같은 날 사장님 "이제 구글시트 연결 끊고 단독적으로 md시트 운영하자. 이젠 md시트는 오피스앱 1개다":
         MD팀 시트 화면은 구글시트 · 구글 연결(Apps Script 브리지)을 부르지 않는다. 고치기 = 오피스 저장소에만 (mdx_cell_edit p_old · mdx_ofx_set · mdx_ofmt_set),
         구글 함수 · 오피스 함수 값은 맥미니 md-db-sync 계산 패스가 1분 안에 (화면은 FX 로 바로). 고치기는 관리자와 MD팀만, PC 는 칸을 눌러 바로 · 휴대폰은 상세 창.
         MD 시트가 아닌 시트(발주 리스트 · 광고 · 디자인 · 벤더 · 보관용)는 아직 그 팀 구글시트가 원본이라 보기만 (맥미니가 구글에서 맞춤).
       · 함수 = 오피스 함수 (2026-11-20 사장님 "구글시트를 이제 안쓸건데? 기능을 오피스앱 내부 엠디팀 시트에 넣어주면 안돼?"):
         '=' 로 시작하게 적으면 오피스가 계산한다 (FX — SUM · IF · VLOOKUP · SUMIF · ROUND · TEXT · EDATE 등, 같은 탭 칸만).
         함수는 저장소 mdx_ofx 에 (mdx_ofx_set), 계산된 값은 저장소 줄 + 구글시트에 '값'으로 — 구글을 끊기 전까지 맞춤(md-db-sync)이 지우지 않게.
         가리킨 칸이 바뀌면 다시 계산한다: 화면은 늘 지금 값(applyOfx), 고칠 수 있는 PC 는 열 때 · 고친 뒤 값이 다르면 시트 · 저장소에도 (ofxSync).
         구글시트 함수가 든 칸(구글이 계산 · 상세 창 ƒx)은 구글을 끊기 전엔 못 고친다.
         함수를 적는 중엔 머리글 왼쪽 위에 열 글자(A · B …)가 뜨고, 다른 칸을 누르면 그 칸 주소(E5) · Shift 를 누르고 누르면 범위(E2:E9)가 들어간다.
         기밀 명단 밖은 이 표에 보이는 칸만 함수에 쓸 수 있다 — 가린 칸 · 다른 탭 · 줄 전체 · 이름 · INDIRECT · OFFSET · IMPORT… 는 막음 (fxGuard).
       · 새 줄: 제목 줄 '＋ 새 줄' — 마지막 줄 다음 줄에 적고, 그 줄의 수식(공급가 · 마진율 등)은 시트가 자동으로 계산.
       · MD 시트 아래쪽 '수식만 남은 빈 줄'은 표 · 개수에서 빼고, TOP 10 처럼 한 탭에 표가 여럿이면 '공홈 · 일별' 단추로 나눈다.
       · 탭 숨기기 (2026-11-23): 제목 줄 '탭 숨기기' · 왼쪽 메뉴 탭 · 시트 이름에 오른쪽 버튼 — 모든 PC 메뉴에서만 빠지고, 왼쪽 메뉴 맨 아래 '숨긴 탭'에서 다시 보인다 (탭 삭제는 왼쪽 메뉴 오른쪽 버튼 메뉴에 같이 — '지운 탭'에서 되살린다). */
  :root{
    --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --bg:#f3f5f8; --card:#fff; --line:#e3e8ef; --line-2:#edf1f5; --head:#f7f9fb;
    --text:#0f172a; --text-2:#334155; --text-3:#64748b; --text-4:#94a3b8;
    --accent:#16a34a; --accent-ink:#15803d; --accent-soft:#ecfdf3;
    --side:#0f172a; --side-text:#cbd5e1; --side-mute:#64748b;
    --danger:#dc2626; --warn:#d97706; --info:#2563eb;
    --row-h:34px; --side-w:224px; --detail-w:400px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  /* 휴대폰: 두 번 눌러 확대 · 누를 때 회색 번쩍임 막기 (두 손가락 확대는 그대로), 끌어내려 새로고침 · 오피스 화면으로 스크롤이 넘어가는 것 막기 (overscroll) */
  html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit}
  .app{height:100vh;height:100dvh;display:flex;overflow:hidden;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* ── 왼쪽 메뉴 ── */
  .side{flex:none;width:var(--side-w);display:flex;flex-direction:column;background:var(--side);color:var(--side-text)}
  .side-top{flex:none;display:flex;align-items:center;gap:11px;height:58px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
  .logo{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 2px 10px rgba(34,197,94,.35)}
  .logo svg{width:16px;height:16px;color:#fff}
  .side-top b{display:block;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .side-top small{display:block;margin-top:1px;font-size:11px;color:var(--side-mute)}
  .side-fold{flex:none;margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--side-mute)}
  .side-fold:hover{background:rgba(255,255,255,.08);color:#fff}
  .side-fold svg{width:17px;height:17px}
  /* 왼쪽 메뉴 접기 (PC) — 접으면 표가 그만큼 넓어지고, 위 막대의 ☰ 로 다시 편다 */
  .app.side-off .menu{display:grid}
  @media (min-width:1001px){ .app.side-off .side{display:none} }
  .nav{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 10px 16px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
  .nav-sec{margin:16px 0 6px;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--side-mute)}
  .nav-item{position:relative;width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;text-align:left;color:var(--side-text)}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.on{background:rgba(34,197,94,.16);color:#fff;font-weight:700}
  .nav-item.on::before{content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#22c55e}
  .nav-item .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#475569}
  .nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item .nd{flex:none;font-size:11px;color:var(--side-mute);font-variant-numeric:tabular-nums}
  .nav-item.on .nd{color:#86efac}
  .side-foot{flex:none;padding:10px 10px 14px;border-top:1px solid rgba(255,255,255,.07)}
  .side-link{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--side-text);text-decoration:none}
  .side-link:hover{background:rgba(255,255,255,.06);color:#fff}
  .side-link svg{width:15px;height:15px;opacity:.8}
  .scrim,.dscrim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:45}
  .dscrim{z-index:39}   /* 상세 창(40) 아래 — 전엔 45 라 휴대폰에서 상세 창 위를 덮어, 창을 누르면 그냥 닫혔다 (2026-11-20) */

  /* ── 본문 ── */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:8px;height:58px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .menu{display:none}
  .find{flex:0 1 420px;min-width:0;display:flex;align-items:center;gap:7px;height:38px;padding:0 8px 0 13px;border-radius:10px;background:#f1f4f8;border:1px solid transparent;cursor:text}
  .find:focus-within{background:#fff;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .find svg{flex:none;width:16px;height:16px;color:var(--text-4)}
  .find input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:13.5px;color:var(--text)}
  .find input::-webkit-search-cancel-button{display:none}
  .qn{flex:none;font-size:12px;font-weight:700;color:var(--info);white-space:nowrap;font-variant-numeric:tabular-nums}
  .qx{flex:none;width:24px;height:24px;border-radius:50%;color:var(--text-4);font-size:12px}
  .qx:hover{background:#e2e8f0;color:var(--text)}
  .sp{flex:1;min-width:0}
  .st{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .st:hover{background:#f1f4f8;color:var(--text)}
  .st .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .st.is-load .dot{background:transparent;box-shadow:none;width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--accent);animation:spin .8s linear infinite}
  .st.is-stored{color:#b45309;background:#fffbeb}
  .st.is-err{color:#b91c1c}
  .st.is-err .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ib{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);text-decoration:none}
  .ib:hover{background:#f1f4f8;color:var(--text)}
  .ib.on{background:#e8f0fe;color:var(--info)}
  .ib svg{width:18px;height:18px}

  .head{flex:none;padding:14px 18px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
  .trow h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.025em}
  .date{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid #bbf7d0;border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .dates{display:flex;gap:6px;flex-wrap:wrap}
  .dates button{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .dates button:hover{border-color:#cbd5e1}
  .dates button.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
  .tools{display:flex;align-items:center;gap:8px;margin-left:auto}
  .etog{height:30px;padding:0 12px;border-radius:999px;border:1px dashed #cbd5e1;background:#fff;font-size:12px;color:var(--text-3);white-space:nowrap}
  .etog:hover{border-color:#94a3b8;color:var(--text)}
  /* ── 깔끔하게 (2026-11-23 사장님 "엠디탭 깔끔하게 좀 만들고싶어. 기능을 좀 적당히 넣어줘") ──
     제목 줄엔 서식(칸을 골랐을 때만) · ＋ 새 줄 · ⋯ 더보기만. 나머지 단추는 ⋯ 안으로. 표 줄은 한 줄(긴 글 …) */
  .tools{position:relative}
  .more{width:32px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--text-2);display:inline-grid;place-items:center;flex:none}
  .more svg{width:17px;height:17px}
  .more:hover,.more.on{border-color:#cbd5e1;background:#f8fafc;color:var(--text)}
  .more .dotn{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;padding:0 4px;border-radius:999px;background:var(--info);color:#fff;font-size:9.5px;font-weight:800;line-height:15px;text-align:center}
  .more{position:relative}
  .mpop{position:absolute;right:0;top:calc(100% + 6px);z-index:45;min-width:236px;max-width:300px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 18px 44px rgba(15,23,42,.18);display:flex;flex-direction:column}
  .mpop[hidden]{display:none}
  .mpop .etog,.mpop .mi{display:flex;align-items:center;gap:9px;width:100%;height:auto;min-height:32px;padding:6px 10px!important;border:0;border-radius:7px;background:none;color:var(--text);font-size:13px;font-weight:500;text-align:left;white-space:nowrap}
  .mpop .etog[hidden],.mpop .mi[hidden],.mpop hr[hidden]{display:none}
  .mpop .mi svg,.mpop .etog svg{width:15px;height:15px;flex:none;color:var(--text-3)}
  .mpop .mi small{margin-left:auto;font-size:11px;color:var(--text-4)}
  .mpop .tdel span{display:inline!important}

  /* 한 줄 보기 — 긴 글은 …, 마우스를 올리면 전체 (⋯ '긴 글 두 줄로' 로 되돌림, 휴대폰은 늘 두 줄) */

  /* 칸 서식 (굵게 · 글자 색 · 칸 색) — 제목 줄 오른쪽 도구 (PC · 고칠 수 있는 사람만), 색판은 구글시트와 같은 80색. 고른 범위 = 옅은 파랑 */

  /* 2026-11-20 사용자 "일반적인 숫자는 블랙으로 다 변경" — 0 · 마이너스 · 시트 글자색 모두 검정 (품절 · 임박은 줄 색으로) */
  .tbl td.r{color:#111827}

  /* 줄이 많은 탭은 보이는 줄 근처만 그리고, 위 · 아래는 빈 줄 하나(높이만)로 채운다 (renderGrid · paintRows) */

  .tbl th .cl{display:none;position:absolute;left:4px;top:3px;font:700 9.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--info);pointer-events:none}

  .tbl tr.empty td{height:120px;text-align:center;color:var(--text-4);cursor:default;box-shadow:none!important}

  .tag{display:inline-block;max-width:100%;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.4;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .hchip{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:#f8fafc;color:var(--text-3);font-size:11px;font-weight:600;line-height:1.45;vertical-align:middle;cursor:default}

  .ipop{position:fixed;z-index:70;padding:6px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 48px rgba(15,23,42,.22),0 0 0 1px rgba(15,23,42,.03);pointer-events:none}

  .ipop span{display:block;padding:5px 2px 0;font-size:11px;color:var(--text-3);text-align:center}
  /* 2026-11-23 사장님 — 주소 칸(1688.com)은 [바로가기][복사], 사진 칸은 사진 옆 [복사][수정] 단추 */

  /* ── 고치기 (표 칸 누르기 · 상세 창 값 누르기 → 오피스 저장소에 바로) ── */
  .d-hint{margin-top:9px;font-size:11.5px;line-height:1.45;color:var(--text-4)}

  /* 줄 다루기 (2026-11-23 — 줄 복사 · 붙여넣기 · 지우기 · 메인 미발매 → Product List 옮기기) */
  .d-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

  .rmenu{position:fixed;z-index:85;min-width:230px;padding:5px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 44px rgba(15,23,42,.2);font-size:13px}

  .edbox{position:fixed;z-index:70;display:flex;flex-direction:column;gap:7px;padding:8px;border:2px solid var(--info);border-radius:10px;background:#fff;box-shadow:0 14px 34px rgba(15,23,42,.2)}
  .edbox .ed-cap{font-size:11.5px;font-weight:700;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:80;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:#0f172a;color:#fff;font-size:13px;font-weight:600;line-height:1.45;box-shadow:0 12px 30px rgba(15,23,42,.25)}

  /* 아이폰 · 아이패드는 16px 보다 작은 입력 칸을 누르면 화면을 확대해 버린다 (찾기 · 고치기 칸) */
  @media (max-width:720px),(pointer:coarse){ .find input,.edbox input,.edbox textarea{font-size:16px} }

  /* ── 좁은 화면 ── 2026-11-20 사용자 "모바일에서 조금 불안정하거나 최적화가 안 된 것 같아 — 완벽하게" */
  @media (max-width:1000px){
    /* 닫혀 있을 땐 그림자 · 보이기도 끈다 (전엔 화면 왼쪽 끝에 서랍 그림자가 늘 비쳤다) */
    .side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}

  }
  /* 휴대폰 (세로) · 가로로 눕힌 휴대폰 — 위쪽은 작게, 표는 넓게 */
  @media (max-width:720px),(max-height:520px){

    .head{padding:10px 12px}

    .trow{display:grid;grid-template-columns:minmax(0,max-content) auto 1fr auto;align-items:center;gap:8px;min-height:28px}

    .kpi{flex:none;min-width:96px;height:52px;padding:0 12px;border-radius:11px}
    .kpi b{font-size:17px}
    .kpi span{font-size:11px}
    .chips{margin:10px -12px 0;padding:0 12px}
    .chip{height:32px}
    /* 표를 아래로 넘기면 위쪽(안내 · 요약 카드 · 칩 · 날짜)을 접어 표를 넓게 — 맨 위로 오거나 제목 줄을 누르면 다시 편다 (headScroll) */
    .app.hmin .head{padding-top:8px;padding-bottom:8px;cursor:pointer}
    .app.hmin .alert,.app.hmin .kpis,.app.hmin .chips,.app.hmin .dates{display:none}
  }
  @media (max-width:720px){
    :root{--row-h:42px}
    /* 상세 창 = 아래에서 올라오는 판 — 위 손잡이를 끌어내리면 닫힘 */
    .detail{top:auto;left:0;width:100%;height:80vh;height:80dvh;border-left:0;border-radius:18px 18px 0 0;box-shadow:0 -14px 34px rgba(15,23,42,.2);padding-bottom:env(safe-area-inset-bottom);animation:sheetUp .22s cubic-bezier(.2,.8,.2,1)}
    .dh{padding:8px 16px 12px;touch-action:none}
    .dgrab{display:block}
    .dh-top button{width:38px;height:38px}
    .d-title{font-size:17px}
    .dbody{padding:2px 16px 20px}
    .dl{grid-template-columns:104px 1fr}
    .dl dt{padding:12px 0}
    .dl dd{padding:12px 0 12px 12px}
  }
  @keyframes sheetUp{from{transform:translateY(100%)}}
  @media (prefers-reduced-motion:reduce){ .detail{animation:none} }
  @media (pointer:coarse){   /* 손가락으로 누르기 좋게 */
    .nav-item{height:44px;font-size:14.5px}

  /* ── MD팀 시트 전용 ── */
  html.emb .side-link.home{display:none}   /* 오피스 MD팀 화면 안 — 오피스의 '홈' 단추가 바로 위에 있다 */

  .fxv b{font-weight:700;margin-right:4px}

  .nr-save{background:var(--info);color:#fff}

  /* 탭 삭제 (2026-11-23) — 제목 줄 단추 · 확인 창 · 왼쪽 메뉴 오른쪽 버튼 · 지운 탭 */

  // 전략팀 시트 링크 (저장소에 넣지 않고 오피스 PIN 프록시로 링크만) — 오피스 MD팀 구글시트 모음에 있던 것
  // 2026-11-20 사장님 "대표만 보게하고 숨김처리" → 기밀 명단(지희선 포함)이 아니라 대표 둘(전승훈 · 전수빈) PC 에서만 받고 그린다

  /* ── 8초마다 바뀐 탭만 확인 (mdx_poll) — 줄이 바뀐 탭은 바뀐 줄만, 탭 정보(이름 · 순서 · 수식 칸)나 시트 목록이 바뀌면 목록을 다시 ── */
  async function poll() {

  // 보고 있는 탭이 저장소보다 뒤처졌으면 받는다 (바뀐 줄만 — 10분마다 한 번은 전체)

  /* ── 한 탭 줄 받기 — mdx_rows_get (줄 = 시트 한 줄, v = 칸 표시값). 처음 · 10분마다 전체(수식 칸 정보도), 그 사이엔 바뀐 줄(ver)만 ── */
  const asRow = x => ({r: x.r, v: x.v, src: x.by ? 'office' : 'sheet', edited_by: x.by || null, edited_at: null, ver: x.ver, deleted_at: x.d ? 'd' : null});
  async function fetchAllRows(gid) {

        gfSet(gid, j.gfmt);

        const sig = JSON.stringify([j.gfmt || null, j.ofmt || null]);   // 서식만 바뀌어도 (다른 PC 에서 칠한 색 등) 표를 다시 그린다
        if (S.fmtSig[gid] !== undefined && S.fmtSig[gid] !== sig) S.fmtNew[gid] = true;

  async function fetchChangedRows(gid, since) {

  /* ── 줄 → 칸 자료 (표 그리기 · 고치기가 쓰는 모양) ──

  const NOSTYLE = {};

    })}));

    }
    // =IMAGE(…) 수식 칸 — 저장소엔 빈칸으로 오니 수식이 가리키는 칸(사진 주소)이나 주소 글로 사진을 보여 준다
    if (Array.isArray(info.fx) && Array.isArray(info.fx_list)) {
      const byR = new Map(mrows.map(x => [x.r, x]));
      const getV = (r, p) => { const x = byR.get(r); return x && x.cells[p] ? x.cells[p].href || x.cells[p].t : ''; };
      info.fx.forEach(run => {
        const f = run.length > 3 ? info.fx_list[run[3]] : '';
        if (!f || !/^=\s*IMAGE\s*\(/i.test(f)) return;
        for (let r = run[1] + 1; r <= run[2] + 1; r++) {
          const row = byR.get(r), c = row && row.cells[run[0]];
          if (!c || c.t) continue;
          const src = imageSrc(f, r, run[0] + 1, getV);

    }

    const gf = tab && S.gf[tab.gid];
    if (gf) {
      const byR = new Map(mrows.map(x => [x.r, x])), cell = (r, p) => { const x = byR.get(r); return x && x.cells[p]; };
      (gf.raw.img || []).forEach(([p, r0, r1, dp]) => {

  /* ── 개인정보 가리기 — 날짜별 주문 원본 탭(코페리11.19 · 야르11.19 …)의 주문자 이름 등. 머리글(위 6줄 안) 이름으로 칸을 찾는다 ── */
  const PII = [
    ['name', /^(주문자|수령인|수취인|구매자|주문인|받는(분|사람|이)|고객|보내는(분|사람|이)|발송인)(이름|명|성명)?$/],

    ['mail', /(이메일|메일주소|e-?mail)/i],

    name: s => /^[-–—.·\s]+$/.test(s) ? s : Array.from(s).map((ch, i) => i === 0 || /\s/.test(ch) ? ch : '○').join(''),

    const cols = {};
    rows.slice(0, 6).forEach((row, i) => row.cells.forEach(c => {
      const t = c.t.replace(/\s+/g, '');
      if (!t || t.length > 12 || cols[c.p]) return;
      const hit = PII.find(x => x[1].test(t));
      if (hit) cols[c.p] = {kind: hit[0], from: i + 1};
    }));
    if (!Object.keys(cols).length) return 0;
    let n = 0;

      const pc = cols[c.p];
      if (!pc || i < pc.from) return;
      c.pii = 1;   // 가린 칸 = 고치기 막음 (가린 글자를 시트에 다시 쓰면 안 됨)
      if (!c.t) return;
      const v = MASK[pc.kind](c.t);

    }));
    return n;
  }

  /* ── 칸 자료 → 업무 표 ──
     맨 위 ⚠ 줄(여러 열에 걸친 긴 글) = 안내, 그다음 이름 줄 = 열 머리글, 나머지 = 자료 (빈 줄은 뺌).
     머리글도 내용도 없는 열은 숨기고, 열마다 내용을 보고 종류(숫자 · 날짜 · 번호 · 체크 · 사진 · 글)를 정한다. */
  // 빈 열로 떨어진 옆 표(구글시트 피벗 집계 등)는 따로 뗀다 — 내용이 가장 많은 덩어리가 본 목록, 나머지는 '집계 표' 단추로
  function buildAll(model, tab) {
    const n = model.cols.length, used = new Array(n).fill(0);
    model.rows.forEach(row => row.cells.forEach(c => {
      if (c.t === '' && !c.chips.length && !c.cb && !c.img) return;
      const span = c.cs >= 4 ? 1 : c.cs;   // 여러 열에 걸친 ⚠ 안내 줄은 표를 잇지 않는다
      for (let x = c.p; x < Math.min(n, c.p + span); x++) used[x]++;
    }));
    const runs = [];
    let s = -1, cnt = 0;
    for (let p = 0; p <= n; p++) {
      if (p < n && used[p]) { if (s < 0) { s = p; cnt = 0; } cnt += used[p]; }
      else if (s >= 0) { runs.push({a: s, b: p - 1, cnt}); s = -1; }
    }
    if (!runs.length) runs.push({a: 0, b: n - 1, cnt: 0});
    const main = runs.reduce((x, y) => y.cnt > x.cnt ? y : x);
    const built = runs.map(r => buildData(model, tab, r.a, r.b, r !== main));
    // 표 이름 · 설명 — 'TOP 10' 처럼 한 탭에 표가 여럿이면 표 위의 '[공홈]' 줄 + 제목의 '(일별)' · '(월별)' 로 '공홈 · 일별'.
    // 제목 · 조건 줄('주문일 2026. 9. 1')은 맨 왼쪽 표 위에만 있으니 같은 제목 아래 오른쪽 표들은 왼쪽 것을 이어받는다

      const lines = d.capLines || [], isBr = s => /^\[[^\]]{1,20}\]$/.test(s);
      const g = lines.map(s => (s.match(/\(([^()]{1,8})\)\s*$/) || [])[1]).filter(Boolean).pop();
      if (g) grp = g;
      const own = lines.filter(s => !isBr(s));
      if (own.length) note = own.join(' · ');
      d.note = note;

      d.label = br ? (grp ? `${br} · ${grp}` : br) : '';

    const parts = [built[runs.indexOf(main)], ...built.filter((d, k) => runs[k] !== main)];
    return {parts};
  }
  function buildData(model, tab, pa, pb, side) {
    const meta = tab ? (tab.meta || classify(tab.name, tab.book)) : classify('', '');
    const rows = model.rows.map(row => ({r: row.r, cells: row.cells.filter(c => c.p >= pa && c.p <= pb)}));
    const grid2 = rows.map(() => []);
    rows.forEach((row, ri) => row.cells.forEach(c => {
      grid2[ri][c.p] = c;
      for (let y = 1; y < c.rs && ri + y < rows.length; y++) if (!grid2[ri + y][c.p]) grid2[ri + y][c.p] = c;   // 세로 병합 = 아래 줄에도 같은 값
    }));
    let i = 0;
    const banner = [];
    while (i < Math.min(3, rows.length)) {   // 맨 위 안내 줄 = 한 칸짜리 ⚠ · ※ · ** 글이나 아주 긴 글 (짧은 제목 · 날짜는 아래 설명 줄로)
      const ne = rows[i].cells.filter(hasVal);
      if (ne.length === 1 && (/^\s*(⚠|※|\*\*|!)/.test(ne[0].t) || ne[0].t.length > 40)) { banner.push(ne[0].t); i++; } else break;
    }
    // 머리글 = 처음 몇 줄 가운데 이름 칸(짧은 글)이 가장 많은 줄. 그 위 줄들(표 제목 · '주문일 2026. 9. 1' · '[공홈]' 같은 조건 줄)은 표 설명으로
    // (옆 표는 시트 아래쪽에서 시작하기도 한다 · 피벗의 '주문수량의 SUM · 쇼핑몰' 줄도 설명)
    const firsts = [];
    for (let k = i; k < rows.length && firsts.length < 6; k++) if (rows[k].cells.some(c => c.t)) firsts.push(k);
    const labs = k => { const ne = rows[k].cells.filter(c => c.t); return {ne, lab: ne.filter(c => c.t.length <= 30 && numOf(c.t) === null)}; };
    let hi = -1, caption = '', capLines = [], start = i, bestN = 1;
    firsts.forEach(k => { const x = labs(k); if (x.lab.length > bestN && x.lab.length >= x.ne.length * 0.6) { hi = k; bestN = x.lab.length; } });

    }
    const head = [];
    if (hi >= 0) rows[hi].cells.forEach(c => { head[c.p] = c.t.replace(/\s*\n\s*/g, ' ').trim(); });

     끈 칸만 그 너비로 두고 나머지 칸이 화면 폭에 맞춘다. 두 번 누르면 그 칸만 자동 너비로, '칸 너비 되돌리기' 는 그 탭 모양 전체를 처음으로. */
  let colW = null;
  function colWAll() {
    if (!colW) { try { colW = JSON.parse(lsGet(LS_COLW) || '{}') || {}; } catch (e) { colW = {}; } }
    return colW;
  }
  function layoutKey() {
    if (!S.cur) return '';
    const part = vstate().part || 0;
    return S.cur + (part ? '#' + part : '');
  }
  function colWOf(col) { const m = colWAll()[layoutKey()]; return (m && m[norm(col.name)]) || 0; }
  function setColW(col, w) {
    const k = layoutKey(), all = colWAll(), m = all[k] || (all[k] = {});
    if (w) m[norm(col.name)] = Math.round(w); else delete m[norm(col.name)];
    if (!Object.keys(m).length) delete all[k];
    lsSet(LS_COLW, JSON.stringify(all));
  }
  const hasColW = () => !!colWAll()[layoutKey()];
  function renderGrid(opt) {
    opt = opt || {};
    const hp = document.querySelector('.hpop');
    if (hp) hp.hidden = true;   // 표를 다시 그리면 '이전 N회' 팝업은 닫는다
    const keep = opt.keep ? {t: grid.scrollTop, l: grid.scrollLeft} : (opt.pos || {t: 0, l: 0});
    const d = curData();
    S.size = sizeKey();
    clearTimeout(S.softT);   // 기다리던 자동 갱신 그리기는 이번 그리기로 끝
    if (!d) { grid.innerHTML = skeleton(); S.list = []; S.vr = null; paintCount(); return; }
    const v = vstate(), list = filtered(d, v);
    S.list = list;
    // 휴대폰: 상품 이름 열을 맨 앞에 고정하고 옵션 · 남은 재고 · 합계 · 리오더 알림을 바로 뒤로 (옆으로 안 밀어도 보이게), 줄 번호 열은 뺌
    const nar = narrow.matches, showRn = !nar, vw = grid.clientWidth || 1000;
    const hcSet = hidColSet();   // ▾ 열 메뉴에서 숨긴 열 (이 브라우저 · 탭마다)
    let cols = d.cols.filter(c => (S.showEmpty || !d.rows.length || !c.empty || c.key || c.keep) && (S.showHid || c.key || !d.hcol.has(c.p)) && (c.key || !hcSet.has(norm(c.name)))), stickN = 0, keyFirst = false;   // 줄이 하나도 없는 탭은 머리글이라도
    if (nar && cols.some(c => c.key)) {
      const pri = c => c.key ? 0 : OPT_RE.test(norm(c.name)) ? 1 : norm(c.name) === '남은재고' ? 2 : c.strong ? 3 : c.status ? 4 : 5;
      cols = cols.map((c, i) => [c, i]).sort((x, y) => pri(x[0]) - pri(y[0]) || x[1] - y[1]).map(x => x[0]);
      stickN = 1;
      keyFirst = true;
    } else {   // 카테고리 · 상품명 · 옵션처럼 상품명이 앞쪽(3번째 안)에 있을 때만 왼쪽 고정 (옆으로 넘길 때)
      const kI = cols.findIndex(c => c.key);
      if (kI >= 0 && kI <= 2) { stickN = kI + 1; if (cols[kI + 1] && OPT_RE.test(norm(cols[kI + 1].name))) stickN++; }
    }
    if (!nar) stickN = freezeN(cols, stickN);   // 더보기 ▾ 틀 고정
    // PC 는 화면 폭에 맞춰 칸 너비를 정하고 (fitWidths — 끌어서 정한 칸은 그 너비 그대로), 휴대폰은 칸마다 알맞은 너비로 옆으로 넘긴다
    // (휴대폰 글자 칸은 화면의 62% 를 넘지 않게 — 긴 글은 두 줄로 접히고 전체는 상세 창에)
    const fix = nar ? [] : cols.map(c => colWOf(c));
    const widths = nar ? cols.map((c, k) => keyFirst && k === 0 ? Math.min(c.pref, Math.max(120, Math.round(vw * 0.42)))
      : c.flex ? Math.max(c.min, Math.min(c.pref, Math.round(vw * 0.62))) : c.pref)
      : fitWidths(cols, vw - (showRn ? RN_W : 0) - 2, fix);
    let left = showRn ? RN_W : 0;
    while (stickN > 0 && left + widths.slice(0, stickN).reduce((s, w) => s + w, 0) > vw * (keyFirst ? 0.62 : XL.freezeName() ? 0.7 : 0.5)) stickN--;
    const posOf = cols.map((c, k) => {
      if (k >= stickN) return null;
      const p = {cls: ` sk${k === stickN - 1 ? ' skl' : ''}`, style: `left:${left}px;`};
      left += widths[k];
      return p;
    });
    const total = (showRn ? RN_W : 0) + widths.reduce((s, w) => s + w, 0), sort = v.sort;
    let h = `<table class="tbl" style="width:max(100%,${total}px)"><colgroup>${showRn ? `<col style="width:${RN_W}px">` : ''}${widths.map(w => `<col style="width:${w}px">`).join('')}<col></colgroup><thead><tr>`;
    if (showRn) h += `<th class="rn sk${stickN ? '' : ' skl'}" style="left:0" data-sort="rn" title="줄 번호 (보이는 순서 1부터) · ${cellMode() ? '누르면 전체 고르기 (Ctrl+A)' : '누르면 원래 순서로'}">행</th>`;
    cols.forEach((c, k) => {
      const ps = posOf[k], ar = sort && sort.p === c.p ? `<span class="ar">${sort.dir > 0 ? '▲' : '▼'}</span>` : '';
      const hf = d.headR ? fmtEff(S.cur, d.headR, c.p, null) : null, hn = d.headR ? noteOf(S.cur, d.headR, c.p) : '';   // 머리글 칸 색 · 메모 (구글시트 그대로)
      const hcss = (ps ? ps.style : '') + (hf && hf.bg ? `background-color:${hf.bg};color:${hf.fg || (darkBg(hf.bg) ? '#fff' : '#1f2937')};` : hf && hf.fg ? `color:${hf.fg};` : '') + (hf ? bdCss(hf) : '');
      const fon = !!(v.filt && v.filt.has(c.p));   // 값으로 거르는 중인 열
      const cls = (c.align + (ps ? ps.cls : '') + (/\s/.test(c.name) ? ' ka' : '') + (fix[k] ? ' wfix' : '') + (hn ? ' nt' : '') + (fon ? ' fon' : '')).trim();
      const rz = nar ? '' : `<button type="button" class="cmb" data-p="${c.p}" tabindex="-1" aria-label="열 메뉴" title="열 메뉴 — 정렬 · 값으로 거르기 · 열 숨기기${fon ? ' (거르는 중)' : ''}">${ICON_CARET}</button><span class="rz" data-p="${c.p}" title="끌어서 칸 너비 조절 · 두 번 누르면 자동 너비"></span>`;
      h += `<th data-p="${c.p}"${cls ? ` class="${cls}"` : ''}${hcss ? ` style="${hcss}"` : ''} title="${colName(c.p)}열 · ${esc(c.name)}${c.tip ? ` (${esc(c.tip)})` : ''} — ${cellMode() ? '누르면 열 고르기 · ▾ 정렬과 거르기' : '누르면 정렬'}${hn ? esc('\n\n메모: ' + hn) : ''}">${nar ? '' : `<i class="cl">${colName(c.p)}</i>`}${esc(c.name)}${ar}${rz}</th>`;
    });
    h += '<th class="fill"></th></tr></thead><tbody>';
    // 줄이 많으면(VR_MIN 넘게) 처음엔 높이만 잡아 두고, 스크롤 위치를 맞춘 뒤 보이는 줄 근처만 그린다 (paintRows)
    const vr = S.vr = {list, cols, posOf, showRn, stickN, span: cols.length + (showRn ? 2 : 1), on: list.length > VR_MIN, a: 0, b: 0, rowH: rowHGuess(), tb: null, hid: d.hid};
    calcRng();   // 고른 범위 · 복사한 자리를 새 줄 차례로
    S.dupN = null;   // 조건부 서식(겹친 상품명) 세기 — 그릴 때마다 새로
    if (!list.length) h += `<tr class="empty"><td colspan="${vr.span}">${d.rows.length ? '조건에 맞는 줄이 없어요' : '이 탭은 비어 있어요'}</td></tr>`;
    else if (vr.on) h += vrBody(vr, 0, 0);
    else list.forEach((row, i) => { h += rowHtml(row, vr, i); });
    h += '</tbody>';
    // 맨 아래 합계 (보이는 줄만 — 걸러 보면 그 줄들의 합)
    const sums = cols.map(c => c.sum ? list.reduce((s, r) => { const x = r.byP[c.p], n = x ? numOf(x.t) : null; return s + (n || 0); }, 0) : null);
    if (list.length && sums.some(x => x !== null)) {
      const labAt = showRn ? -1 : sums.findIndex(x => x === null);   // '합계' 글자는 줄 번호 칸에 (휴대폰은 첫 글자 칸)
      h += '<tfoot><tr>' + (showRn ? `<td class="rn sk${stickN ? '' : ' skl'}" style="left:0"><span class="ft">합계</span></td>` : '');
      cols.forEach((c, k) => {
        const ps = posOf[k], cls = ((sums[k] !== null ? 'r' : '') + (ps ? ps.cls : '')).trim();
        const inner = sums[k] !== null ? fmt(sums[k]) : k === labAt ? '<span class="ft">합계</span>' : '';
        h += `<td${cls ? ` class="${cls}"` : ''}${ps ? ` style="${ps.style}"` : ''}>${inner}</td>`;
      });
      h += '<td class="fill"></td></tr></tfoot>';
    }
    grid.innerHTML = h + '</table>';
    vr.tb = grid.querySelector('tbody');
    paintHeadSel();
    grid.scrollTop = keep.t;
    grid.scrollLeft = keep.l;
    if (vr.on) paintRows(true);
    paintCount();
    reanchor();
    // 그리고 나서 세로 스크롤바가 생기거나 없어져 폭이 바뀌었으면 그 폭으로 한 번 더 맞춘다
    if (!nar && !opt.again && grid.clientWidth && Math.abs(grid.clientWidth - vw) > 1) renderGrid({keep: true, again: true});
  }
  // 높이는 빼고 폭만 — 휴대폰에서 위쪽을 접고 펴거나 주소창 · 자판이 나와 높이만 바뀌면 표 전체를 다시 그리지 않고 줄만 더 채운다 (paintRows)
  const sizeKey = () => `${grid.clientWidth}x${narrow.matches ? 1 : 0}`;

  /* ── 보이는 줄 근처만 그리기 (2026-11-20 휴대폰 최적화) ──
     줄이 많은 탭(재고 87~230줄 · 메인 제외 상품들 665줄)은 표를 통째로 그리면 칸이 5천~1만 개라
     PC 에서도 한 번에 0.1초, 휴대폰은 그 몇 배가 걸려 누를 때마다 멈칫했다. 줄 높이는 늘 같으니(--row-h)
     화면에 보이는 줄 + 위아래 한 화면씩만 그리고, 나머지는 높이만 있는 빈 줄로 채워 스크롤 길이는 그대로 둔다. */
  const VR_MIN = 60;
  const rowKey = () => `${S.dense ? 1 : 0}${narrow.matches ? 1 : 0}`;
  const rowHGuess = () => S.rowH[rowKey()] || (S.dense ? 28 : narrow.matches ? 36 : 34);
  // 행 번호 = 지금 보이는 순서대로 1, 2, 3 … (2026-11-20 사장님 "행 번호가 마음대로인데 행은 그냥 1번부터 다 기재" — 걸러 보기 · 정렬해도 위에서부터 1번).
  // 함수 주소(E5 등)는 여전히 시트 줄 번호(row.r)라 그 번호는 마우스를 올리면 보인다.
  function rowHtml(row, vr, i) {
    const cls = ((S.sel && S.sel.gid === S.cur && S.sel.r === row.r ? 'on' : '') + (row.lv ? ' lv-' + row.lv : '') + (row.sub ? ' sub' : '') + (vr.hid && vr.hid.has(row.r) ? ' hrow' : '')).trim();
    let s = `<tr data-r="${row.r}"${cls ? ` class="${cls}"` : ''}>`;
    if (vr.showRn) s += `<td class="rn sk${vr.stickN ? '' : ' skl'}${S.hr && S.hr.has(row.r) ? ' hl' : ''}" style="left:0" title="${i + 1}번 줄 (함수 주소는 ${row.r}행) — ${cellMode() ? '누르면 줄 고르기 · 두 번 누르면 이 줄 전체 보기' : '누르면 이 줄 전체 보기'}${row.lv === 'low' ? ' · 품절 임박' : row.lv === 'out' ? ' · 품절' : ''}">${i + 1}</td>`;
    for (let k = 0; k < vr.cols.length; k++) s += cellHtml(row, vr.cols[k], vr.posOf[k]);
    return s + '<td class="fill"></td></tr>';
  }
  const vrGap = (vr, n) => n > 0 ? `<tr class="vsp" aria-hidden="true"><td colspan="${vr.span}" style="height:${(n * vr.rowH).toFixed(2)}px"></td></tr>` : '';
  function vrBody(vr, a, b) {
    let s = vrGap(vr, a);
    for (let i = a; i < b; i++) s += rowHtml(vr.list[i], vr, i);
    return s + vrGap(vr, vr.list.length - b);
  }
  // 그릴 범위 [a, b) = 보이는 줄 ± 한 화면, [lo, hi) = 이 안이 다 그려져 있으면 다시 안 그림 (± 반 화면)
  function vrWindow(vr, top) {
    const n = vr.list.length, vis = Math.ceil((grid.clientHeight || 800) / vr.rowH) + 1, over = Math.max(12, vis), half = over >> 1;
    const first = Math.min(n, Math.max(0, Math.floor(top / vr.rowH)));   // 고정 머리글 바로 아래 줄
    return {a: Math.max(0, first - over), b: Math.min(n, first + vis + over), lo: Math.max(0, first - half), hi: Math.min(n, first + vis + half)};
  }
  function paintRows(force) {
    const vr = S.vr;
    if (!vr || !vr.on || !vr.tb || !vr.tb.isConnected) return;
    const w = vrWindow(vr, grid.scrollTop);
    if (!force && w.lo >= vr.a && w.hi <= vr.b) return;
    vr.a = w.a;
    vr.b = w.b;
    vr.tb.innerHTML = vrBody(vr, w.a, w.b);
    // 실제 줄 높이를 재서 다르면 그 높이로 (글꼴 · 확대 배율에 따라 조금 다를 수 있다 — 처음 한 번)
    const tr = vr.tb.querySelector('tr[data-r]'), rh = tr ? tr.getBoundingClientRect().height : 0;
    if (rh > 8 && Math.abs(rh - vr.rowH) > 0.5) {
      vr.rowH = S.rowH[rowKey()] = rh;
      const w2 = vrWindow(vr, grid.scrollTop);
      vr.a = w2.a;
      vr.b = w2.b;
      vr.tb.innerHTML = vrBody(vr, w2.a, w2.b);
    }
    reanchor();
  }
  // r 행이 보이게 스크롤 (↑↓ · 찾기 Enter · 상세 창 이전/다음) — 그려지지 않은 줄도 위치를 계산해서
  function showRow(r) {
    const vr = S.vr;
    if (!vr || !vr.on) { const tr = grid.querySelector(`tbody tr[data-r="${r}"]`); if (tr) ensureRowVisible(tr); return; }
    const i = vr.list.findIndex(x => x.r === r);
    if (i < 0) return;
    const th = grid.querySelector('thead'), tf = grid.querySelector('tfoot');
    const thH = th ? th.offsetHeight : 0, tfH = tf ? tf.offsetHeight : 0, y = i * vr.rowH;   // y = 머리글 아래에서 잰 줄 위치
    if (y < grid.scrollTop) grid.scrollTop = y;
    else if (thH + y + vr.rowH > grid.scrollTop + grid.clientHeight - tfH) grid.scrollTop = thH + y + vr.rowH - grid.clientHeight + tfH;
    paintRows();
  }
  // 1분 자동 갱신 · 저장 뒤 다시 읽기로 자료가 바뀌었을 때 — 손가락으로 넘기는 중이면 멈춘 뒤에 그린다
  // (넘기는 도중 표를 갈아 끼우면 휴대폰에선 관성 스크롤이 뚝 끊기고 위치가 튄다)
  function softRender() {
    clearTimeout(S.softT);
    const idle = Date.now() - S.touchAt;
    if (idle < 1500) { S.softT = setTimeout(softRender, 1600 - idle); return; }
    if (!curData()) return;
    renderGrid({keep: true});
    if (S.sel && S.sel.gid === S.cur && !$('detail').hidden) openDetail(S.sel.r, false);   // 상세 창도 새 값으로
  }
  const touched = () => { S.touchAt = Date.now(); };
  ['touchstart', 'touchmove', 'wheel'].forEach(ev => document.addEventListener(ev, touched, {passive: true, capture: true}));

  /* ── 휴대폰: 표를 아래로 넘기면 위쪽(안내 · 요약 카드 · 칩 · 날짜)을 접는다 ──
     접으면 표가 그만큼 길어진다. 맨 위 근처로 돌아오거나 제목 줄을 누르면 편다.
     목록이 짧아 접으면 스크롤할 게 없어지는 탭은 접지 않는다 (접었다 폈다 반복하지 않게) */
  let hdLast = 0, hdAcc = 0, hdLock = 0;
  function setHmin(on) {
    on = !!on && compactMQ.matches;
    if (app.classList.contains('hmin') === on) return;
    app.classList.toggle('hmin', on);
    hdLock = Date.now() + 350;   // 높이가 바뀌며 생기는 스크롤 이벤트는 잠깐 무시
    hdAcc = 0;
  }
  function headScroll() {
    const top = grid.scrollTop, dy = top - hdLast;
    hdLast = top;
    if (!compactMQ.matches || Date.now() < hdLock) return;
    const on = app.classList.contains('hmin');
    if (on) { if (top < 24) setHmin(false); return; }
    hdAcc = dy > 0 ? hdAcc + dy : 0;
    const head = document.querySelector('.head');
    if (hdAcc > 24 && top > 56 && grid.scrollHeight - grid.clientHeight > head.offsetHeight + 160) setHmin(true);
  }

  /* ── 위쪽 (제목 · 날짜 · 안내 · 요약 카드 · 칩) ── */
  function renderHead() {
    const t = tabOf(S.cur), m = t ? (t.meta || (t.meta = classify(t.name, t.book))) : null, b = t ? bookOf(t.book) : null, d = curData(), v = vstate();
    $('title').textContent = !m ? '불러오는 중…' : m.label;
    $('dates').innerHTML = '';
    const td = $('tDate');   // 제목 옆 = 어느 시트의 탭인지
    td.hidden = !b;
    td.textContent = b ? b.title + (isCut(S.cur) ? ' · 오피스가 원본' : '') : '';
    const tc = $('tCap');    // 그 옆 = 표 위의 제목 · 조건 줄 ('월별 판매 성과 분석' · '주문일 · 2026. 9. 1')
    tc.textContent = d && d.note ? d.note : '';
    tc.title = tc.textContent;
    tc.style.cssText = d && d.capBg ? `background:${d.capBg};color:${darkBg(d.capBg) ? '#fff' : '#1f2937'};padding:2px 8px;border-radius:6px` : '';   // '해당 컬러는 …' 처럼 색으로 뜻을 적은 설명
    tc.hidden = !tc.textContent;
    const fv = $('tFav'), isFav = !!t && S.fav.includes(t.gid);
    fv.hidden = !t;
    paintHideBtn(t);   // 제목 줄 '탭 숨기기' · 숨긴 탭이면 '다시 보이기' (2026-11-23 — '탭 삭제' 단추 대신)
    fv.textContent = isFav ? '★' : '☆';
    fv.classList.toggle('on', isFav);
    fv.title = isFav ? '즐겨찾기에서 빼기' : '즐겨찾기 — 왼쪽 메뉴 맨 위에 모아 둬요';
    $('addRow').hidden = !canAddRow();
    $('wReset').hidden = !d || narrow.matches || !hasColW();   // 끌어서 바꾼 칸 너비가 있을 때만
    fmtBar();

  /* ── 왼쪽 메뉴 ── 즐겨찾기(★) → 묶음(MD 기본 시트 · 플랫폼 가격표 …) → 시트(머리를 누르면 접기 · 펴기, 기억) → 탭 (시트의 탭 순서).

  function tabHid(t) { return !!(t && (t.info ? t.info.th : t.th)); }   // 숨긴 탭 (저장소 mdx_tabs.tab_hidden_at) — 메뉴에서만 빠지고 줄 · 함수 · 자동 업무는 그대로
  function renderNav() {

      if (!tabs.length) continue;   // 탭을 다 지운 시트

    }
    const hid = canEdit() ? S.tabs.filter(tabHid) : [];   // 숨긴 탭 — 고칠 수 있는 사람(관리자 · MD팀)만, 처음엔 접어 둔다. 누르면 열어 보고, 제목 줄 '다시 보이기'
    if (hid.length) {

        hs.forEach(t => {
          const by = t.info && t.info.th_by;   // 저장해 둔 메뉴로 먼저 그릴 땐 탭 정보가 아직 없다

          h += `<button type="button" class="nav-item hid${t.gid === S.cur ? ' on' : ''}" data-gid="${esc(t.gid)}" title="${esc(`${b.title} › ${t.name}${by ? ` — ${by} 숨김` : ''} · 누르면 열기 (오른쪽 버튼 = 다시 보이기)`)}"><i class="dot" style="background:${t.meta.color}"></i><span class="nm">${esc(t.name)}</span><span class="bk">${esc(b.title)}</span><span class="rv">숨김</span></button>`;
        });

    const gone = canEdit() ? (S.gone || []) : [];   // 지운 탭 — 처음엔 접어 둔다
    if (gone.length) {
      h += `<div class="nav-grp${isFolded('_gone') ? ' off' : ''}"><button type="button" class="nav-sec" data-fold="_gone" title="지운 탭 — 누르면 되살릴 수 있어요">${CHEV}<i class="bd" style="background:#475569"></i><span class="bn">지운 탭</span><em>${gone.length}</em></button>`;
      gone.forEach(x => {
        const b = bookOf(x.book) || {}, d = x.at ? new Date(x.at) : null;
        h += `<button type="button" class="nav-item gone" data-back="${esc(x.tk)}" title="${esc(`${b.title || ''} › ${x.name}${d ? ` — ${d.getMonth() + 1}/${d.getDate()} 지움` : ''}${x.by ? ` (${x.by})` : ''} · 누르면 되살리기`)}"><i class="dot"></i><span class="nm">${esc(x.name)}</span><span class="bk">${esc(b.title || '')}</span><span class="rv">되살리기</span></button>`;
      });
      h += '</div>';
    }
    S.nav = list;
    $('nav').innerHTML = h;
  }
  const erpItem = () => '<button type="button" class="nav-item lnk-item" data-erp="1" title="재고는 오피스 ERP(ERP전산팀 화면)에서 봐요"><i class="dot" style="background:#16a34a"></i><span class="nm">재고 ERP</span><span class="go">ERP전산팀 →</span></button>';
  const curItem = () => S.nav.find(it => it.key === S.cur) || null;
  // 왼쪽 메뉴 숫자 — 바뀌었을 때만 저장 · 다시 그림
  function setCount(gid, data) {
    const n = data && data.parts && data.parts[0] ? (data.parts[0].nShow != null ? data.parts[0].nShow : data.parts[0].rows.length) : null;
    if (n === null || S.counts[gid] === n) return;
    S.counts[gid] = n;

  function toggleFav(gid) {

  function openErp() {
    try { if (window.parent !== window && typeof window.parent.openErpPage === 'function') { window.parent.openErpPage(); return; } } catch (e) { /* 다른 출처 */ }

  }
  // PC 는 메뉴를 접어 표를 넓게 (접힌 상태는 기억), 좁은 화면은 서랍

  /* ── 저장본 (IndexedDB) — 탭마다 마지막으로 받은 칸 자료(주문자 이름은 이미 가린 것)와 받은 시각. 못 쓰는 브라우저(사생활 보호 창 등)면 그냥 안 씀 ── */
  const store = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise(res => {
      try {
        const rq = indexedDB.open(IDB_NAME, 1);
        rq.onupgradeneeded = () => { try { rq.result.createObjectStore('tabs'); } catch (e) { /* 이미 있음 */ } };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = rq.onblocked = () => res(null);
      } catch (e) { res(null); }
    }));
    const run = (mode, fn) => open().then(db => db && new Promise(res => {
      try {
        const tx = db.transaction('tabs', mode), rq = fn(tx.objectStore('tabs'));
        tx.oncomplete = () => res(rq ? rq.result : true);
        tx.onerror = tx.onabort = () => res(null);
      } catch (e) { res(null); }
    }));
    return {
      get: gid => run('readonly', s => s.get(gid)).then(v => v && v.v === CACHE_VER && Array.isArray(v.rows) ? v : null),
      put: (gid, rows, rowsVer, at, gf) => run('readwrite', s => s.put({v: CACHE_VER, rows, rowsVer, at, gf}, gid)),
      keys: () => run('readonly', s => s.getAllKeys()),
      del: gid => run('readwrite', s => s.delete(gid)),
    };
  })();
  S.savedAt = {};   // gid → 저장본에 쓴 시각 (자료가 같으면 2분에 한 번만 다시 씀)
  // 저장본 = 그 탭의 줄 [{r, v, src, edited_by, edited_at}] (주문자 이름은 이미 가린 것) · 그때의 줄 번호표(rows_ver) · 받은 시각.
  // 구글시트를 바로 읽은 것(direct — 저장소가 멈췄을 때)은 가리기 전 글이 섞일 수 있어 저장하지 않는다.
  function saveRows(gid, ent, changed) {
    if (!ent || ent.direct) return;
    if (!changed && Date.now() - (S.savedAt[gid] || 0) < 120e3) return;
    S.savedAt[gid] = Date.now();
    store.put(gid, [...ent.rows.values()], ent.rowsVer, ent.at, S.gf[gid] ? S.gf[gid].raw : null);
  }
  // 줄 → 칸 자료 → 업무 표 (고치는 중이라 저장 전인 칸은 고친 값으로)
  function build(gid, ent) {
    const list = [...ent.rows.values()].sort((a, b) => a.r - b.r);
    ent.model = modelFromRows(tabOf(gid), list);
    if (ent.direct) {   // 구글시트를 바로 읽은 것 — 주문자 이름 등은 저장소와 같은 규칙으로 가리고 줄에도 가린 글만 남긴다
      ent.model.masked = maskPII(ent.model.rows);
      ent.model.rows.forEach(mr => { const x = ent.rows.get(mr.r); mr.cells.forEach(c => { if (c.pii && x) x.v[c.p] = c.t; }); });
    }
    applyPending(gid, ent.model);
    applyOfx(gid, ent);   // 오피스 함수 칸 = 지금 계산한 값
    applyGfx(gid, ent);   // 끊은 시트 — 방금 고친 줄의 구글 함수 칸도 바로
    ent.data = buildAll(ent.model, tabOf(gid));
    return ent;
  }
  const slim = x => ({r: x.r, v: Array.isArray(x.v) ? x.v.map(t => t == null ? '' : String(t)) : [], src: x.src || 'sheet', edited_by: x.edited_by || null, edited_at: x.edited_at || null});
  function sameRows(a, b) {
    if (a.size !== b.size) return false;
    for (const [r, x] of b) { const y = a.get(r); if (!y || y.v.length !== x.v.length || y.v.some((t, i) => t !== x.v[i]) || y.edited_by !== x.edited_by) return false; }
    return true;
  }

  /* ── 미리 받기 — 첫 탭이 뜬 뒤 다른 브랜드 재고 탭을 하나씩 (화면이 보일 때만, 저장소와 같으면 건너뜀) ── */
  let prefetchOn = false;

  /* ── 표 조작 — 머리글 = 정렬, 칸 = 바로 고치기(PC) · 줄 = 상세 창(휴대폰 · 행 번호), 사진 = 크게 ── */
  grid.addEventListener('click', e => {

  /* 표 사진에 마우스 → 옆에 크게 (2026-11-23 사장님 "이미지는 마우스오버로 볼 수 있게") — 누르면 여전히 사진 주소 복사.

  function moveSel(dir) {

  /* ── 상세 창 — 그 줄의 모든 칸을 이름 · 값으로 (휴대폰은 아래에서 올라옴) ── */

  function openDetail(r, scroll) {

  $('dscrim').addEventListener('click', closeDetail);
  // 휴대폰: 상세 창 윗부분(손잡이 · 제목)을 잡고 끌어내리면 닫힌다
  (function () {
    const det = $('detail'), dh = det.querySelector('.dh');

    const cells = items.map(it => ({x: it.x, v: String(it.v), old: it.old != null ? String(it.old) : rawOf(gid, it.x.r, it.x.p), before: it.x.fx && !it.x.check ? it.x.fx : it.old != null ? String(it.old) : rawOf(gid, it.x.r, it.x.p), key: pkey(it.x)}));

              if (d && d.conflict) { if (norm(d.current) === norm(c.v)) done.push({c, ok: true, v: d.v}); else done.push({c, ok: false, current: d.current}); continue; }

            const arr = j.rows && (j.rows[r] || j.rows[String(r)]), row = Array.isArray(arr) ? arr.map(y => y == null ? '' : String(y)) : null;

  const ICON_TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg>';

    cmenu.innerHTML = `<div class="rh">${colName(p)}열 · ${esc(col.name)}</div>`
      + `<button type="button" data-c="asc">${sorted > 0 ? '✓ ' : ''}오름차순 정렬<kbd>가→하 · 1→9</kbd></button>`
      + `<button type="button" data-c="desc">${sorted < 0 ? '✓ ' : ''}내림차순 정렬<kbd>하→가 · 9→1</kbd></button>`
      + (sorted ? '<button type="button" data-c="unsort">정렬 풀기 (원래 순서)</button>' : '')
      + '<hr><div class="cf"><div class="cft">값으로 거르기<em class="cfn"></em></div>'
      + '<input class="cfq" type="search" placeholder="값 찾기" autocomplete="off" spellcheck="false">'
      + '<div class="cfa"><button type="button" data-c="all">모두 고르기</button><button type="button" data-c="none">모두 빼기</button></div>'
      + '<div class="cfl"></div>'
      + `<div class="cfb"><button type="button" class="pri" data-c="apply">적용</button>${cur ? '<button type="button" class="sec" data-c="clear">거르기 풀기</button>' : ''}</div></div>`
      + (col.key ? '' : '<hr><button type="button" data-c="hide">이 열 숨기기</button>')
      + (colWOf(col) ? '<button type="button" data-c="autow">칸 너비 자동으로</button>' : '');
    paintCfl();
    cmenu.hidden = false;
    const w = cmenu.offsetWidth, h = cmenu.offsetHeight;
    let L = x, T = y;
    if (anchor) { const rc = (anchor.offsetWidth ? anchor : anchor.closest('th') || anchor).getBoundingClientRect(); L = rc.right - w; T = rc.bottom + 4; }   // ▾ 가 안 보이면(키보드 · 터치) 머리글 칸 기준
    cmenu.style.left = Math.max(6, Math.min(L, innerWidth - w - 6)) + 'px';
    cmenu.style.top = Math.max(6, Math.min(T, innerHeight - h - 6)) + 'px';
  }
  function applyFilt() {
    const v = vstate();
    if (!CM.sel.size) { toast('하나 이상 골라 주세요', true); return; }
    if (!v.filt) v.filt = new Map();
    if (CM.sel.size === CM.vals.length) v.filt.delete(CM.p); else v.filt.set(CM.p, new Set(CM.sel));
    closeCmenu();
    redraw(true);
  }
  cmenu.addEventListener('click', e => {
    const b = e.target.closest('button[data-c]');
    if (!b) return;
    const v = vstate(), p = CM.p, d = curData(), col = d && d.cols.find(c => c.p === p), c = b.dataset.c;
    if (c === 'all' || c === 'none') {
      const q = CM.q.trim().toLowerCase();
      CM.vals.forEach(([k]) => { if (!q || k.toLowerCase().includes(q)) { if (c === 'all') CM.sel.add(k); else CM.sel.delete(k); } });
      paintCfl();
      return;
    }
    if (c === 'apply') { applyFilt(); return; }
    closeCmenu();
    if (!col) return;
    if (c === 'asc' || c === 'desc') { v.sort = {p, dir: c === 'asc' ? 1 : -1}; redraw(false); }
    else if (c === 'unsort') { v.sort = null; redraw(false); }
    else if (c === 'clear') { if (v.filt) v.filt.delete(p); redraw(true); }
    else if (c === 'hide') { setHidCols([...hidColSet(), norm(col.name)]); redraw(false); toast(`'${col.name}' 열을 숨겼어요 — 위 '숨긴 열 · 다시 보이기' 로 되돌려요`); }
    else if (c === 'autow') { setColW(col, 0); redraw(false); }
  });
  cmenu.addEventListener('change', e => {
    const i = e.target.dataset && e.target.dataset.i;
    if (i == null) return;
    const k = CM.vals[+i] && CM.vals[+i][0];
    if (k == null) return;
    if (e.target.checked) CM.sel.add(k); else CM.sel.delete(k);
    cmenu.querySelector('.cfn').textContent = `${fmt(CM.sel.size)} / ${fmt(CM.vals.length)}`;
  });
  cmenu.addEventListener('input', e => { if (e.target.classList.contains('cfq')) { CM.q = e.target.value; paintCfl(); } });
  cmenu.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('cfq')) { e.preventDefault(); applyFilt(); } else if (e.key === 'Escape') closeCmenu(); });
  grid.addEventListener('click', e => {   // ▾ — 머리글 누르기(정렬)보다 먼저
    const b = e.target.closest && e.target.closest('.cmb');
    if (!b) return;
    e.stopImmediatePropagation();
    e.preventDefault();
    if (CM.p === +b.dataset.p && !cmenu.hidden) { closeCmenu(); return; }
    openCmenu(+b.dataset.p, b);
  }, true);
  grid.addEventListener('contextmenu', e => {   // 머리글 오른쪽 클릭 = 열 메뉴
    const th = e.target.closest && e.target.closest('thead th[data-p]');
    if (!th || narrow.matches) return;
    e.preventDefault();
    openCmenu(+th.dataset.p, null, e.clientX, e.clientY);
  });
  document.addEventListener('mousedown', e => { if (!cmenu.hidden && !(e.target.closest && e.target.closest('#cmenu,.cmb'))) closeCmenu(); }, true);
  grid.addEventListener('scroll', () => { if (!cmenu.hidden) closeCmenu(); }, {passive: true});

  // ⋯ 더보기 — 원래 제목 줄에 있던 단추를 그대로 옮겨 담는다
  const ICON_DOTS = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/></svg>';
  const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>';
  const ICON_WRAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h13a3 3 0 0 1 0 6h-4M15 16l-2 2 2 2M4 18h5"/></svg>';
  const ICON_XL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>';
  const ICON_KEY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>';
  const moreBtn = document.createElement('button');
  moreBtn.type = 'button';
  moreBtn.className = 'more';
  moreBtn.id = 'btnMore';
  moreBtn.title = '더보기 — 엑셀로 받기 · 보기 설정 · 탭 숨기기';
  moreBtn.setAttribute('aria-label', '더보기');
  moreBtn.innerHTML = ICON_DOTS;
  const pop = document.createElement('div');
  pop.className = 'mpop';
  pop.id = 'morePop';
  pop.hidden = true;
  pop.setAttribute('role', 'menu');
  pop.innerHTML = `<button type="button" class="mi" data-m="csv">${ICON_DL}<span>엑셀로 받기</span><small>보이는 그대로</small></button>`
    + `<button type="button" class="mi" data-m="xl">${ICON_XL}<span>엑셀 기능 더보기</span><small>찾기·바꾸기</small></button>`
    + `<button type="button" class="mi" data-m="wrap">${ICON_WRAP}<span></span></button>`
    + `<button type="button" class="mi" data-m="cols" hidden>${ICON_EYE}<span></span></button>`
    + '<hr data-sep="v"><div class="mgrp" data-g="v"></div>'
    + `<hr><button type="button" class="mi" data-m="keys">${ICON_KEY}<span>단축키 보기</span><small>?</small></button>`
    + '<hr data-sep="t"><div class="mgrp" data-g="t"></div>';
  const toolsEl = document.querySelector('.head .tools');
  toolsEl.appendChild(moreBtn);
  toolsEl.appendChild(pop);
  const gV = pop.querySelector('[data-g="v"]'), gT = pop.querySelector('[data-g="t"]');
  ['wReset', 'eTog', 'hTog', 'pTog'].forEach(id => { const el = $(id); if (el) gV.appendChild(el); });
  gT.appendChild(hideBtn);
  // 지금 탭 — 이름 바꾸기 · 새 탭 · 삭제 (2026-11-24 — 휴대폰 · 아이폰은 왼쪽 메뉴 길게 누르기가 없어서 여기에도)
  const mkMore = (id, icon, label, fn) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'etog tdel';
    b.id = id;
    b.innerHTML = `${icon}<span>${label}</span>`;
    b.addEventListener('click', () => { const t = tabOf(S.cur); if (t) fn(t); });
    gT.appendChild(b);
    return b;
  };
  const renMore = mkMore('renTab', ICON_PEN, '탭 이름 바꾸기', t => askRenameTab(t.gid));
  const addMore = mkMore('addTab', ICON_PLUS, '이 뒤에 새 탭 만들기', t => askAddTab(t.book, t.gid));
  const delMore = mkMore('delTabMore', ICON_TRASH, '탭 삭제', t => askDelTab(t.gid));
  function paintTabMore() {
    const t = tabOf(S.cur);
    renMore.hidden = addMore.hidden = !canTabEdit(t);
    delMore.hidden = !canDelTab(t);
  }
  function closeMore() { if (!pop.hidden) { pop.hidden = true; moreBtn.classList.remove('on'); } }
  function paintMore() {
    const d = curData();
    pop.querySelector('[data-m="csv"]').disabled = !d || !S.vr || !S.vr.list.length;
    const w = pop.querySelector('[data-m="wrap"]');
    w.hidden = narrow.matches;
    w.querySelector('span').textContent = S.wrap2 ? '긴 글 한 줄로 보기' : '긴 글 두 줄로 보기';
    const hc = hidColNames(d), c = pop.querySelector('[data-m="cols"]');
    c.hidden = !hc.length;
    c.querySelector('span').textContent = `숨긴 열 ${hc.length}개 다시 보이기`;
    paintTabMore();
    [['v', gV], ['t', gT]].forEach(([k, g]) => { pop.querySelector(`hr[data-sep="${k}"]`).hidden = ![...g.children].some(x => !x.hidden); });
  }
  moreBtn.addEventListener('click', () => {
    if (!pop.hidden) { closeMore(); return; }
    closeCmenu(); closeRmenu();
    paintMore();
    pop.hidden = false;
    moreBtn.classList.add('on');
  });
  pop.addEventListener('click', e => {   // 옮겨 담은 단추는 자기 동작을 먼저 하고, 여기서 메뉴만 닫는다
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const m = b.dataset.m;
    closeMore();
    if (m === 'csv') XL.exportXlsx();
    else if (m === 'xl') XL.openMore(moreBtn);
    else if (m === 'wrap') { S.wrap2 = !S.wrap2; lsSet('mdx_wrap2_v1', S.wrap2 ? '1' : '0'); applyWrap(); renderGrid({keep: true}); }
    else if (m === 'cols') { setHidCols([]); redraw(false); toast('숨긴 열을 다시 보여요'); }
    else if (m === 'keys') openKeys();
  });
  document.addEventListener('mousedown', e => { if (!pop.hidden && !(e.target.closest && e.target.closest('#morePop,#btnMore'))) closeMore(); }, true);

  // 한 줄 보기 (PC) — 줄 높이가 고르게. 휴대폰은 늘 두 줄
  S.wrap2 = lsGet('mdx_wrap2_v1') === '1';
  function applyWrap() { app.classList.toggle('onel', !S.wrap2 && !narrow.matches); }
  applyWrap();
  if (narrow.addEventListener) narrow.addEventListener('change', applyWrap);

  // 단축키 (? 키 · ⋯ 단축키 보기)
  const openKeys = () => XL.toggleHelp(moreBtn);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeMore(); closeCmenu(); return; }
    if (e.key !== '?' || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    const el = e.target;
    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
    openKeys();
  });

  /* ── 보일 때만 자동 갱신 (오피스 안 화면은 홈으로 나가도 살아 있어서 숨었는지 직접 본다) ── */
  function shown() {
    if (document.visibilityState === 'hidden') return false;
    try { const fe = window.frameElement; if (fe && !fe.getClientRects().length) return false; } catch (e) { /* 다른 출처 */ }
    return true;
  }
  function tick() {
    const vis = shown();
    S.shown = vis;
    if (!vis) return;
    paintStatus();
    if (sizeKey() !== S.size && grid.clientWidth) renderGrid({keep: true});
    else paintRows();
    if (!S.tabsOk) {   // 탭 목록을 아직 못 받음 (처음 · 연결 끊김) → 30초마다 다시
      if (!S.tabsBusy && Date.now() - (S.tabsTry || 0) > RETRY_MS) { S.tabsTry = Date.now(); loadTabs().catch(() => {}); }
      return;
    }
    if (Date.now() - S.pollAt >= POLL_MS - 500) poll();
    const s = S.st[S.cur];   // 받다가 실패한 탭은 30초 뒤 다시
    if (S.cur && !S.busy[S.cur] && s && s.k === 'err' && Date.now() - s.at > RETRY_MS) loadSheet(S.cur);
  }
  // 다른 사람이 고친 칸 · 함수 · 서식 · 탭 숨기기가 저장되면 바로 (실시간 알림선 office-live.js, 2026-11-23) — 끊기면 8초 확인으로
  let liveOn = false;
  function liveBoot() {
    if (liveOn || !window.OfficeLive) return;
    liveOn = true;
    OfficeLive.on(['mdx_rows', 'mdx_ofx', 'mdx_tabs'], () => {
      if (!shown() || !S.tabsOk) return;
      if (S.pollBusy) { setTimeout(() => { if (shown()) poll(); }, 700); return; }
      S.pollAt = 0;
      return poll();
    });
  }
  if (window.OfficeLive) liveBoot(); else { window.addEventListener('load', liveBoot); setTimeout(liveBoot, 5000); }
  setInterval(tick, 2000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(tick, 300); });
  let rzT = 0;
  window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(tick, 180); });
  narrow.addEventListener && narrow.addEventListener('change', () => {
    if (!narrow.matches) setNav(false);
    $('dscrim').hidden = !narrow.matches || $('detail').hidden;
    setFonts();   // 휴대폰 ↔ PC 글자 크기가 다르니 받아 둔 탭들 칸 너비를 다시 잰다
    S.cache.forEach(ent => { if (ent && ent.data && ent.data.parts) ent.data.parts.forEach(fitCols); });
    renderGrid({keep: true});
  });
  compactMQ.addEventListener && compactMQ.addEventListener('change', () => { if (!compactMQ.matches) setHmin(false); });

  /* ── 시작 — 지난번 탭은 탭 목록을 기다리지 않고 바로 읽는다 ── */
  (async function boot() {
    setDense(lsGet(LS_DENSE) === '1', false);
    if (lsGet(LS_SIDE) === '0') app.classList.add('side-off');
    S.showEmpty = lsGet(LS_EMPTY) === '1';
    S.showHid = lsGet(LS_HID) === '1';
    if (document.fonts && document.fonts.load) { try { document.fonts.load(F_CELL, '재고ABC123'); document.fonts.load(F_BOLD, '재고ABC123'); } catch (e) { /* noop */ } }
    let saved = null;
    try { saved = JSON.parse(lsGet(LS_TAB) || 'null'); } catch (e) { saved = null; }
    let want = null;
    try { want = new URLSearchParams(location.search).get('tab'); } catch (e) { want = null; }
    S.want = want;     // 탭 목록이 늦게(실패 뒤 다시) 읽혀도 같은 규칙으로 고른다 (loadTabs)
    S.saved = saved;
    renderGrid();
    // 지난번 탭 목록으로 메뉴를 바로 그리고 고른 탭을 연다 (저장본이 있으면 표도 바로) — 새 탭 목록은 뒤에서
    let known = null;
    try { known = JSON.parse(lsGet(LS_TABS) || 'null'); } catch (e) { known = null; }
    if (known && Array.isArray(known.tabs) && known.tabs.length) {
      S.books = (known.books || []).filter(bookVisible);
      const vis = new Set(S.books.map(b => b.book));
      S.tabs = known.tabs.filter(t => t && t.tk && t.book && vis.has(t.book)).map(t => mkTab({tk: t.tk, gid: t.gid, book: t.book, name: t.name, th: t.th}));
    }
    if (S.tabs.length) {
      const first = pickTab(want, saved);
      if (first && (!want || known)) openTab(first);
    }
    S.tabsTry = Date.now();
    try { await loadTabs(); }   // 보던 탭이 없거나 지워졌으면 loadTabs 가 고른다 (그 사이 사용자가 고른 탭은 그대로)
    catch (e) {
      S.st[S.cur || ''] = {k: 'err', err: e.message, at: Date.now()};
      paintStatus();
      if (!S.cur || !S.cache.get(S.cur)) showErr(e.message);
    }
  })();
})();
</script>
<script src="../office-live.js?v=1" defer></script><!-- 실시간 알림선 (office-live.js) -->
