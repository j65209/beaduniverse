<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>MD팀 시트 · 비드유니버스 오피스</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script>
  /* 오피스 잠금 연동 (erp/ 와 같은 방식) — 오피스에서 PIN 을 넣은 브라우저만 들어올 수 있음.
     오피스 MD팀 화면 맨 위(iframe, data-embed="md")에 들어가 있으면 '← 오피스 홈' 은 숨긴다 (오피스의 '홈' 단추가 바로 위에 있음).
     회사 주소(beaduniverse.kr/office/)에선 오피스가 이 HTML 을 받아 빈 iframe 에 직접 쓰므로 홈 주소는 부모(오피스)에서 얻는다. */
  (function () {
    var inOffice = false, home = '', emb = false;
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    try { emb = !!(window.frameElement && window.frameElement.getAttribute('data-embed') === 'md'); } catch (e) { /* 다른 출처 */ }
    if (emb) document.documentElement.classList.add('emb');
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    try { if (window.parent === window && localStorage.getItem('brightbeed_unlocked') !== '1') { location.replace(home + '?from=mdsheet'); return; } } catch (e) { /* noop */ }
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
    });
  })();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  /* MD팀 시트 — MD팀 구글시트들(주얼리 MD · MD 코페리 · MD 코즈미 · 에이블리 · 지그재그 가격표 · 발주 · 광고 · 디자인 · 벤더)을
     ERP전산팀(erp/)과 같은 업무 프로그램 화면으로. 오피스 MD팀 화면(#md) 맨 위 iframe (index.html mdxMount) · 이 주소를 바로 열어도 된다.
     · 2026-11-20 사용자 "주얼리엠디, 엠디코페리, 엠디코즈미 구글시트안에 있는 모든정보를 erp 전산팀과 동일한 디자인으로 오피스앱 엠디팀 최상단에" → 첫 판(구글 웹 보기를 바로 읽음).
     · 같은 날 "겹치는건 빼고 나머지는 위로" · "시트별로 즐겨찾기" · "함수 기능" · "구글시트 이제 안쓰고 엠디팀 시트를 쓸 수 있게" ·
       "구글시트 전부 이전이야. 1:1 뷰어 시스템은 이제 없앨거야" → 2판: erp/ 오피스 저장소판을 그대로 가져와
       · 자료는 오피스 저장소(Supabase mdx_books · mdx_tabs · mdx_rows)에서만 읽는다. 맥미니 md-db-sync(sixshop-collector md/md-db-sync.mjs)가
         1분마다 돌며 MD 시트는 3분 · 나머지는 15분마다 바뀐 줄만 맞춘다. 화면은 8초마다 바뀐 탭만 확인해 바뀐 줄만 받는다.
       · 원가 · 판매가 · 광고비가 들어 있어 저장소는 공개 anon 키로 못 읽는다 — 열쇠(비공개 brightbeed-reports office/mdx-key.json)를
         오피스의 PIN 프록시(ghFetch)로 받아 함수(mdx_meta · mdx_rows_get · mdx_poll · mdx_cell_edit)로만 읽고 쓴다. 이 브라우저에 기억.
       · 왼쪽 메뉴 = 즐겨찾기(★) → 묶음(MD 기본 시트 · 플랫폼 가격표 · 재고 · 발주 · 광고 · 디자인 · 벤더) → 시트(접기 · 펴기) → 탭.
         ERP MASTER 는 ERP전산팀 화면으로 바로 간다. 전략팀 시트 링크는 기밀 명단(대표 둘 · 지희선) PC 에만.
       · 기밀(같은 날 "단가, 가격, 링크정보 같은 기밀은 희선이랑 대표 2명만"): 명단 밖 PC 는 원가 · 단가 · 판매가 · 위안 · 마진 · 공급처 열과
         구글시트 · 공급처 링크를 표 · 상세 창 · 찾기 · 요약 카드 · 함수 줄에서 아예 뺀다 (매출 · 광고비는 그대로).
       · 고치기는 erp/ 와 같다 (PC 는 칸을 눌러 바로 · 휴대폰은 상세 창) — 고칠 수 있는 시트(브리지 book)만 · 관리자와 MD팀만.
         구글시트(브리지)에 먼저 쓰고 같은 줄을 저장소에도 (mdx_cell_edit). 끊는 날까지 원가 보고서 · 가격 감시가 구글시트를 읽기 때문.
       · 함수: 수식 칸은 상세 창 · 고칠 칸에 =E2*300 처럼 보이고, '=' 로 시작하게 적으면 함수로 저장된다 (브리지 버전 3 부터).
       · 새 줄: 제목 줄 '＋ 새 줄' — 마지막 줄 다음 줄에 적고, 그 줄의 수식(공급가 · 마진율 등)은 시트가 자동으로 계산.
       · MD 시트 아래쪽 '수식만 남은 빈 줄'은 표 · 개수에서 빼고, TOP 10 처럼 한 탭에 표가 여럿이면 '공홈 · 일별' 단추로 나눈다. */
  :root{
    --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --bg:#f3f5f8; --card:#fff; --line:#e3e8ef; --line-2:#edf1f5; --head:#f7f9fb;
    --text:#0f172a; --text-2:#334155; --text-3:#64748b; --text-4:#94a3b8;
    --accent:#16a34a; --accent-ink:#15803d; --accent-soft:#ecfdf3;
    --side:#0f172a; --side-text:#cbd5e1; --side-mute:#64748b;
    --danger:#dc2626; --warn:#d97706; --info:#2563eb;
    --row-h:34px; --side-w:224px; --detail-w:400px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
  /* 휴대폰: 두 번 눌러 확대 · 누를 때 회색 번쩍임 막기 (두 손가락 확대는 그대로), 끌어내려 새로고침 · 오피스 화면으로 스크롤이 넘어가는 것 막기 (overscroll) */
  html{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit}
  .app{height:100vh;height:100dvh;display:flex;overflow:hidden;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* ── 왼쪽 메뉴 ── */
  .side{flex:none;width:var(--side-w);display:flex;flex-direction:column;background:var(--side);color:var(--side-text)}
  .side-top{flex:none;display:flex;align-items:center;gap:11px;height:58px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
  .logo{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 2px 10px rgba(34,197,94,.35)}
  .logo svg{width:16px;height:16px;color:#fff}
  .side-top b{display:block;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .side-top small{display:block;margin-top:1px;font-size:11px;color:var(--side-mute)}
  .side-fold{flex:none;margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--side-mute)}
  .side-fold:hover{background:rgba(255,255,255,.08);color:#fff}
  .side-fold svg{width:17px;height:17px}
  /* 왼쪽 메뉴 접기 (PC) — 접으면 표가 그만큼 넓어지고, 위 막대의 ☰ 로 다시 편다 */
  .app.side-off .menu{display:grid}
  @media (min-width:1001px){ .app.side-off .side{display:none} }
  .nav{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:6px 10px 16px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
  .nav-sec{margin:16px 0 6px;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--side-mute)}
  .nav-item{position:relative;width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;text-align:left;color:var(--side-text)}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.on{background:rgba(34,197,94,.16);color:#fff;font-weight:700}
  .nav-item.on::before{content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#22c55e}
  .nav-item .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#475569}
  .nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item .nd{flex:none;font-size:11px;color:var(--side-mute);font-variant-numeric:tabular-nums}
  .nav-item.on .nd{color:#86efac}
  .side-foot{flex:none;padding:10px 10px 14px;border-top:1px solid rgba(255,255,255,.07)}
  .side-link{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--side-text);text-decoration:none}
  .side-link:hover{background:rgba(255,255,255,.06);color:#fff}
  .side-link svg{width:15px;height:15px;opacity:.8}
  .scrim,.dscrim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:45}
  .dscrim{z-index:39}   /* 상세 창(40) 아래 — 전엔 45 라 휴대폰에서 상세 창 위를 덮어, 창을 누르면 그냥 닫혔다 (2026-11-20) */

  /* ── 본문 ── */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:8px;height:58px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .menu{display:none}
  .find{flex:0 1 420px;min-width:0;display:flex;align-items:center;gap:7px;height:38px;padding:0 8px 0 13px;border-radius:10px;background:#f1f4f8;border:1px solid transparent;cursor:text}
  .find:focus-within{background:#fff;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .find svg{flex:none;width:16px;height:16px;color:var(--text-4)}
  .find input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:13.5px;color:var(--text)}
  .find input::-webkit-search-cancel-button{display:none}
  .qn{flex:none;font-size:12px;font-weight:700;color:var(--info);white-space:nowrap;font-variant-numeric:tabular-nums}
  .qx{flex:none;width:24px;height:24px;border-radius:50%;color:var(--text-4);font-size:12px}
  .qx:hover{background:#e2e8f0;color:var(--text)}
  .sp{flex:1;min-width:0}
  .st{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .st:hover{background:#f1f4f8;color:var(--text)}
  .st .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .st.is-load .dot{background:transparent;box-shadow:none;width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--accent);animation:spin .8s linear infinite}
  .st.is-stored{color:#b45309;background:#fffbeb}
  .st.is-err{color:#b91c1c}
  .st.is-err .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ib{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);text-decoration:none}
  .ib:hover{background:#f1f4f8;color:var(--text)}
  .ib.on{background:#e8f0fe;color:var(--info)}
  .ib svg{width:18px;height:18px}

  .head{flex:none;padding:14px 18px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
  .trow h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.025em}
  .date{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid #bbf7d0;border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .dates{display:flex;gap:6px;flex-wrap:wrap}
  .dates button{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .dates button:hover{border-color:#cbd5e1}
  .dates button.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
  .tools{display:flex;align-items:center;gap:8px;margin-left:auto}
  .etog{height:30px;padding:0 12px;border-radius:999px;border:1px dashed #cbd5e1;background:#fff;font-size:12px;color:var(--text-3);white-space:nowrap}
  .etog:hover{border-color:#94a3b8;color:var(--text)}
  .parts{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#f1f4f8}
  .parts button{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .parts button:hover{color:var(--text)}
  .parts button.on{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.12)}
  .alert{margin-top:12px;display:flex;gap:10px;padding:10px 13px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;line-height:1.6}
  .alert svg{flex:none;width:17px;height:17px;margin-top:1px;color:#d97706}
  .alert ul{margin:0;padding:0;list-style:none}
  .alert li+li{margin-top:2px}
  .al-more{display:none}   /* 휴대폰에서만 — 안내는 첫 줄만, 누르면 전부 */
  .kpis{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  .kpi{min-width:124px;height:62px;display:flex;flex-direction:column;justify-content:center;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;cursor:default}
  .kpi b{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--text)}
  .kpi b small{font-size:12px;font-weight:700;margin-left:2px;color:var(--text-3)}
  .kpi span{margin-top:3px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
  .kpi.click{cursor:pointer}
  .kpi.click:hover{border-color:#cbd5e1;background:#fafbfc}
  .kpi.red b{color:var(--danger)}
  .kpi.amber b{color:var(--warn)}
  .kpi.blue b{color:var(--info)}
  .kpi.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,163,74,.14);background:#fff}
  .chips{margin-top:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);white-space:nowrap}
  .chip:hover{border-color:#cbd5e1}
  .chip em{font-style:normal;font-size:11.5px;color:var(--text-4);font-variant-numeric:tabular-nums}
  .chip.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
  .chip.on em{color:#cbd5e1}

  /* ── 표 ── */
  .gwrap{flex:1;min-height:0;position:relative;background:var(--card)}
  .grid{position:absolute;inset:0;overflow:auto;outline:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .tbl{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;color:var(--text)}
  .tbl th{position:sticky;top:0;z-index:3;height:44px;padding:5px 8px;background:var(--head);color:var(--text-3);font-size:12px;font-weight:700;line-height:1.3;text-align:left;vertical-align:middle;white-space:normal;text-wrap:balance;overflow:hidden;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);cursor:pointer;user-select:none}
  .tbl th.ka{word-break:keep-all}   /* 띄어 쓴 머리글은 낱말 사이에서만 줄바꿈 ('남은 / 재고') */
  .tbl th:hover{color:var(--text)}
  .tbl th.sk{z-index:4}
  .tbl th .ar{margin-left:4px;font-size:9px;color:var(--accent)}
  .tbl th.fill,.tbl td.fill{padding:0;border-right:0;cursor:default}
  .tbl td{height:var(--row-h);padding:0 8px;background:#fff;border-bottom:1px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app.dense .tbl td{height:28px}
  .tbl .cl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal;line-height:1.25;word-break:keep-all;overflow-wrap:break-word}
  .app.dense .tbl .cl{-webkit-line-clamp:1}
  .tbl .r{text-align:left;font-variant-numeric:tabular-nums}   /* 2026-11-19 사용자 "전체 모두 좌측정렬" — 숫자 · 체크 · 사진 칸도 왼쪽 */
  .tbl .c{text-align:left}
  .tbl td.r,.tbl td.c,.tbl th.r,.tbl th.c{padding-left:6px;padding-right:6px}   /* 숫자 · 체크 칸은 좁게 (fitCols 의 여백과 같게) */
  .tbl .b{font-weight:700}
  /* 2026-11-20 사용자 "일반적인 숫자는 블랙으로 다 변경" — 0 · 마이너스 · 시트 글자색 모두 검정 (품절 · 임박은 줄 색으로) */
  .tbl td.r{color:#111827}
  .tbl .rn{color:var(--text-4);font-size:11.5px;text-align:left;font-variant-numeric:tabular-nums;padding:0 7px 0 3px}
  .tbl td.rn{cursor:pointer}
  @media (hover:hover){ .tbl td.rn:hover{color:var(--info);text-decoration:underline} }
  .tbl .sk{position:sticky;z-index:1}
  .tbl .skl{border-right:1px solid #d5dce5}
  .tbl tbody tr{cursor:pointer}
  @media (hover:hover){ .tbl tbody tr:not(.vsp):hover td{box-shadow:inset 0 0 0 999px rgba(15,23,42,.035)} }   /* 휴대폰은 누른 뒤 회색이 남지 않게 */
  /* 줄이 많은 탭은 보이는 줄 근처만 그리고, 위 · 아래는 빈 줄 하나(높이만)로 채운다 (renderGrid · paintRows) */
  .tbl tbody tr.vsp{cursor:default}
  .tbl tbody tr.vsp td{padding:0;border:0;background:transparent}
  .tbl tbody tr.on td{box-shadow:inset 0 0 0 999px rgba(37,99,235,.075)}
  .tbl tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--info),inset 0 0 0 999px rgba(37,99,235,.075)}
  /* 품절 임박 (남은 재고 10개 이하) · 품절 (0 이하) — 상품명 · 고정 칸까지 줄 전체 (2026-11-20 사용자 "제품명까지 칸 컬러 다 바꿔주고") */
  .tbl tbody tr.lv-low td:not(.fill){background:#fff1f2}
  .tbl tbody tr.lv-out td:not(.fill){background:#fde2e4}
  .tbl tbody tr.lv-low td.key,.tbl tbody tr.lv-out td.key{font-weight:700}
  .tbl tbody tr.lv-low td.rn,.tbl tbody tr.lv-out td.rn{box-shadow:inset 3px 0 0 #f87171}
  .tbl tbody tr.lv-out td.rn{box-shadow:inset 3px 0 0 #dc2626}
  .tbl td .blank{color:#dc2626;font-size:11.5px;font-weight:600}   /* 남은 재고 빈칸 = 세어서 적을 줄 */
  /* 엑셀처럼 고르기 · 고치기 (PC) — 고른 칸 파란 테두리, 저장 중 = 오른쪽 위 파란 점, 못 씀 = 빨간 점 */
  .tbl td.csel{box-shadow:inset 0 0 0 2px var(--info)!important}
  .tbl td.pend{position:relative}
  .tbl td.pend::after{content:'';position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:var(--info)}
  .tbl td.pend.fail::after{background:var(--danger)}
  .cedit{position:fixed;z-index:65;margin:0;padding:0 7px;border:2px solid var(--info);border-radius:2px;background:#fff;color:var(--text);font:400 13px var(--ui);line-height:1.35;outline:0;box-shadow:0 6px 18px rgba(15,23,42,.18);resize:none;overflow:hidden}
  textarea.cedit{padding:6px 7px;white-space:pre-wrap;overflow:auto}
  .cedit-tip{position:fixed;z-index:66;padding:3px 8px;border-radius:6px;background:#0f172a;color:#fff;font-size:11.5px;font-weight:600;line-height:1.4;white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(15,23,42,.2)}
  .cedit-tip.err{background:#b91c1c}
  /* 칸 너비 조절 — 머리글 오른쪽 끝을 끌기 (두 번 누르면 자동 너비) */
  .tbl th .rz{position:absolute;top:0;right:0;width:8px;height:100%;cursor:col-resize;z-index:2}
  .tbl th .rz::after{content:'';position:absolute;top:9px;bottom:9px;right:3px;width:2px;border-radius:1px;background:transparent}
  .tbl th:hover .rz::after{background:#cbd5e1}
  .tbl th .rz:hover::after{background:var(--info)}
  .tbl th.wfix{color:var(--text-2)}
  .rz-line{position:fixed;top:0;bottom:0;z-index:90;width:0;border-left:2px solid var(--info);pointer-events:none}
  .rz-tip{position:fixed;z-index:91;padding:3px 8px;border-radius:6px;background:var(--info);color:#fff;font-size:11.5px;font-weight:700;pointer-events:none;font-variant-numeric:tabular-nums}
  body.rz-drag,body.rz-drag *{cursor:col-resize!important;user-select:none!important}
  .tbl tr.empty td{height:120px;text-align:center;color:var(--text-4);cursor:default;box-shadow:none!important}
  .tbl tfoot td{position:sticky;bottom:0;z-index:2;height:36px;background:#f1f5f9;border-top:1px solid #cbd5e1;border-bottom:0;font-weight:700;font-variant-numeric:tabular-nums}
  .tbl tfoot td.sk{z-index:3}
  .tbl tfoot .ft{font-size:12px;color:var(--text-3);font-weight:700}
  .tag{display:inline-block;max-width:100%;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.4;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag+.tag{margin-left:4px}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.4;vertical-align:middle}
  .pill.red{background:#fef2f2;color:#b91c1c}
  .pill.gray{background:#f1f5f9;color:#475569}
  .pill.blue{background:#eff6ff;color:#1d4ed8}
  .pill-sub{margin-left:6px;font-size:12px;color:var(--text-3);vertical-align:middle}
  .pill-sub:first-child{margin-left:0}
  /* 날짜가 여러 번 적힌 칸(발주일 · 입고일) — 최근 것만 칸에, 그 전은 '이전 N회' 에 마우스 (오피스 물류팀 발주서 '이전 발주' 와 같은 방식) */
  .hchip{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;border:1px solid var(--line);background:#f8fafc;color:var(--text-3);font-size:11px;font-weight:600;line-height:1.45;vertical-align:middle;cursor:default}
  .hchip:hover{background:#eef2f7;color:var(--text);border-color:#cbd5e1}
  .hpop{position:fixed;z-index:70;min-width:210px;max-width:min(380px,calc(100vw - 16px));max-height:calc(100vh - 16px);overflow:auto;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 18px 48px rgba(15,23,42,.22),0 0 0 1px rgba(15,23,42,.03);font-size:12.5px;pointer-events:none}
  .hp-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:7px;margin-bottom:5px;border-bottom:1px solid var(--line-2);font-weight:700;color:var(--text)}
  .hp-h em{font-style:normal;font-weight:500;font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}
  .hp-r{display:grid;grid-template-columns:minmax(78px,auto) 64px 1fr;gap:8px;align-items:baseline;padding:5px 4px;border-radius:5px;font-variant-numeric:tabular-nums}
  .hp-r.on{background:var(--accent-soft)}
  .hp-d{font-weight:700;color:var(--text-2);white-space:nowrap}
  .hp-d small{margin-right:3px;font-size:10.5px;font-weight:500;color:var(--text-4)}
  .hp-d b{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;background:#dcfce7;color:var(--accent-ink);font-size:10.5px;font-weight:700}
  .hp-q{text-align:right;font-weight:700;color:var(--text);white-space:nowrap}
  .hp-n{color:var(--text-3);overflow-wrap:anywhere}
  .dl .hp-r{padding:3px 0;grid-template-columns:minmax(74px,auto) 60px 1fr}
  .ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#dcfce7;color:#15803d;vertical-align:middle}
  .ck svg{width:12px;height:12px}
  .ck0{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid #d5dce5;vertical-align:middle}
  .thumb{display:block;margin:2px 0;width:30px;height:30px;border-radius:6px;object-fit:cover;background:#f1f5f9;cursor:zoom-in}
  .app.dense .thumb{width:24px;height:24px;margin:1px 0}
  .lnk{color:var(--info);text-decoration:none}
  .lnk:hover{text-decoration:underline}
  mark{background:#fef08a;color:inherit;border-radius:2px;padding:0 1px}
  .skel{padding:6px 0}
  .skel div{display:flex;gap:22px;align-items:center;height:34px;padding:0 16px;border-bottom:1px solid var(--line-2)}
  .skel i{display:block;height:9px;border-radius:5px;background:#edf1f5}
  .msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));padding:22px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 12px 34px rgba(15,23,42,.14);font-size:13.5px;line-height:1.6;color:var(--text-2);z-index:20;text-align:center}
  .msg b{display:block;font-size:15.5px;color:var(--text);margin-bottom:6px}
  .msg button{margin-top:14px;height:36px;padding:0 18px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}

  /* ── 상세 창 (줄을 누르면) ── */
  .detail{position:fixed;top:0;right:0;bottom:0;z-index:40;width:var(--detail-w);max-width:100%;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 34px rgba(15,23,42,.1)}
  @media (min-width:1280px){ .app.has-detail .main{margin-right:var(--detail-w)} .detail{box-shadow:none} }
  .dh{flex:none;padding:14px 18px 14px;border-bottom:1px solid var(--line)}
  .dgrab{display:none;width:40px;height:5px;margin:0 auto 8px;border-radius:3px;background:#cbd5e1}   /* 휴대폰 — 잡고 끌어내리면 닫힘 */
  .dh-top{display:flex;align-items:center;gap:8px}
  .dh-cap{flex:1;font-size:12px;font-weight:700;color:var(--text-3)}
  .dh-top button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
  .dh-top button:hover{background:#f1f4f8;color:var(--text)}
  .dh-top svg{width:17px;height:17px}
  .d-title{margin-top:6px;font-size:18px;font-weight:800;line-height:1.35;letter-spacing:-.02em;word-break:break-word}
  .d-sub{margin-top:4px;font-size:12.5px;color:var(--text-3);line-height:1.5}
  .d-sheet{display:inline-flex;align-items:center;gap:5px;margin-top:10px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-2);text-decoration:none}
  .d-sheet:hover{border-color:#cbd5e1;color:var(--text)}
  .dbody{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:4px 18px 22px}
  .dl{display:grid;grid-template-columns:118px 1fr;margin:0}
  .dl dt{padding:10px 0;font-size:12.5px;color:var(--text-3);border-bottom:1px solid var(--line-2)}
  .dl dd{margin:0;padding:10px 0 10px 12px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line-2);word-break:break-word;white-space:pre-wrap}
  .dl dd.r{font-variant-numeric:tabular-nums;font-weight:700}
  .dl .none{color:var(--text-4)}
  .dl dt.iss,.dl dd.iss{color:#b91c1c;font-weight:600;background:#fff5f5}
  .dl dt.iss{padding-left:8px;border-radius:6px 0 0 6px}
  .msg .msg-2{background:#fff;color:var(--text-2);border:1px solid var(--line)}
  .dl .ckt{margin-left:4px;color:#15803d;font-weight:700}
  .dimg{display:block;max-width:100%;max-height:220px;border-radius:10px;background:#f1f5f9;cursor:zoom-in}
  .lb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(15,23,42,.82);cursor:zoom-out;padding:24px}
  .lb img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}

  /* ── 고치기 (표 칸 두 번 누르기 · 상세 창 값 누르기 → 구글시트에 바로) ── */
  .d-hint{margin-top:9px;font-size:11.5px;line-height:1.45;color:var(--text-4)}
  .d-hint.no{color:var(--warn)}
  .dl dd.ed-ok{cursor:text;position:relative;padding-right:52px}
  @media (hover:hover){
    .dl dd.ed-ok:hover{background:#f6f9ff;box-shadow:inset 0 0 0 1px #c7d7fe;border-radius:6px}
    .dl dd.ed-ok:hover::after{content:'✎ 고치기';position:absolute;right:6px;top:10px;font-size:11px;font-weight:700;color:var(--info);white-space:nowrap}
  }
  @media (hover:none){ .dl dd.ed-ok{padding-right:0} }
  .dl dd.ed-ro{cursor:default}
  .dl dd.ed-on{background:#eef4ff;box-shadow:inset 0 0 0 2px var(--info);border-radius:6px}
  .tbl td.ed-on{box-shadow:inset 0 0 0 2px var(--info)!important}
  .edbox{position:fixed;z-index:70;display:flex;flex-direction:column;gap:7px;padding:8px;border:2px solid var(--info);border-radius:10px;background:#fff;box-shadow:0 14px 34px rgba(15,23,42,.2)}
  .edbox .ed-cap{font-size:11.5px;font-weight:700;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .edbox input,.edbox textarea{width:100%;min-width:0;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font:inherit;font-size:14px;color:var(--text);background:#fff;outline:0;resize:vertical}
  .edbox input:focus,.edbox textarea:focus{border-color:var(--info);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .edbox input:disabled,.edbox textarea:disabled{background:#f6f8fa;color:var(--text-3)}
  .edbox .ed-row{display:flex;align-items:center;gap:6px}
  .edbox .ed-msg{flex:1;min-width:0;font-size:11.5px;line-height:1.4;color:var(--text-4)}
  .edbox .ed-msg.err{color:var(--danger);font-weight:600}
  .edbox .ed-msg.busy{color:var(--info);font-weight:600}
  .edbox button{flex:none;height:30px;padding:0 12px;border-radius:7px;font-size:12.5px;font-weight:700;white-space:nowrap}
  .edbox .ed-save{background:var(--info);color:#fff}
  .edbox .ed-save:disabled{opacity:.45;cursor:default}
  .edbox .ed-force{background:var(--danger);color:#fff}
  .edbox .ed-cancel{background:#f1f4f8;color:var(--text-2)}
  .toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:80;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 16px;border-radius:10px;background:#0f172a;color:#fff;font-size:13px;font-weight:600;line-height:1.45;box-shadow:0 12px 30px rgba(15,23,42,.25)}
  .toast.err{background:#b91c1c}
  /* 아이폰 · 아이패드는 16px 보다 작은 입력 칸을 누르면 화면을 확대해 버린다 (찾기 · 고치기 칸) */
  @media (max-width:720px),(pointer:coarse){ .find input,.edbox input,.edbox textarea{font-size:16px} }

  /* ── 좁은 화면 ── 2026-11-20 사용자 "모바일에서 조금 불안정하거나 최적화가 안 된 것 같아 — 완벽하게" */
  @media (max-width:1000px){
    /* 닫혀 있을 땐 그림자 · 보이기도 끈다 (전엔 화면 왼쪽 끝에 서랍 그림자가 늘 비쳤다) */
    .side{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility 0s linear .2s}
    .app.nav-open .side{transform:none;visibility:visible;transition:transform .2s ease;box-shadow:12px 0 34px rgba(15,23,42,.3)}
    .menu{display:grid}
  }
  /* 휴대폰 (세로) · 가로로 눕힌 휴대폰 — 위쪽은 작게, 표는 넓게 */
  @media (max-width:720px),(max-height:520px){
    .bar{height:52px;padding:0 8px;gap:4px}
    .find{flex:1 1 auto;height:38px}
    .st{padding:0 8px}
    .st #stText,#btnFull,#btnDense{display:none}
    .st.is-err #stText,.st.is-stored #stText{display:inline;font-size:11.5px}
    .head{padding:10px 12px}
    /* 제목 줄은 한 줄 (길면 … ), 날짜 단추는 그 아래 한 줄로 옆으로 넘김 */
    .trow{display:grid;grid-template-columns:minmax(0,max-content) auto 1fr auto;align-items:center;gap:8px;min-height:28px}
    .trow h1{grid-column:1;grid-row:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .trow h1 .t2{display:none}
    .date{grid-column:2;grid-row:1;padding:2px 8px;font-size:11.5px}
    .tools{grid-column:4;grid-row:1;margin-left:0;gap:6px}
    .etog{height:28px;padding:0 10px;font-size:11.5px}
    .parts button{height:26px;padding:0 10px;font-size:12px}
    .dates{grid-column:1/-1;grid-row:2;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
    .dates::-webkit-scrollbar{display:none}
    .dates:empty{display:none}
    .dates button{flex:none;height:30px}
    .alert{margin-top:10px;padding:8px 11px;font-size:12px;line-height:1.5;cursor:pointer}
    .alert ul{flex:1;min-width:0}
    .alert.fold li+li{display:none}
    .alert.fold li{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
    .al-more{display:block;flex:none;align-self:center;font-size:11.5px;font-weight:700;color:#b45309;white-space:nowrap}
    .kpis{flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none;margin:7px -12px -3px;padding:3px 12px}
    .kpis::-webkit-scrollbar{display:none}
    .kpi{flex:none;min-width:96px;height:52px;padding:0 12px;border-radius:11px}
    .kpi b{font-size:17px}
    .kpi span{font-size:11px}
    .chips{margin:10px -12px 0;padding:0 12px}
    .chip{height:32px}
    /* 표를 아래로 넘기면 위쪽(안내 · 요약 카드 · 칩 · 날짜)을 접어 표를 넓게 — 맨 위로 오거나 제목 줄을 누르면 다시 편다 (headScroll) */
    .app.hmin .head{padding-top:8px;padding-bottom:8px;cursor:pointer}
    .app.hmin .alert,.app.hmin .kpis,.app.hmin .chips,.app.hmin .dates{display:none}
  }
  @media (max-width:720px){
    :root{--row-h:42px}
    /* 상세 창 = 아래에서 올라오는 판 — 위 손잡이를 끌어내리면 닫힘 */
    .detail{top:auto;left:0;width:100%;height:80vh;height:80dvh;border-left:0;border-radius:18px 18px 0 0;box-shadow:0 -14px 34px rgba(15,23,42,.2);padding-bottom:env(safe-area-inset-bottom);animation:sheetUp .22s cubic-bezier(.2,.8,.2,1)}
    .dh{padding:8px 16px 12px;touch-action:none}
    .dgrab{display:block}
    .dh-top button{width:38px;height:38px}
    .d-title{font-size:17px}
    .dbody{padding:2px 16px 20px}
    .dl{grid-template-columns:104px 1fr}
    .dl dt{padding:12px 0}
    .dl dd{padding:12px 0 12px 12px}
  }
  @keyframes sheetUp{from{transform:translateY(100%)}}
  @media (prefers-reduced-motion:reduce){ .detail{animation:none} }
  @media (pointer:coarse){   /* 손가락으로 누르기 좋게 */
    .nav-item{height:44px;font-size:14.5px}
    .side-link{height:42px;font-size:13.5px}
    .ib{width:40px;height:40px}
  }

  /* ── MD팀 시트 전용 ── */
  html.emb .side-link.home{display:none}   /* 오피스 MD팀 화면 안 — 오피스의 '홈' 단추가 바로 위에 있다 */
  .nav-gt{margin:18px 0 4px;padding:0 10px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#475569;text-transform:uppercase}
  .nav-gt:first-child{margin-top:8px}
  button.nav-sec{display:flex;align-items:center;gap:6px;width:100%;height:26px;margin:6px 0 2px;border-radius:6px;text-align:left}
  button.nav-sec:hover{color:var(--side-text);background:rgba(255,255,255,.04)}
  .nav-sec .cv{flex:none;width:12px;height:12px;transition:transform .15s ease}
  .nav-grp.off .nav-sec .cv{transform:rotate(-90deg)}
  .nav-sec .bd{flex:none;width:7px;height:7px;border-radius:50%}
  .nav-sec .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--side-text)}
  .nav-sec em{flex:none;font-style:normal;font-weight:500;font-size:11px;font-variant-numeric:tabular-nums}
  .nav-grp.off .nav-item:not(.on){display:none}
  .nav-item.empty .nm{color:var(--side-mute)}
  .nav-item .fv{flex:none;width:18px;text-align:center;font-size:13px;line-height:1;color:var(--side-mute);opacity:0}
  .nav-item:hover .fv,.nav-item .fv.on{opacity:1}
  .nav-item .fv.on{color:#fbbf24}
  .nav-item .fv:hover{color:#fde68a}

  try { S.fav = JSON.parse(localStorage.getItem(LS_FAV) || '[]') || []; } catch (e) { S.fav = []; }
  try { S.fold = JSON.parse(localStorage.getItem(LS_FOLD) || '{}') || {}; } catch (e) { S.fold = {}; }
  try { S.counts = JSON.parse(localStorage.getItem(LS_COUNTS) || '{}') || {}; } catch (e) { S.counts = {}; }

  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 저장 못 해도 화면은 그대로 */ } };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pad2 = n => String(n).padStart(2, '0');
  const hhmm = t => { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
  const colName = i => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
  const norm = s => String(s || '').replace(/\s+/g, '');
  const fmt = n => Number.isInteger(n) ? n.toLocaleString('ko-KR') : n.toLocaleString('ko-KR', {maximumFractionDigits: 2});
  const tabOf = gid => S.tabs.find(t => t.gid === gid);
  const bookOf = k => S.books.find(b => b.book === k) || null;
  const vstate = () => S.view[S.cur] || (S.view[S.cur] = {sort: null, cat: null, kpi: null, part: 0});
  const curAll = () => { const c = S.cache.get(S.cur); return c && c.data ? c.data : null; };
  const curData = () => { const all = curAll(); return all ? all.parts[Math.min(vstate().part || 0, all.parts.length - 1)] : null; };
  function numOf(s) {
    const t = String(s || '').replace(/[,\s]/g, '').replace(/^[₩￦$￥¥]/, '').replace(/(원|개)$/, '');
    return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : null;
  }

  /* ── 탭 → 메뉴 자리 (시트 · 점 색). raw = 판매원본처럼 날마다 쌓이는 원본 (처음엔 최근 줄이 위로) ── */
  function classify(name, book) {
    const n = String(name || '').trim();
    const dot = TAB_DOTS.find(x => x.re.test(n));
    return {sec: book || '', label: n, key: `${book}:${n}`, date: '', color: dot ? dot.color : (BOOK_COLOR[book] || '#64748b'), raw: /판매원본|TOP\s*10|월별\s*판매/i.test(n)};
  }
  const mkTab = x => ({gid: x.tk, sgid: String(x.gid), book: x.book, name: String(x.name || ''), meta: classify(x.name, x.book), info: x.info || null});

  /* ── 함수(수식) 보이기 — 저장소엔 구글 R1C1 수식이 있다 (맥미니가 브리지로 읽어 둠). 그 칸 기준 A1 로 (=R[0]C5*300 → =$E2*300) ── */
  const colA = n => { let s = ''; for (; n > 0; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; };
  const R1C1 = /(?<![A-Za-z0-9_.$])(R(\[-?\d+\]|\d+)?)?(C(\[-?\d+\]|\d+)?)?(?![A-Za-z0-9_(.])/g;
  function rcPart(tok, base) { const m = tok.slice(1); if (!m) return {n: base, abs: false}; if (m[0] === '[') return {n: base + Number(m.slice(1, -1)), abs: false}; return {n: Number(m), abs: true}; }
  function r1c1ToA1(f, row, col) {   // row · col = 그 칸 (1부터). 글자("…") · 시트 이름('…') 안은 그대로
    if (typeof f !== 'string' || f[0] !== '=') return f;
    return f.split(/("(?:[^"]|"")*"|'(?:[^']|'')*')/).map((s0, k) => k % 2 ? s0 : s0.replace(R1C1, (all, R, r, C, c) => {
      if (!R && !C) return all;
      if (R && C) { const a = rcPart(R, row), b = rcPart(C, col); return (b.abs ? '$' : '') + colA(b.n) + (a.abs ? '$' : '') + a.n; }
      if (C) { const b = rcPart(C, col); return (b.abs ? '$' : '') + colA(b.n); }
      const a = rcPart(R, row); return (a.abs ? '$' : '') + a.n;
    })).join('');
  }
  // 그 칸의 수식 (A1) — 없으면 '' (info.fx = [[열, 시작줄, 끝줄, 수식 번호]] 0부터, info.fx_list = R1C1 수식들)
  function fxText(info, r, p) {
    if (!info || !Array.isArray(info.fx) || !Array.isArray(info.fx_list)) return '';
    const run = info.fx.find(x => x[0] === p && r - 1 >= x[1] && r - 1 <= x[2]);
    const f = run && run.length > 3 ? info.fx_list[run[3]] : '';
    return f ? r1c1ToA1(f, r, p + 1) : '';
  }
  // =IMAGE("주소") · =IMAGE(옆 칸) → 사진 주소 (칸을 가리키면 그 칸 값). getV(r, p) = 그 칸 값 (r 1부터 · p 0부터)
  function imageSrc(f, row, col, getV) {
    const m = String(f || '').match(/^=\s*IMAGE\s*\(\s*(?:"([^"]+)"|R(\[-?\d+\]|\d+)?C(\[-?\d+\]|\d+)?)/i);
    if (!m) return '';
    if (m[1]) return /^https?:\/\//i.test(m[1]) ? m[1] : '';
    const v = String(getV(rcPart('R' + (m[2] || ''), row).n, rcPart('C' + (m[3] || ''), col).n - 1) || '');
    return /^https?:\/\//i.test(v) ? v : '';
  }

  /* ── 오피스 저장소 (Supabase) — 시간 제한 · 잠깐 막힘(429 · 5xx)은 쉬었다 다시 · 연결 끊김은 한 번 더 ── */
  const sbH = extra => Object.assign({apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, 'Content-Type': 'application/json'}, extra || {});
  async function sbFetch(path, opt) {
    for (let i = 0; ; i++) {
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), TIMEOUT_MS);
      try {
        const r = await fetch(`${SB_URL}/rest/v1/${path}`, Object.assign({headers: sbH(), cache: 'no-store', signal: ac.signal}, opt || {}));
        if ((r.status === 429 || r.status >= 500) && i < 2) { await sleep(800 * (i + 1)); continue; }
        const text = await r.text();
        if (!r.ok) {
          let m = '';
          try { m = JSON.parse(text).message || ''; } catch (e) { m = text.slice(0, 120); }
          throw Object.assign(new Error(m || 'db_' + r.status), {fatal: true, status: r.status});
        }
        return text ? JSON.parse(text) : null;
      } catch (e) {
        if (e.fatal) throw e;
        if (i < 1) { await sleep(900); continue; }
        throw new Error(e && e.name === 'AbortError' ? 'timeout' : 'network');
      } finally { clearTimeout(timer); }
    }
  }
  const sbRpc = (fn, body) => sbFetch(`rpc/${fn}`, {method: 'POST', body: JSON.stringify(body || {})});
  // 열쇠 — 이 브라우저에 기억해 둔 것 → 없으면 오피스(부모 창)의 PIN 프록시로 비공개 레포에서 받는다. 오피스 밖(주소로 바로)에서 처음이면 못 받음
  let keyP = null;
  function getKey(fresh) {
    if (!fresh) { const k = lsGet(LS_KEY); if (k && k.length >= 32) return Promise.resolve(k); }
    if (keyP) return keyP;
    keyP = (async () => {
      let gf = null;
      try { gf = window.parent && window.parent !== window && typeof window.parent.ghFetch === 'function' ? window.parent.ghFetch : null; } catch (e) { gf = null; }
      if (!gf) throw new Error('no_key');
      const r = await gf(KEY_PATH, {headers: {Accept: 'application/vnd.github.raw+json'}, cache: 'no-store'});
      if (!r.ok) throw new Error('no_key');
      let j = await r.json();
      if (j && typeof j.content === 'string' && j.encoding === 'base64') j = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, '')), c => c.charCodeAt(0))));
      if (!j || typeof j.key !== 'string' || j.key.length < 32) throw new Error('no_key');
      lsSet(LS_KEY, j.key);
      return j.key;
    })().finally(() => { keyP = null; });
    return keyP;
  }
  // 열쇠가 바뀌었으면(denied) 한 번 새로 받아 다시
  async function mdx(fn, body) {
    let key = await getKey(false);
    try { return await sbRpc(fn, Object.assign({p_key: key}, body || {})); }
    catch (e) {
      if (!/denied/.test((e && e.message) || '')) throw e;
      key = await getKey(true);
      return sbRpc(fn, Object.assign({p_key: key}, body || {}));
    }
  }

  /* ── 시트 · 탭 목록 = 저장소 mdx_meta (맥미니가 시트마다 5 · 15분마다 시트 메뉴와 맞춤) ── */
  function loadTabs() {
    if (S.tabsBusy) return S.tabsBusy;
    S.tabsBusy = (async () => {
      try {
        const j = await mdx('mdx_meta');
        const books = (j && j.books || []).filter(b => !b.admin || lsGet('brightbeed_role') === 'master');
        if (!books.length || !(j.tabs || []).length) throw new Error('no_tabs');
        S.books = books;
        S.booksOk = true;
        const live = new Set(books.map(b => b.book));
        const out = (j.tabs || []).filter(x => live.has(x.book)).map(x => {
          const prev = tabOf(x.tk), info = Object.assign({}, x);
          if (prev && prev.info && prev.info.fx && prev.info.fxVer === x.ver) { info.fx = prev.info.fx; info.fx_list = prev.info.fx_list; info.fxVer = x.ver; }
          return mkTab({tk: x.tk, gid: x.gid, book: x.book, name: x.name, info});
        });
        S.tabs = out;
        S.tabsAt = Date.now();
        S.tabsOk = true;
        out.forEach(t => { S.synced[t.gid] = t.info.synced_at; });
        S.pollMax = Math.max(S.pollMax, +j.max || 0);
        lsSet(LS_TABS, JSON.stringify({books: books.map(b => ({book: b.book, title: b.title, grp: b.grp, pos: b.pos, edit: b.edit})),
          tabs: out.map(t => ({tk: t.gid, gid: t.sgid, book: t.book, name: t.name}))}));   // 다음에 열 때 메뉴를 바로 그린다
        const liveTk = new Set(out.map(t => t.gid));
        if (!S.pruned) { S.pruned = true; store.keys().then(ks => (ks || []).forEach(g => { if (!liveTk.has(String(g))) store.del(g); })); }   // 지워진 탭의 저장본
        if (Object.keys(S.counts).some(k => !liveTk.has(k))) { Object.keys(S.counts).forEach(k => { if (!liveTk.has(k)) delete S.counts[k]; }); lsSet(LS_COUNTS, JSON.stringify(S.counts)); }
        loadStrat();
        if (canEdit()) bridgeVer().catch(() => {});   // 함수 입력이 되는 브리지인지 미리 (고칠 수 있는 사람만)
        if (!S.cur) { hideMsg(); openTab(pickTab(S.want, S.saved)); }                       // 처음 · 실패 뒤 다시 읽힘
        else if (!tabOf(S.cur)) openTab(pickTab(null, {book: S.lastBook, name: S.lastName}));   // 보던 탭이 지워짐
        else { renderNav(); renderHead(); saveTab(); syncCur(); }
        const cc = S.cache.get(S.cur);
        if (cc && !cc.stored) prefetch();   // 보던 탭이 먼저 받아졌으면 이제 미리 받기 시작
        return out;
      } finally { S.tabsBusy = null; }
    })();
    return S.tabsBusy;
  }
  // 열 탭 고르기 — 주소 ?tab= (tk 또는 탭 이름) → 지난번 탭 → 첫 시트의 Product List
  function pickTab(want, saved) {
    const tabs = S.tabs;
    if (!tabs.length) return '';
    if (want) {
      const w = String(want);
      const t = tabs.find(x => x.gid === w) || tabs.find(x => x.name === w) || tabs.find(x => x.name.includes(w));
      if (t) return t.gid;
    }
    if (saved) {
      const t = tabs.find(x => x.gid === saved.tk) || tabs.find(x => x.book === saved.book && x.name === saved.name) || (saved.book ? tabs.find(x => x.book === saved.book) : null);
      if (t) return t.gid;
    }
    const b0 = S.books[0];
    return (tabs.find(x => b0 && x.book === b0.book && /^product\s*list$/i.test(x.name)) || tabs.find(x => /^product\s*list$/i.test(x.name)) || tabs[0]).gid;
  }
  // 전략팀 시트 링크 (기밀 명단 PC 만 · 저장소에 넣지 않고 오피스 PIN 프록시로 링크만) — 오피스 MD팀 구글시트 모음에 있던 것
  let stratP = null;
  function loadStrat() {
    if (!secretOk() || stratP) return;
    stratP = (async () => {
      let gf = null;
      try { gf = window.parent && window.parent !== window && typeof window.parent.ghFetch === 'function' ? window.parent.ghFetch : null; } catch (e) { gf = null; }
      if (!gf) return;
      const r = await gf(STRAT_PATH, {headers: {Accept: 'application/vnd.github.raw+json'}, cache: 'no-store'});
      if (!r.ok) return;
      let j = await r.json();
      if (j && typeof j.content === 'string' && j.encoding === 'base64') j = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, '')), c => c.charCodeAt(0))));
      S.strat = (j && j.groups || []).flatMap(g => (g.items || []).filter(it => it && /^https:\/\/docs\.google\.com\//.test(String(it.url || ''))).map(it => ({title: it.title || it.name || '전략팀 시트', url: it.url})));
      renderNav();
    })().catch(() => {});
  }

  /* ── 8초마다 바뀐 탭만 확인 (mdx_poll) — 줄이 바뀐 탭은 바뀐 줄만, 탭 정보(이름 · 순서 · 수식 칸)나 시트 목록이 바뀌면 목록을 다시 ── */
  async function poll() {
    if (S.pollBusy) return;
    S.pollBusy = true;
    S.pollAt = Date.now();
    try {
      const j = await mdx('mdx_poll', {p_since: S.pollMax || 0, p_tk: S.cur || null});
      S.pollErr = 0;
      if (j.now) S.skew = Date.parse(j.now) - Date.now();   // 이 PC 시계와 서버 시계 차이 (맞춤 시각 '몇 분 전' 계산용)
      Object.assign(S.synced, j.synced || {});
      let meta = false;
      for (const x of j.tabs || []) {
        const t = tabOf(String(x.tk));
        if (!t || !t.info) { meta = true; continue; }   // 새 탭 · 지워진 탭
        if (+x.ver !== +t.info.ver) meta = true;
        if (+x.rows_ver !== +t.info.rows_ver) t.info.rows_ver = +x.rows_ver;
      }
      if (+j.books_ver && +j.books_ver !== +S.booksVer) { if (S.booksVer) meta = true; S.booksVer = +j.books_ver; }
      S.pollMax = Math.max(S.pollMax, +j.max || 0);
      if (meta) loadTabs().catch(() => {});
      syncCur();
    } catch (e) {
      S.pollErr++;
    } finally {
      S.pollBusy = false;
      paintStatus();
    }
  }
  // 보고 있는 탭이 저장소보다 뒤처졌으면 받는다 (바뀐 줄만 — 10분마다 한 번은 전체)
  function syncCur() {
    const t = tabOf(S.cur), c = S.cache.get(S.cur);
    if (!t || !t.info || S.busy[S.cur]) return;
    if (!c || c.stored || c.rowsVer < +t.info.rows_ver || Date.now() - (S.fullAt[S.cur] || 0) > FULL_MS) loadSheet(S.cur);
  }

  /* ── 한 탭 줄 받기 — mdx_rows_get (줄 = 시트 한 줄, v = 칸 표시값). 처음 · 10분마다 전체(수식 칸 정보도), 그 사이엔 바뀐 줄(ver)만 ── */
  const asRow = x => ({r: x.r, v: x.v, src: x.by ? 'office' : 'sheet', edited_by: x.by || null, edited_at: null, ver: x.ver, deleted_at: x.d ? 'd' : null});
  async function fetchAllRows(gid) {
    const out = [];
    for (let after = 0, first = true; ; first = false) {
      const j = await mdx('mdx_rows_get', {p_tk: gid, p_since: 0, p_after: after, p_limit: 4000, p_fx: first});
      if (first) {   // 수식 칸 (맥미니가 브리지로 읽어 둔 것) — 고치기 막기 · 함수 보이기 · IMAGE 사진
        const t = tabOf(gid);
        if (t && t.info) { t.info.fx = j.fx || null; t.info.fx_list = j.fx_list || null; t.info.fxVer = t.info.ver; }
      }
      (j.rows || []).forEach(x => out.push(asRow(x)));
      if (!j.more || !(j.rows || []).length) return out;
      after = j.rows[j.rows.length - 1].r;
    }
  }
  async function fetchChangedRows(gid, since) {
    const out = [];
    for (let after = 0; ;) {
      const j = await mdx('mdx_rows_get', {p_tk: gid, p_since: since, p_after: after, p_limit: 4000, p_fx: false});
      (j.rows || []).forEach(x => out.push(asRow(x)));
      if (!j.more || !(j.rows || []).length) return out;
      after = j.rows[j.rows.length - 1].r;
    }
  }

  /* ── 줄 → 칸 자료 (표 그리기 · 고치기가 쓰는 모양) ──
     체크박스 = 값이 TRUE/FALSE 뿐인 열, 주소 = 링크(사진 주소 열은 작은 사진), 맨 위 ⚠ 한 칸짜리 긴 글 = 안내 줄(시트에선 병합).
     가린 개인정보 칸(pii)은 고치기를 막는다. 시트 글자색 · 칸 색은 쓰지 않는다 (2026-11-20 — 숫자는 검정, 색은 품절 · 임박만) */
  const NOSTYLE = {};
  const hasVal = c => !!c && (c.t !== '' || c.chips.length > 0 || c.cb === 2 || !!c.img);
  const IMG_URL_RE = /^https?:\/\/\S+\.(jpe?g|png|webp|gif)(\?\S*)?$|^https?:\/\/([\w-]+\.)*alicdn\.com\/\S+$/i;
  function modelFromRows(tab, rows) {
    const info = (tab && tab.info) || {}, sec = secretOk();
    let n = +info.n_cols || 0;
    rows.forEach(x => { if (x.v.length > n) n = x.v.length; });
    n = Math.max(n, 1);
    const cols = Array.from({length: n}, (_, i) => ({i, l: colName(i)}));
    const ck = new Array(n).fill(false), imgCol = new Array(n).fill(false);
    for (let p = 0; p < n; p++) {
      let tf = 0, other = 0, img = 0, url = 0;
      for (const x of rows) {
        const t = x.v[p];
        if (t == null || t === '') continue;
        if (t === 'TRUE' || t === 'FALSE') tf++;
        else { other++; if (/^https?:\/\//i.test(t)) { url++; if (IMG_URL_RE.test(t)) img++; } }
      }
      ck[p] = tf > 0 && tf >= (tf + other) * 0.8;
      imgCol[p] = img > 0 && img >= url * 0.8 && img >= other * 0.6;
    }
    const pii = new Set(info.pii_cols || []), piiFrom = info.pii_from || 1;
    const mrows = rows.map(x => ({r: x.r, ed: x.src === 'office' && x.edited_by ? {by: x.edited_by, at: x.edited_at} : null, cells: Array.from({length: n}, (_, p) => {
      const raw = x.v[p] == null ? '' : String(x.v[p]);
      const c = {p, cs: 1, rs: 1, r: x.r, st: NOSTYLE, t: raw, chips: [], cb: 0, img: '', href: ''};
      if (ck[p] && (raw === 'TRUE' || raw === 'FALSE')) { c.cb = raw === 'TRUE' ? 2 : 1; c.t = ''; }
      else if (/^https?:\/\/\S+$/i.test(raw)) {
        if (!sec && SECRET_LINK_RE.test(raw)) { c.sl = 1; c.t = ''; }   // 기밀 명단 밖 — 공급처 · 구글시트 링크는 아예 안 둔다
        else { c.href = raw; if (imgCol[p]) c.img = raw; }
      }
      if (pii.size && pii.has(p) && x.r >= piiFrom) c.pii = 1;
      return c;
    })}));
    for (const row of mrows.slice(0, 3)) {
      const ne = row.cells.filter(hasVal);
      if (ne.length === 1 && ne[0].p === 0 && (/^⚠/.test(ne[0].t) || ne[0].t.length > 40)) ne[0].cs = n; else break;
    }
    // =IMAGE(…) 수식 칸 — 저장소엔 빈칸으로 오니 수식이 가리키는 칸(사진 주소)이나 주소 글로 사진을 보여 준다
    if (Array.isArray(info.fx) && Array.isArray(info.fx_list)) {
      const byR = new Map(mrows.map(x => [x.r, x]));

  /* ── 개인정보 가리기 — 날짜별 주문 원본 탭(코페리11.19 · 야르11.19 …)의 주문자 이름 등. 머리글(위 6줄 안) 이름으로 칸을 찾는다 ── */
  const PII = [
    ['name', /^(주문자|수령인|수취인|구매자|주문인|받는(분|사람|이)|고객|보내는(분|사람|이)|발송인)(이름|명|성명)?$/],
    ['phone', /(연락처|전화|휴대폰|핸드폰|휴대전화)/],

    phone: s => { const n = (s.match(/\d/g) || []).length; let i = 0; return s.replace(/\d/g, d => (++i <= 3 || i > n - 4) ? d : '*'); },

    mail: s => s.replace(/^([^@]{0,2})[^@]*@/, '$1***@'),
  };
  function maskPII(rows) {
    const cols = {};
    rows.slice(0, 6).forEach((row, i) => row.cells.forEach(c => {
      const t = c.t.replace(/\s+/g, '');
      if (!t || t.length > 12 || cols[c.p]) return;
      const hit = PII.find(x => x[1].test(t));
      if (hit) cols[c.p] = {kind: hit[0], from: i + 1};

      if (!c.t) return;

  }

  /* ── 칸 자료 → 업무 표 ──
     맨 위 ⚠ 줄(여러 열에 걸친 긴 글) = 안내, 그다음 이름 줄 = 열 머리글, 나머지 = 자료 (빈 줄은 뺌).

  // 빈 열로 떨어진 옆 표(구글시트 피벗 집계 등)는 따로 뗀다 — 내용이 가장 많은 덩어리가 본 목록, 나머지는 '집계 표' 단추로

    model.rows.forEach(row => row.cells.forEach(c => {
      if (c.t === '' && !c.chips.length && !c.cb && !c.img) return;
      const span = c.cs >= 4 ? 1 : c.cs;   // 여러 열에 걸친 ⚠ 안내 줄은 표를 잇지 않는다
      for (let x = c.p; x < Math.min(n, c.p + span); x++) used[x]++;
    }));
    const runs = [];
    let s = -1, cnt = 0;
    for (let p = 0; p <= n; p++) {
      if (p < n && used[p]) { if (s < 0) { s = p; cnt = 0; } cnt += used[p]; }
      else if (s >= 0) { runs.push({a: s, b: p - 1, cnt}); s = -1; }
    }

    // 제목 · 조건 줄('주문일 2026. 9. 1')은 맨 왼쪽 표 위에만 있으니 같은 제목 아래 오른쪽 표들은 왼쪽 것을 이어받는다

      const g = lines.map(s => (s.match(/\(([^()]{1,8})\)\s*$/) || [])[1]).filter(Boolean).pop();
      if (g) grp = g;
      const own = lines.filter(s => !isBr(s));
      if (own.length) note = own.join(' · ');
      d.note = note;
      const br = lines.filter(isBr).map(s => s.slice(1, -1)).pop();
      d.label = br ? (grp ? `${br} · ${grp}` : br) : '';

    const parts = [built[runs.indexOf(main)], ...built.filter((d, k) => runs[k] !== main)];

  }
  function buildData(model, tab, pa, pb, side) {
    const meta = tab ? (tab.meta || classify(tab.name, tab.book)) : classify('', '');
    const rows = model.rows.map(row => ({r: row.r, cells: row.cells.filter(c => c.p >= pa && c.p <= pb)}));
    const grid2 = rows.map(() => []);
    rows.forEach((row, ri) => row.cells.forEach(c => {
      grid2[ri][c.p] = c;
      for (let y = 1; y < c.rs && ri + y < rows.length; y++) if (!grid2[ri + y][c.p]) grid2[ri + y][c.p] = c;   // 세로 병합 = 아래 줄에도 같은 값
    }));
    let i = 0;
    const banner = [];
    while (i < Math.min(3, rows.length)) {   // 맨 위 안내 줄 = 한 칸짜리 ⚠ · ※ · ** 글이나 아주 긴 글 (짧은 제목 · 날짜는 아래 설명 줄로)
      const ne = rows[i].cells.filter(hasVal);
      if (ne.length === 1 && (/^\s*(⚠|※|\*\*|!)/.test(ne[0].t) || ne[0].t.length > 40)) { banner.push(ne[0].t); i++; } else break;
    }
    // 머리글 = 처음 몇 줄 가운데 이름 칸(짧은 글)이 가장 많은 줄. 그 위 줄들(표 제목 · '주문일 2026. 9. 1' · '[공홈]' 같은 조건 줄)은 표 설명으로
    // (옆 표는 시트 아래쪽에서 시작하기도 한다 · 피벗의 '주문수량의 SUM · 쇼핑몰' 줄도 설명)

      else if (texts.length && nums >= texts.length * 0.8 && !ID_RE.test(name) && !texts.some(t => t.replace(/\D/g, '').length >= 9)) type = 'num';
      else if (texts.length && texts.filter(t => DATE_RE.test(t)).length >= texts.length * 0.8) type = 'date';   // 값 전체가 날짜일 때만 ('2026-09-30 1000개' 는 글)
      else if (texts.length && ID_RE.test(name)) type = 'id';

        link: filled.length > 0 && filled.filter(c => c.href).length >= filled.length * 0.5,
        align: type === 'num' ? 'r' : (type === 'check' || type === 'img') ? 'c' : '',

        if (c.t) vals.push(norm(c.t));
        const hx = col.hist && hxOf(c);
        if (hx) txt += ' ' + hx.all.map(histText).join(' ');   // '9/30' 으로 찾아도 나오게

    });
    // 판매원본처럼 날마다 아래로 쌓이는 탭은 최근 줄이 위로 (머리글을 눌러 다른 순서로 볼 수 있다)

    const keyIdx = cols.findIndex(c => c.key);

      // 상품명이 아직 없는 줄이 많은 탭(메인 미발매 · 발주 리스트 등 — 이름 정하기 전 상품)은 '줄'로 센다

      else kpis.push({id: '', label: '줄', val: outRows.length, sub: `상품명 있는 줄 ${fmt(named)}`});
      const noYuan = row => isItem(row) && val(row, cYuan) === '';
      if (cnt(noYuan)) kpis.push({id: 'yuan', label: `${cYuan.name} 빈칸`, tone: 'amber', val: cnt(noYuan), pred: noYuan});
      const cMemo = cols.find(c => /단가메모/.test(norm(c.name)));
      if (cMemo) { const warn = row => /⚠|미기재/.test(val(row, cMemo)); if (cnt(warn)) kpis.push({id: 'memo', label: '단가 확인 필요', tone: 'amber', val: cnt(warn), pred: warn}); }

      if (cMoney) kpis.push({label: `${cMoney.name} 합계`, unit: '원', val: sumOf(cMoney)});

    const cCat = cols.find(c => CAT_RE.test(norm(c.name)));
    if (cCat) {
      const mm = new Map();
      outRows.forEach(r => { const v = catVal(r, cCat.p); if (v) mm.set(v, (mm.get(v) || 0) + 1); });
      if (mm.size >= 2 && mm.size <= 30) cat = {p: cCat.p, values: [...mm.entries()].sort((x, y) => y[1] - x[1])};

  }

  const HX = new WeakMap();   // 칸 → parseHist 결과. 칸 객체에 붙이지 않는다 (저장본 IndexedDB 에 옛 해석이 섞여 남지 않게)

    document.title = `${t ? `${t.name} · ${b ? b.title : ''} · ` : ''}MD팀 시트`;
  }
  $('kpis').addEventListener('click', e => {
    const b = e.target.closest('.kpi[data-kpi]');
    if (!b) return;
    const v = vstate(), id = b.dataset.kpi;
    v.kpi = !id || v.kpi === id ? null : id;
    S.stick.clear();
    renderHead();
    renderGrid({pos: {t: 0, l: grid.scrollLeft}});
  });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    const v = vstate();
    v.cat = b.dataset.all ? null : (v.cat === b.dataset.cat ? null : b.dataset.cat);
    S.stick.clear();
    renderHead();
    renderGrid({pos: {t: 0, l: grid.scrollLeft}});
  });
  $('dates').addEventListener('click', e => { const b = e.target.closest('button[data-gid]'); if (b) openTab(b.dataset.gid); });
  $('alert').addEventListener('click', () => { if (compactMQ.matches) { S.alertOpen = !S.alertOpen; renderHead(); } });
  // 휴대폰: 접힌 위쪽은 제목 줄을 누르면 편다
  document.querySelector('.head').addEventListener('click', e => { if (app.classList.contains('hmin') && !e.target.closest('button,a')) setHmin(false); });
  $('parts').addEventListener('click', e => {
    const b = e.target.closest('button[data-part]');
    if (!b) return;
    const v = vstate();
    if ((v.part || 0) === +b.dataset.part) return;
    Object.assign(v, {part: +b.dataset.part, sort: null, cat: null, kpi: null});
    closeDetail();
    renderHead();
    renderGrid();
  });

  /* ── 왼쪽 메뉴 ── 즐겨찾기(★) → 묶음(MD 기본 시트 · 플랫폼 가격표 …) → 시트(머리를 누르면 접기 · 펴기, 기억) → 탭 (시트의 탭 순서).
     오른쪽 숫자 = 표 줄 수 (한 번이라도 읽은 탭 — 수식만 남은 빈 줄은 뺀 수). ERP MASTER 는 ERP전산팀 화면으로, 전략팀 시트는 기밀 명단 PC 에만 */
  const CHEV = '<svg class="cv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const isFolded = bk => S.fold[bk] != null ? !!S.fold[bk] : !CORE_BOOKS.has(bk);
  function navItem(t, withBook) {
    const on = t.gid === S.cur, n = S.counts[t.gid], fav = S.fav.includes(t.gid), b = withBook ? bookOf(t.book) : null;
    return `<button type="button" class="nav-item${on ? ' on' : ''}${n === 0 ? ' empty' : ''}" data-gid="${esc(t.gid)}" title="${esc(`${(bookOf(t.book) || {}).title || ''} › ${t.name}`)}">`
      + `<i class="dot" style="background:${t.meta.color}"></i><span class="nm">${esc(t.name)}</span>${b ? `<span class="bk">${esc(b.title)}</span>` : ''}`
      + `${n != null && !b ? `<span class="nd">${n ? fmt(n) : '빈 탭'}</span>` : ''}<span class="fv${fav ? ' on' : ''}" data-fav="${esc(t.gid)}" title="${fav ? '즐겨찾기에서 빼기' : '즐겨찾기'}">${fav ? '★' : '☆'}</span></button>`;
  }
  function renderNav() {
    const list = [];
    let h = '';
    const favs = S.fav.map(tabOf).filter(Boolean);
    if (favs.length) {
      h += '<div class="nav-gt">즐겨찾기</div>';
      favs.forEach(t => { h += navItem(t, true); });
    }
    let grp = null;
    for (const b of S.books) {
      if (b.grp !== grp) {
        if (grp === '재고 · 발주') h += erpItem();
        grp = b.grp;
        h += `<div class="nav-gt">${esc(grp || '기타')}</div>`;
      }
      const tabs = S.tabs.filter(t => t.book === b.book);
      tabs.forEach(t => list.push({key: t.gid, tabs: [t]}));
      const off = isFolded(b.book) && !tabs.some(t => t.gid === S.cur);
      h += `<div class="nav-grp${isFolded(b.book) ? ' off' : ''}"><button type="button" class="nav-sec" data-fold="${esc(b.book)}" title="${esc((b.descr || b.title) + (off ? ' — 누르면 펴기' : ' — 누르면 접기'))}">${CHEV}<i class="bd" style="background:${BOOK_COLOR[b.book] || '#64748b'}"></i><span class="bn">${esc(b.title)}</span><em>${tabs.length || ''}</em></button>`;
      tabs.forEach(t => { h += navItem(t, false); });
      h += '</div>';
    }
    if (grp === '재고 · 발주') h += erpItem();
    if (S.strat.length) {
      h += '<div class="nav-gt">전략팀 (대표 · 지희선)</div>';
      S.strat.forEach((x, i) => { h += `<button type="button" class="nav-item lnk-item" data-strat="${i}" title="구글시트로 열기 (새 탭)"><i class="dot" style="background:#d4af37"></i><span class="nm">${esc(x.title)}</span><span class="go">↗</span></button>`; });
    }
    S.nav = list;
    $('nav').innerHTML = h;
  }
  const erpItem = () => '<button type="button" class="nav-item lnk-item" data-erp="1" title="재고 ERP MASTER 는 ERP전산팀 화면에서 (같은 모양)"><i class="dot" style="background:#16a34a"></i><span class="nm">식스샵 ERP MASTER</span><span class="go">ERP전산팀 →</span></button>';
  const curItem = () => S.nav.find(it => it.key === S.cur) || null;
  // 왼쪽 메뉴 숫자 — 바뀌었을 때만 저장 · 다시 그림
  function setCount(gid, data) {
    const n = data && data.parts && data.parts[0] ? data.parts[0].rows.length : null;
    if (n === null || S.counts[gid] === n) return;
    S.counts[gid] = n;
    lsSet(LS_COUNTS, JSON.stringify(S.counts));
    renderNav();
  }
  function toggleFav(gid) {
    const i = S.fav.indexOf(gid);
    if (i >= 0) S.fav.splice(i, 1); else S.fav.push(gid);
    lsSet(LS_FAV, JSON.stringify(S.fav));
    renderNav();
    if (gid === S.cur) renderHead();
    toast(i >= 0 ? '즐겨찾기에서 뺐어요' : '즐겨찾기에 넣었어요 — 왼쪽 메뉴 맨 위');
  }
  function openErp() {
    try { if (window.parent !== window && typeof window.parent.openErpPage === 'function') { window.parent.openErpPage(); return; } } catch (e) { /* 다른 출처 */ }
    location.href = '../erp/';
  }
  function setNav(open) {
    app.classList.toggle('nav-open', open);
    $('scrim').hidden = !open;
    if (open) { const on = $('nav').querySelector('.nav-item.on'); if (on) on.scrollIntoView({block: 'nearest'}); }   // 보고 있는 탭이 보이게
  }
  // PC 는 메뉴를 접어 표를 넓게 (접힌 상태는 기억), 좁은 화면은 서랍
  const wide = matchMedia('(min-width:1001px)');
  function setSide(open, save) {
    app.classList.toggle('side-off', !open);
    if (save) lsSet(LS_SIDE, open ? '1' : '0');
    renderGrid({keep: true});
  }
  $('btnFold').addEventListener('click', () => { if (wide.matches) setSide(false, true); else setNav(false); });
  $('eTog').addEventListener('click', () => {
    S.showEmpty = !S.showEmpty;
    lsSet(LS_EMPTY, S.showEmpty ? '1' : '0');
    renderHead();
    renderGrid({keep: true});
  });
  $('nav').addEventListener('click', e => {
    const fv = e.target.closest('.fv[data-fav]');
    if (fv) { e.stopPropagation(); toggleFav(fv.dataset.fav); return; }
    const f = e.target.closest('.nav-sec[data-fold]');
    if (f) { const k = f.dataset.fold; S.fold[k] = !isFolded(k); lsSet(LS_FOLD, JSON.stringify(S.fold)); renderNav(); return; }
    const b = e.target.closest('.nav-item');
    if (!b) return;
    if (b.dataset.erp) { openErp(); return; }
    if (b.dataset.strat != null) { const x = S.strat[+b.dataset.strat]; if (x) window.open(x.url, '_blank', 'noopener'); return; }
    openTab(b.dataset.gid);
    setNav(false);
  });
  $('tFav').addEventListener('click', () => { if (S.cur) toggleFav(S.cur); });
  $('btnMenu').addEventListener('click', () => { if (wide.matches) setSide(app.classList.contains('side-off'), true); else setNav(!app.classList.contains('nav-open')); });
  $('scrim').addEventListener('click', () => setNav(false));

  function saveTab() {
    const t = tabOf(S.cur);
    if (t) lsSet(LS_TAB, JSON.stringify({tk: t.gid, book: t.book, name: t.name}));
  }

  /* ── 저장본 (IndexedDB) — 탭마다 마지막으로 받은 칸 자료(주문자 이름은 이미 가린 것)와 받은 시각. 못 쓰는 브라우저(사생활 보호 창 등)면 그냥 안 씀 ── */
  const store = (() => {
    let dbp = null;
    const open = () => dbp || (dbp = new Promise(res => {
      try {
        const rq = indexedDB.open(IDB_NAME, 1);
        rq.onupgradeneeded = () => { try { rq.result.createObjectStore('tabs'); } catch (e) { /* 이미 있음 */ } };
        rq.onsuccess = () => res(rq.result);
        rq.onerror = rq.onblocked = () => res(null);
      } catch (e) { res(null); }
    }));
    const run = (mode, fn) => open().then(db => db && new Promise(res => {
      try {
        const tx = db.transaction('tabs', mode), rq = fn(tx.objectStore('tabs'));
        tx.oncomplete = () => res(rq ? rq.result : true);
        tx.onerror = tx.onabort = () => res(null);
      } catch (e) { res(null); }
    }));
    return {
      get: gid => run('readonly', s => s.get(gid)).then(v => v && v.v === CACHE_VER && Array.isArray(v.rows) ? v : null),
      put: (gid, rows, rowsVer, at) => run('readwrite', s => s.put({v: CACHE_VER, rows, rowsVer, at}, gid)),
      keys: () => run('readonly', s => s.getAllKeys()),
      del: gid => run('readwrite', s => s.delete(gid)),
    };
  })();
  S.savedAt = {};   // gid → 저장본에 쓴 시각 (자료가 같으면 2분에 한 번만 다시 씀)
  // 저장본 = 그 탭의 줄 [{r, v, src, edited_by, edited_at}] (주문자 이름은 이미 가린 것) · 그때의 줄 번호표(rows_ver) · 받은 시각.
  // 구글시트를 바로 읽은 것(direct — 저장소가 멈췄을 때)은 가리기 전 글이 섞일 수 있어 저장하지 않는다.
  function saveRows(gid, ent, changed) {
    if (!ent || ent.direct) return;
    if (!changed && Date.now() - (S.savedAt[gid] || 0) < 120e3) return;
    S.savedAt[gid] = Date.now();
    store.put(gid, [...ent.rows.values()], ent.rowsVer, ent.at);
  }
  // 줄 → 칸 자료 → 업무 표 (고치는 중이라 저장 전인 칸은 고친 값으로)
  function build(gid, ent) {
    const list = [...ent.rows.values()].sort((a, b) => a.r - b.r);
    ent.model = modelFromRows(tabOf(gid), list);
    if (ent.direct) {   // 구글시트를 바로 읽은 것 — 주문자 이름 등은 저장소와 같은 규칙으로 가리고 줄에도 가린 글만 남긴다
      ent.model.masked = maskPII(ent.model.rows);
      ent.model.rows.forEach(mr => { const x = ent.rows.get(mr.r); mr.cells.forEach(c => { if (c.pii && x) x.v[c.p] = c.t; }); });
    }
    applyPending(gid, ent.model);
    ent.data = buildAll(ent.model, tabOf(gid));
    return ent;
  }
  const slim = x => ({r: x.r, v: Array.isArray(x.v) ? x.v.map(t => t == null ? '' : String(t)) : [], src: x.src || 'sheet', edited_by: x.edited_by || null, edited_at: x.edited_at || null});
  function sameRows(a, b) {
    if (a.size !== b.size) return false;
    for (const [r, x] of b) { const y = a.get(r); if (!y || y.v.length !== x.v.length || y.v.some((t, i) => t !== x.v[i]) || y.edited_by !== x.edited_by) return false; }
    return true;
  }
  function useStored(gid) {   // 메모리에 없으면 저장본을 꺼내 바로 띄운다 (그 사이 새 자료가 왔으면 무시)
    return store.get(gid).then(hit => {
      if (!hit || S.cache.get(gid)) return false;
      const ent = build(gid, {rows: new Map(hit.rows.map(x => [x.r, slim(x)])), rowsVer: +hit.rowsVer || 0, at: hit.at, stored: true});
      cachePut(gid, ent);
      S.savedAt[gid] = Date.now();
      setCount(gid, ent.data);
      if (gid === S.cur) { hideMsg(); renderHead(); renderGrid({pos: S.pos[gid]}); paintStatus(); }
      return true;
    }).catch(() => false);
  }

  /* ── 미리 받기 — 첫 탭이 뜬 뒤 다른 브랜드 재고 탭을 하나씩 (화면이 보일 때만, 저장소와 같으면 건너뜀) ── */
  let prefetchOn = false;
  function prefetch() {
    if (prefetchOn || !S.tabsOk || !S.cur) return;
    prefetchOn = true;
    (async () => {
      await sleep(800);
      const gids = S.tabs.filter(t => CORE_BOOKS.has(t.book) && /^product\s*list$/i.test(t.name)).map(t => t.gid).filter(g => g !== S.cur);   // 시트마다 Product List
      for (const g of gids) {
        while (!shown()) await sleep(5000);
        if (!S.cache.get(g)) await useStored(g);
        const c = S.cache.get(g), t = tabOf(g);
        if (c && !c.stored && t && t.info && c.rowsVer >= +t.info.rows_ver) continue;
        await loadSheet(g);
        await sleep(PREFETCH_GAP);
      }
    })().catch(() => {});   // 한 번만 (그 뒤엔 탭을 열 때 바뀐 줄만 받으니 빠르다)
  }
  function cachePut(gid, v) {
    S.cache.delete(gid);
    S.cache.set(gid, v);
    for (const k of S.cache.keys()) { if (S.cache.size <= CACHE_MAX) break; if (k !== S.cur) S.cache.delete(k); }
  }
  function openTab(gid) {
    if (!gid) return;
    if (S.cur && S.cur !== gid) { S.pos[S.cur] = {t: grid.scrollTop, l: grid.scrollLeft}; closeDetail(); }
    if (S.cur !== gid) { setHmin(false); S.stick.clear(); if (CE.x) commitCell(0, 0, true); S.cell = null; }
    S.cur = gid;
    hideMsg();
    const t = tabOf(gid);
    if (t) { S.lastName = t.name; S.lastBook = t.book; if (isFolded(t.book)) { S.fold[t.book] = false; lsSet(LS_FOLD, JSON.stringify(S.fold)); } }   // 접힌 시트의 탭을 열면 그 시트를 편다
    saveTab();
    renderNav();
    const c = S.cache.get(gid);
    renderHead();
    renderGrid({pos: S.pos[gid]});
    if (!c) useStored(gid);   // 저장본이 있으면 바로 띄우고, 새 자료(바뀐 줄)는 뒤에서
    const tt = tabOf(gid);   // 탭 정보(줄 번호표)를 아직 못 받았으면 저장본만 띄우고, 받은 뒤 loadTabs → syncCur 가 받는다
    if (tt && tt.info && (!c || c.stored || c.direct || c.rowsVer < +tt.info.rows_ver || Date.now() - (S.fullAt[gid] || 0) > FULL_MS)) loadSheet(gid);
    paintStatus();
  }

  /* ── 표 조작 — 머리글 = 정렬, 칸 = 바로 고치기(PC) · 줄 = 상세 창(휴대폰 · 행 번호), 사진 = 크게 ── */
  grid.addEventListener('click', e => {
    if (e.target.closest('.rz') || Date.now() - RZ.justDragged < 400) return;   // 칸 너비를 끈 뒤 생기는 click 은 정렬로 보지 않는다
    const th = e.target.closest('th');
    if (th) {
      if (th.classList.contains('fill')) return;
      const v = vstate();
      if (th.dataset.sort === 'rn') v.sort = null;
      else {
        const p = +th.dataset.p;
        v.sort = !v.sort || v.sort.p !== p ? {p, dir: 1} : v.sort.dir > 0 ? {p, dir: -1} : null;   // 오름 → 내림 → 원래 순서
      }
      renderGrid({keep: true});
      return;
    }
    const img = e.target.closest('img.thumb');
    if (img) { e.stopPropagation(); openLb(img.currentSrc || img.src); return; }
    if (e.target.closest('a')) return;
    const tr = e.target.closest('tbody tr[data-r]');
    if (!tr || e.target.closest('td.rn')) return;   // 행 번호는 아래 따로 (상세 창)
    const td = e.target.closest('tbody td[data-p]');
    // PC: 칸을 누르면 그 자리에서 바로 고친다 (2026-11-20 사용자 "엑셀처럼 수정할 곳 누르면 바로 수정") — 행 번호를 누르면 상세 창
    if (cellMode() && td && !(window.getSelection && String(window.getSelection()).length)) {
      if (document.activeElement !== grid) grid.focus({preventScroll: true});
      pickCell(+tr.dataset.r, +td.dataset.p, {edit: true, click: true, noScroll: true});
      return;
    }
    openDetail(+tr.dataset.r, false);
    if (cellMode() && S.cell) setCell(null);
    if (document.activeElement !== grid && !matchMedia('(pointer:coarse)').matches) grid.focus({preventScroll: true});
  });
  grid.addEventListener('keydown', e => {
    if (e.target !== grid) return;
    // 고른 칸이 있으면 엑셀처럼 — 화살표 · Tab = 칸 옮기기, Enter · F2 = 고치기, 영문 · 숫자 = 바로 고치기, Delete = 비우고 고치기, 스페이스 = 체크
    if (S.cell && S.cell.gid === S.cur && cellMode()) {
      const k = e.key, c = S.cell;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (/^Arrow/.test(k)) { e.preventDefault(); moveCell(k === 'ArrowDown' ? 1 : k === 'ArrowUp' ? -1 : 0, k === 'ArrowRight' ? 1 : k === 'ArrowLeft' ? -1 : 0, false); return; }
      if (k === 'Tab') { e.preventDefault(); moveCell(0, e.shiftKey ? -1 : 1, false); return; }
      if (k === 'Enter' || k === 'F2') { e.preventDefault(); pickCell(c.r, c.p, {edit: true}); return; }
      if (k === 'Escape') { setCell(null); hideTip(); return; }
      if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); pickCell(c.r, c.p, {edit: true, text: ''}); return; }
      if (k === ' ') { e.preventDefault(); pickCell(c.r, c.p, {edit: true, space: true}); return; }
      if (k.length === 1) { e.preventDefault(); pickCell(c.r, c.p, {edit: true, text: k}); return; }
      return;
    }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSel(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Escape') closeDetail();
  });
  // 행 번호 칸 = 그 줄 상세 창 (PC 에선 칸을 누르면 고치기라서)
  grid.addEventListener('click', e => {
    const rn = e.target.closest && e.target.closest('tbody td.rn');
    if (!rn) return;
    const tr = rn.closest('tr[data-r]');
    if (!tr) return;
    if (CE.x) commitCell(0, 0, true);
    setCell(null);
    const r = +tr.dataset.r;
    if (S.sel && S.sel.r === r && !$('detail').hidden) closeDetail(); else openDetail(r, false);
  });
  /* '이전 N회' 에 마우스 → 발주 · 입고 전부 (오피스 물류팀 발주서의 '이전 발주' 팝업과 같은 방식 — 휴대폰은 줄을 눌러 상세 창에서) */
  const hpop = document.createElement('div');
  hpop.className = 'hpop';
  hpop.hidden = true;
  document.body.appendChild(hpop);
  grid.addEventListener('mouseover', e => {
    const chip = e.target.closest && e.target.closest('.hchip');
    if (!chip || !hoverMQ.matches) return;   // 휴대폰은 누르면 가짜 마우스가 와서 팝업이 상세 창 위에 남았다 — 상세 창에 전부 나온다
    const d = curData(), row = d && d.rows.find(x => x.r === +chip.dataset.r), col = d && d.cols.find(x => x.p === +chip.dataset.p);
    const c = row && col && row.byP[col.p];
    const hx = c && hxOf(c);
    if (!hx) return;

      dd.classList.toggle('ed-ro', !!why);

  }

  /* ── 한 칸 쓰기 — 화면 먼저 새 값(pend) → 구글시트(브리지) → 오피스 저장소(mdx_cell_edit). 칸마다 차례로(E.q) ──
     돌려줌: {ok} · {conflict, current} (그사이 시트 값이 바뀜) · 실패면 throw. 실패 · 충돌이면 화면은 원래(또는 시트) 값으로 돌아간다. */
  const pkey = x => `${x.gid}|${x.r}|${x.p}`;

  // 저장하는 동안 화면에 새 값 (줄 자료를 그 자리에서 바꾸고 다시 그림 — 고치는 중인 칸은 그대로)
  function showPending(x, v, key) {
    const ent = S.cache.get(x.gid);

    const row = ent.rows.get(x.r);
    if (!row) return;
    const pd = E.pend.get(key);
    if (!pd) E.pend.set(key, {gid: x.gid, r: x.r, p: x.p, busy: true, at: Date.now(), was: row.v[x.p] == null ? '' : row.v[x.p], now: v});

  function applyPending(gid, model) {

  /* 상세 창 · 휴대폰 고칠 칸 상자 — 상세 값 바로 위에 겹쳐 뜬다 (휴대폰은 화면 위쪽) */

    if (!E.x || !E.at || (E.anchor && E.anchor.isConnected)) return;

  }

    const d = curData();

    const m = new Map();
    d.rows.forEach(rw => { const v = catVal(rw, x.p); if (v && v.length <= 40 && !/^⚠|묶음|중복/.test(v)) m.set(v.trim(), (m.get(v.trim()) || 0) + 1); });

  }

    if (E.busy) return;

    const why = roWhy(x);

  }
  // 고른 칸이 보이게 (아래 · 위는 showRow, 옆은 고정 칸을 피해서)
  function revealCell(r, p) {

  }

    opt = opt || {};

  const ERR = {

  function syncLimits(gid) {

    const every = (!b || !b.edit ? SYNC_EVERY.other : t.meta.raw ? SYNC_EVERY.raw : SYNC_EVERY.core) * 60e3;
    return {warn: every * 2 + 3 * 60e3, bad: every * 3 + 8 * 60e3};
  }
  // 맥미니가 이 탭을 시트와 마지막으로 맞춘 뒤 지난 시간 (서버 시계 기준)
  function syncAge(gid) {
    const at = Date.parse(S.synced[gid] || '');
    return at ? Math.max(0, Date.now() + (S.skew || 0) - at) : Infinity;
  }
  const agoMs = ms => ms < 50e3 ? '방금' : ms < 3600e3 ? `${Math.round(ms / 60e3)}분 전` : ms < 86400e3 ? `${Math.floor(ms / 3600e3)}시간 전` : `${Math.floor(ms / 86400e3)}일 전`;
  function paintStatus() {
    const st = $('st'), s = S.st[S.cur] || {k: 'load'}, c = S.cache.get(S.cur), age = syncAge(S.cur), lim = syncLimits(S.cur);
    let k = s.k, txt = '', tip = '';
    const late = c && age > lim.bad ? 'bad' : c && age > lim.warn ? 'warn' : '';
    if (k === 'load') txt = c ? (c.stored ? (narrow.matches ? '저장본' : `${hhmm(c.at)} 저장본 · 새로 받는 중…`) : s.direct ? '구글시트 읽는 중…' : '갱신 중…') : '불러오는 중…';
    else if (k === 'err') txt = errShort(s.err);
    else if (c && c.direct) txt = narrow.matches ? '구글시트 바로' : `구글시트에서 바로 읽음 · ${hhmm(c.at)}`;
    else if (c && c.stored) txt = `${hhmm(c.at)} 저장본`;
    else if (late) txt = narrow.matches ? `맞춤 ${agoMs(age)}` : `시트와 맞춘 지 ${agoMs(age)} · 맥미니 확인 중`;
    else if (c) txt = narrow.matches ? '최신' : `시트와 맞춤 ${isFinite(age) ? agoMs(age) : '—'} · 오피스 저장소`;
    if (k === 'ok' && late === 'bad') k = 'err';
    st.className = `st is-${k}`;
    if (c && c.stored) st.classList.add('is-stored');   // 저장본을 보고 있음 (주황) — 새 자료가 오면 꺼짐
    if (k === 'ok' && (late === 'warn' || (c && c.direct))) st.classList.add('is-stored');
    $('stText').textContent = txt;
    const m = c && c.model;
    tip = c && c.direct ? `오피스 저장소가 ${isFinite(age) ? agoMs(age) : '오래'} 맞춰지지 않아 이 탭은 구글시트를 바로 읽어 보여 주는 중 (${hhmm(c.at)})`
      : c && c.stored ? `이 브라우저에 저장해 둔 ${hhmm(c.at)} 자료를 먼저 보여 주는 중 — 새 자료가 오면 바로 바뀌어요`
      : `오피스 저장소에서 읽음 — 맥미니가 구글시트와 맞추고(MD 시트 3분 · 판매원본 · 나머지 시트 15분마다), 화면은 ${POLL_MS / 1000}초마다 바뀐 줄만 받아요`
        + (isFinite(age) ? `\n이 탭을 시트와 마지막으로 맞춘 때: ${agoMs(age)}` : '');
    st.title = tip + (m && m.masked ? `\n주문자 이름 등 개인정보 ${m.masked.toLocaleString('ko-KR')}칸은 가려서 보여 줌` : '')
      + (c && c.data ? (() => { const g = c.data.parts.reduce((n, x) => n + (x.ghosts || 0), 0); return g ? `\n수식만 남은 빈 줄 ${g.toLocaleString('ko-KR')}줄은 표에서 뺐어요 (시트는 그대로)` : ''; })() : '')
      + '\n누르면 지금 다시 받기';
  }
  function paintCount() { $('qn').textContent = S.terms.length && curData() ? `${fmt(S.list.length)}줄` : ''; }
  function reloadNow() {
    if (S.cur) loadSheet(S.cur, {full: true});
    if (!S.tabsBusy) loadTabs().catch(() => {});
  }
  $('st').addEventListener('click', reloadNow);

  /* ── 줄 간격 · 전체 화면 ── */
  function setDense(on, save) {
    S.dense = !!on;
    app.classList.toggle('dense', S.dense);
    $('btnDense').classList.toggle('on', S.dense);
    $('btnDense').title = S.dense ? '줄 간격 넓게' : '줄 간격 촘촘하게';
    if (save) { lsSet(LS_DENSE, S.dense ? '1' : '0'); renderGrid({keep: true}); }   // 줄 높이가 바뀌니 다시 그린다 (보이는 줄만 그리기)
  }
  $('btnDense').addEventListener('click', () => setDense(!S.dense, true));
  const fsOk = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (!fsOk) $('btnFull').hidden = true;
  $('btnFull').addEventListener('click', () => {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  });

  /* ── 찾기 ── */
  function setQuery(v) {
    S.terms = String(v || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    S.stick.clear();
    S.hlRe = S.terms.length ? new RegExp(S.terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi') : null;
    $('qx').hidden = !v;
    renderGrid({pos: {t: 0, l: grid.scrollLeft}});
  }
  let qT = 0;
  qIn.addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => setQuery(qIn.value), 140); });
  qIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qT); if (S.terms.join(' ') !== qIn.value.trim().toLowerCase().split(/\s+/).filter(Boolean).join(' ')) setQuery(qIn.value); moveSel(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { qIn.value = ''; setQuery(''); grid.focus({preventScroll: true}); }
  });
  $('qx').addEventListener('click', () => { qIn.value = ''; setQuery(''); qIn.focus(); });
  // 휴대폰: 찾기 칸을 누르면 자판이 올라오니 위쪽을 접어 결과를 넓게, 찾을 말 없이 나가면 다시 편다
  qIn.addEventListener('focus', () => { if (compactMQ.matches) setHmin(true); });
  qIn.addEventListener('blur', () => { if (!qIn.value.trim() && grid.scrollTop < 56) setHmin(false); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('edbox').hidden) { closeEditor(); return; }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); qIn.focus(); qIn.select(); }
    else if (e.key === 'Escape' && !$('lb').hidden) { $('lb').hidden = true; }
    else if (e.key === 'Escape' && !$('detail').hidden && e.target !== qIn) closeDetail();
    else if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.nav.length) {   // Alt+↑↓ = 위 · 아래 메뉴
      e.preventDefault();
      const i = S.nav.findIndex(it => it.key === S.cur);
      openTab(S.nav[(i + (e.key === 'ArrowDown' ? 1 : -1) + S.nav.length) % S.nav.length].key);
    }
  });

  /* ── 보일 때만 자동 갱신 (오피스 안 화면은 홈으로 나가도 살아 있어서 숨었는지 직접 본다) ── */
  function shown() {
    if (document.visibilityState === 'hidden') return false;
    try { const fe = window.frameElement; if (fe && !fe.getClientRects().length) return false; } catch (e) { /* 다른 출처 */ }
    return true;
  }
  function tick() {
    const vis = shown();
    S.shown = vis;
    if (!vis) return;
    paintStatus();
    if (sizeKey() !== S.size && grid.clientWidth) renderGrid({keep: true});
    else paintRows();
    if (!S.tabsOk) {   // 탭 목록을 아직 못 받음 (처음 · 연결 끊김) → 30초마다 다시
      if (!S.tabsBusy && Date.now() - (S.tabsTry || 0) > RETRY_MS) { S.tabsTry = Date.now(); loadTabs().catch(() => {}); }
      return;
    }
    if (Date.now() - S.pollAt >= POLL_MS - 500) poll();
    const s = S.st[S.cur];   // 받다가 실패한 탭은 30초 뒤 다시
    if (S.cur && !S.busy[S.cur] && s && s.k === 'err' && Date.now() - s.at > RETRY_MS) loadSheet(S.cur);
  }
  setInterval(tick, 2000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(tick, 300); });
  let rzT = 0;
  window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(tick, 180); });
  narrow.addEventListener && narrow.addEventListener('change', () => { if (!narrow.matches) setNav(false); $('dscrim').hidden = !narrow.matches || $('detail').hidden; renderGrid({keep: true}); });
  compactMQ.addEventListener && compactMQ.addEventListener('change', () => { if (!compactMQ.matches) setHmin(false); });

  /* ── 시작 — 지난번 탭은 탭 목록을 기다리지 않고 바로 읽는다 ── */
  (async function boot() {
    setDense(lsGet(LS_DENSE) === '1', false);
    if (lsGet(LS_SIDE) === '0') app.classList.add('side-off');
    S.showEmpty = lsGet(LS_EMPTY) === '1';
    if (document.fonts && document.fonts.load) { try { document.fonts.load(F_CELL, '재고ABC123'); document.fonts.load(F_BOLD, '재고ABC123'); } catch (e) { /* noop */ } }
    let saved = null;
    try { saved = JSON.parse(lsGet(LS_TAB) || 'null'); } catch (e) { saved = null; }
    let want = null;
    try { want = new URLSearchParams(location.search).get('tab'); } catch (e) { want = null; }
    S.want = want;     // 탭 목록이 늦게(실패 뒤 다시) 읽혀도 같은 규칙으로 고른다 (loadTabs)
    S.saved = saved;
    renderGrid();
    // 지난번 탭 목록으로 메뉴를 바로 그리고 고른 탭을 연다 (저장본이 있으면 표도 바로) — 새 탭 목록은 뒤에서
    let known = null;
    try { known = JSON.parse(lsGet(LS_TABS) || 'null'); } catch (e) { known = null; }
    if (known && Array.isArray(known.tabs) && known.tabs.length) {
      S.books = (known.books || []).filter(b => b && b.book);
      S.tabs = known.tabs.filter(t => t && t.tk && t.book).map(t => mkTab({tk: t.tk, gid: t.gid, book: t.book, name: t.name}));
    }
    if (S.tabs.length) {
      const first = pickTab(want, saved);
      if (first && (!want || known)) openTab(first);
    }
    S.tabsTry = Date.now();
    try { await loadTabs(); }   // 보던 탭이 없거나 지워졌으면 loadTabs 가 고른다 (그 사이 사용자가 고른 탭은 그대로)
    catch (e) {
      S.st[S.cur || ''] = {k: 'err', err: e.message, at: Date.now()};
      paintStatus();
      if (!S.cur || !S.cache.get(S.cur)) showErr(e.message);
    }
  })();
})();
</script>
</body>
</html>
