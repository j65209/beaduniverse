<!doctype html>
<html lang="ko">

<title>마케팅 회의록 · 비드유니버스</title>
<script src="../office-undo.js?v=1"></script><!-- 어디서든 되돌리기 (office-undo.js) -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<script>
  /* 오피스 안 화면(iframe, index.html 의 TOOL_PAGES 'meeting')으로 열렸으면 '← 오피스' 는 그 화면을 닫는다 (bbToolClose).
     혼자 열면 이 페이지의 잠금 화면에서 오피스 접속 코드를 받는다. (인스타 피드 시뮬레이터 feed/ 와 같은 방식) */
  (function () {
    var inOffice = false, home = '';
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    window.__mtgInOffice = inOffice;
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
    });
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  /* 마케팅 회의록 — 오피스 업무용 툴 (2026-11-24)
     사장님 요청: "업무용툴에 마케팅 회의록 만들어주고 / 인스타그램 피드나 릴스나 계정 주소 넣으면 마우스오버로 볼 수 있게 /
     디자인팀 · 마케팅팀 · 엠디팀 참여하고 각각 이름으로 세로로 만들어줘서 각자 링크 넣을 수 있게 / 중복되는 계정주소가 있으면 경고문"
     · 왼쪽 = 회의 목록 (날짜순, 휴대폰은 위 '회의 목록' 단추로 서랍)
     · 가운데 = 고른 회의: 날짜 · 제목 · 참여자 → 중복 경고 띠 → 사람마다 세로 칸(디자인팀 · 마케팅팀 · MD팀 순) → 회의 메모 · 결정 · 할 일
     · 칸에 인스타 주소(계정 · 피드 · 릴스 · 스토리)나 아무 링크를 붙여 넣으면 바로 저장. 마우스를 올리면 인스타 미리보기(휴대폰은 누르면)
     · 같은 계정 · 같은 게시물이 이 회의에 또 있으면 빨간 경고, 다른 회의에 나왔던 것이면 회색 안내
     · 저장 = 오피스 슈퍼베이스 mkt_meetings(회의 한 줄) · mkt_meeting_links(링크 한 줄씩 — 서로 덮어쓰지 않음). 지우기는 deleted_at 만 */
  :root {
    --bg: #f3f5f8; --panel: #fff; --line: #e5e7eb; --line2: #d5dae2; --text: #0f172a; --t2: #475569; --t3: #94a3b8;
    --acc: #2563eb; --acc-d: #1d4ed8; --acc-t: rgba(37, 99, 235, .10); --red: #e11d48; --red-t: rgba(225, 29, 72, .08);
    --amber: #b45309; --amber-t: rgba(245, 158, 11, .12); --ok: #16a34a;
    --top: 56px; --r: 12px; --colw: 276px;
    --font: Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit }
  a { color: var(--acc-d) }
  [hidden] { display: none !important }
  svg { flex: none }

  /* ── 상단 ── */
  .top { position: sticky; top: 0; z-index: 30; min-height: var(--top); display: flex; align-items: center; gap: 10px; padding: 8px 16px;
    background: rgba(255, 255, 255, .94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line) }
  .back { color: var(--t2); text-decoration: none; font-weight: 600; font-size: 13px; white-space: nowrap; padding: 6px 8px; border-radius: 8px }
  .back:hover { background: var(--bg) }
  .ttl { font-weight: 800; font-size: 15px; letter-spacing: -.2px; white-space: nowrap; display: flex; align-items: center; gap: 8px }
  .ttl svg { width: 20px; height: 20px; color: var(--acc) }
  .top-r { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none }
  .save-st { font-size: 12px; color: var(--t3); white-space: nowrap }
  .save-st.err { color: var(--red); font-weight: 600; cursor: pointer }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 13px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; color: var(--text) }
  .btn:hover { border-color: var(--line2); background: #fafbfc }
  .btn.pri { background: var(--acc); border-color: var(--acc); color: #fff }
  .btn.pri:hover { background: var(--acc-d); border-color: var(--acc-d) }
  .btn.danger { color: var(--red) }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px }
  .btn.ico { width: 32px; padding: 0 }
  .btn svg { width: 16px; height: 16px }
  .btn:disabled { opacity: .45; cursor: default }
  .only-narrow { display: none }

  /* ── 틀 ── */
  .wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - var(--top)) }
  .side { border-right: 1px solid var(--line); background: #fbfcfd; padding: 12px; position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto }
  .side-h { display: flex; align-items: center; gap: 6px; margin-bottom: 8px }
  .side-h input { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; outline: none; background: #fff }
  .side-h input:focus { border-color: var(--acc) }
  .mi { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none; border-radius: 10px; padding: 8px 10px; cursor: pointer; margin-bottom: 2px }
  .mi:hover { background: #f1f4f8 }
  .mi.on { background: var(--acc-t); border-color: rgba(37, 99, 235, .28) }
  .mi .d { font-size: 11.5px; color: var(--t3); font-weight: 600 }
  .mi.on .d { color: var(--acc) }
  .mi .t { font-weight: 700; font-size: 13.5px; line-height: 1.3; margin-top: 1px; word-break: break-all }
  .mi .n { font-size: 11.5px; color: var(--t2); margin-top: 3px; display: flex; gap: 6px; flex-wrap: wrap }
  .mi .n .w { color: var(--red); font-weight: 700 }
  .side-empty { color: var(--t3); font-size: 12.5px; padding: 12px 4px }
  .main { min-width: 0; padding: 16px 18px 40px }

  /* ── 회의 머리 ── */
  .mhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px }
  .mhead input[type=date] { height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; background: #fff; outline: none; font-weight: 600 }
  .mhead .tt { flex: 1; min-width: 200px; height: 36px; border: 1px solid transparent; border-radius: 9px; padding: 0 10px; background: transparent;
    font-size: 19px; font-weight: 800; letter-spacing: -.3px; outline: none }
  .mhead .tt:hover { border-color: var(--line) }
  .mhead input:focus { border-color: var(--acc); background: #fff }
  .mh-r { display: flex; gap: 6px; align-items: center }
  .menu { position: absolute; z-index: 60; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(15, 23, 42, .14);
    padding: 4px; min-width: 190px }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; text-align: left; font-size: 13px }
  .menu button:hover { background: #f1f4f8 }
  .menu button.danger { color: var(--red) }

  /* ── 중복 경고 띠 ── */
  .dupbar { border: 1px solid rgba(225, 29, 72, .35); background: var(--red-t); color: #9f1239; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px }
  .dupbar b { font-weight: 800 }
  .dupbar ul { margin: 6px 0 0; padding-left: 18px }
  .dupbar li { margin: 2px 0 }
  .dupbar .k { font-weight: 700 }

  /* ── 사람별 세로 칸 ── */
  .board-w { position: relative }
  .bnav { position: absolute; top: -4px; z-index: 5; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line2); background: #fff;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .14); display: grid; place-items: center; cursor: pointer; color: var(--t2) }
  .bnav:hover { color: var(--text); border-color: var(--t3) }
  .bnav svg { width: 16px; height: 16px }
  .bnav.l { left: -6px } .bnav.r { right: -6px }
  @media (hover: none) { .bnav { display: none } }
  .board { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 12px; align-items: flex-start; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch }
  .team { flex: none; display: flex; flex-direction: column; gap: 8px; scroll-snap-align: start }
  .team-h { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; color: var(--tc); padding: 0 4px }
  .team-h .bar { width: 4px; height: 16px; border-radius: 3px; background: var(--tc) }
  .team-h .n { font-weight: 600; color: var(--t3); font-size: 12px }
  .cols { display: flex; gap: 10px; align-items: flex-start }
  .col { width: var(--colw); flex: none; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: var(--r);
    display: flex; flex-direction: column; scroll-snap-align: start }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 10px 12px 8px }
  .av { width: 28px; height: 28px; border-radius: 50%; background: var(--tt); color: var(--tc); display: grid; place-items: center; font-weight: 800; font-size: 12.5px; flex: none }
  .col-h .nm { font-weight: 800; font-size: 14px }
  .col-h .ct { margin-left: auto; font-size: 12px; color: var(--t3); font-weight: 600 }
  .col-h .ct.w { color: var(--red) }
  .add { padding: 0 10px 8px }
  .add-in { display: flex; gap: 6px }
  .add-in input { flex: 1; min-width: 0; height: 34px; border: 1px dashed var(--line2); border-radius: 8px; padding: 0 10px; outline: none; background: #fbfcfd; font-size: 13px }
  .add-in input:focus { border-style: solid; border-color: var(--tc); background: #fff }
  .add-in .btn { height: 34px; padding: 0 10px }
  .add-warn { margin-top: 6px; border: 1px solid rgba(225, 29, 72, .35); background: var(--red-t); border-radius: 9px; padding: 8px 10px; font-size: 12.5px; color: #9f1239 }
  .add-warn .r { display: flex; gap: 6px; margin-top: 6px }
  .add-hint { font-size: 11.5px; color: var(--t3); margin-top: 5px; padding: 0 2px }
  .lks { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px }
  .col-empty { color: var(--t3); font-size: 12px; text-align: center; padding: 14px 6px 16px; border: 1px dashed var(--line); border-radius: 9px }

  .lk { position: relative; display: flex; gap: 9px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 9px; background: #fff;
    cursor: pointer; transition: border-color .12s, box-shadow .12s }
  .lk:hover, .lk.pv-on { border-color: var(--line2); box-shadow: 0 2px 8px rgba(15, 23, 42, .07) }
  .lk.dup { border-color: rgba(225, 29, 72, .55); background: #fff8f9 }
  .lk-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; color: #fff;
    background: linear-gradient(135deg, #f58529, #dd2a7b 55%, #8134af) }
  .lk-ic svg { width: 17px; height: 17px }
  .lk.k-link .lk-ic { background: #e2e8f0; color: var(--t2) }
  .lk-b { flex: 1; min-width: 0 }
  .lk-t { font-weight: 700; font-size: 13.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .lk-s { font-size: 11.5px; color: var(--t3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px }
  .lk-m { font-size: 12.5px; color: var(--t2); margin-top: 4px; white-space: pre-wrap; word-break: break-word }
  .lk-me { width: 100%; margin-top: 5px; border: 1px solid var(--acc); border-radius: 7px; padding: 5px 7px; font-size: 12.5px; outline: none; resize: vertical; min-height: 34px; background: #fff }
  .lk-w { font-size: 11.5px; font-weight: 700; color: var(--red); margin-top: 4px }
  .lk-p { font-size: 11.5px; color: var(--t3); margin-top: 3px }
  .lk-p.amb { color: var(--amber) }
  .lk-a { position: absolute; top: 5px; right: 5px; display: flex; gap: 1px; padding: 2px; border-radius: 8px; background: #fff;
    box-shadow: 0 1px 4px rgba(15, 23, 42, .12); opacity: 0; pointer-events: none; transition: opacity .12s }
  .lk:hover .lk-a, .lk:focus-within .lk-a { opacity: 1; pointer-events: auto }
  .lk-a button, .lk-a a { width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--t2); display: grid; place-items: center; cursor: pointer; padding: 0 }
  .lk-a button:hover, .lk-a a:hover { background: #f1f4f8; color: var(--text) }
  .lk-a button.del:hover { color: var(--red) }
  .lk-a svg { width: 14px; height: 14px }
  @media (hover: none) {
    .lk-a { position: static; opacity: 1; pointer-events: auto; box-shadow: none; background: none; padding: 0; align-self: flex-start }
    .lk-a a { display: none }
    .lk-a button { width: 30px; height: 30px; color: var(--t3) }
  }

  /* ── 회의 메모 ── */
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px }
  .note { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px }
  .note label { font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px }
  .note label .s { font-weight: 500; color: var(--t3); font-size: 12px }
  .note textarea { width: 100%; min-height: 140px; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; outline: none; resize: none; background: #fbfcfd;
    font-size: 13.5px; line-height: 1.6; overflow: hidden }
  .note textarea:hover { border-color: var(--line) }
  .note textarea:focus { border-color: var(--acc); background: #fff }

  .empty { max-width: 420px; margin: 70px auto; text-align: center; color: var(--t2) }
  .empty b { display: block; font-size: 17px; color: var(--text); margin-bottom: 6px }
  .empty .btn { margin-top: 14px; height: 40px; padding: 0 18px }

  /* ── 인스타 미리보기 (마우스 올리면 · 휴대폰은 누르면 아래에서) ── */
  .pv { position: fixed; z-index: 200; width: 360px; background: #fff; border: 1px solid var(--line2); border-radius: 14px; box-shadow: 0 18px 50px rgba(15, 23, 42, .22);
    display: flex; flex-direction: column; overflow: hidden }
  .pv-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px }
  .pv-h b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .pv-h a { font-weight: 700; text-decoration: none; white-space: nowrap }
  .pv-h button { border: 0; background: none; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; color: var(--t2); font-size: 18px; line-height: 1 }
  .pv-h button:hover { background: #f1f4f8 }
  .pv-b { position: relative; flex: 1; min-height: 0; background: #fafafa }
  .pv-b iframe { display: block; width: 100%; height: 100%; border: 0; background: #fff }
  .pv-spin { position: absolute; inset: 0; display: grid; place-items: center; color: var(--t3); font-size: 12.5px; pointer-events: none }
  .pv-spin i { width: 26px; height: 26px; border: 3px solid #e5e7eb; border-top-color: #dd2a7b; border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 8px; display: block }
  @keyframes spin { to { transform: rotate(360deg) } }
  .pv-f { font-size: 11px; color: var(--t3); padding: 6px 10px; border-top: 1px solid var(--line) }
  .pv.sheet { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100%; height: 82vh !important; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom) }
  .pv-veil { position: fixed; inset: 0; z-index: 199; background: rgba(15, 23, 42, .35) }

  /* ── 참여자 창 ── */
  .dlg { position: fixed; inset: 0; z-index: 300; background: rgba(15, 23, 42, .35); display: flex; align-items: center; justify-content: center; padding: 16px }
  .dlg-card { background: #fff; border-radius: 16px; width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; padding: 18px 18px 14px; box-shadow: 0 20px 60px rgba(15, 23, 42, .25) }
  .dlg-card h3 { margin: 0 0 4px; font-size: 16px }
  .dlg-card .sub { color: var(--t3); font-size: 12.5px; margin-bottom: 12px }
  .mg { margin-bottom: 12px }
  .mg-h { font-weight: 800; font-size: 12.5px; color: var(--tc); margin-bottom: 6px; display: flex; align-items: center; gap: 6px }
  .mg-h .bar { width: 4px; height: 13px; border-radius: 3px; background: var(--tc) }
  .pills { display: flex; flex-wrap: wrap; gap: 6px }
  .pill { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); cursor: pointer; font-weight: 600; font-size: 13px; user-select: none; background: #fff }
  .pill input { display: none }
  .pill.on { background: var(--tt); border-color: var(--tc); color: var(--tc) }
  .pill .ck { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--line2); display: grid; place-items: center }
  .pill.on .ck { background: var(--tc); border-color: var(--tc) }
  .pill.on .ck::after { content: ''; width: 7px; height: 4px; border-left: 2px solid #fff; border-bottom: 2px solid #fff; transform: rotate(-45deg) translate(1px, -1px) }
  .addp { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap }
  .addp input, .addp select { height: 34px; border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; outline: none; background: #fff }
  .addp input { flex: 1; min-width: 120px }
  .addp input:focus, .addp select:focus { border-color: var(--acc) }
  .dlg-f { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 500; background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 10px;
    font-size: 13px; font-weight: 600; box-shadow: 0 8px 24px rgba(15, 23, 42, .25); max-width: calc(100vw - 32px) }
  .toast.err { background: var(--red) }

  .lock { position: fixed; inset: 0; z-index: 400; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px }
  .lock-box { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 26px; width: min(340px, 100%); display: flex; flex-direction: column; gap: 10px; text-align: center }
  .lock-box input { height: 42px; border: 1px solid var(--line); border-radius: 10px; text-align: center; font-size: 18px; letter-spacing: 4px; outline: none }
  .lock-box input:focus { border-color: var(--acc) }
  .lock-box .err { color: var(--red); font-size: 12.5px; min-height: 18px }
  .muted { color: var(--t3) }

  /* ── 휴대폰 ── */
  @media (max-width: 860px) {
    :root { --colw: min(82vw, 300px) }
    .wrap { grid-template-columns: 1fr }
    .side { position: fixed; z-index: 80; top: 0; left: 0; bottom: 0; width: min(300px, 86vw); height: auto; transform: translateX(-102%); transition: transform .2s;
      box-shadow: 0 0 40px rgba(15, 23, 42, .25); padding-top: calc(12px + env(safe-area-inset-top)) }
    body.side-open .side { transform: none }
    .side-veil { position: fixed; inset: 0; z-index: 79; background: rgba(15, 23, 42, .3) }

      let i = 0, user = null;
      if (!IG_RESERVED.has(s0) && HANDLE.test(seg[0])) { user = s0; i = 1; }
      const t = (seg[i] || '').toLowerCase(), code = seg[i + 1] || '';

  const S = {
    meetings: new Map(),   // id → 저장소 줄 (지운 건 뺌)
    links: new Map(),      // id → 저장소 줄 (지운 건 뺌)
    sel: null,
    staff: null,           // {design:[이름], mkt:[], md:[]}
    curM: '', curL: '',    // 마지막으로 받은 updated_at
    q: '',
  };
  const E = {base: null, dirty: {}, saving: false, again: false, timer: 0, retryT: 0};   // 고른 회의의 글 칸 저장 상태
  const drafts = new Map();   // 사람 → {text, warn:[{p, who}]} (칸 입력 · 중복 경고)
  let editMemo = null;        // 메모 고치는 링크 id
  let boardPending = false;

  /* ══════════════════════ 직원 명단 ══════════════════════ */
  async function loadStaff() {
    const col = new Map(BASE_STAFF.map(s => [s.name, s.color]));
    const order = BASE_STAFF.map(s => s.name);
    try {
      const [added, ovr, hid] = await Promise.all([
        rest('staff_added?select=name,color&order=created_at.asc'),
        rest('staff_dept_overrides?select=staff_name,color'),
        rest('staff_hidden?select=staff_name'),
      ]);
      (added || []).forEach(r => { if (r.name && !col.has(r.name)) { col.set(r.name, r.color); order.push(r.name); } });
      (ovr || []).forEach(r => { if (r.staff_name && r.color && col.has(r.staff_name)) col.set(r.staff_name, r.color); });
      (hid || []).forEach(r => col.delete(r.staff_name));
    } catch (e) { console.warn('staff', e); }
    const out = {design: [], mkt: [], md: []};
    order.forEach(n => { const t = COLOR_TEAM[col.get(n)]; if (t && !EXCLUDE.has(n) && !out[t].includes(n)) out[t].push(n); });
    S.staff = out;
  }
  function defaultMembers() {
    const st = S.staff || {design: [], mkt: [], md: []};
    const list = [];
    ['design', 'mkt', 'md'].forEach(t => st[t].forEach(n => list.push({name: n, team: t})));
    // 지난 회의에서 직접 넣은 사람(손님 · 대표)도 이어서
    const last = sortedMeetings()[0];
    if (last && Array.isArray(last.members)) last.members.forEach(m => { if (m && m.name && !EXCLUDE.has(m.name) && !list.some(x => x.name === m.name) && !isStaffName(m.name)) list.push({name: m.name, team: m.team || 'etc'}); });
    return list;
  }
  function isStaffName(n) { const st = S.staff; return !!st && (st.design.includes(n) || st.mkt.includes(n) || st.md.includes(n)); }
  function teamOfName(n) {
    const st = S.staff;
    if (st) for (const t of ['design', 'mkt', 'md']) if (st[t].includes(n)) return t;
    return 'etc';
  }

  /* ══════════════════════ 불러오기 · 정기 확인 ══════════════════════ */
  function sortedMeetings() {
    return [...S.meetings.values()].sort((a, b) => (b.day || '').localeCompare(a.day || '') || (b.created_at || '').localeCompare(a.created_at || ''));
  }
  function linksOf(mid) { return [...S.links.values()].filter(l => l.meeting_id === mid); }
  const later = (a, b) => !b || (a || '') > (b || '');

  async function loadAll() {
    const [ms, ls] = await Promise.all([
      rest(`${T_M}?deleted_at=is.null&select=*&order=day.desc,created_at.desc&limit=2000`),
      rest(`${T_L}?deleted_at=is.null&select=*&order=pos.desc&limit=20000`),
    ]);
    S.meetings.clear(); S.links.clear();
    (ms || []).forEach(r => { S.meetings.set(r.id, r); if (later(r.updated_at, S.curM)) S.curM = r.updated_at; });
    (ls || []).forEach(r => { S.links.set(r.id, r); if (later(r.updated_at, S.curL)) S.curL = r.updated_at; });
  }
  // 겹쳐 읽기(1분) — 먼저 시작해 늦게 끝난 저장도 놓치지 않게. 같은 줄은 updated_at 이 늦은 쪽만
  function since(t) { if (!t) return '1970-01-01T00:00:00Z'; return new Date(Date.parse(t) - 60000).toISOString(); }
  let polling = false, pollT = 0;
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      const [ms, ls] = await Promise.all([
        rest(`${T_M}?updated_at=gt.${encodeURIComponent(since(S.curM))}&select=*&order=updated_at.asc&limit=1000`),
        rest(`${T_L}?updated_at=gt.${encodeURIComponent(since(S.curL))}&select=*&order=updated_at.asc&limit=5000`),
      ]);
      let chM = false, chL = false;
      (ms || []).forEach(r => { if (later(r.updated_at, S.curM)) S.curM = r.updated_at; if (applyMeeting(r)) chM = true; });
      (ls || []).forEach(r => { if (later(r.updated_at, S.curL)) S.curL = r.updated_at; if (applyLink(r)) chL = true; });
      if (chM || chL) {
        if ((S.sel && !S.meetings.has(S.sel)) || (!S.sel && S.meetings.size)) pickMeeting((sortedMeetings()[0] || {}).id || null);
        else { renderList(); renderBoard(); }
      }
    } catch (e) { console.warn('poll', e); }
    finally { polling = false; }
  }
  function applyMeeting(r) {
    const old = S.meetings.get(r.id);
    if (old && !later(r.updated_at, old.updated_at)) return false;
    if (r.deleted_at) { if (!old) return false; S.meetings.delete(r.id); return true; }
    S.meetings.set(r.id, r);
    if (r.id === S.sel) syncFields(r);
    return true;
  }
  function applyLink(r) {
    const old = S.links.get(r.id);
    if (old && !later(r.updated_at, old.updated_at)) return false;
    if (r.deleted_at) { if (!old) return false; S.links.delete(r.id); return true; }
    S.links.set(r.id, r);
    return true;
  }
  function pollLoop() {
    clearTimeout(pollT);
    pollT = setTimeout(async () => { if (document.visibilityState !== 'hidden') await poll(); pollLoop(); }, POLL_MS);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') { if (Object.keys(E.dirty).length) saveMeeting(); }
    else poll();
  });
  // 다른 사람이 고치면 바로 (실시간 알림선 ../office-live.js) — 끊기면 8초 확인 그대로
  let liveOn = false;
  function liveBoot() { if (liveOn || !window.OfficeLive) return; liveOn = true; OfficeLive.on([T_M, T_L], () => poll()); }

  /* ══════════════════════ 회의 목록 ══════════════════════ */
  function meetingStats(mid) {
    const ls = linksOf(mid), groups = new Map();
    ls.forEach(l => { const k = dupKey(l); groups.set(k, (groups.get(k) || 0) + 1); });
    let dup = 0; groups.forEach(n => { if (n > 1) dup++; });
    return {n: ls.length, dup};
  }
  function renderList() {
    const box = $('mlist'), q = S.q.trim().toLowerCase().replace(/^@/, '');
    let list = sortedMeetings();
    if (q) list = list.filter(m => (m.title || '').toLowerCase().includes(q) || dayLabel(m.day).includes(q)
      || linksOf(m.id).some(l => (l.url || '').toLowerCase().includes(q) || (l.memo || '').toLowerCase().includes(q) || (l.person || '').includes(q)));
    if (!list.length) { box.innerHTML = `<div class="side-empty">${q ? '찾는 회의가 없어요' : '회의가 아직 없어요'}</div>`; return; }
    box.innerHTML = list.map(m => {
      const st = meetingStats(m.id);
      return `<button type="button" class="mi${m.id === S.sel ? ' on' : ''}" data-id="${esc(m.id)}">
        <div class="d">${esc(dayLabel(m.day))}</div>
        <div class="t">${esc(m.title || '제목 없는 회의')}</div>
        <div class="n"><span>링크 ${st.n}</span>${st.dup ? `<span class="w">⚠ 중복 ${st.dup}</span>` : ''}</div>
      </button>`;
    }).join('');
  }
  $('mlist').addEventListener('click', e => {
    const b = e.target.closest('.mi'); if (!b) return;
    pickMeeting(b.dataset.id);
    closeSide();
  });
  $('q').addEventListener('input', e => { S.q = e.target.value; renderList(); });

  function pickMeeting(id) {
    if (S.sel && S.sel !== id && Object.keys(E.dirty).length) saveMeeting();
    S.sel = id && S.meetings.has(id) ? id : null;
    if (S.sel) lsSet(LS.sel, S.sel);
    drafts.clear(); editMemo = null; hidePreview();
    const m = S.sel ? S.meetings.get(S.sel) : null;
    $('empty').hidden = S.meetings.size > 0;
    $('mtg').hidden = !m;
    if (m) {
      E.base = Object.assign({}, m); E.dirty = {};
      ['mDay', 'mTitle', 'mNotes', 'mDec'].forEach(fid => { $(fid).value = m[FMAP[fid]] || ''; });
      autoGrow($('mNotes')); autoGrow($('mDec'));
    }
    renderList();
    renderBoard(true);
  }

  /* ══════════════════════ 회의 만들기 · 지우기 ══════════════════════ */
  async function newMeeting() {
    const btn = $('newBtn'); btn.disabled = true;
    try {
      if (Object.keys(E.dirty).length) await saveMeeting();
      if (!S.staff) await loadStaff();
      const day = todayKST();
      const sameDay = [...S.meetings.values()].filter(x => x.day === day).length;
      const body = {day, title: `${shortDay(day)} 마케팅 회의${sameDay ? ` (${sameDay + 1})` : ''}`, members: defaultMembers(), created_by: ME(), updated_by: ME()};
      const r = await rest(T_M, {method: 'POST', headers: RET, body: JSON.stringify(body)});
      const row = r && r[0];
      if (!row) throw new Error('저장소가 답을 안 했어요');
      S.meetings.set(row.id, row);
      if (later(row.updated_at, S.curM)) S.curM = row.updated_at;
      pickMeeting(row.id);
      toast('새 회의를 만들었어요');
      setTimeout(() => { const f = document.querySelector('.add-in input'); if (f && matchMedia('(pointer:fine)').matches) f.focus(); }, 60);
    } catch (e) {
      console.warn('new', e);
      toast('회의를 만들지 못했어요: ' + e.message, true);
    } finally { btn.disabled = false; }
  }
  $('newBtn').addEventListener('click', newMeeting);
  $('emptyNew').addEventListener('click', newMeeting);

  async function deleteMeeting() {
    const m = S.meetings.get(S.sel); if (!m) return;
    try {
      const r = await rest(`${T_M}?id=eq.${m.id}`, {method: 'PATCH', headers: RET, body: JSON.stringify({deleted_at: new Date().toISOString(), updated_by: ME()})});
      S.meetings.delete(m.id);
      if (r && r[0] && later(r[0].updated_at, S.curM)) S.curM = r[0].updated_at;
      E.dirty = {};
      pickMeeting((sortedMeetings()[0] || {}).id || null);
      toast('회의를 지웠어요 — 되돌리려면 Ctrl+Z (왼쪽 아래 되돌리기)');
    } catch (e) { toast('지우지 못했어요: ' + e.message, true); }
  }

  /* ══════════════════════ 회의 글 칸 (날짜 · 제목 · 메모 · 결정) ══════════════════════
     0.7초 뒤 저절로 저장. 같은 회의를 두 사람이 동시에 고치면 줄 단위로 합친다(내가 넣은 줄 · 그쪽이 넣은 줄 둘 다 남김). */
  const FMAP = {mDay: 'day', mTitle: 'title', mNotes: 'notes', mDec: 'decisions'};
  const FEL = {day: 'mDay', title: 'mTitle', notes: 'mNotes', decisions: 'mDec'};
  const fieldVal = f => $(FEL[f]).value;
  function setField(f, v) {
    const el = $(FEL[f]);
    if (el.value === (v || '')) return;
    const focused = document.activeElement === el;
    const a = el.selectionStart, b = el.selectionEnd;
    el.value = v || '';
    if (focused && a != null && f !== 'day') { try { el.setSelectionRange(Math.min(a, el.value.length), Math.min(b, el.value.length)); } catch (e) { /* noop */ } }
    if (el.tagName === 'TEXTAREA') autoGrow(el);
  }
  function syncFields(r) {   // 다른 PC 에서 고친 것 — 내가 고치는 중인 칸은 그대로 두고 저장할 때 합친다
    for (const f of Object.keys(FEL)) {
      if (E.dirty[f]) continue;
      E.base[f] = r[f];
      setField(f, r[f]);
    }
    E.base.updated_at = r.updated_at;
    paintMemN();
  }
  function merge3(base, mine, theirs) {
    base = base || ''; mine = mine || ''; theirs = theirs || '';
    if (mine === theirs || theirs === base) return mine;
    if (mine === base) return theirs;
    const B = base.split('\n'), M = mine.split('\n'), T = theirs.split('\n');
    const cnt = a => { const m = new Map(); a.forEach(x => m.set(x, (m.get(x) || 0) + 1)); return m; };
    const cB = cnt(B), cM = cnt(M), cT = cnt(T);
    const del = new Map(); cB.forEach((n, x) => { const d = n - (cM.get(x) || 0); if (d > 0) del.set(x, d); });
    const out = [];
    for (const x of T) { const d = del.get(x); if (d && (cT.get(x) || 0) <= (cB.get(x) || 0)) { del.set(x, d - 1); continue; } out.push(x); }
    const add = new Map(); cM.forEach((n, x) => { const d = n - Math.max(cB.get(x) || 0, cT.get(x) || 0); if (d > 0) add.set(x, d); });
    let at = -1;
    for (const x of M) {
      const a = add.get(x);
      if (a) {
        let j = at + 1;
        while (j < out.length && !cB.has(out[j]) && !cM.has(out[j])) j++;   // 그쪽이 새로 넣은 줄 다음에
        out.splice(j, 0, x); at = j; add.set(x, a - 1); continue;
      }
      const j = out.indexOf(x, at + 1);
      if (j >= 0) at = j;
    }
    return out.join('\n');
  }
  function markDirty(f) {
    if (!S.sel) return;
    E.dirty[f] = true;
    setSt('saving');
    clearTimeout(E.timer);
    E.timer = setTimeout(saveMeeting, 700);
  }
  Object.keys(FMAP).forEach(fid => {
    const el = $(fid);
    el.addEventListener('input', () => { markDirty(FMAP[fid]); if (el.tagName === 'TEXTAREA') autoGrow(el); if (fid === 'mTitle') renderListSoon(); });
    if (fid === 'mDay') el.addEventListener('change', () => markDirty('day'));
    el.addEventListener('blur', () => { if (Object.keys(E.dirty).length) { clearTimeout(E.timer); saveMeeting(); } });
  });
  let rlT = 0;
  function renderListSoon() {
    clearTimeout(rlT);
    rlT = setTimeout(() => { const m = S.meetings.get(S.sel); if (m) { const tmp = Object.assign({}, m, {title: $('mTitle').value}); S.meetings.set(m.id, tmp); renderList(); S.meetings.set(m.id, m); } }, 250);
  }
  async function saveMeeting() {
    clearTimeout(E.timer);
    if (E.saving) { E.again = true; return; }
    const id = S.sel;
    const fs = Object.keys(E.dirty);
    if (!id || !fs.length) return;
    E.saving = true;
    setSt('saving');
    let ok = false;
    try {
      for (let tries = 0; tries < 4 && !ok; tries++) {
        const srv = S.meetings.get(id);
        if (!srv) throw new Error('지워진 회의예요');
        const body = {updated_by: ME()}, sent = {};
        for (const f of fs) {
          const mine = fieldVal(f);
          sent[f] = mine;
          if (f === 'day') { if (/^\d{4}-\d{2}-\d{2}$/.test(mine)) body.day = mine; }
          else if (f === 'title') body.title = mine.slice(0, 200);
          else body[f] = merge3(E.base[f], mine, srv[f]);
        }
        const r = await rest(`${T_M}?id=eq.${id}&updated_at=eq.${encodeURIComponent(srv.updated_at)}`, {method: 'PATCH', headers: RET, body: JSON.stringify(body)});
        if (r && r.length) {
          const row = r[0];
          S.meetings.set(id, row);
          if (later(row.updated_at, S.curM)) S.curM = row.updated_at;
          if (S.sel === id) {
            const nb = Object.assign({}, row);
            for (const f of fs) {
              if (fieldVal(f) === sent[f]) { delete E.dirty[f]; setField(f, row[f]); }
              else nb[f] = sent[f];   // 보내는 사이 더 적음 — 다음 저장은 '보낸 글' 기준으로 합친다
            }
            for (const f of Object.keys(FEL)) if (!fs.includes(f)) nb[f] = E.dirty[f] ? E.base[f] : row[f];
            E.base = nb;
          }
          ok = true;
        } else {
          // 그사이 다른 사람이 저장함 → 새로 받아서 다시 합침
          const fresh = await rest(`${T_M}?id=eq.${id}&select=*`);
          if (!fresh || !fresh.length) throw new Error('회의를 찾지 못했어요');
          S.meetings.set(id, fresh[0]);
        }
      }
      if (!ok) throw new Error('다른 사람과 동시에 고치는 중이에요');
      setSt(Object.keys(E.dirty).length ? 'saving' : 'ok');
      renderList();
    } catch (e) {
      console.warn('save', e);
      setSt('err');
      clearTimeout(E.retryT);
      E.retryT = setTimeout(saveMeeting, 5000);
    } finally {
      E.saving = false;
      if (E.again || (ok && Object.keys(E.dirty).length)) { E.again = false; clearTimeout(E.timer); E.timer = setTimeout(saveMeeting, 400); }
    }
  }
  function setSt(k) {
    const el = $('saveSt');
    el.className = 'save-st' + (k === 'err' ? ' err' : '');
    el.textContent = k === 'saving' ? '저장 중…' : k === 'err' ? '저장 안 됨 · 누르면 다시' : k === 'ok' ? '저장됨' : '';
  }
  $('saveSt').addEventListener('click', () => { if ($('saveSt').classList.contains('err')) saveMeeting(); });
  function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.max(140, el.scrollHeight + 2) + 'px'; }

  /* ══════════════════════ 사람별 세로 칸 ══════════════════════ */
  function columnsOf(m) {
    const mem = Array.isArray(m.members) ? m.members.filter(x => x && x.name) : [];
    const cols = mem.map(x => ({name: x.name, team: TMAP[x.team] ? x.team : teamOfName(x.name), off: false}));
    // 참여자에서 뺐어도 링크가 남아 있는 사람은 칸을 보여 줌 (링크가 안 숨게)
    linksOf(m.id).forEach(l => { if (!cols.some(c => c.name === l.person)) cols.push({name: l.person, team: teamOfName(l.person), off: true}); });
    return cols;
  }
  function analyze(mid) {
    const mine = linksOf(mid), groups = new Map(), accts = new Map();
    mine.forEach(l => {
      const k = dupKey(l);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(l);
      if (l.kind === 'account' || l.kind === 'story') { if (!accts.has(l.ig_user)) accts.set(l.ig_user, []); accts.get(l.ig_user).push(l); }
    });
    // 다른 회의에 나왔던 것
    const other = new Map();
    S.links.forEach(l => {
      if (l.meeting_id === mid) return;
      const m = S.meetings.get(l.meeting_id); if (!m) return;
      const k = dupKey(l);
      if (!other.has(k)) other.set(k, []);
      other.get(k).push({m, person: l.person});
    });
    return {groups, accts, other};
  }
  function renderBoard(force) {
    const box = $('board'), m = S.meetings.get(S.sel);
    paintMemN();
    if (!m) { box.innerHTML = ''; $('dupBar').hidden = true; return; }
    // 칸 안에 적는 중이면 다 적은 뒤에 다시 그림 (적던 글자 · 커서 지키기)
    const ae = document.activeElement;
    if (!force && ae && box.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) { boardPending = true; paintDupBar(analyze(m.id)); return; }
    boardPending = false;
    const A = analyze(m.id), cols = columnsOf(m);
    const ls = linksOf(m.id).sort((a, b) => b.pos - a.pos);
    const html = [];
    TEAMS.forEach(t => {
      const tc = cols.filter(c => c.team === t.k);
      if (!tc.length) return;
      html.push(`<div class="team" style="--tc:${t.c};--tt:${t.t}"><div class="team-h"><span class="bar"></span>${esc(t.name)}<span class="n">${tc.length}명</span></div><div class="cols">`);
      tc.forEach(c => html.push(colHtml(c, ls.filter(l => l.person === c.name), A)));
      html.push('</div></div>');
    });
    if (!cols.length) html.push('<div class="col-empty" style="width:100%">참여자가 없어요 — 위 <b>참여자</b> 단추로 사람을 골라 주세요</div>');
    box.innerHTML = html.join('');
    paintDupBar(A);
    paintNav();
  }
  function paintNav() {
    const b = $('board'), max = b.scrollWidth - b.clientWidth;
    $('bnavL').hidden = !(max > 4 && b.scrollLeft > 4);
    $('bnavR').hidden = !(max > 4 && b.scrollLeft < max - 4);
  }
  $('bnavL').addEventListener('click', () => $('board').scrollBy({left: -Math.round($('board').clientWidth * .8), behavior: 'smooth'}));
  $('bnavR').addEventListener('click', () => $('board').scrollBy({left: Math.round($('board').clientWidth * .8), behavior: 'smooth'}));
  window.addEventListener('resize', () => paintNav());
  function colHtml(c, ls, A) {
    const d = drafts.get(c.name) || {text: '', warn: []};
    const dupN = ls.filter(l => (A.groups.get(dupKey(l)) || []).length > 1).length;
    const warn = d.warn && d.warn.length ? `<div class="add-warn">⚠ <b>중복 계정 · 주소</b>${d.warn.map(w => `<div>${esc(keyLabel(dupKey(w.p)))} — 이미 <b>${esc(w.who.join(' · '))}</b>님 칸에 있어요</div>`).join('')}
      <div class="r"><button class="btn sm" type="button" data-act="force" data-p="${esc(c.name)}">그래도 넣기</button><button class="btn sm" type="button" data-act="drop" data-p="${esc(c.name)}">넣지 않기</button></div></div>` : '';
    return `<div class="col" data-p="${esc(c.name)}">
      <div class="col-h"><span class="av">${esc(c.name.slice(-2))}</span><span class="nm">${esc(c.name)}</span>${c.off ? '<span class="muted" style="font-size:11px">(참여자 아님)</span>' : ''}
        <span class="ct${dupN ? ' w' : ''}">${dupN ? `⚠ ${dupN} · ` : ''}${ls.length}개</span></div>
      <div class="add">
        <form class="add-in" data-p="${esc(c.name)}"><input type="text" inputmode="url" enterkeyhint="done" autocomplete="off" placeholder="인스타 주소 · @아이디 붙여넣기" value="${esc(d.text)}" aria-label="${esc(c.name)} 칸에 링크 넣기"><button class="btn" type="submit">넣기</button></form>
        ${warn}
      </div>
      <div class="lks">${ls.length ? ls.map(l => linkHtml(l, A)).join('') : '<div class="col-empty">계정 · 피드 · 릴스 주소를 넣어 주세요</div>'}</div>
    </div>`;
  }
  function linkHtml(l, A) {
    const k = dupKey(l), same = (A.groups.get(k) || []).filter(x => x.id !== l.id);
    let w = '';
    if (same.length) {
      const who = [...new Set(same.map(x => x.person))];
      w = `<div class="lk-w">⚠ 중복 — ${who.map(n => n === l.person ? '이 칸에 또' : esc(n) + '님 칸에도').join(' · ')} 있어요</div>`;
    }
    let p = '';
    if (!same.length && (l.kind === 'post' || l.kind === 'reel') && l.ig_user && A.accts.has(l.ig_user)) {
      const who = [...new Set(A.accts.get(l.ig_user).map(x => x.person))];
      p = `<div class="lk-p amb">같은 계정 @${esc(l.ig_user)} 을 ${esc(who.join(' · '))}님이 넣었어요</div>`;
    }
    const prev = A.other.get(k);
    if (prev && prev.length) {
      const seen = [], uniq = [];
      prev.sort((a, b) => (b.m.day || '').localeCompare(a.m.day || '')).forEach(x => { const s = x.m.id + x.person; if (!seen.includes(s)) { seen.push(s); uniq.push(x); } });
      const shown = uniq.slice(0, 2).map(x => `${shortDay(x.m.day)} ${esc(x.person)}`).join(', ');
      p += `<div class="lk-p">↺ 다른 회의에도 나왔어요 · ${shown}${uniq.length > 2 ? ` 외 ${uniq.length - 2}` : ''}</div>`;
    }
    const by = l.created_by && l.created_by !== l.person ? ` · ${esc(l.created_by)} 넣음` : '';
    const memo = editMemo === l.id
      ? `<textarea class="lk-me" data-id="${esc(l.id)}" maxlength="2000" placeholder="메모 (Enter 저장 · Esc 취소)">${esc(l.memo || '')}</textarea>`
      : (l.memo ? `<div class="lk-m">${esc(l.memo)}</div>` : '');
    return `<div class="lk k-${esc(l.kind)}${same.length ? ' dup' : ''}" data-id="${esc(l.id)}">
      <div class="lk-ic">${ICON[l.kind] || ICON.link}</div>
      <div class="lk-b"><div class="lk-t">${esc(linkTitle(l))}</div><div class="lk-s">${esc(KIND_NAME[l.kind] || '링크')} · ${esc(linkSub(l))}${by}</div>${memo}${w}${p}</div>
      <div class="lk-a">
        <a href="${esc(l.url)}" target="_blank" rel="noopener" title="새 탭으로 열기" aria-label="새 탭으로 열기">${ICON.open}</a>
        <button type="button" data-act="memo" title="메모" aria-label="메모">${ICON.edit}</button>
        <button type="button" class="del" data-act="del" title="지우기" aria-label="지우기">${ICON.del}</button>
      </div>
    </div>`;
  }
  function paintDupBar(A) {
    const bar = $('dupBar'), rows = [];
    A.groups.forEach((arr, k) => {
      if (arr.length < 2) return;
      const who = arr.map(x => x.person);
      const cnt = new Map(); who.forEach(n => cnt.set(n, (cnt.get(n) || 0) + 1));
      rows.push(`<li><span class="k">${esc(keyLabel(k))}</span> — ${[...cnt].map(([n, c]) => esc(n) + (c > 1 ? ` ${c}번` : '')).join(' · ')}</li>`);
    });
    bar.hidden = !rows.length;
    if (rows.length) bar.innerHTML = `⚠ <b>중복된 계정 · 게시물 ${rows.length}건</b> — 같은 주소가 여러 칸에 있어요. 한 사람만 남겨 주세요<ul>${rows.join('')}</ul>`;
  }
  function paintMemN() {
    const m = S.meetings.get(S.sel);
    $('memN').textContent = m && Array.isArray(m.members) ? m.members.length + '명' : '';
  }

  /* ── 링크 넣기 ── */
  function findDup(p, mid, extra) {
    const k = dupKey(p);
    const who = linksOf(mid).concat(extra || []).filter(l => dupKey(l) === k).map(l => l.person);
    return who.length ? [...new Set(who)] : null;
  }
  async function addLinks(person, text, force) {
    const m = S.meetings.get(S.sel); if (!m) return;
    const parts = String(text || '').split(/[\s,]+/).filter(Boolean);
    const parsed = parts.map(parseLink).filter(Boolean);
    if (!parsed.length) { if (parts.length) toast('인스타 주소나 링크 모양이 아니에요', true); return false; }
    const ok = [], warn = [];
    parsed.forEach(p => {
      const pp = Object.assign({person}, p);
      const who = force ? null : findDup(pp, m.id, ok);
      if (who) warn.push({p: pp, who}); else ok.push(pp);
    });
    const d = drafts.get(person) || {text: '', warn: []};
    d.text = ''; d.warn = force ? [] : warn;
    drafts.set(person, d);
    if (ok.length) {
      const base = Date.now();
      const rows = ok.map((p, i) => ({meeting_id: m.id, person, url: p.url, kind: p.kind, ig_user: p.ig_user, ig_code: p.ig_code, memo: '', pos: base + i, created_by: ME()}));
      try {
        const r = await rest(T_L, {method: 'POST', headers: RET, body: JSON.stringify(rows)});
        (r || []).forEach(x => { S.links.set(x.id, x); if (later(x.updated_at, S.curL)) S.curL = x.updated_at; });
        if (!warn.length) toast(ok.length > 1 ? `${ok.length}개 넣었어요` : '넣었어요');
      } catch (e) {
        console.warn('add', e);
        d.text = parts.join(' ');
        toast('저장하지 못했어요: ' + e.message, true);
      }
    }
    renderBoard(true);
    renderList();
    const inp = document.querySelector(`.add-in[data-p="${cssEsc(person)}"] input`);
    if (inp && matchMedia('(pointer:fine)').matches) inp.focus();
    return true;
  }
  const cssEsc = s => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');

  const board = $('board');
  board.addEventListener('submit', e => {
    const f = e.target.closest('.add-in'); if (!f) return;
    e.preventDefault();
    const inp = f.querySelector('input');
    addLinks(f.dataset.p, inp.value);
  });
  board.addEventListener('input', e => {
    const f = e.target.closest('.add-in'); if (!f) return;
    const d = drafts.get(f.dataset.p) || {text: '', warn: []};
    d.text = e.target.value; drafts.set(f.dataset.p, d);
  });
  // 붙여 넣으면 바로 넣기 (주소가 맞을 때만)
  board.addEventListener('paste', e => {
    const f = e.target.closest('.add-in'); if (!f) return;
    setTimeout(() => {
      const v = e.target.value.trim(), parts = v.split(/[\s,]+/).filter(Boolean);
      if (parts.length && parts.every(x => parseLink(x))) addLinks(f.dataset.p, v);
    }, 0);
  });
  board.addEventListener('focusout', () => { setTimeout(() => { if (boardPending && !board.contains(document.activeElement)) renderBoard(); }, 0); });
  board.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'force' || a === 'drop') {
        const person = act.dataset.p, d = drafts.get(person);
        const items = d && d.warn ? d.warn : [];
        if (d) d.warn = [];
        if (a === 'force' && items.length) addLinks(person, items.map(w => w.p.url).join(' '), true);
        else renderBoard(true);
        return;
      }
      const card = act.closest('.lk'); if (!card) return;
      const l = S.links.get(card.dataset.id); if (!l) return;
      if (a === 'memo') { editMemo = l.id; renderBoard(true); const t = board.querySelector(`.lk-me[data-id="${cssEsc(l.id)}"]`); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
      else if (a === 'del') delLink(l);
      return;
    }
    if (e.target.closest('a, textarea, input, button')) return;
    const card = e.target.closest('.lk'); if (!card) return;
    const l = S.links.get(card.dataset.id); if (!l) return;
    if (!canHover.matches && embedSrc(l)) showPreview(card, l, true);
    else window.open(l.url, '_blank', 'noopener');
  });
  board.addEventListener('keydown', e => {
    const t = e.target.closest('.lk-me'); if (!t) return;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); saveMemo(t); }
    else if (e.key === 'Escape') { editMemo = null; renderBoard(true); }
  });
  board.addEventListener('focusout', e => { const t = e.target.closest && e.target.closest('.lk-me'); if (t) saveMemo(t); });
  async function saveMemo(t) {
    if (t._done) return; t._done = true;
    const l = S.links.get(t.dataset.id); editMemo = null;
    if (!l) { renderBoard(true); return; }
    const v = t.value.trim().slice(0, 2000);
    if (v === (l.memo || '')) { renderBoard(true); return; }
    try {
      const r = await rest(`${T_L}?id=eq.${l.id}`, {method: 'PATCH', headers: RET, body: JSON.stringify({memo: v})});
      if (r && r[0]) { S.links.set(l.id, r[0]); if (later(r[0].updated_at, S.curL)) S.curL = r[0].updated_at; }
    } catch (e) { toast('메모를 저장하지 못했어요: ' + e.message, true); }
    renderBoard(true);
  }
  async function delLink(l) {
    hidePreview();
    try {
      const r = await rest(`${T_L}?id=eq.${l.id}`, {method: 'PATCH', headers: RET, body: JSON.stringify({deleted_at: new Date().toISOString()})});
      S.links.delete(l.id);
      if (r && r[0] && later(r[0].updated_at, S.curL)) S.curL = r[0].updated_at;
      renderBoard(true); renderList();
    } catch (e) { toast('지우지 못했어요: ' + e.message, true); }
  }

  /* ══════════════════════ 인스타 미리보기 ══════════════════════
     PC = 링크 위에 마우스를 0.3초 올리면 옆에 인스타 화면(인스타 공식 퍼가기 embed), 미리보기 위로 옮겨도 그대로.
     휴대폰 = 링크를 누르면 아래에서 올라옴. 한 번 연 미리보기는 몇 개 기억해 다시 올리면 바로 뜬다. */
  const canHover = matchMedia('(hover: hover) and (pointer: fine)');
  const pv = $('pv'), pvB = $('pvB'), pvCache = new Map();
  let pvCard = null, pvShowT = 0, pvHideT = 0;
  function frameFor(src) {
    let f = pvCache.get(src);
    if (f) { pvCache.delete(src); pvCache.set(src, f); return f; }
    f = document.createElement('iframe');
    f.src = src; f.loading = 'eager'; f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.setAttribute('allow', 'encrypted-media; picture-in-picture; clipboard-write');
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
    f.title = '인스타 미리보기';
    f.addEventListener('load', () => { f.dataset.loaded = '1'; if (f.style.display !== 'none') $('pvSpin').hidden = true; });
    pvB.appendChild(f);
    pvCache.set(src, f);
    while (pvCache.size > 8) { const [k, old] = pvCache.entries().next().value; pvCache.delete(k); old.remove(); }
    return f;
  }
  function showPreview(card, l, sheet) {
    const src = embedSrc(l); if (!src) return;
    clearTimeout(pvHideT);
    if (pvCard && pvCard !== card) pvCard.classList.remove('pv-on');
    pvCard = card; card.classList.add('pv-on');
    $('pvT').textContent = linkTitle(l);
    $('pvOpen').href = l.url;
    const f = frameFor(src);
    pvCache.forEach(x => { x.style.display = x === f ? 'block' : 'none'; });
    $('pvSpin').hidden = f.dataset.loaded === '1';
    pv.classList.toggle('sheet', !!sheet);
    $('pvVeil').hidden = !sheet;
    pv.hidden = false;
    if (sheet) { pv.style.height = ''; return; }
    const r = card.getBoundingClientRect(), W = 360, vw = innerWidth, vh = innerHeight;
    const H = Math.min(l.kind === 'account' || l.kind === 'story' ? 560 : 640, vh - 24);
    let x = r.right + 10;
    if (x + W > vw - 8) x = r.left - W - 10;
    if (x < 8) x = clamp(r.left, 8, vw - W - 8);
    pv.style.left = x + 'px';
    pv.style.top = clamp(r.top - 60, 12, vh - H - 12) + 'px';
    pv.style.height = H + 'px';
  }
  function hidePreview() {
    clearTimeout(pvShowT); clearTimeout(pvHideT);
    pv.hidden = true; $('pvVeil').hidden = true;
    if (pvCard) { pvCard.classList.remove('pv-on'); pvCard = null; }
  }
  board.addEventListener('mouseover', e => {
    if (!canHover.matches) return;
    const card = e.target.closest('.lk'); if (!card || card.contains(e.relatedTarget)) return;
    if (e.target.closest('.lk-a')) return;
    const l = S.links.get(card.dataset.id); if (!l || !embedSrc(l)) return;
    clearTimeout(pvShowT); clearTimeout(pvHideT);
    pvShowT = setTimeout(() => showPreview(card, l, false), pv.hidden ? 300 : 80);
  });
  board.addEventListener('mouseout', e => {
    if (!canHover.matches) return;
    const card = e.target.closest('.lk'); if (!card || card.contains(e.relatedTarget)) return;
    clearTimeout(pvShowT);
    if (pv.contains(e.relatedTarget)) return;
    pvHideT = setTimeout(hidePreview, 250);
  });
  pv.addEventListener('mouseenter', () => clearTimeout(pvHideT));
  pv.addEventListener('mouseleave', e => { if (pv.classList.contains('sheet')) return; if (pvCard && pvCard.contains(e.relatedTarget)) return; pvHideT = setTimeout(hidePreview, 250); });
  $('pvX').addEventListener('click', hidePreview);
  $('pvVeil').addEventListener('click', hidePreview);
  board.addEventListener('scroll', () => { if (!pv.classList.contains('sheet')) hidePreview(); paintNav(); }, {passive: true});
  window.addEventListener('scroll', () => { if (!pv.classList.contains('sheet')) hidePreview(); }, {passive: true});
  window.addEventListener('resize', () => hidePreview());

  /* ══════════════════════ 참여자 ══════════════════════ */
  async function openMembers() {
    if (!S.staff) await loadStaff();
    $('pTeam').innerHTML = TEAMS.map(t => `<option value="${t.k}"${t.k === 'etc' ? ' selected' : ''}>${esc(t.name)}</option>`).join('');
    paintMembers();
    $('memDlg').hidden = false;
  }
  function paintMembers() {
    const m = S.meetings.get(S.sel); if (!m) return;
    const mem = Array.isArray(m.members) ? m.members : [];
    const on = new Set(mem.map(x => x.name));
    const st = S.staff || {design: [], mkt: [], md: []};
    $('memBody').innerHTML = TEAMS.map(t => {
      const names = (t.k === 'etc' ? ETC_DEFAULT.slice() : st[t.k].slice());
      mem.forEach(x => { if ((TMAP[x.team] ? x.team : teamOfName(x.name)) === t.k && !names.includes(x.name)) names.push(x.name); });
      if (!names.length) return '';
      return `<div class="mg" style="--tc:${t.c};--tt:${t.t}"><div class="mg-h"><span class="bar"></span>${esc(t.name)}</div><div class="pills">${
        names.map(n => `<label class="pill${on.has(n) ? ' on' : ''}" data-n="${esc(n)}" data-t="${t.k}"><input type="checkbox"${on.has(n) ? ' checked' : ''}><span class="ck"></span>${esc(n)}</label>`).join('')
      }</div></div>`;
    }).join('');
  }
  async function setMembers(next) {
    const m = S.meetings.get(S.sel); if (!m) return;
    try {
      const r = await rest(`${T_M}?id=eq.${m.id}`, {method: 'PATCH', headers: RET, body: JSON.stringify({members: next, updated_by: ME()})});
      if (r && r[0]) {
        const row = r[0];
        S.meetings.set(m.id, row);
        if (later(row.updated_at, S.curM)) S.curM = row.updated_at;
        if (E.base) { E.base.members = row.members; }
      }
    } catch (e) { toast('참여자를 저장하지 못했어요: ' + e.message, true); }
    paintMembers(); renderBoard(true);
  }
  function memberOrder(list) {   // 팀 순서 → 직원 명단 순서 → 넣은 순서
    const st = S.staff || {design: [], mkt: [], md: []};
    const rank = x => { const ti = TEAMS.findIndex(t => t.k === x.team); const arr = x.team === 'etc' ? ETC_DEFAULT : (st[x.team] || []); const i = arr.indexOf(x.name); return ti * 1000 + (i < 0 ? 500 : i); };
    return list.map((x, i) => ({x, i})).sort((a, b) => rank(a.x) - rank(b.x) || a.i - b.i).map(o => o.x);
  }
  $('memBody').addEventListener('click', e => {
    const p = e.target.closest('.pill'); if (!p) return;
    e.preventDefault();
    const m = S.meetings.get(S.sel); if (!m) return;
    const mem = (Array.isArray(m.members) ? m.members : []).slice(), n = p.dataset.n;
    const i = mem.findIndex(x => x.name === n);
    if (i >= 0) {
      const cnt = linksOf(m.id).filter(l => l.person === n).length;
      mem.splice(i, 1);
      if (cnt) toast(`${n}님 링크 ${cnt}개는 칸에 그대로 남아요`);
    } else mem.push({name: n, team: p.dataset.t});
    setMembers(memberOrder(mem));
  });
  $('pAdd').addEventListener('click', () => {
    const n = $('pName').value.trim().slice(0, 40), t = $('pTeam').value;
    if (!n) { $('pName').focus(); return; }
    const m = S.meetings.get(S.sel); if (!m) return;
    const mem = (Array.isArray(m.members) ? m.members : []).slice();
    if (mem.some(x => x.name === n)) { toast('이미 있는 이름이에요', true); return; }
    mem.push({name: n, team: t});
    $('pName').value = '';
    setMembers(memberOrder(mem));
  });
  $('pName').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('pAdd').click(); } });
  $('memBtn').addEventListener('click', openMembers);
  $('memClose').addEventListener('click', () => { $('memDlg').hidden = true; });
  $('memDlg').addEventListener('click', e => { if (e.target === $('memDlg')) $('memDlg').hidden = true; });

  /* ══════════════════════ 더보기 (복사 · 지우기) ══════════════════════ */
  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  $('moreBtn').addEventListener('click', e => {
    e.stopPropagation();
    if (menuEl) { closeMenu(); return; }
    const r = $('moreBtn').getBoundingClientRect();
    menuEl = document.createElement('div');
    menuEl.className = 'menu';
    menuEl.innerHTML = `<button type="button" data-m="copy">${ICON.copy} 회의록 글로 복사 (카톡에 붙여넣기)</button>
      <button type="button" class="danger" data-m="del">${ICON.trash} 이 회의 지우기</button>`;
    document.body.appendChild(menuEl);
    menuEl.style.top = (r.bottom + scrollY + 6) + 'px';
    menuEl.style.left = Math.max(8, r.right + scrollX - menuEl.offsetWidth) + 'px';
    menuEl.addEventListener('click', ev => {
      const b = ev.target.closest('[data-m]'); if (!b) return;
      ev.stopPropagation();
      if (b.dataset.m === 'copy') { closeMenu(); copyText(); }
      else if (b.dataset.m === 'del') {
        if (!b.dataset.sure) { b.dataset.sure = '1'; b.innerHTML = `${ICON.trash} 한 번 더 누르면 지워요`; return; }
        closeMenu(); deleteMeeting();
      }
    });
  });
  document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (menuEl) closeMenu();
    else if (!$('memDlg').hidden) $('memDlg').hidden = true;
    else if (!pv.hidden) hidePreview();
    else if (document.body.classList.contains('side-open')) closeSide();
  });
  async function copyText() {
    const m = S.meetings.get(S.sel); if (!m) return;
    const A = analyze(m.id), cols = columnsOf(m), out = [`[${dayLabel(m.day)}] ${m.title || '마케팅 회의'}`];
    TEAMS.forEach(t => cols.filter(c => c.team === t.k).forEach(c => {
      const ls = linksOf(m.id).filter(l => l.person === c.name).sort((a, b) => b.pos - a.pos);
      out.push('', `■ ${t.name} ${c.name} (${ls.length})`);
      ls.forEach(l => out.push(`- ${l.url}${l.memo ? '  ' + l.memo.replace(/\n/g, ' ') : ''}${(A.groups.get(dupKey(l)) || []).length > 1 ? '  ⚠중복' : ''}`));
    }));
    const notes = fieldVal('notes').trim(), dec = fieldVal('decisions').trim();
    if (notes) out.push('', '■ 회의 메모', notes);
    if (dec) out.push('', '■ 결정 · 할 일', dec);
    const txt = out.join('\n');
    try { await navigator.clipboard.writeText(txt); toast('복사했어요 — 카톡에 붙여 넣으면 돼요'); }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('복사했어요'); } catch (er) { toast('복사하지 못했어요', true); }
      ta.remove();
    }
  }

  /* ── 휴대폰 회의 목록 서랍 ── */
  function closeSide() { document.body.classList.remove('side-open'); $('sideVeil').hidden = true; }
  $('sideBtn').addEventListener('click', () => { document.body.classList.add('side-open'); $('sideVeil').hidden = false; });
  $('sideVeil').addEventListener('click', closeSide);

  /* ══════════════════════ 잠금 · 시작 ══════════════════════ */
  function isUnlocked() {
    if (window.__mtgInOffice) return true;
    return lsGet('brightbeed_unlocked') === '1' && lsGet('brightbeed_auth_ver') === AUTH_VERSION
      && !(lsGet('brightbeed_role') === 'master' && lsGet('brightbeed_master_ver') !== MASTER_PIN_VER);
  }
  async function sha256hex(s) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('lockPin').value.trim();
    let role = null;
    try { role = PIN_HASH[await sha256hex(v)] || null; } catch (err) { role = null; }
    if (!role) { $('lockErr').textContent = '접속 코드가 올바르지 않아요'; $('lockPin').value = ''; $('lockPin').focus(); return; }
    lsSet('brightbeed_unlocked', '1'); lsSet('brightbeed_role', role); lsSet('brightbeed_auth_ver', AUTH_VERSION);
    if (role === 'master') lsSet('brightbeed_master_ver', MASTER_PIN_VER);
    $('lock').hidden = true;
    start();
  });

  async function start() {
    $('app').hidden = false;
    try { await Promise.all([loadAll(), loadStaff()]); }
    catch (e) { toast('회의록을 못 불러왔어요: ' + e.message, true); }
    const want = (location.hash || '').slice(1);
    const id = S.meetings.has(want) ? want : S.meetings.has(lsGet(LS.sel)) ? lsGet(LS.sel) : (sortedMeetings()[0] || {}).id || null;
    pickMeeting(id);
    pollLoop();
    if (window.OfficeLive) liveBoot(); else { window.addEventListener('load', liveBoot); setTimeout(liveBoot, 5000); }
  }
  window.__mtgTest = {parseLink, dupKey, merge3};   // 확인용
  if (isUnlocked()) start(); else { $('lock').hidden = false; setTimeout(() => $('lockPin').focus(), 50); }
})();
</script>
