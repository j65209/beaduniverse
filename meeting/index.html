<script src="../office-undo.js?v=1" data-skip="mkt_meetings\?columns="></script><!-- 어디서든 되돌리기 (office-undo.js) — 그 주 줄이 저절로 생기는 것만 뺌 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<script>
  /* 오피스 안 화면(iframe, index.html 의 TOOL_PAGES 'meeting')으로 열렸으면 '← 오피스' 는 그 화면을 닫는다 (bbToolClose).
     혼자 열면 이 페이지의 잠금 화면에서 오피스 접속 코드를 받는다. (인스타 피드 시뮬레이터 feed/ 와 같은 방식) */
  (function () {
    var inOffice = false, home = '';
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    window.__mtgInOffice = inOffice;
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
      // 맨 위 '주간 회의록' 탭 — 오피스 안에선 그 자리에서 바꿔 끼운다 (bbToolSwap)
      Array.prototype.forEach.call(document.querySelectorAll('a[data-swap]'), function (a) {
        a.href = inOffice ? home + '#' + a.dataset.swap : home + a.dataset.swap + '/';   // 회사 주소 입구에선 <base> 가 깃허브라 지금 주소 기준으로
        if (!inOffice) return;
        a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolSwap(a.dataset.swap); }
          catch (err) { window.parent.location.hash = a.dataset.swap; window.parent.location.reload(); }   // 배포 전부터 열려 있던 오피스
        });
      });
    });
  })();
</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  /* 마케팅 회의록 — 오피스 업무용 툴 (2026-11-24)
     사장님 요청 ①: "업무용툴에 마케팅 회의록 만들어주고 / 인스타그램 피드나 릴스나 계정 주소 넣으면 마우스오버로 볼 수 있게 /
     디자인팀 · 마케팅팀 · 엠디팀 참여하고 각각 이름으로 세로로 만들어줘서 각자 링크 넣을 수 있게 / 중복되는 계정주소가 있으면 경고문"
     사장님 요청 ②: "매주 수요일 · 오후2시까지 · 각각 브랜드별로 벤치마킹 or 래퍼런스 인스타그램 주소 넣기 / 좌측 목록은 지워주고 상단에서 날짜 11월 1주차 2주차 이런식으로 /
     배지 선택 가능하게 · 중복안되게 · 사람마다"
     사장님 요청 ③: "다들 인스타그램 주소 기재할때 어떤 브랜드 래퍼런스 주소인지 선택하게 하는거라" → 사람이 브랜드를 맡는 게 아니라 주소마다 브랜드를 고른다
     사장님 요청 ④: "벤치마킹 or 레퍼런스 같이 합쳐줘 버튼" → 둘 중 고르기 없음, '벤치마킹 · 레퍼런스' 한 칸 (카드의 종류 배지도 없음). 저장소 tag 는 옛 줄에만 있고 새 줄은 비움
     사장님 요청 ⑤: "마케팅 회의록 옆에 주간 회의록 만들어줘" → weekly/ (맨 위 탭으로 오감)
     · 맨 위 = 달 ‹ 11월 › + 주차 탭 (그 달의 첫째 수요일 = 1주차). 회의 줄(mkt_meetings)은 그 주에 처음 무언가 넣을 때 저절로 생긴다 (수요일 하루에 한 줄)
     · 안내 띠 = 매주 수요일 오후 2시까지 + 남은 시간 · 아직 안 넣은 사람 · 브랜드별 개수(누르면 그 브랜드 주소만 보기)
     · 사람마다 세로 칸(디자인팀 · 마케팅팀 · MD팀 순): 브랜드 배지 하나 고르기 → '벤치마킹 · 레퍼런스' 주소 붙여넣기.
       브랜드를 안 고르고 주소부터 넣으면 "이 주소는 어떤 브랜드예요?" 를 묻고, 배지를 누르는 순간 저장. 저장 뒤엔 배지 선택이 풀려 다음 주소도 다시 고른다
     · 카드의 브랜드 배지를 누르면 나중에도 바꿀 수 있다
     · 주소 = 한 주에 같은 계정 · 게시물은 한 번만, 사람이 달라도 (mkt_meeting_links_one). 또 넣으면 빨간 안내만 뜨고 안 들어감. 다른 주에 나왔던 것은 회색 안내
     · 마우스를 올리면 인스타 미리보기(휴대폰은 누르면)
     · 저장 = 오피스 슈퍼베이스 mkt_meetings · mkt_meeting_links(주소 한 줄씩, brand). 지우기는 deleted_at 만 */
  :root {
    --bg: #f5f6f8; --panel: #fff; --line: #e5e7eb; --line2: #cfd4dc; --text: #1f2329; --t2: #4b5563; --t3: #8b93a1;
    --red: #dc2626; --red-t: #fef2f2; --soft: #f1f3f6;
    --top: 52px; --wkh: 56px; --r: 12px; --colw: 218px;
    --font: Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  * { box-sizing: border-box }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased }
  button, input, textarea, select { font-family: inherit; font-size: inherit; color: inherit }
  a { color: var(--text) }
  [hidden] { display: none !important }
  svg { flex: none }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--text); outline-offset: 1px }

  /* ── 상단 ── */
  .top { position: sticky; top: 0; z-index: 30; min-height: var(--top); display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line) }
  .back { color: var(--t2); text-decoration: none; font-weight: 600; font-size: 13px; white-space: nowrap; padding: 6px 8px; border-radius: 8px }
  .back:hover { background: var(--soft) }
  .back i { font-style: normal }
  .ttl { display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: var(--soft); flex: none }
  .ttl b, .ttl a { display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; text-decoration: none; color: var(--t2) }
  .ttl b { background: #fff; color: var(--text); font-weight: 800; box-shadow: 0 1px 3px rgba(15, 23, 42, .13) }
  .ttl a:hover { color: var(--text) }
  .top-r { display: flex; align-items: center; gap: 8px; margin-left: auto; flex: none }
  .save-st { font-size: 12px; color: var(--t3); white-space: nowrap }
  .save-st.err { color: var(--red); font-weight: 600; cursor: pointer }
  .btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 600; font-size: 13px;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; color: var(--text) }
  .btn:hover { border-color: var(--line2); background: #fafbfc }
  .btn.pri { background: var(--text); border-color: var(--text); color: #fff }
  .btn.pri:hover { background: #000; border-color: #000 }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 12px }
  .btn.ico { width: 32px; padding: 0 }
  .btn svg { width: 16px; height: 16px }
  .btn:disabled { opacity: .45; cursor: default }
  .menu { position: absolute; z-index: 60; background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(15, 23, 42, .14);
    padding: 4px; min-width: 190px }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; text-align: left; font-size: 13px }
  .menu button:hover { background: var(--soft) }
  .menu svg { width: 16px; height: 16px }
  .menu button.on { font-weight: 800; background: var(--soft) }

  /* ── 주차 고르기 ── */
  .weeks { position: sticky; top: var(--top); z-index: 25; min-height: var(--wkh); display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #fff; border-bottom: 1px solid var(--line) }
  .wk-m { display: flex; align-items: center; gap: 4px; flex: none }
  .wk-m b { min-width: 54px; text-align: center; font-size: 18px; font-weight: 800; letter-spacing: -.4px; white-space: nowrap }
  .wk-t { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 1px }
  .wk-t::-webkit-scrollbar { display: none }
  .wk { flex: none; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; white-space: nowrap }
  .wk:hover { border-color: var(--line2) }
  .wk b { font-weight: 700; font-size: 14.5px }
  .wk span { font-size: 12.5px; color: var(--t3); font-weight: 500 }
  .wk i { font-style: normal; font-size: 11.5px; font-weight: 700; color: var(--t2); background: var(--soft); border-radius: 6px; padding: 2px 6px }
  .wk.on { background: var(--text); border-color: var(--text); color: #fff }
  .wk.on span { color: rgba(255, 255, 255, .72) }
  .wk.on i { background: rgba(255, 255, 255, .18); color: #fff }

  .main { min-width: 0; padding: 14px 16px 40px }

  /* ── 안내 띠 ── */
  .rule { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 10px }
  .rule-1 { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap }
  .rule-1 b { font-size: 16px; font-weight: 800; letter-spacing: -.3px }
  .rule-1 .how { color: var(--t2); font-size: 13.5px }
  .due { margin-left: auto; font-size: 13px; color: var(--t2); font-weight: 600; text-align: right }
  .due .red { color: var(--red); font-weight: 700 }
  .bstrip { display: flex; flex-wrap: wrap; gap: 6px }
  .bst { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-size: 12.5px; white-space: nowrap; cursor: pointer }
  .bst:hover { border-color: var(--t3) }
  .bst b { font-weight: 700 }
  .bst.zero { color: var(--t3) }
  .bst.on { background: var(--text); border-color: var(--text); color: #fff }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block }

  /* ── 사람별 세로 칸 ── */
  .board-w { position: relative }
  .bnav { position: absolute; top: -4px; z-index: 5; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line2); background: #fff;
    box-shadow: 0 2px 8px rgba(15, 23, 42, .14); display: grid; place-items: center; cursor: pointer; color: var(--t2) }
  .bnav:hover { color: var(--text); border-color: var(--t3) }
  .bnav svg { width: 16px; height: 16px }
  .bnav.l { left: -6px } .bnav.r { right: -6px }
  @media (hover: none) { .bnav { display: none } }
  .board { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 12px; align-items: flex-start; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch }
  .team { flex: var(--n) 0 auto; display: flex; flex-direction: column; gap: 8px; scroll-snap-align: start }
  .team-h { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 13px; padding: 0 4px }
  .team-h .n { font-weight: 600; color: var(--t3); font-size: 12px }
  .cols { display: flex; gap: 10px; align-items: flex-start }
  .col { flex: 1 0 var(--colw); width: var(--colw); max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r);
    display: flex; flex-direction: column; scroll-snap-align: start }
  .col-h { display: flex; align-items: center; gap: 8px; padding: 11px 12px 9px }
  .av { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); color: var(--t2); display: grid; place-items: center; font-weight: 700; font-size: 11.5px; flex: none }
  .col-h .nm { font-weight: 800; font-size: 14.5px }
  .col-h .ct { margin-left: auto; font-size: 12px; color: var(--t3); font-weight: 600; white-space: nowrap }
  .col-h .ct.w { color: var(--red); font-weight: 700 }

  /* 주소 넣기 — 브랜드 배지 → '벤치마킹 · 레퍼런스' 주소 */
  .ent { padding: 0 10px 10px }
  .ask { font-size: 12.5px; font-weight: 600; color: var(--t2); padding: 0 2px 6px }
  .ent.need .ask { color: var(--red); font-weight: 700 }
  .bds { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px }
  .bd { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line2); background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 600; white-space: nowrap }
  .bd:hover { border-color: var(--text) }
  .bd.on { background: var(--text); border-color: var(--text); color: #fff }
  .ent.need .bds { margin: 0 -4px 8px; padding: 4px; border-radius: 12px; box-shadow: 0 0 0 1.5px var(--red) }
  .kindb { display: block; width: 100%; height: 34px; border: 0; border-radius: 9px; background: var(--soft); padding: 0 10px; margin-bottom: 6px; cursor: pointer; font-size: 12.5px; font-weight: 700; color: var(--text) }
  .add-in { display: flex; gap: 6px }
  .add-in input { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--line2); border-radius: 8px; padding: 0 10px; outline: none; background: #fff; font-size: 13px }
  .add-in input::placeholder { color: var(--t3) }
  .add-in input:focus { border-color: var(--text) }
  .add-in .btn { height: 36px; padding: 0 11px }
  .add-warn { position: relative; margin-top: 6px; border: 1px solid rgba(220, 38, 38, .35); background: var(--red-t); border-radius: 9px; padding: 8px 28px 8px 10px; font-size: 12.5px; color: #991b1b; line-height: 1.5; word-break: break-word }
  .add-warn button { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0; background: none; color: inherit; cursor: pointer; font-size: 16px; line-height: 1 }
  .lks { display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px }
  .lks:empty { display: none }

  .lk { position: relative; display: flex; gap: 9px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 9px; background: #fff;
    cursor: pointer; transition: border-color .12s, box-shadow .12s }
  .lk:hover, .lk.pv-on { border-color: var(--line2); box-shadow: 0 2px 8px rgba(15, 23, 42, .07) }
  .lk-ic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; flex: none; background: var(--soft); color: var(--t2) }
  .lk-ic svg { width: 16px; height: 16px }
  .lk-b { flex: 1; min-width: 0 }
  .lk-t { font-weight: 700; font-size: 13.5px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .lk-s { display: flex; align-items: center; flex-wrap: wrap; gap: 4px; font-size: 11.5px; color: var(--t3); margin-top: 5px; min-width: 0 }
  .lk-s span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
  .bb { flex: none; display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line2); background: #fff; color: var(--text); font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap }
  .bb:hover { border-color: var(--t3) }
  .bb.none { color: var(--red); border-style: dashed; border-color: var(--red) }
  .lk-m { font-size: 12.5px; color: var(--t2); margin-top: 5px; white-space: pre-wrap; word-break: break-word }
  .lk-me { width: 100%; margin-top: 5px; border: 1px solid var(--text); border-radius: 7px; padding: 5px 7px; font-size: 12.5px; outline: none; resize: vertical; min-height: 34px; background: #fff }
  .lk-p { font-size: 11.5px; color: var(--t3); margin-top: 4px }
  .lk-p.amb { color: var(--red) }
  .lk-a { position: absolute; top: 5px; right: 5px; display: flex; gap: 1px; padding: 2px; border-radius: 8px; background: #fff;
    box-shadow: 0 1px 4px rgba(15, 23, 42, .12); opacity: 0; pointer-events: none; transition: opacity .12s }
  .lk:hover .lk-a, .lk:focus-within .lk-a { opacity: 1; pointer-events: auto }
  .lk-a button, .lk-a a { width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; color: var(--t2); display: grid; place-items: center; cursor: pointer; padding: 0 }
  .lk-a button:hover, .lk-a a:hover { background: var(--soft); color: var(--text) }
  .lk-a button.del:hover { color: var(--red) }
  .lk-a svg { width: 14px; height: 14px }
  @media (hover: none) {
    .lk-a { position: static; opacity: 1; pointer-events: auto; box-shadow: none; background: none; padding: 0; align-self: flex-start }
    .lk-a a { display: none }
    .lk-a button { width: 30px; height: 30px; color: var(--t3) }
  }

  /* ── 회의 메모 ── */
  .notes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px }
  .note { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px }
  .note label { font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 6px }
  .note label .s { font-weight: 500; color: var(--t3); font-size: 12px }
  .note textarea { width: 100%; min-height: 140px; border: 1px solid transparent; border-radius: 8px; padding: 6px 8px; outline: none; resize: none; background: #fafbfc;
    font-size: 13.5px; line-height: 1.6; overflow: hidden }
  .note textarea:hover { border-color: var(--line) }
  .note textarea:focus { border-color: var(--text); background: #fff }

  /* ── 인스타 미리보기 (마우스 올리면 · 휴대폰은 누르면 아래에서) ── */
  .pv { position: fixed; z-index: 200; width: 360px; background: #fff; border: 1px solid var(--line2); border-radius: 14px; box-shadow: 0 18px 50px rgba(15, 23, 42, .22);
    display: flex; flex-direction: column; overflow: hidden }
  .pv-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); font-size: 12.5px }
  .pv-h b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .pv-h a { font-weight: 700; text-decoration: none; white-space: nowrap }

    for (let t = Date.UTC(y, m - 1, 1); new Date(t).getUTCMonth() === m - 1; t += DAY) if (new Date(t).getUTCDay() === MEET_DOW) out.push(iso(t));
    return out;
  }
  function addMonth(month, n) { const [y, m] = month.split('-').map(Number); return iso(Date.UTC(y, m - 1 + n, 1)).slice(0, 7); }
  const md = s => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  const mdw = s => `${md(s)} (${WD[new Date(utc(s)).getUTCDay()]})`;
  const dueMs = wk => Date.parse(`${wk}T${pad2(DUE_HOUR)}:00:00+09:00`);
  const dueTxt = `오후 ${DUE_HOUR > 12 ? DUE_HOUR - 12 : DUE_HOUR}시`;
  function leftTxt(ms) {
    const min = Math.max(1, Math.ceil(ms / 60000)), d = Math.floor(min / 1440), h = Math.floor((min % 1440) / 60), mm = min % 60;
    if (d) return `${d}일${h ? ` ${h}시간` : ''} 남음`;
    if (h) return `${h}시간${mm ? ` ${mm}분` : ''} 남음`;
    return `${mm}분 남음`;
  }

  /* ══════════════════════ 인스타 주소 읽기 ══════════════════════
     계정  instagram.com/아이디 · @아이디 · 아이디(점 없는 글자만)
     피드  instagram.com/p/코드 · /아이디/p/코드 · /tv/코드
     릴스  instagram.com/reel/코드 · /reels/코드 · /아이디/reel/코드
     스토리 instagram.com/stories/아이디/번호
     그 밖 주소는 '링크'. 공유 꼬리(?igsh= · ?utm_)는 떼고 저장 */
  const IG_RESERVED = new Set(['p', 'reel', 'reels', 'tv', 'stories', 'explore', 'accounts', 'direct', 'about', 'developer', 'legal', 'web', 's', 'tags',
    'locations', 'challenge', 'ar', 'emails', 'session', 'privacy', 'terms', 'help', 'press', 'api', 'blog', 'jobs', 'directory', 'lite', 'graphql',
    'oauth', 'popular', 'topics', 'nametag', 'qr', 'create', 'account', 'settings', 'your_activity', 'archive', 'saved', 'threads', 'download', 'business']);
  const HANDLE = /^[A-Za-z0-9._]{1,30}$/;
  const CODE = /^[A-Za-z0-9_-]{5,60}$/;
  function igAccount(u) { u = u.toLowerCase(); return {kind: 'account', ig_user: u, ig_code: null, url: `https://www.instagram.com/${u}/`}; }
  function parseLink(raw) {
    let s = String(raw || '').trim().replace(/^[<(\[]+|[>)\],.。]+$/g, '');
    if (!s) return null;
    let m = /^@([A-Za-z0-9._]{1,30})$/.exec(s);
    if (m) return igAccount(m[1]);
    if (HANDLE.test(s) && !s.includes('.') && /[A-Za-z_]/.test(s)) return igAccount(s);
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) {
      if (!/^[^\s/]+\.[a-z]{2,}([/?#]|$)/i.test(s)) return null;   // 주소 모양이 아님
      s = 'https://' + s;
    }
    let u;
    try { u = new URL(s); } catch (e) { return null; }
    if (!/^https?:$/.test(u.protocol) || !u.hostname.includes('.')) return null;
    const host = u.hostname.toLowerCase().replace(/^(www|m|l)\./, '');
    if (host === 'instagram.com' || host === 'instagr.am' || host.endsWith('.instagram.com')) {
      const seg = u.pathname.split('/').filter(Boolean).map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
      if (!seg.length) return null;
      const s0 = seg[0].toLowerCase();
      if (s0 === 'stories') {
        if (seg[1] && seg[1].toLowerCase() !== 'highlights' && HANDLE.test(seg[1])) {
          const user = seg[1].toLowerCase(), id = /^\d+$/.test(seg[2] || '') ? seg[2] : null;
          return {kind: 'story', ig_user: user, ig_code: id, url: `https://www.instagram.com/stories/${user}/${id ? id + '/' : ''}`};
        }
        return {kind: 'link', ig_user: null, ig_code: null, url: `https://www.instagram.com${u.pathname}`};
      }
      let i = 0, user = null;
      if (!IG_RESERVED.has(s0) && HANDLE.test(seg[0])) { user = s0; i = 1; }
      const t = (seg[i] || '').toLowerCase(), code = seg[i + 1] || '';
      if ((t === 'p' || t === 'tv') && CODE.test(code)) return {kind: 'post', ig_user: user, ig_code: code, url: `https://www.instagram.com/p/${code}/`};
      if ((t === 'reel' || t === 'reels') && CODE.test(code)) return {kind: 'reel', ig_user: user, ig_code: code, url: `https://www.instagram.com/reel/${code}/`};
      if (user) return igAccount(user);
      return {kind: 'link', ig_user: null, ig_code: null, url: `https://www.instagram.com${u.pathname}`};
    }
    // 인스타 밖 주소 — utm_ · fbclid 같은 꼬리만 떼고 그대로
    ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'fbclid', 'igsh', 'igshid', 'si'].forEach(k => u.searchParams.delete(k));
    u.hash = '';
    return {kind: 'link', ig_user: null, ig_code: null, url: u.href};
  }
  function normUrl(url) {
    try { const u = new URL(url); return u.hostname.toLowerCase().replace(/^(www|m)\./, '') + u.pathname.replace(/\/+$/, '') + u.search; } catch (e) { return String(url || '').toLowerCase(); }
  }
  // 중복을 가르는 열쇠 — 계정(계정 · 스토리)은 아이디, 피드 · 릴스는 게시물 코드, 그 밖은 주소
  function dupKey(l) {
    if ((l.kind === 'account' || l.kind === 'story') && l.ig_user) return 'u:' + l.ig_user;
    if ((l.kind === 'post' || l.kind === 'reel') && l.ig_code) return 'c:' + l.ig_code;
    return 'url:' + normUrl(l.url);
  }
  function keyLabel(k) {
    if (k.startsWith('u:')) return '@' + k.slice(2);
    if (k.startsWith('c:')) return '게시물 ' + k.slice(2);
    return k.slice(4);
  }
  function linkTitle(l) {
    if (l.kind === 'account') return '@' + l.ig_user;
    if (l.kind === 'story') return '스토리 · @' + l.ig_user;
    if (l.kind === 'post') return l.ig_user ? '피드 · @' + l.ig_user : '피드 게시물';
    if (l.kind === 'reel') return l.ig_user ? '릴스 · @' + l.ig_user : '릴스';
    try { return new URL(l.url).hostname.replace(/^www\./, ''); } catch (e) { return l.url; }
  }
  function linkSub(l) {
    if (l.kind === 'account') return 'instagram.com/' + l.ig_user;
    if (l.kind === 'post' || l.kind === 'reel') return (l.kind === 'reel' ? 'reel/' : 'p/') + l.ig_code;
    if (l.kind === 'story') return 'stories/' + l.ig_user;
    try { const u = new URL(l.url); return (u.pathname + u.search).replace(/^\/$/, '') || u.hostname; } catch (e) { return ''; }
  }
  function embedSrc(l) {
    if ((l.kind === 'post' || l.kind === 'reel') && l.ig_code) return `https://www.instagram.com/p/${encodeURIComponent(l.ig_code)}/embed/captioned/`;
    if ((l.kind === 'account' || l.kind === 'story') && l.ig_user) return `https://www.instagram.com/${encodeURIComponent(l.ig_user)}/embed/`;
    return null;
  }

  /* ══════════════════════ 상태 ══════════════════════ */
  const S = {
    meetings: new Map(),   // id → 저장소 줄 (지운 건 뺌)
    links: new Map(),      // id → 주소 줄 (지운 건 뺌)
    wk: null,              // 고른 주 (그 주 수요일 날짜)
    month: null,           // 탭에 보이는 달 '2026-11'
    staff: null,           // {design:[이름], mkt:[], md:[]}
    filter: null,          // 이 브랜드 주소만 보기 (안내 띠에서 고름)
    curM: '', curL: '',    // 마지막으로 받은 updated_at
  };
  const drafts = new Map();   // 사람 → {text, brand, ask, warn:[글]} (칸 입력 · 고른 브랜드 · 브랜드 묻는 중 · 중복 안내)
  const draftOf = p => { if (!drafts.has(p)) drafts.set(p, {text: '', brand: null, ask: false, warn: []}); return drafts.get(p); };
  let editMemo = null;        // 메모 고치는 주소 id
  let boardPending = false;

  /* ══════════════════════ 직원 명단 ══════════════════════ */
  async function loadStaff() {
    const col = new Map(BASE_STAFF.map(s => [s.name, s.color]));
    const order = BASE_STAFF.map(s => s.name);
    try {
      const [added, ovr, hid] = await Promise.all([
        rest('staff_added?select=name,color&order=created_at.asc'),
        rest('staff_dept_overrides?select=staff_name,color'),
        rest('staff_hidden?select=staff_name'),
      ]);
      (added || []).forEach(r => { if (r.name && !col.has(r.name)) { col.set(r.name, r.color); order.push(r.name); } });
      (ovr || []).forEach(r => { if (r.staff_name && r.color && col.has(r.staff_name)) col.set(r.staff_name, r.color); });
      (hid || []).forEach(r => col.delete(r.staff_name));
    } catch (e) { console.warn('staff', e); }
    const out = {design: [], mkt: [], md: []};
    order.forEach(n => { const t = COLOR_TEAM[col.get(n)]; if (t && !EXCLUDE.has(n) && !out[t].includes(n)) out[t].push(n); });
    S.staff = out;
  }
  // 새 주의 참여자 = 직원 명단 세 팀 + 지난 회의에 직접 넣은 사람(손님 · 대표). 지난 회의에서 뺀 직원은 계속 빠져 있게
  function defaultMembers(wk) {
    const st = S.staff || {design: [], mkt: [], md: []};
    const last = [...S.meetings.values()].filter(m => m.day < wk).sort((a, b) => b.day.localeCompare(a.day))[0];
    const lastMem = last && Array.isArray(last.members) ? last.members.filter(m => m && m.name) : [];
    const list = [];
    ['design', 'mkt', 'md'].forEach(t => st[t].forEach(n => list.push({name: n, team: t})));
    lastMem.forEach(m => { if (!EXCLUDE.has(m.name) && !list.some(x => x.name === m.name) && !isStaffName(m.name)) list.push({name: m.name, team: m.team || 'etc'}); });
    return memberOrder(list);
  }
  function isStaffName(n) { const st = S.staff; return !!st && (st.design.includes(n) || st.mkt.includes(n) || st.md.includes(n)); }
  function teamOfName(n) {
    const st = S.staff;
    if (st) for (const t of ['design', 'mkt', 'md']) if (st[t].includes(n)) return t;
    return 'etc';
  }
  function memberOrder(list) {   // 팀 순서 → 직원 명단 순서 → 넣은 순서
    const st = S.staff || {design: [], mkt: [], md: []};
    const rank = x => { const ti = TEAMS.findIndex(t => t.k === x.team); const arr = x.team === 'etc' ? ETC_DEFAULT : (st[x.team] || []); const i = arr.indexOf(x.name); return ti * 1000 + (i < 0 ? 500 : i); };
    return list.map((x, i) => ({x, i})).sort((a, b) => rank(a.x) - rank(b.x) || a.i - b.i).map(o => o.x);
  }

  /* ══════════════════════ 그 주 회의 줄 ══════════════════════ */
  function meetingOf(wk) {
    let near = null;
    for (const m of S.meetings.values()) {
      if (m.day === wk) return m;
      if (!near && isDay(m.day) && weekOf(m.day) === wk) near = m;   // 수요일이 아닌 날로 만들어진 옛 줄
    }
    return near;
  }
  const cur = () => meetingOf(S.wk);
  const linksOf = mid => (mid ? [...S.links.values()].filter(l => l.meeting_id === mid) : []);

  // 그 주에 처음 무언가 넣을 때 회의 줄을 만든다. 두 사람이 동시에 만들어도 저장소가 하루 한 줄만 받으므로(mkt_meetings_day_one) 있던 줄을 쓴다
  const making = new Map();
  function ensureMeeting(wk) {
    const m = meetingOf(wk);
    if (m) return Promise.resolve(m);
    if (making.has(wk)) return making.get(wk);
    const p = (async () => {
      if (!S.staff) await loadStaff();
      const body = {day: wk, title: `${weekName(wk)} 마케팅 회의`, members: defaultMembers(wk), created_by: ME(), updated_by: ME()};
      let row = null;
      try {
        const r = await rest(`${T_M}?columns=day,title,members,created_by,updated_by`, {method: 'POST', headers: RET, body: JSON.stringify(body)});
        row = r && r[0];
      } catch (e) {
        if (e.status !== 409) throw e;
      }
      if (!row) { const r = await rest(`${T_M}?day=eq.${wk}&deleted_at=is.null&select=*&limit=1`); row = r && r[0]; }
      if (!row) throw new Error('저장소가 답을 안 했어요');
      S.meetings.set(row.id, row);
      if (later(row.updated_at, S.curM)) S.curM = row.updated_at;
      return row;
    })().finally(() => making.delete(wk));
    making.set(wk, p);
    return p;
  }

  /* ══════════════════════ 불러오기 · 정기 확인 ══════════════════════ */
  const later = (a, b) => !b || (a || '') > (b || '');
  async function page(path) {   // 저장소가 한 번에 1,000줄까지만 줘서 나눠 받는다
    const out = [];
    for (let off = 0; ; off += 1000) {
      const r = await rest(`${path}&order=id.asc&limit=1000&offset=${off}`) || [];
      out.push(...r);
      if (r.length < 1000) return out;
    }
  }
  async function loadAll() {
    const [ms, ls] = await Promise.all([
      page(`${T_M}?deleted_at=is.null&select=*`), page(`${T_L}?deleted_at=is.null&select=*`),
    ]);
    S.meetings.clear(); S.links.clear();
    ms.forEach(r => { S.meetings.set(r.id, r); if (later(r.updated_at, S.curM)) S.curM = r.updated_at; });
    ls.forEach(r => { S.links.set(r.id, r); if (later(r.updated_at, S.curL)) S.curL = r.updated_at; });
  }
  // 겹쳐 읽기(1분) — 먼저 시작해 늦게 끝난 저장도 놓치지 않게. 같은 줄은 updated_at 이 늦은 쪽만
  function since(t) { if (!t) return '1970-01-01T00:00:00Z'; return new Date(Date.parse(t) - 60000).toISOString(); }
  function applyRow(map, r) {
    const old = map.get(r.id);
    if (old && !later(r.updated_at, old.updated_at)) return false;
    if (r.deleted_at) { if (!old) return false; map.delete(r.id); return true; }
    map.set(r.id, r);
    return true;
  }
  let polling = null, pollT = 0;
  function poll() {
    if (polling) return polling;
    polling = pollOnce().catch(e => console.warn('poll', e)).finally(() => { polling = null; });
    return polling;
  }
  async function pollOnce() {
    const mid = (cur() || {}).id, t0 = Date.now();
    const [ms, ls, aliveL] = await Promise.all([
      rest(`${T_M}?updated_at=gt.${encodeURIComponent(since(S.curM))}&select=*&order=updated_at.asc&limit=1000`),
      rest(`${T_L}?updated_at=gt.${encodeURIComponent(since(S.curL))}&select=*&order=updated_at.asc&limit=1000`),
      // 되돌리기(office-undo)는 넣은 줄을 아예 지우므로, 지금 보는 주는 남아 있는 줄 번호도 맞춘다
      mid ? rest(`${T_L}?meeting_id=eq.${mid}&deleted_at=is.null&select=id&limit=1000`) : null,
    ]);
    let ch = false;
    (ms || []).forEach(r => { if (later(r.updated_at, S.curM)) S.curM = r.updated_at; if (applyRow(S.meetings, r)) { ch = true; syncFields(r); } });
    (ls || []).forEach(r => { if (later(r.updated_at, S.curL)) S.curL = r.updated_at; if (applyRow(S.links, r)) ch = true; });
    const prune = (map, alive) => {
      if (!alive || alive.length >= 1000) return;
      const ids = new Set(alive.map(x => x.id));
      [...map.values()].forEach(r => { if (r.meeting_id === mid && !ids.has(r.id) && Date.parse(r.updated_at) < t0 - 15000) { map.delete(r.id); ch = true; } });
    };
    prune(S.links, aliveL);
    if (ch) renderAll();
  }
  function pollLoop() {
    clearTimeout(pollT);
    const live = !!(window.OfficeLive && OfficeLive.ok && OfficeLive.ok());
    pollT = setTimeout(async () => { if (document.visibilityState !== 'hidden') await poll(); pollLoop(); }, live ? POLL_LIVE_MS : POLL_MS);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') EST.forEach(e => { if (Object.keys(e.dirty).length) saveText(e); });
    else { poll(); paintDue(); }
  });
  // 다른 사람이 고치면 바로 (실시간 알림선 ../office-live.js) — 끊기면 8초 확인 그대로
  let liveOn = false;
  function liveBoot() { if (liveOn || !window.OfficeLive) return; liveOn = true; OfficeLive.on([T_M, T_L], () => poll()); }

  /* ══════════════════════ 주차 탭 ══════════════════════ */
  function renderWeeks() {
    const now = thisWeek(), y = S.month.slice(0, 4);
    $('mName').textContent = (y !== todayKST().slice(0, 4) ? y.slice(2) + '년 ' : '') + (+S.month.slice(5, 7)) + '월';
    $('wkTabs').innerHTML = weeksOf(S.month).map(w => `<button type="button" class="wk${w === S.wk ? ' on' : ''}" data-w="${w}"${w === S.wk ? ' aria-current="true"' : ''}><b>${weekNo(w)}주차</b><span>${mdw(w)}</span>${w === now ? '<i>이번 주</i>' : ''}</button>`).join('');
    $('wkNow').hidden = S.wk === now && S.month === monthOf(now);
  }
  function showTab() { const b = $('wkTabs').querySelector('.wk.on'); if (b) { const box = $('wkTabs'); box.scrollLeft = Math.max(0, b.offsetLeft - box.offsetLeft - 12); } }
  $('wkTabs').addEventListener('click', e => { const b = e.target.closest('.wk'); if (b) pickWeek(b.dataset.w); });
  $('mPrev').addEventListener('click', () => { S.month = addMonth(S.month, -1); renderWeeks(); showTab(); });
  $('mNext').addEventListener('click', () => { S.month = addMonth(S.month, 1); renderWeeks(); showTab(); });
  $('wkNow').addEventListener('click', () => pickWeek(thisWeek()));

  function pickWeek(wk) {
    const changed = S.wk !== wk;
    S.wk = wk; S.month = monthOf(wk);
    if (changed) { EST.forEach(e => { if (Object.keys(e.dirty).length) saveText(e); }); drafts.clear(); S.filter = null; editMemo = null; hidePreview(); paintText(); }
    renderAll(true);
    showTab();
  }
  function renderAll(force) { renderWeeks(); paintDue(); paintStrip(); renderBoard(force); paintMemN(); }

  /* ══════════════════════ 안내 띠 ══════════════════════ */
  // 아직 안 넣은 사람 = 참여자 중 이번 주 주소가 하나도 없는 사람
  function missing(m) {
    const has = new Set(linksOf(m.id).map(l => l.person));
    return (Array.isArray(m.members) ? m.members : []).filter(x => x && x.name && !has.has(x.name)).map(x => x.name);
  }
  function paintDue() {
    if (!S.wk) return;
    const m = cur(), left = dueMs(S.wk) - Date.now(), miss = m ? missing(m) : [];
    let h = `${mdw(S.wk)} ${dueTxt}`;
    if (left > 0) {
      h += left < 3 * 3600e3 ? ` · <span class="red">${leftTxt(left)}</span>` : ` · ${leftTxt(left)}`;
      if (miss.length) h += ` · 아직 ${miss.length}명`;
    } else {
      h += ' 마감';
      if (miss.length) h += ` · <span class="red">못 넣은 사람 ${miss.map(esc).join(', ')}</span>`;
    }
    $('due').innerHTML = h;
  }
  function paintStrip() {
    const ls = linksOf((cur() || {}).id), cnt = k => ls.filter(l => l.brand === k).length;
    $('bstrip').innerHTML = `<button type="button" class="bst${S.filter ? '' : ' on'}" data-f="" aria-pressed="${!S.filter}">전체 <b>${ls.length}</b></button>` + BRANDS.map(b => {
      const n = cnt(b.k), on = S.filter === b.k;
      return `<button type="button" class="bst${on ? ' on' : n ? '' : ' zero'}" data-f="${b.k}" aria-pressed="${on}" title="${esc(b.name)} 주소만 보기">${bDot(b.k)}${esc(b.name)} <b>${n}</b></button>`;
    }).join('');
  }
  $('bstrip').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; S.filter = b.dataset.f && S.filter !== b.dataset.f ? b.dataset.f : null; hidePreview(); paintStrip(); renderBoard(true); });
  setInterval(() => { if (document.visibilityState !== 'hidden' && S.wk) paintDue(); }, 30000);

  /* ══════════════════════ 회의 메모 · 결정 ══════════════════════
     0.7초 뒤 저절로 저장. 주마다 따로 들고 있어서(EST) 저장하는 사이 다른 주로 옮겨도 글이 섞이거나 빠지지 않는다.
     같은 회의를 두 사람이 동시에 고치면 줄 단위로 합친다(내가 넣은 줄 · 그쪽이 넣은 줄 둘 다 남김). */
  const FEL = {notes: 'mNotes', decisions: 'mDec'};
  const EST = new Map();   // 주 → {wk, base, val, dirty, saving, again, timer, retryT}
  function est(wk) {
    let e = EST.get(wk);
    if (!e) {
      const m = meetingOf(wk) || {};
      e = {wk, base: {notes: m.notes || '', decisions: m.decisions || ''}, val: {notes: m.notes || '', decisions: m.decisions || ''}, dirty: {}, saving: false, again: false, timer: 0, retryT: 0};
      EST.set(wk, e);
    }
    return e;
  }
  function setField(f, v) {
    const el = $(FEL[f]);
    if (el.value === (v || '')) return;
    const focused = document.activeElement === el, a = el.selectionStart, b = el.selectionEnd;
    el.value = v || '';
    if (focused && a != null) { try { el.setSelectionRange(Math.min(a, el.value.length), Math.min(b, el.value.length)); } catch (e) { /* noop */ } }
    autoGrow(el);
  }
  function paintText() { const e = est(S.wk); Object.keys(FEL).forEach(f => { $(FEL[f]).value = e.val[f]; autoGrow($(FEL[f])); }); setSt(Object.keys(e.dirty).length ? 'saving' : ''); }
  function syncFields(r) {   // 다른 PC 에서 고친 것 — 내가 고치는 중인 칸은 그대로 두고 저장할 때 합친다
    const wk = isDay(r.day) ? weekOf(r.day) : '', e = EST.get(wk);
    if (!e || r.deleted_at) return;
    Object.keys(FEL).forEach(f => { if (e.dirty[f]) return; e.base[f] = r[f] || ''; e.val[f] = r[f] || ''; if (S.wk === wk) setField(f, r[f]); });
  }
  function merge3(base, mine, theirs) {
    base = base || ''; mine = mine || ''; theirs = theirs || '';
    if (mine === theirs || theirs === base) return mine;
    if (mine === base) return theirs;
    const B = base.split('\n'), M = mine.split('\n'), T = theirs.split('\n');
    const cnt = a => { const m = new Map(); a.forEach(x => m.set(x, (m.get(x) || 0) + 1)); return m; };
    const cB = cnt(B), cM = cnt(M), cT = cnt(T);
    const del = new Map(); cB.forEach((n, x) => { const d = n - (cM.get(x) || 0); if (d > 0) del.set(x, d); });
    const out = [];
    for (const x of T) { const d = del.get(x); if (d && (cT.get(x) || 0) <= (cB.get(x) || 0)) { del.set(x, d - 1); continue; } out.push(x); }
    const add = new Map(); cM.forEach((n, x) => { const d = n - Math.max(cB.get(x) || 0, cT.get(x) || 0); if (d > 0) add.set(x, d); });
    let at = -1;
    for (const x of M) {
      const a = add.get(x);
      if (a) {
        let j = at + 1;
        while (j < out.length && !cB.has(out[j]) && !cM.has(out[j])) j++;   // 그쪽이 새로 넣은 줄 다음에
        out.splice(j, 0, x); at = j; add.set(x, a - 1); continue;
      }
      const j = out.indexOf(x, at + 1);
      if (j >= 0) at = j;
    }
    return out.join('\n');
  }
  Object.keys(FEL).forEach(f => {
    const el = $(FEL[f]);
    el.addEventListener('input', () => {
      const e = est(S.wk);
      e.val[f] = el.value; e.dirty[f] = true;
      setSt('saving'); autoGrow(el);
      clearTimeout(e.timer); e.timer = setTimeout(() => saveText(e), 700);
    });
    el.addEventListener('blur', () => { const e = est(S.wk); if (Object.keys(e.dirty).length) saveText(e); });
  });
  async function saveText(e) {
    clearTimeout(e.timer); clearTimeout(e.retryT);
    if (e.saving) { e.again = true; return; }
    const fs = Object.keys(e.dirty);
    if (!fs.length) return;
    e.saving = true;
    if (S.wk === e.wk) setSt('saving');
    let ok = false;
    try {
      let srv = await ensureMeeting(e.wk);
      for (let tries = 0; tries < 4 && !ok; tries++) {
        srv = S.meetings.get(srv.id) || srv;
        const body = {updated_by: ME()}, sent = {};
        fs.forEach(f => { sent[f] = e.val[f]; body[f] = merge3(e.base[f], sent[f], srv[f]); });
        const r = await rest(`${T_M}?id=eq.${srv.id}&updated_at=eq.${encodeURIComponent(srv.updated_at)}`, {method: 'PATCH', headers: RET, body: JSON.stringify(body)});
        if (r && r.length) {
          const row = r[0];
          S.meetings.set(row.id, row);
          if (later(row.updated_at, S.curM)) S.curM = row.updated_at;
          fs.forEach(f => {
            if (e.val[f] === sent[f]) { delete e.dirty[f]; e.base[f] = e.val[f] = row[f] || ''; if (S.wk === e.wk) setField(f, row[f]); }
            else e.base[f] = sent[f];   // 보내는 사이 더 적음 — 다음 저장은 '보낸 글' 기준으로 합친다
          });
          ok = true;
        } else {
          // 그사이 다른 사람이 저장함 → 새로 받아서 다시 합침
          const fresh = await rest(`${T_M}?id=eq.${srv.id}&deleted_at=is.null&select=*`);
          if (!fresh || !fresh.length) throw new Error('회의를 찾지 못했어요');
          S.meetings.set(fresh[0].id, fresh[0]); srv = fresh[0];
        }
      }
      if (!ok) throw new Error('다른 사람과 동시에 고치는 중이에요');
      if (S.wk === e.wk) setSt(Object.keys(e.dirty).length ? 'saving' : 'ok');
    } catch (err) {
      console.warn('save', err);
      if (S.wk === e.wk) setSt('err');
      e.retryT = setTimeout(() => saveText(e), 5000);
    } finally {
      e.saving = false;
      if (e.again || (ok && Object.keys(e.dirty).length)) { e.again = false; clearTimeout(e.timer); e.timer = setTimeout(() => saveText(e), 400); }
    }
  }
  function setSt(k) {
    const el = $('saveSt');
    el.className = 'save-st' + (k === 'err' ? ' err' : '');
    el.textContent = k === 'saving' ? '저장 중…' : k === 'err' ? '저장 안 됨 · 누르면 다시' : k === 'ok' ? '저장됨' : '';
  }
  $('saveSt').addEventListener('click', () => { if ($('saveSt').classList.contains('err')) saveText(est(S.wk)); });
  function autoGrow(el) { el.style.height = 'auto'; el.style.height = Math.max(140, el.scrollHeight + 2) + 'px'; }

  /* ══════════════════════ 사람별 세로 칸 ══════════════════════ */
  function columnsOf(m) {
    const mem = (m && Array.isArray(m.members) ? m.members.filter(x => x && x.name) : defaultMembers(S.wk));
    const cols = mem.map(x => ({name: x.name, team: TMAP[x.team] ? x.team : teamOfName(x.name), off: false}));
    if (!m) return cols;
    // 참여자에서 뺐어도 주소가 남아 있는 사람은 칸을 보여 줌 (안 숨게)
    linksOf(m.id).forEach(l => { if (!cols.some(c => c.name === l.person)) cols.push({name: l.person, team: teamOfName(l.person), off: true}); });
    return cols;
  }
  function analyze(m) {
    const accts = new Map(), other = new Map(), mid = m ? m.id : null;
    linksOf(mid).forEach(l => { if (l.kind === 'account' || l.kind === 'story') { if (!accts.has(l.ig_user)) accts.set(l.ig_user, []); accts.get(l.ig_user).push(l); } });
    // 다른 주에 나왔던 것
    S.links.forEach(l => {
      if (l.meeting_id === mid) return;
      const om = S.meetings.get(l.meeting_id); if (!om) return;
      const k = dupKey(l);
      if (!other.has(k)) other.set(k, []);
      other.get(k).push({m: om, person: l.person});
    });
    return {accts, other};
  }
  function renderBoard(force) {
    const box = $('board'), m = cur();
    // 칸 안에 적는 중이면 다 적은 뒤에 다시 그림 (적던 글자 · 커서 지키기)
    const ae = document.activeElement;
    if (!force && ae && box.contains(ae) && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) { boardPending = true; return; }
    boardPending = false;
    const A = analyze(m), cols = columnsOf(m), mid = m ? m.id : null;
    const ls = linksOf(mid).sort((a, b) => bRank(a.brand) - bRank(b.brand) || b.pos - a.pos);   // 브랜드끼리 모으고, 그 안은 새로 넣은 것부터
    const html = [];
    TEAMS.forEach(t => {
      const tc = cols.filter(c => c.team === t.k);
      if (!tc.length) return;
      html.push(`<div class="team" style="--n:${tc.length}"><div class="team-h">${esc(t.name)}<span class="n">${tc.length}명</span></div><div class="cols">`);
      tc.forEach(c => html.push(colHtml(c, ls.filter(l => l.person === c.name), A, !!m)));
      html.push('</div></div>');
    });
    if (!cols.length) html.push('<div class="muted" style="padding:24px">참여자가 없어요 — 위 <b>참여자</b> 단추로 사람을 골라 주세요</div>');
    box.innerHTML = html.join('');
    paintNav();
  }
  function paintNav() {
    const b = $('board'), max = b.scrollWidth - b.clientWidth;
    $('bnavL').hidden = !(max > 4 && b.scrollLeft > 4);
    $('bnavR').hidden = !(max > 4 && b.scrollLeft < max - 4);
  }
  $('bnavL').addEventListener('click', () => $('board').scrollBy({left: -Math.round($('board').clientWidth * .8), behavior: 'smooth'}));
  $('bnavR').addEventListener('click', () => $('board').scrollBy({left: Math.round($('board').clientWidth * .8), behavior: 'smooth'}));
  window.addEventListener('resize', () => paintNav());

  function colHtml(c, ls, A, hasRow) {
    const d = draftOf(c.name), late = hasRow && Date.now() > dueMs(S.wk);
    const ct = ls.length ? `${ls.length}개` : late && !c.off ? '못 넣음' : '';
    const show = S.filter ? ls.filter(l => l.brand === S.filter) : ls;
    const warn = d.warn.length ? `<div class="add-warn" role="alert">${d.warn.map(w => `<div>${w}</div>`).join('')}<button type="button" data-act="okwarn" aria-label="닫기">×</button></div>` : '';
    return `<div class="col" data-p="${esc(c.name)}">
      <div class="col-h"><span class="av">${esc(c.name.slice(-2))}</span><span class="nm">${esc(c.name)}</span>${c.off ? '<span class="muted" style="font-size:11px">(참여자 아님)</span>' : ''}
        <span class="ct${ct === '못 넣음' ? ' w' : ''}">${ct}</span></div>
      <div class="ent${d.ask ? ' need' : ''}">
        <div class="ask">${d.ask ? '이 주소는 어떤 브랜드예요?' : '어떤 브랜드예요?'}</div>
        <div class="bds" role="radiogroup" aria-label="${esc(c.name)} 브랜드 고르기">${BRANDS.map(b => `<button type="button" class="bd${d.brand === b.k ? ' on' : ''}" role="radio" aria-checked="${d.brand === b.k}" data-act="brand" data-b="${b.k}">${bDot(b.k)}${esc(b.name)}</button>`).join('')}</div>
        <button type="button" class="kindb" data-act="kind">벤치마킹 · 레퍼런스</button>
        <form class="add-in" data-p="${esc(c.name)}"><input type="text" inputmode="url" enterkeyhint="done" autocomplete="off" autocapitalize="off" placeholder="인스타 주소 · @아이디" value="${esc(d.text)}" aria-label="${esc(c.name)} 주소 넣기"><button class="btn" type="submit">넣기</button></form>
        ${warn}
      </div>
      <div class="lks">${show.map(l => linkHtml(l, A)).join('')}</div>
    </div>`;
  }
  function linkHtml(l, A) {
    let p = '';
    if ((l.kind === 'post' || l.kind === 'reel') && l.ig_user && A.accts.has(l.ig_user)) {
      const who = [...new Set(A.accts.get(l.ig_user).map(x => x.person))].filter(n => n !== l.person);
      if (who.length) p = `<div class="lk-p amb">같은 계정 @${esc(l.ig_user)} — ${esc(who.join(' · '))}님이 넣었어요</div>`;
    }
    const prev = A.other.get(dupKey(l));
    if (prev && prev.length) {
      const seen = new Set(), uniq = [];
      prev.sort((a, b) => (b.m.day || '').localeCompare(a.m.day || '')).forEach(x => { const s = x.m.id + x.person; if (!seen.has(s)) { seen.add(s); uniq.push(x); } });
      p += `<div class="lk-p">↺ ${uniq.slice(0, 2).map(x => `${weekName(weekOf(x.m.day))} ${esc(x.person)}`).join(', ')}${uniq.length > 2 ? ` 외 ${uniq.length - 2}` : ''} 에도 나왔어요</div>`;
    }
    const late = Date.parse(l.created_at) > dueMs(S.wk) ? ' · 마감 뒤' : '';
    const by = l.created_by && l.created_by !== l.person ? ` · ${l.created_by} 넣음` : '', note = (late + by).replace(/^ · /, '');
    const memo = editMemo === l.id
      ? `<textarea class="lk-me" data-id="${esc(l.id)}" maxlength="2000" placeholder="메모 (Enter 저장 · Esc 취소)">${esc(l.memo || '')}</textarea>`
      : (l.memo ? `<div class="lk-m">${esc(l.memo)}</div>` : '');
    return `<div class="lk k-${esc(l.kind)}" data-id="${esc(l.id)}">
      <div class="lk-ic">${ICON[l.kind] || ICON.link}</div>
      <div class="lk-b"><div class="lk-t">${esc(linkTitle(l))}</div>
        <div class="lk-s"><button type="button" class="bb${BMAP[l.brand] ? '' : ' none'}" data-act="cbrand" title="누르면 브랜드 바꾸기">${BMAP[l.brand] ? bDot(l.brand) : ''}${esc(BMAP[l.brand] ? bName(l.brand) : '브랜드 고르기')}</button>${note ? `<span>${esc(note)}</span>` : ''}</div>${memo}${p}</div>
      <div class="lk-a">
        <a href="${esc(l.url)}" target="_blank" rel="noopener" title="새 탭으로 열기" aria-label="새 탭으로 열기">${ICON.open}</a>
        <button type="button" data-act="memo" title="메모" aria-label="메모">${ICON.edit}</button>
        <button type="button" class="del" data-act="del" title="지우기" aria-label="지우기">${ICON.del}</button>
      </div>
    </div>`;
  }
  function paintMemN() {
    const m = cur(), n = m && Array.isArray(m.members) ? m.members.length : defaultMembers(S.wk).length;
    $('memN').textContent = n + '명';
  }

  /* ── 주소 넣기 (브랜드를 골라야 저장 · 같은 주에 같은 계정 · 게시물 · 주소는 한 번만, 사람이 달라도) ── */
  const busy = new Set();
  function focusAdd(person) {
    const i = document.querySelector(`.add-in[data-p="${cssEsc(person)}"] input`);
    if (i && matchMedia('(pointer:fine)').matches) i.focus({preventScroll: true});
  }
  const splitWords = t => String(t || '').split(/[\s,]+/).filter(Boolean);
  const dupMsg = (p, hit, person) => `<b>${esc(keyLabel(dupKey(p)))}</b> — ${hit.person === person ? '이미 이 칸에' : `${esc(hit.person)}님이 이미`} 넣었어요${hit.brand ? ` (${esc(bName(hit.brand))})` : ''}`;
  function sift(parsed, person, mid) {   // 넣을 것 · 중복이라 못 넣는 것
    const ok = [], warn = [];
    parsed.forEach(p => {
      const pp = Object.assign({person}, p), k = dupKey(pp), hit = linksOf(mid).concat(ok).find(l => dupKey(l) === k);
      if (hit) warn.push(dupMsg(pp, hit, person)); else ok.push(pp);
    });
    return {ok, warn};
  }
  // 칸에서 [넣기] · 붙여넣기 → 중복 먼저 가르고, 브랜드를 안 골랐으면 묻는다
  function submitLinks(person, text) {
    const d = draftOf(person), parts = splitWords(text), parsed = parts.map(parseLink).filter(Boolean);
    if (!parsed.length) { if (parts.length) toast('인스타 주소나 링크 모양이 아니에요', true); return; }
    const {ok, warn} = sift(parsed, person, (cur() || {}).id);
    if (!ok.length) { d.text = ''; d.ask = false; d.warn = warn; renderBoard(true); focusAdd(person); return; }
    if (d.brand) { addLinks(person, d.brand, text); return; }
    d.text = ok.map(p => p.url).join(' '); d.ask = true; d.warn = warn;
    renderBoard(true);
  }
  function pickBrand(person, brand) {
    const d = draftOf(person);
    if (d.ask && d.text.trim()) { d.brand = brand; addLinks(person, brand, d.text); return; }   // 주소를 먼저 넣어 둠 → 고르는 순간 저장
    d.brand = d.brand === brand ? null : brand; d.ask = false;
    renderBoard(true);
    focusAdd(person);
  }
  async function addLinks(person, brand, text, retry) {
    const wk = S.wk, key = wk + '|' + person;
    if (busy.has(key) && !retry) return;
    const d = draftOf(person), parsed = splitWords(text).map(parseLink).filter(Boolean);
    if (!parsed.length) return;
    busy.add(key);
    const kept = d.ask ? d.warn : [];
    let again = false;
    try {
      const m = await ensureMeeting(wk), {ok, warn} = sift(parsed, person, m.id);
      if (ok.length) {
        const base = Date.now();
        const rows = ok.map((p, i) => ({meeting_id: m.id, person, brand, url: p.url, kind: p.kind, ig_user: p.ig_user, ig_code: p.ig_code, memo: '', pos: base + i, created_by: ME()}));
        const r = await rest(T_L, {method: 'POST', headers: RET, body: JSON.stringify(rows)});
        (r || []).forEach(x => { S.links.set(x.id, x); if (later(x.updated_at, S.curL)) S.curL = x.updated_at; });
      }
      d.text = ''; d.ask = false; d.brand = null; d.warn = kept.concat(warn.filter(w => !kept.includes(w)));   // 다음 주소도 브랜드를 다시 고르게
      if (S.filter && S.filter !== brand) S.filter = null;   // 다른 브랜드만 보던 중이면 방금 넣은 것이 보이게
      if (ok.length && !d.warn.length) toast(`${bName(brand)} ${ok.length > 1 ? ok.length + '개 ' : ''}넣었어요`);
    } catch (e) {
      if (e.status === 409 && !retry) { await poll(); again = true; }   // 방금 다른 사람이 같은 주소를 넣음 → 새로 받아 다시 가름
      else {
        console.warn('add', e);
        d.text = text;
        if (e.status === 409) d.warn = ['이미 들어 있는 주소예요 — 다른 주소를 넣어 주세요'];
        else toast('저장하지 못했어요: ' + e.message, true);
      }
    } finally { busy.delete(key); }
    if (again) return addLinks(person, brand, text, true);
    if (S.wk !== wk) return;
    renderAll(true);
    focusAdd(person);
  }

  const board = $('board');
  board.addEventListener('submit', e => {
    const f = e.target.closest('.add-in'); if (!f) return;
    e.preventDefault();
    submitLinks(f.dataset.p, f.querySelector('input').value);
  });
  board.addEventListener('input', e => { const f = e.target.closest('.add-in'); if (!f) return; const d = draftOf(f.dataset.p); d.text = e.target.value; if (!d.text.trim() && d.ask) { d.ask = false; const box = f.closest('.ent'); if (box) box.classList.remove('need'); } });
  // 붙여 넣으면 바로 넣기 (주소가 맞을 때만). 여러 줄을 붙여도 줄마다 따로
  board.addEventListener('paste', e => {
    const f = e.target.closest('.add-in'); if (!f) return;
    const raw = e.clipboardData ? e.clipboardData.getData('text') : '', parts = splitWords(raw);
    if (parts.length > 1 && parts.every(x => parseLink(x))) { e.preventDefault(); submitLinks(f.dataset.p, parts.join(' ')); return; }
    setTimeout(() => {
      const v = e.target.value.trim(), ps = splitWords(v);
      if (ps.length && ps.every(x => parseLink(x))) submitLinks(f.dataset.p, v);
    }, 0);
  });
  board.addEventListener('focusout', () => { setTimeout(() => { if (boardPending && !board.contains(document.activeElement)) renderBoard(); }, 0); });
  board.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act, col = act.closest('.col'), person = col ? col.dataset.p : '';
      if (a === 'brand') { pickBrand(person, act.dataset.b); return; }
      if (a === 'kind') { const i = col.querySelector('.add-in input'); if (i) i.focus(); return; }
      if (a === 'okwarn') { draftOf(person).warn = []; renderBoard(true); return; }
      const card = act.closest('.lk'); if (!card) return;
      const l = S.links.get(card.dataset.id); if (!l) return;
      if (a === 'cbrand') { e.stopPropagation(); brandMenu(act, l); }
      else if (a === 'memo') { editMemo = l.id; renderBoard(true); const t = board.querySelector(`.lk-me[data-id="${cssEsc(l.id)}"]`); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } }
      else if (a === 'del') delLink(l);
      return;
    }
    if (e.target.closest('a, textarea, input, button')) return;
    const card = e.target.closest('.lk'); if (!card) return;
    const l = S.links.get(card.dataset.id); if (!l) return;
    if (!canHover.matches && embedSrc(l)) showPreview(card, l, true);
    else window.open(l.url, '_blank', 'noopener');
  });
  board.addEventListener('keydown', e => {
    const t = e.target.closest('.lk-me'); if (!t) return;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); saveMemo(t); }
    else if (e.key === 'Escape') { t._done = true; editMemo = null; renderBoard(true); }
  });
  board.addEventListener('focusout', e => { const t = e.target.closest && e.target.closest('.lk-me'); if (t) saveMemo(t); });
  async function patchLink(l, body) {
    const r = await rest(`${T_L}?id=eq.${l.id}`, {method: 'PATCH', headers: RET, body: JSON.stringify(body)});
    if (r && r[0]) { if (r[0].deleted_at) S.links.delete(l.id); else S.links.set(l.id, r[0]); if (later(r[0].updated_at, S.curL)) S.curL = r[0].updated_at; }
  }
  async function saveMemo(t) {
    if (t._done) return; t._done = true;
    const l = S.links.get(t.dataset.id); editMemo = null;
    if (!l) { renderBoard(true); return; }
    const v = t.value.trim().slice(0, 2000);
    if (v === (l.memo || '')) { renderBoard(true); return; }
    try { await patchLink(l, {memo: v}); } catch (e) { toast('메모를 저장하지 못했어요: ' + e.message, true); }
    renderBoard(true);
  }
  // 카드의 브랜드 배지 → 다른 브랜드로 바꾸기
  function brandMenu(btn, l) {
    if (menuEl) { const same = menuEl.dataset.l === l.id; closeMenu(); if (same) return; }
    hidePreview();
    openMenu(btn, BRANDS.map(b => `<button type="button" data-m="${b.k}" class="${l.brand === b.k ? 'on' : ''}">${bDot(b.k)} ${esc(b.name)}</button>`).join(''), async k => {
      if (k === l.brand) return;
      try { await patchLink(l, {brand: k}); } catch (e) { toast('브랜드를 바꾸지 못했어요: ' + e.message, true); }
      renderAll(true);
    });
    menuEl.dataset.l = l.id;
  }
  async function delLink(l) {
    hidePreview();
    try { await patchLink(l, {deleted_at: new Date().toISOString()}); S.links.delete(l.id); renderAll(true); }
    catch (e) { toast('지우지 못했어요: ' + e.message, true); }
  }

  /* ══════════════════════ 인스타 미리보기 ══════════════════════
     PC = 링크 위에 마우스를 0.3초 올리면 옆에 인스타 화면(인스타 공식 퍼가기 embed), 미리보기 위로 옮겨도 그대로.
     휴대폰 = 링크를 누르면 아래에서 올라옴. 한 번 연 미리보기는 몇 개 기억해 다시 올리면 바로 뜬다. */
  const canHover = matchMedia('(hover: hover) and (pointer: fine)');
  const pv = $('pv'), pvB = $('pvB'), pvCache = new Map();
  let pvCard = null, pvShowT = 0, pvHideT = 0;
  function frameFor(src) {
    let f = pvCache.get(src);
    if (f) { pvCache.delete(src); pvCache.set(src, f); return f; }
    f = document.createElement('iframe');
    f.src = src; f.loading = 'eager'; f.referrerPolicy = 'strict-origin-when-cross-origin';
    f.setAttribute('allow', 'encrypted-media; picture-in-picture; clipboard-write');
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox');
    f.title = '인스타 미리보기';
    f.addEventListener('load', () => { f.dataset.loaded = '1'; if (f.style.display !== 'none') $('pvSpin').hidden = true; });
    pvB.appendChild(f);
    pvCache.set(src, f);
    while (pvCache.size > 8) { const [k, old] = pvCache.entries().next().value; pvCache.delete(k); old.remove(); }
    return f;
  }
  function showPreview(card, l, sheet) {
    const src = embedSrc(l); if (!src) return;
    clearTimeout(pvHideT);
    if (pvCard && pvCard !== card) pvCard.classList.remove('pv-on');
    pvCard = card; card.classList.add('pv-on');
    $('pvT').textContent = linkTitle(l);
    $('pvOpen').href = l.url;
    const f = frameFor(src);
    pvCache.forEach(x => { x.style.display = x === f ? 'block' : 'none'; });
    $('pvSpin').hidden = f.dataset.loaded === '1';
    pv.classList.toggle('sheet', !!sheet);
    $('pvVeil').hidden = !sheet;
    pv.hidden = false;
    if (sheet) { pv.style.height = ''; return; }
    const r = card.getBoundingClientRect(), W = 360, vw = innerWidth, vh = innerHeight;
    const H = Math.min(l.kind === 'account' || l.kind === 'story' ? 560 : 640, vh - 24);
    let x = r.right + 10;
    if (x + W > vw - 8) x = r.left - W - 10;
    if (x < 8) x = clamp(r.left, 8, vw - W - 8);
    pv.style.left = x + 'px';
    pv.style.top = clamp(r.top - 60, 12, vh - H - 12) + 'px';
    pv.style.height = H + 'px';
  }
  function hidePreview() {
    clearTimeout(pvShowT); clearTimeout(pvHideT);
    pv.hidden = true; $('pvVeil').hidden = true;
    if (pvCard) { pvCard.classList.remove('pv-on'); pvCard = null; }
  }
  board.addEventListener('mouseover', e => {
    if (!canHover.matches) return;
    const card = e.target.closest('.lk'); if (!card || card.contains(e.relatedTarget)) return;
    if (e.target.closest('.lk-a')) return;
    const l = S.links.get(card.dataset.id); if (!l || !embedSrc(l)) return;
    clearTimeout(pvShowT); clearTimeout(pvHideT);
    pvShowT = setTimeout(() => showPreview(card, l, false), pv.hidden ? 300 : 80);
  });
  board.addEventListener('mouseout', e => {
    if (!canHover.matches) return;
    const card = e.target.closest('.lk'); if (!card || card.contains(e.relatedTarget)) return;
    clearTimeout(pvShowT);
    if (pv.contains(e.relatedTarget)) return;
    pvHideT = setTimeout(hidePreview, 250);
  });
  pv.addEventListener('mouseenter', () => clearTimeout(pvHideT));
  pv.addEventListener('mouseleave', e => { if (pv.classList.contains('sheet')) return; if (pvCard && pvCard.contains(e.relatedTarget)) return; pvHideT = setTimeout(hidePreview, 250); });
  $('pvX').addEventListener('click', hidePreview);
  $('pvVeil').addEventListener('click', hidePreview);
  board.addEventListener('scroll', () => { if (!pv.classList.contains('sheet')) hidePreview(); paintNav(); }, {passive: true});
  window.addEventListener('scroll', () => { if (!pv.classList.contains('sheet')) hidePreview(); }, {passive: true});
  window.addEventListener('resize', () => hidePreview());

  /* ══════════════════════ 참여자 ══════════════════════ */
  async function openMembers() {
    if (!S.staff) await loadStaff();
    $('pTeam').innerHTML = TEAMS.map(t => `<option value="${t.k}"${t.k === 'etc' ? ' selected' : ''}>${esc(t.name)}</option>`).join('');
    paintMembers();
    $('memDlg').hidden = false;
  }
  const membersNow = () => { const m = cur(); return (m && Array.isArray(m.members) ? m.members : defaultMembers(S.wk)).filter(x => x && x.name).slice(); };
  function paintMembers() {
    const mem = membersNow(), on = new Set(mem.map(x => x.name));
    const st = S.staff || {design: [], mkt: [], md: []};
    $('memTtl').textContent = `${weekName(S.wk)} 참여자`;
    $('memBody').innerHTML = TEAMS.map(t => {
      const names = (t.k === 'etc' ? ETC_DEFAULT.slice() : st[t.k].slice());
      mem.forEach(x => { if ((TMAP[x.team] ? x.team : teamOfName(x.name)) === t.k && !names.includes(x.name)) names.push(x.name); });
      if (!names.length) return '';
      return `<div class="mg"><div class="mg-h">${esc(t.name)}</div><div class="pills">${
        names.map(n => `<label class="pill${on.has(n) ? ' on' : ''}" data-n="${esc(n)}" data-t="${t.k}"><input type="checkbox"${on.has(n) ? ' checked' : ''}><span class="ck"></span>${esc(n)}</label>`).join('')
      }</div></div>`;
    }).join('');
  }
  async function setMembers(next) {
    try {
      const m = await ensureMeeting(S.wk);
      const r = await rest(`${T_M}?id=eq.${m.id}`, {method: 'PATCH', headers: RET, body: JSON.stringify({members: next, updated_by: ME()})});
      if (r && r[0]) { S.meetings.set(m.id, r[0]); if (later(r[0].updated_at, S.curM)) S.curM = r[0].updated_at; }
    } catch (e) { toast('참여자를 저장하지 못했어요: ' + e.message, true); }
    paintMembers(); renderAll(true);
  }
  $('memBody').addEventListener('click', e => {
    const p = e.target.closest('.pill'); if (!p) return;
    e.preventDefault();
    const m = cur(), mem = membersNow(), n = p.dataset.n;
    const i = mem.findIndex(x => x.name === n);
    if (i >= 0) {
      const cnt = m ? linksOf(m.id).filter(l => l.person === n).length : 0;
      mem.splice(i, 1);
      if (cnt) toast(`${n}님 주소 ${cnt}개는 칸에 그대로 남아요`);
    } else mem.push({name: n, team: p.dataset.t});
    setMembers(memberOrder(mem));
  });
  $('pAdd').addEventListener('click', () => {
    const n = $('pName').value.trim().slice(0, 40), t = $('pTeam').value;
    if (!n) { $('pName').focus(); return; }
    const mem = membersNow();
    if (mem.some(x => x.name === n)) { toast('이미 있는 이름이에요', true); return; }
    mem.push({name: n, team: t});
    $('pName').value = '';
    setMembers(memberOrder(mem));
  });
  $('pName').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('pAdd').click(); } });
  $('memBtn').addEventListener('click', openMembers);
  $('memClose').addEventListener('click', () => { $('memDlg').hidden = true; });
  $('memDlg').addEventListener('click', e => { if (e.target === $('memDlg')) $('memDlg').hidden = true; });

  /* ══════════════════════ 더보기 (글로 복사) ══════════════════════ */
  let menuEl = null;
  function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
  function openMenu(btn, html, pick) {
    const r = btn.getBoundingClientRect();
    menuEl = document.createElement('div');
    menuEl.className = 'menu';
    menuEl.innerHTML = html;
    document.body.appendChild(menuEl);
    const below = r.bottom + 6 + menuEl.offsetHeight <= innerHeight - 8;
    menuEl.style.top = Math.max(scrollY + 8, (below ? r.bottom + 6 : r.top - 6 - menuEl.offsetHeight) + scrollY) + 'px';
    menuEl.style.left = clamp(r.left + scrollX, 8, Math.max(8, innerWidth - menuEl.offsetWidth - 8)) + 'px';
    menuEl.addEventListener('click', ev => { const b = ev.target.closest('[data-m]'); if (!b) return; ev.stopPropagation(); closeMenu(); pick(b.dataset.m); });
  }
  $('moreBtn').addEventListener('click', e => {
    e.stopPropagation();
    if (menuEl) { closeMenu(); return; }
    openMenu($('moreBtn'), `<button type="button" data-m="copy">${ICON.copy} 회의록 글로 복사 (카톡에 붙여넣기)</button>`, () => copyText());
  });
  document.addEventListener('click', e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (menuEl) closeMenu();
    else if (!$('memDlg').hidden) $('memDlg').hidden = true;
    else if (!pv.hidden) hidePreview();
  });
  async function copyText() {
    const m = cur(), cols = columnsOf(m), all = m ? linksOf(m.id) : [];
    const out = [`[${weekName(S.wk)} · ${mdw(S.wk)}] 마케팅 회의`];
    TEAMS.forEach(t => cols.filter(c => c.team === t.k).forEach(c => {
      const ls = all.filter(l => l.person === c.name).sort((a, b) => bRank(a.brand) - bRank(b.brand) || b.pos - a.pos);
      out.push('', `■ ${t.name} ${c.name} (${ls.length})`);
      ls.forEach(l => out.push(`- [${bName(l.brand)}] ${l.url}${l.memo ? '  ' + l.memo.replace(/\n/g, ' ') : ''}`));
    }));
    const e = est(S.wk), notes = e.val.notes.trim(), dec = e.val.decisions.trim();
    if (notes) out.push('', '■ 회의 메모', notes);
    if (dec) out.push('', '■ 결정 · 할 일', dec);
    const txt = out.join('\n');
    try { await navigator.clipboard.writeText(txt); toast('복사했어요 — 카톡에 붙여 넣으면 돼요'); }
    catch (err) {
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('복사했어요'); } catch (er) { toast('복사하지 못했어요', true); }
      ta.remove();
    }
  }

  /* ══════════════════════ 잠금 · 시작 ══════════════════════ */
  function isUnlocked() {
    if (window.__mtgInOffice) return true;
    return lsGet('brightbeed_unlocked') === '1' && lsGet('brightbeed_auth_ver') === AUTH_VERSION
      && !(lsGet('brightbeed_role') === 'master' && lsGet('brightbeed_master_ver') !== MASTER_PIN_VER);
  }
  async function sha256hex(s) {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  }
  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('lockPin').value.trim();
    let role = null;
    try { role = PIN_HASH[await sha256hex(v)] || null; } catch (err) { role = null; }
    if (!role) { $('lockErr').textContent = '접속 코드가 올바르지 않아요'; $('lockPin').value = ''; $('lockPin').focus(); return; }
    lsSet('brightbeed_unlocked', '1'); lsSet('brightbeed_role', role); lsSet('brightbeed_auth_ver', AUTH_VERSION);
    if (role === 'master') lsSet('brightbeed_master_ver', MASTER_PIN_VER);
    $('lock').hidden = true;
    start();
  });


  async function start() {
    $('app').hidden = false;
    const want = (location.hash || '').slice(1);
    S.wk = isDay(want) ? weekOf(want) : thisWeek();
    S.month = monthOf(S.wk);
    renderWeeks();
    try { await Promise.all([loadAll(), loadStaff()]); }
    catch (e) { toast('회의록을 못 불러왔어요: ' + e.message, true); }
    EST.clear();
    paintText();
    renderAll(true);
    showTab();
    // 휴대폰에서는 내 칸부터 보이게 (업무일지 '나는' 이름)
    const mine = matchMedia('(max-width: 860px)').matches && ME() ? document.querySelector(`.col[data-p="${cssEsc(ME())}"]`) : null;
    if (mine) $('board').scrollLeft = Math.max(0, mine.getBoundingClientRect().left - $('board').getBoundingClientRect().left - 2);
    pollLoop();
    if (window.OfficeLive) liveBoot(); else { window.addEventListener('load', liveBoot); setTimeout(liveBoot, 5000); }
  }
  window.__mtgTest = {parseLink, dupKey, merge3, weekOf, weeksOf, weekName};   // 확인용
  if (isUnlocked()) start(); else { $('lock').hidden = false; setTimeout(() => $('lockPin').focus(), 50); }
})();
</script>
