name: 라인시트 사진 (디자인센터 전광판)

# 구글시트 'COFERRY LINE SHEET' 의 상품 사진을 linesheet/ 로 옮긴다 (scripts/linesheet-images.mjs).
# 시트 사진 주소는 금방 만료되고 다른 사이트에 못 띄워서, 오피스는 여기서 옮긴 사본을 쓴다.
# 사진이 바뀌었을 때만 커밋한다. 5분마다(GitHub 예약 최소 간격) — 정각은 붐벼서 늦어지니 2분·7분… 에 돈다.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # 사진이 바뀌면 사이트 배포(pages.yml)를 직접 부르기 위해

concurrency:
  group: linesheet-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 사진 받기
        run: node scripts/linesheet-images.mjs
      - name: 커밋
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A linesheet
          git diff --cached --quiet && exit 0
          git commit -m "linesheet: 라인시트 사진 갱신 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          exit 1
      # 봇(GITHUB_TOKEN) 커밋은 GitHub 규칙상 push 로 도는 배포를 깨우지 못한다.
      # linesheet/ 는 사이트 주소로 읽으니, 사진이 바뀐 경우에만 배포를 직접 부른다.
      # 요청이 안 돼도 이 작업은 실패로 치지 않는다 (다음 커밋 배포 때 같이 올라감).
      - name: 사이트 배포 요청
        if: steps.commit.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY" && exit 0
            sleep 5
          done
          echo "::warning::사이트 배포 요청 실패 — 다음 커밋 배포 때 같이 반영됨"
