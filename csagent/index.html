<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  /* 에이전트 학습 — 카카오톡 상담 에이전트를 사장님이 직접 고치는 창 (2026-11-25)
     사장님 "에이전트 학습을 아예 새창으로 키워서. 기존 정상적으로 된건 냅두고. 개입해서 시나리오를 조금 수정해야하거나 확인이 필요한건 수정할 수 있게하자.
     시나리오북이랑 시험답변 합쳐주고. 예상질문 답 이런것도 요약으로 다 저장해두고. 학습이 필요하거나 수정이 필요한 시나리오 처음보는 시나리오 이런것만 보이게 해줘. 내가 개입해서 수정하게"
     · 볼 것 = 수정 필요 · 학습 필요 · 처음 보는 시나리오만 (맞은 답 · 정해진 대로 간 것은 안 보임 — 되살리지 말 것). GET · POST /cs/kakao-review (관리자, 대화는 사무실 인터넷만)
     · 정리된 답 = 예상 질문 · 답 요약 + 브랜드 정보 (GET /cs/kakao-book). 고치면 에이전트가 바로 그 답을 쓴다(10분 안). 고객에게 나가는 것은 아님
     · 적는 중에는 다시 그리지 않는다. 적다 만 글은 이 브라우저에(DRAFT), 못 보낸 것은 OUT 에 두었다가 다시 보낸다(번호가 같아 두 번 안 들어감)
     · 색은 아낌 — 무채색 + 빨강 하나, 대화창만 카카오톡 색 */
  :root { --bg:#f4f5f7; --panel:#fff; --line:#e6e8ec; --line2:#d3d7de; --ink:#191919; --t2:#4b5563; --t3:#8b93a1; --soft:#f3f4f6; --red:#c62828; --sky:#b2c7da; --yel:#fee500; --top:60px;
    --font:Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif }
  * { box-sizing:border-box }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--font); -webkit-font-smoothing:antialiased }
  body { display:flex; flex-direction:column; overflow:hidden }
  button,input,textarea,select { font:inherit; color:inherit }
  button { cursor:pointer }
  [hidden] { display:none !important }
  :focus-visible { outline:2px solid var(--ink); outline-offset:1px }
  .top { flex:none; display:flex; align-items:center; gap:10px 18px; min-height:var(--top); padding:8px 20px; background:var(--panel); border-bottom:1px solid var(--line) }
  .top h1 { margin:0; font-size:18px; font-weight:800; letter-spacing:-.4px; white-space:nowrap }
  .seg { display:inline-flex; gap:2px; padding:3px; border-radius:11px; background:var(--soft) }
  .seg button { display:inline-flex; align-items:center; gap:6px; min-height:34px; padding:0 16px; border:0; border-radius:9px; background:none; color:var(--t2); font-size:13.5px; font-weight:700; white-space:nowrap }
  .seg button[aria-selected=true] { background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.1) }
  .seg em { font-style:normal; font-weight:800; color:var(--red); font-variant-numeric:tabular-nums }
  .nums { display:flex; gap:20px; margin-left:auto; white-space:nowrap }
  .nums div { display:flex; align-items:baseline; gap:6px }
  .nums span { font-size:12px; color:var(--t3) } .nums b { font-size:16px; font-weight:800; letter-spacing:-.3px; font-variant-numeric:tabular-nums }
  .off { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--t3); white-space:nowrap }
  .off::before { content:''; width:7px; height:7px; border-radius:50%; background:#b5bac3 }
  .off.on::before { background:var(--ink) }
  .x { flex:none; width:36px; height:36px; border:0; border-radius:10px; background:none; font-size:18px; color:var(--t2) } .x:hover { background:var(--soft) }
  main { flex:1; min-height:0; display:flex }
  .bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap }
  select,input[type=search] { min-height:36px; padding:0 12px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:13px }
  input[type=search] { min-width:0; flex:1 } select:focus,input:focus,textarea:focus { outline:none; border-color:var(--ink) }

  /* 볼 것 — 목록 · 대화 · 고치기 */
  .todo { flex:1; min-width:0; display:grid; grid-template-columns:minmax(300px,23vw) minmax(0,1fr) minmax(380px,30vw) }
  .col { min-width:0; min-height:0; display:flex; flex-direction:column; background:var(--panel) }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px }
  .chips button { display:inline-flex; align-items:center; gap:5px; min-height:32px; padding:0 12px; border:0; border-radius:999px; background:var(--soft); color:var(--t2); font-size:12.5px; font-weight:700 }
  .chips button[aria-pressed=true] { background:var(--ink); color:#fff }

  .list { flex:1; min-height:0; overflow:auto; padding:6px 8px 24px }

  .it .m { display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--t3) } .it .m b { color:var(--t2); font-weight:700 } .it .m .t { margin-left:auto; font-variant-numeric:tabular-nums }
  .it .q { display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-top:3px; font-size:13.5px; font-weight:600; line-height:1.45; overflow-wrap:anywhere }

  .none { padding:48px 20px; text-align:center; color:var(--t3); font-size:13.5px }
  .chead { flex:none; display:flex; align-items:center; gap:8px; min-height:54px; padding:8px 18px; border-bottom:1px solid var(--line); background:#fff }
  .chead b { font-size:15px; font-weight:800 } .chead .s { font-size:12px; color:var(--t3) }
  .back { display:none; width:36px; height:36px; margin-left:-8px; border:0; border-radius:10px; background:none; font-size:20px }
  .talk { flex:1; min-height:0; overflow:auto; padding:20px 22px 30px; background:var(--sky) }
  .day { margin:14px 0 10px; text-align:center; font-size:11.5px; color:#51677a }
  .msg { display:flex; align-items:flex-end; gap:6px; margin-top:8px } .msg.me { flex-direction:row-reverse }
  .msg .b { max-width:min(560px,78%); padding:9px 12px; border-radius:14px; background:#fff; font-size:13.5px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere } .msg.me .b { background:var(--yel) } .msg.me.auto .b { background:#fff8b8 }
  .msg .w { font-size:10.5px; color:#5c7286; white-space:nowrap; font-variant-numeric:tabular-nums; text-align:left } .msg.me .w { text-align:right }
  .msg .w span { display:block } .msg.ask .b { box-shadow:0 0 0 2px var(--ink) }
  .msg.ph .b { color:#7a8794 }
  .edit { overflow:auto; padding:18px 20px 30px }
  .why { padding:12px 14px; border-radius:12px; background:var(--soft); font-size:13px; line-height:1.55; overflow-wrap:anywhere } .why b { display:block; margin-bottom:2px; font-size:12px; font-weight:800; color:var(--t2) } .why.r b { color:var(--red) }
  .lb { display:flex; align-items:center; gap:8px; margin:18px 0 6px; font-size:12.5px; font-weight:800 } .lb small { font-weight:600; color:var(--t3) } .lb button { margin-left:auto }
  .mini { min-height:28px; padding:0 10px; border:1px solid var(--line2); border-radius:8px; background:#fff; font-size:12px; font-weight:700; white-space:nowrap } .mini:hover { border-color:var(--ink) }
  textarea { display:block; width:100%; min-height:132px; padding:12px 14px; border:1px solid var(--line2); border-radius:12px; background:#fff; font-size:14px; line-height:1.6; resize:vertical } textarea.sm { min-height:68px; font-size:13px }
  .ref { margin-top:8px; padding:10px 14px; border:1px dashed var(--line2); border-radius:12px; font-size:13px; line-height:1.55; color:var(--t2); white-space:pre-wrap; overflow-wrap:anywhere }
  .acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:18px }
  .btn { min-height:42px; padding:0 16px; border:1px solid var(--line2); border-radius:12px; background:#fff; font-size:13.5px; font-weight:700 } .btn:hover { border-color:var(--ink) }
  .btn.p { flex:1 0 100%; min-height:48px; border-color:var(--ink); background:var(--ink); color:#fff; font-size:14.5px; font-weight:800 } .btn.p:hover { background:#000 } .btn:disabled { opacity:.45; cursor:default }
  .acts .btn:not(.p) { flex:1 }
  .state { margin-top:10px; min-height:20px; font-size:12.5px; color:var(--t3) } .state.bad { color:var(--red); font-weight:700 }
  .fixed { margin-bottom:14px; padding:12px 14px; border:1px solid var(--ink); border-radius:12px; font-size:13px } .fixed b { font-weight:800 } .fixed .mini { float:right }

  /* 정리된 답 */
  .book { flex:1; min-width:0; overflow:auto; padding:20px clamp(16px,3vw,44px) 60px }
  .book .bar { position:sticky; top:-20px; z-index:2; margin:-20px 0 14px; padding:16px 0 12px; background:var(--bg) } .book .bar input { max-width:420px }
  .bin { max-width:1360px; margin:0 auto }
  .bg { margin:22px 0 8px; font-size:13px; font-weight:800; color:var(--t2) } .bg em { font-style:normal; color:var(--t3); font-weight:600 }
  .card { border:1px solid var(--line); border-radius:14px; background:#fff; overflow:hidden }
  .row + .row { border-top:1px solid var(--line) }
  .rowb { display:grid; grid-template-columns:minmax(200px,30%) minmax(0,1fr) auto; gap:16px; align-items:baseline; width:100%; padding:12px 18px; border:0; background:none; text-align:left } .rowb:hover { background:#fafbfc }
  .rowb b { font-size:13.5px; font-weight:700; overflow-wrap:anywhere } .rowb .a { font-size:13px; color:var(--t2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis } .rowb .n { font-size:12px; color:var(--t3); white-space:nowrap; font-variant-numeric:tabular-nums }
  .rowx { padding:2px 18px 18px } .rowx .full { padding:12px 14px; border-radius:12px; background:var(--soft); font-size:13.5px; line-height:1.6; white-space:pre-wrap; overflow-wrap:anywhere }
  .rowx .v { margin-top:8px; font-size:12.5px; color:var(--t3) } .rowx .acts .btn { flex:none } .rowx .acts .btn.p { flex:none; min-height:42px; font-size:13.5px }
  .ltop { display:flex; align-items:center; gap:12px; margin-bottom:14px; font-size:13px; color:var(--t3) }
  .lks { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr)); gap:16px }
  .lk { padding:18px 20px 10px; border:1px solid var(--line); border-radius:16px; background:#fff } .lk h2 { display:flex; align-items:center; gap:8px; margin:0 0 8px; font-size:15.5px; font-weight:800 }
  .lr { display:grid; grid-template-columns:auto minmax(120px,36%) minmax(0,1fr) auto; gap:10px; align-items:baseline; padding:10px 0; border-top:1px solid var(--line); font-size:13px }
  .lr i { width:8px; height:8px; border-radius:50%; background:#c3c8d0 } .lr.ok i { background:var(--ink) } .lr.bad i { background:var(--red) } .lr.wait i { background:#fff; box-shadow:inset 0 0 0 2px #c3c8d0 }
  .lr b { font-weight:700 } .lr span { color:var(--t2); overflow-wrap:anywhere } .lr em { font-style:normal; font-size:12px; font-weight:700; color:var(--t3) } .lr.bad em,.lr.bad span { color:var(--red) }
  .warn { margin:0 0 12px; padding:10px 14px; border-radius:10px; background:#fdecec; color:var(--red); font-size:13px; font-weight:600 }
  @media (max-width:1180px) { .todo { grid-template-columns:minmax(280px,34%) minmax(0,1fr) } .todo .c2 { grid-column:2; grid-row:1 } .todo .c3 { grid-column:2; grid-row:2; border-top:1px solid var(--line) } .todo { grid-template-rows:minmax(0,1fr) minmax(0,1.1fr) } .todo .c1 { grid-row:1 / span 2 } .nums span { display:none } }
  @media (max-width:760px) {
    .top { flex-wrap:wrap; padding:8px 12px; gap:8px 12px } .top h1 { font-size:16px } .nums,.off { display:none } .top .seg { order:3; width:100% } .top .seg button { flex:1; justify-content:center } .top .x { margin-left:auto }
    .todo { display:block; overflow:auto; background:var(--panel) } .todo .col { display:none } .todo .c1 { display:flex; height:100% } .todo.open .c1 { display:none } .todo.open .c2,.todo.open .c3 { display:flex; border:0 } .todo.open .talk { max-height:46vh } .back { display:block }
    .lr { grid-template-columns:auto 1fr auto } .lr span { grid-column:2 / -1; grid-row:2 }
    .rowb { grid-template-columns:1fr auto; gap:4px 10px } .rowb .a { grid-column:1 / -1; white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical } textarea,select,input[type=search] { font-size:16px } .btn,.chips button,.mini { min-height:44px }
  }
</style>

<script>
(function () {
'use strict';
const P = window.parent, $ = id => document.getElementById(id);
const E = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const N = v => Number(v || 0).toLocaleString('ko-KR');
const p2 = v => String(v).padStart(2, '0');
const DRAFT = 'bb_csagent_draft_v1', OUT = 'bb_csagent_out_v1';
const ls = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
const me = () => { try { return (localStorage.getItem('brightbeed_diary_me') || '').trim().slice(0, 20); } catch (e) { return ''; } };
const rid = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 12));
const KIND = {fix: ['수정 필요', '답이 아쉽거나 틀렸어요'], learn: ['학습 필요', '답을 몰라 직원을 불렀어요'], new: ['처음 보는 시나리오', '예상 질문에 없던 문의예요']};
const ACT = {answer: '바로 답', ask: '정보를 물음', todo: '답하고 처리할 일로', staff: '직원을 부름'};
const WHO = {staff: '직원', ai: '카나나', bot: '자동응답'};
const FV = {text: '답을 고쳤어요', ok: '이대로 맞아요', staff: '직원이 맡아요', drop: '볼 필요 없음'};
const S = {d: null, err: '', book: null, bookErr: '', links: null, linkErr: '', tab: 'todo', f: 'all', brand: '', q: '', cur: '', b2: '', q2: '', sub: 'qa', open: new Set(), rows: new Map(), edits: new Map(), out: ls(OUT) || [], sending: false, wait: 0, tm: 0};

/* ── 서버 ── */
async function api(path, body) {
  const base = await P.loadProxyBase();
  if (!base) throw new Error('서버에 연결되지 않았어요');
  const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 30000);
  try {
    const r = await fetch(base + path, {method: body ? 'POST' : 'GET', headers: Object.assign({'X-Brightbeed-PIN': P.ghPin(), 'Accept': 'application/json'}, body ? {'Content-Type': 'application/json'} : {}), body: body ? JSON.stringify(body) : undefined, cache: 'no-store', signal: ac.signal});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) { const e = new Error(j.error || 'HTTP ' + r.status); e.no = [400, 403, 409, 413].includes(r.status); throw e; }
    return j;
  } catch (e) { if (e && e.name === 'AbortError') throw new Error('응답이 늦어요'); throw e; }
  finally { clearTimeout(tm); }
}
async function load() {
  try {
    const j = await api('/cs/kakao-review');
    S.d = j; S.err = '';
    S.rows = new Map(); (j.rows || []).forEach(r => S.rows.set(r.key, r));
    S.edits = new Map(); (j.edits || []).forEach(r => S.edits.set(r.key, r));
    S.out.forEach(o => apply(o));
    if (j.staff && S.tab === 'todo') S.tab = 'book';
  } catch (e) { S.err = (e && e.message) || String(e); }
  if (S.tab === 'todo' || (S.tab === 'book' && !S.book)) paint();
  head(); push();
  if (S.tab === 'book') loadBook();
}
async function loadBook() {
  try { S.book = await api('/cs/kakao-book'); S.bookErr = ''; } catch (e) { S.bookErr = (e && e.message) || String(e); }
  if (S.tab === 'book' && !typing()) paint();
}
const typing = () => { const a = document.activeElement; return !!a && a.tagName === 'TEXTAREA' && !!a.value; };

/* ── 고친 것 저장 ── 화면 먼저, 서버는 차례로. 번호가 같아 두 번 안 들어간다 */
function apply(o) { const m = /^(faq|fact):/.test(o.key) ? S.edits : S.rows; if (o.del) m.delete(o.key); else m.set(o.key, Object.assign({}, o, {snap: o.snap || (m.get(o.key) || {}).snap})); }
function save(o) {
  o = Object.assign({id: rid(), at: Date.now(), by: me()}, o);
  S.out = S.out.filter(x => !(x.key === o.key && !x.tried)); S.out.push(o); ls(OUT, S.out);
  apply(o); head(); push();
}
async function push() {
  if (S.sending || !S.out.length) return;
  S.sending = true; clearTimeout(S.tm);
  try {
    while (S.out.length) {
      const o = S.out[0]; o.tried = true;
      try {
        await api('/cs/kakao-review', o.del ? {id: o.id, key: o.key, del: true} : {id: o.id, key: o.key, v: o.v, text: o.text || '', note: o.note || '', by: o.by});
        S.out = S.out.filter(x => x !== o); ls(OUT, S.out); S.wait = 0;

  const ST = {ok: '정상', wait: '대기', bad: '끊김'}, gs = [...new Set(d.items.map(x => x.group))], old = (d.fileAgeSec || 0) > 45 * 60, t = new Date(d.at);
  const card = g => { const xs = d.items.filter(x => x.group === g), b = xs.filter(x => x.st === 'bad').length, w = xs.filter(x => x.st === 'wait').length;
    return `<section class="lk"><h2>${E(g)} <span class="tag${b ? ' r' : ''}">${b ? '끊김 ' + b : w ? '대기 ' + w : '모두 정상'}</span></h2>${xs.map(x => `<div class="lr ${x.st}"><i></i><b>${E(x.name)}</b><span>${E(x.note)}</span><em>${ST[x.st]}</em></div>`).join('')}</section>`; };
  m.innerHTML = `<div class="book"><div class="bin"><div class="ltop">${old ? '<span class="warn" style="margin:0">점검이 늦어지고 있어요</span>' : ''}<span>${p2(t.getHours())}:${p2(t.getMinutes())}에 실제로 불러 본 결과예요. 15분마다 다시 확인하고, 끊기면 알림이 가요.</span></div><div class="lks">${gs.map(card).join('')}</div></div></div>`;
}

/* ── 시작 ── */
$('tabTodo').onclick = () => { if (S.tab !== 'todo') { S.tab = 'todo'; paint(); } };
$('tabBook').onclick = () => { if (S.tab !== 'book') { S.tab = 'book'; paint(); loadBook(); } };
$('tabLink').onclick = () => { S.tab = 'link'; paint(); loadLinks(); };
$('close').onclick = () => { try { if (P.document.documentElement.classList.contains('solo-csagent')) P.close(); P.bbToolClose(); } catch (e) { history.back(); } };
load(); loadLinks();
setInterval(() => { if (!document.hidden) loadLinks(); }, 300000);
setInterval(() => { if (!document.hidden && S.tab === 'todo' && !S.out.length && S.d) api('/cs/kakao-review').then(j => { if (typing()) return; const o = JSON.stringify((S.d.items || []).map(x => x.key)), nw = JSON.stringify((j.items || []).map(x => x.key)); S.d = j; S.rows = new Map((j.rows || []).map(r => [r.key, r])); S.edits = new Map((j.edits || []).map(r => [r.key, r])); head(); if (o !== nw) listOnly(!document.querySelector('.it[aria-current=true]')); }).catch(() => {}); }, 120000);
})();
