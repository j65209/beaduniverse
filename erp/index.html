<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>ERP전산팀 · 비드유니버스 오피스</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script>
  /* 오피스 잠금 연동 (models/ 와 같은 방식) — 오피스에서 PIN 을 넣은 브라우저만 들어올 수 있음.
     오피스 안 화면(iframe, index.html 의 TOOL_PAGES 'erp')으로 열렸으면 '← 오피스 홈' 은 그 화면을 닫는다 (bbToolClose).
     회사 주소(beaduniverse.kr/office/)에선 오피스가 이 HTML 을 받아 빈 iframe 에 직접 쓰므로 홈 주소는 부모(오피스)에서 얻는다. */
  (function () {
    var inOffice = false, home = '';
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    try { if (window.parent === window && localStorage.getItem('brightbeed_unlocked') !== '1') { location.replace(home + '?from=erp'); return; } } catch (e) { /* noop */ }
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
    });
  })();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<style>
  /* ERP전산팀 — 구글시트 '식스샵 ERP MASTER'(= 재고 ERP MASTER)를 업무 프로그램 화면으로 보여 준다 (보기 전용)
     · 2026-11-19 첫 판은 시트 모양 그대로였고, 같은 날 사용자 "구글시트랑 똑같이가 아니라 전문 프로그램처럼 —
       칸을 우리가 맞추는 게 아니라 들어간 숫자 · 글자에 맞춰 자동으로" → 2판: 왼쪽 메뉴 · 요약 카드 · 자동 칸 너비 표 · 상세 창.
     · 자료는 그대로 시트 '웹 보기'(htmlview/sheet)를 브라우저가 구글에서 바로 받는다 (링크 보기 공개 시트, CORS 허용, 서버 · 키 없음).
       시트의 머리글 줄 = 표 머리글, 칸 너비 · 정렬 · 숫자 쉼표는 내용으로 정하고, 시트의 글자색 · 굵게 · 칸 색(옅게) · 체크박스 · 칩 · 사진 · 링크는 뜻만 살린다.
     · 날짜별 주문 원본 탭의 주문자 이름 · 연락처 · 주소 칸은 가려서 보여 준다. */
  :root{
    --ui:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
    --bg:#f3f5f8; --card:#fff; --line:#e3e8ef; --line-2:#edf1f5; --head:#f7f9fb;
    --text:#0f172a; --text-2:#334155; --text-3:#64748b; --text-4:#94a3b8;
    --accent:#16a34a; --accent-ink:#15803d; --accent-soft:#ecfdf3;
    --side:#0f172a; --side-text:#cbd5e1; --side-mute:#64748b;
    --danger:#dc2626; --warn:#d97706; --info:#2563eb;
    --row-h:34px; --side-w:224px; --detail-w:400px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--ui);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
  a{color:inherit}
  .app{height:100vh;height:100dvh;display:flex;overflow:hidden}

  /* ── 왼쪽 메뉴 ── */
  .side{flex:none;width:var(--side-w);display:flex;flex-direction:column;background:var(--side);color:var(--side-text)}
  .side-top{flex:none;display:flex;align-items:center;gap:11px;height:58px;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.07)}
  .logo{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,#22c55e,#15803d);box-shadow:0 2px 10px rgba(34,197,94,.35)}
  .logo svg{width:16px;height:16px;color:#fff}
  .side-top b{display:block;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.02em}
  .side-top small{display:block;margin-top:1px;font-size:11px;color:var(--side-mute)}
  .side-fold{flex:none;margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--side-mute)}
  .side-fold:hover{background:rgba(255,255,255,.08);color:#fff}
  .side-fold svg{width:17px;height:17px}
  /* 왼쪽 메뉴 접기 (PC) — 접으면 표가 그만큼 넓어지고, 위 막대의 ☰ 로 다시 편다 */
  .app.side-off .menu{display:grid}
  @media (min-width:1001px){ .app.side-off .side{display:none} }
  .nav{flex:1;min-height:0;overflow:auto;padding:6px 10px 16px;scrollbar-width:thin;scrollbar-color:#334155 transparent}
  .nav-sec{margin:16px 0 6px;padding:0 10px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--side-mute)}
  .nav-item{position:relative;width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:13.5px;text-align:left;color:var(--side-text)}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.on{background:rgba(34,197,94,.16);color:#fff;font-weight:700}
  .nav-item.on::before{content:'';position:absolute;left:-10px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:#22c55e}
  .nav-item .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#475569}
  .nav-item .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item .nd{flex:none;font-size:11px;color:var(--side-mute);font-variant-numeric:tabular-nums}
  .nav-item.on .nd{color:#86efac}
  .side-foot{flex:none;padding:10px 10px 14px;border-top:1px solid rgba(255,255,255,.07)}
  .side-link{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:8px;font-size:12.5px;color:var(--side-text);text-decoration:none}
  .side-link:hover{background:rgba(255,255,255,.06);color:#fff}
  .side-link svg{width:15px;height:15px;opacity:.8}
  .scrim,.dscrim{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:45}

  /* ── 본문 ── */
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;gap:8px;height:58px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
  .menu{display:none}
  .find{flex:0 1 420px;min-width:0;display:flex;align-items:center;gap:7px;height:38px;padding:0 8px 0 13px;border-radius:10px;background:#f1f4f8;border:1px solid transparent;cursor:text}
  .find:focus-within{background:#fff;border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .find svg{flex:none;width:16px;height:16px;color:var(--text-4)}
  .find input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font:inherit;font-size:13.5px;color:var(--text)}
  .find input::-webkit-search-cancel-button{display:none}
  .qn{flex:none;font-size:12px;font-weight:700;color:var(--info);white-space:nowrap;font-variant-numeric:tabular-nums}
  .qx{flex:none;width:24px;height:24px;border-radius:50%;color:var(--text-4);font-size:12px}
  .qx:hover{background:#e2e8f0;color:var(--text)}
  .sp{flex:1;min-width:0}
  .st{flex:none;display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:9px;font-size:12.5px;color:var(--text-3);white-space:nowrap;font-variant-numeric:tabular-nums}
  .st:hover{background:#f1f4f8;color:var(--text)}
  .st .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .st.is-load .dot{background:transparent;box-shadow:none;width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--accent);animation:spin .8s linear infinite}
  .st.is-err{color:#b91c1c}
  .st.is-err .dot{background:var(--danger);box-shadow:0 0 0 3px rgba(220,38,38,.15)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .ib{flex:none;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-3);text-decoration:none}
  .ib:hover{background:#f1f4f8;color:var(--text)}
  .ib.on{background:#e8f0fe;color:var(--info)}
  .ib svg{width:18px;height:18px}

  .head{flex:none;padding:14px 18px 12px;background:var(--card);border-bottom:1px solid var(--line)}
  .trow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-height:30px}
  .trow h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.025em}
  .date{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border:1px solid #bbf7d0;border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
  .dates{display:flex;gap:6px;flex-wrap:wrap}
  .dates button{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);font-variant-numeric:tabular-nums}
  .dates button:hover{border-color:#cbd5e1}
  .dates button.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
  .tools{display:flex;align-items:center;gap:8px;margin-left:auto}
  .etog{height:30px;padding:0 12px;border-radius:999px;border:1px dashed #cbd5e1;background:#fff;font-size:12px;color:var(--text-3);white-space:nowrap}
  .etog:hover{border-color:#94a3b8;color:var(--text)}
  .parts{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:#f1f4f8}
  .parts button{height:28px;padding:0 12px;border-radius:7px;font-size:12.5px;color:var(--text-3);white-space:nowrap}
  .parts button:hover{color:var(--text)}
  .parts button.on{background:#fff;color:var(--text);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.12)}
  .alert{margin-top:12px;display:flex;gap:10px;padding:10px 13px;border-radius:10px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;font-size:12.5px;line-height:1.6}
  .alert svg{flex:none;width:17px;height:17px;margin-top:1px;color:#d97706}
  .alert ul{margin:0;padding:0;list-style:none}
  .alert li+li{margin-top:2px}
  .kpis{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
  .kpi{min-width:124px;height:62px;display:flex;flex-direction:column;justify-content:center;padding:0 15px;border-radius:12px;border:1px solid var(--line);background:#fff;text-align:left;cursor:default}
  .kpi b{font-size:21px;font-weight:800;letter-spacing:-.025em;line-height:1.15;font-variant-numeric:tabular-nums;color:var(--text)}
  .kpi b small{font-size:12px;font-weight:700;margin-left:2px;color:var(--text-3)}
  .kpi span{margin-top:3px;font-size:11.5px;color:var(--text-3);white-space:nowrap}
  .kpi.click{cursor:pointer}
  .kpi.click:hover{border-color:#cbd5e1;background:#fafbfc}
  .kpi.red b{color:var(--danger)}
  .kpi.amber b{color:var(--warn)}
  .kpi.blue b{color:var(--info)}
  .kpi.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(22,163,74,.14);background:#fff}
  .chips{margin-top:12px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--text-2);white-space:nowrap}
  .chip:hover{border-color:#cbd5e1}
  .chip em{font-style:normal;font-size:11.5px;color:var(--text-4);font-variant-numeric:tabular-nums}
  .chip.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
  .chip.on em{color:#cbd5e1}

  /* ── 표 ── */
  .gwrap{flex:1;min-height:0;position:relative;background:var(--card)}
  .grid{position:absolute;inset:0;overflow:auto;outline:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .tbl{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:13px;color:var(--text)}
  .tbl th{position:sticky;top:0;z-index:3;height:44px;padding:5px 8px;background:var(--head);color:var(--text-3);font-size:12px;font-weight:700;line-height:1.3;text-align:left;vertical-align:middle;white-space:normal;text-wrap:balance;overflow:hidden;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);cursor:pointer;user-select:none}
  .tbl th.ka{word-break:keep-all}   /* 띄어 쓴 머리글은 낱말 사이에서만 줄바꿈 ('남은 / 재고') */
  .tbl th:hover{color:var(--text)}
  .tbl th.sk{z-index:4}
  .tbl th .ar{margin-left:4px;font-size:9px;color:var(--accent)}
  .tbl th.fill,.tbl td.fill{padding:0;border-right:0;cursor:default}
  .tbl td{height:var(--row-h);padding:0 8px;background:#fff;border-bottom:1px solid var(--line-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .app.dense .tbl td{height:28px}
  .tbl .cl{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;white-space:normal;line-height:1.25;word-break:keep-all;overflow-wrap:break-word}
  .app.dense .tbl .cl{-webkit-line-clamp:1}
  .tbl .r{text-align:right;font-variant-numeric:tabular-nums}
  .tbl .c{text-align:center}
  .tbl td.r,.tbl td.c,.tbl th.r,.tbl th.c{padding-left:6px;padding-right:6px}   /* 숫자 · 체크 칸은 좁게 (fitCols 의 여백과 같게) */
  .tbl .b{font-weight:700}
  .tbl .z{color:#c3cad4}
  .tbl .neg{color:var(--danger);font-weight:700}
  .tbl .rn{color:var(--text-4);font-size:11.5px;text-align:right;font-variant-numeric:tabular-nums;padding:0 7px 0 3px}
  .tbl .sk{position:sticky;z-index:1}
  .tbl .skl{border-right:1px solid #d5dce5}
  .tbl tbody tr{cursor:pointer}
  .tbl tbody tr:hover td{box-shadow:inset 0 0 0 999px rgba(15,23,42,.035)}
  .tbl tbody tr.on td{box-shadow:inset 0 0 0 999px rgba(37,99,235,.075)}
  .tbl tbody tr.on td:first-child{box-shadow:inset 3px 0 0 var(--info),inset 0 0 0 999px rgba(37,99,235,.075)}
  .tbl tr.empty td{height:120px;text-align:center;color:var(--text-4);cursor:default;box-shadow:none!important}
  .tbl tfoot td{position:sticky;bottom:0;z-index:2;height:36px;background:#f1f5f9;border-top:1px solid #cbd5e1;border-bottom:0;font-weight:700;font-variant-numeric:tabular-nums}
  .tbl tfoot td.sk{z-index:3}
  .tbl tfoot .ft{font-size:12px;color:var(--text-3);font-weight:700}
  .tag{display:inline-block;max-width:100%;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;line-height:1.4;vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag+.tag{margin-left:4px}
  .pill{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.4;vertical-align:middle}
  .pill.red{background:#fef2f2;color:#b91c1c}
  .pill.gray{background:#f1f5f9;color:#475569}
  .pill.blue{background:#eff6ff;color:#1d4ed8}
  .pill-sub{margin-left:6px;font-size:12px;color:var(--text-3);vertical-align:middle}
  .pill-sub:first-child{margin-left:0}
  .ck{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:5px;background:#dcfce7;color:#15803d;vertical-align:middle}
  .ck svg{width:12px;height:12px}
  .ck0{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid #d5dce5;vertical-align:middle}
  .thumb{display:block;margin:2px auto;width:30px;height:30px;border-radius:6px;object-fit:cover;background:#f1f5f9;cursor:zoom-in}
  .app.dense .thumb{width:24px;height:24px;margin:1px auto}
  .lnk{color:var(--info);text-decoration:none}
  .lnk:hover{text-decoration:underline}
  mark{background:#fef08a;color:inherit;border-radius:2px;padding:0 1px}
  .skel{padding:6px 0}
  .skel div{display:flex;gap:22px;align-items:center;height:34px;padding:0 16px;border-bottom:1px solid var(--line-2)}
  .skel i{display:block;height:9px;border-radius:5px;background:#edf1f5}
  .msg{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));padding:22px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 12px 34px rgba(15,23,42,.14);font-size:13.5px;line-height:1.6;color:var(--text-2);z-index:20;text-align:center}
  .msg b{display:block;font-size:15.5px;color:var(--text);margin-bottom:6px}
  .msg button{margin-top:14px;height:36px;padding:0 18px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}

  /* ── 상세 창 (줄을 누르면) ── */
  .detail{position:fixed;top:0;right:0;bottom:0;z-index:40;width:var(--detail-w);max-width:100%;display:flex;flex-direction:column;background:#fff;border-left:1px solid var(--line);box-shadow:-14px 0 34px rgba(15,23,42,.1)}
  @media (min-width:1280px){ .app.has-detail .main{margin-right:var(--detail-w)} .detail{box-shadow:none} }
  .dh{flex:none;padding:14px 18px 14px;border-bottom:1px solid var(--line)}
  .dh-top{display:flex;align-items:center;gap:8px}
  .dh-cap{flex:1;font-size:12px;font-weight:700;color:var(--text-3)}
  .dh-top button{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
  .dh-top button:hover{background:#f1f4f8;color:var(--text)}
  .dh-top svg{width:17px;height:17px}
  .d-title{margin-top:6px;font-size:18px;font-weight:800;line-height:1.35;letter-spacing:-.02em;word-break:break-word}
  .d-sub{margin-top:4px;font-size:12.5px;color:var(--text-3);line-height:1.5}
  .d-sheet{display:inline-flex;align-items:center;gap:5px;margin-top:10px;height:30px;padding:0 11px;border-radius:8px;border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-2);text-decoration:none}
  .d-sheet:hover{border-color:#cbd5e1;color:var(--text)}
  .dbody{flex:1;min-height:0;overflow:auto;padding:4px 18px 22px}
  .dl{display:grid;grid-template-columns:118px 1fr;margin:0}
  .dl dt{padding:10px 0;font-size:12.5px;color:var(--text-3);border-bottom:1px solid var(--line-2)}
  .dl dd{margin:0;padding:10px 0 10px 12px;font-size:13.5px;line-height:1.5;border-bottom:1px solid var(--line-2);word-break:break-word;white-space:pre-wrap}
  .dl dd.r{font-variant-numeric:tabular-nums;font-weight:700}
  .dl .none{color:var(--text-4)}
  .dl .ckt{margin-left:4px;color:#15803d;font-weight:700}
  .dimg{display:block;max-width:100%;max-height:220px;border-radius:10px;background:#f1f5f9;cursor:zoom-in}
  .lb{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(15,23,42,.82);cursor:zoom-out;padding:24px}
  .lb img{max-width:100%;max-height:100%;border-radius:12px;background:#fff}

  /* ── 좁은 화면 ── */

<script>
(function () {
  'use strict';

  /* ── 설정 ── */
  const SHEET_ID = '1hE7jVLZvE3gBYWflk6d3p2vZroQC9Hz3HY7jf2eqIcA';   // 구글시트 '식스샵 ERP MASTER' (오피스 index.html ERP_SHEET_ID 와 같음)
  const BASE = `https://docs.google.com/spreadsheets/d/${SHEET_ID}`;
  const REFRESH_MS = 60e3;      // 보고 있는 탭을 다시 읽는 간격 (화면이 보일 때만)
  const STALE_MS = 20e3;        // 다른 탭을 보다 돌아왔을 때 이보다 오래됐으면 뒤에서 다시 읽음
  const TABS_MS = 5 * 60e3;     // 탭 목록 (매일 날짜가 바뀌는 탭 이름 · 새 탭)
  const RETRY_MS = 30e3, TIMEOUT_MS = 25e3, CACHE_MAX = 8;
  // 송장출력 탭은 체크박스만 있는 줄이 3,000줄이라 웹 보기가 무겁다 → 지난번 내용 끝 줄 + 여유만 읽는다 (range=1:N).
  // 내용이 범위 끝까지 차 있으면 전체를 다시 읽고, 탭마다 한 번은 전체를 읽어 멀리 떨어진 칸도 확인한다. 상태 단추를 누르면 늘 전체.
  const RANGE_MIN = 500, RANGE_FULL_OVER = 2500;
  const LS_TAB = 'erp_tab_v1', LS_ROWS = 'erp_rows_v1', LS_DENSE = 'erp_dense_v1';
  // 브랜드 점 색 = 오피스 '실시간 재고' 브랜드 색
  const BRANDS = [
    {k: '코페리', name: '코페리', color: '#818cf8', re: /코페리/},
    {k: '아페티', name: '아페티', color: '#fb7185', re: /아페티/},
    {k: '코즈미', name: '코즈미', color: '#14b8a6', re: /코즈미/},
    {k: '식스에이', name: '식스에이', color: '#22d3ee', re: /식스에이/},
    {k: '야르', name: '야르', color: '#a78bfa', re: /야르/},
    {k: '프피', name: '프로덕트피알', color: '#f59e0b', re: /프피|프로덕트피알/},
    {k: '아코이', name: '아코이하우스', color: '#f472b6', re: /아코이/},
  ];
  const SECS = {stock: '재고 · 송장출력', home: '공홈 주문 원본', plato: '플랫폼 주문 (플토)', defect: '불량 · 반품', etc: '기타'};
  const SEC_ORDER = ['stock', 'home', 'plato', 'defect', 'etc'];
  const FONT = "Pretendard,-apple-system,BlinkMacSystemFont,'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
  const F_CELL = `400 13px ${FONT}`, F_BOLD = `700 13px ${FONT}`, F_HEAD = `700 12px ${FONT}`, F_TAG = `500 12px ${FONT}`;
  const RN_W = 42;
  const OPT_RE = /^(옵션|상품옵션정보|옵션정보)$/;
  const DATE_RE = /^(\d{4}[-.]\s?\d{1,2}[-.]\s?\d{1,2}\.?(\s+\d{1,2}:\d{2}(:\d{2})?)?|\d{1,2}[./]\d{1,2})$/;
  const LS_SIDE = 'erp_side_v1', LS_EMPTY = 'erp_empty_v1';
  const CK1 = '<span class="ck"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.6 8.4l2.9 2.9 5.9-6.4"/></svg></span>';
  const CK0 = '<span class="ck0"></span>';
  const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>';
  const ID_RE = /번호|ID|코드|송장|전화|연락/i;               // 숫자라도 쉼표 없이 (주문번호 · 신청번호 등)
  const SUM_RE = /수량|합계|재고|식스샵|에이블리|지그재그|29cm|스마트스토어|쿠팡|W컨셉|오늘의집|EQL|잔량|금액|SUM/i;   // 맨 아래 합계를 내는 열
  const KEY_RE = /^(상품명|상품이름|온라인상품명|품목명|제품명)$/;   // 상품 이름 열 = 왼쪽에 고정 · 상세 창 제목

  const $ = id => document.getElementById(id);
  const app = $('app'), grid = $('grid'), qIn = $('q');
  const narrow = matchMedia('(max-width:720px)');
  const S = {
    tabs: [], tabsAt: 0, tabsBusy: null, cur: '', nav: [], lastName: '',
    cache: new Map(),     // gid → {model, at, data}
    busy: {}, st: {},     // gid → 읽는 중 Promise · {k:'load'|'ok'|'err', err, at}
    pos: {}, view: {},    // gid → {t, l} 스크롤 · {sort, cat, kpi} 고른 정렬 · 걸러보기
    rowsKnown: {},        // gid → 내용이 있는 마지막 줄 번호 (다음에 읽을 범위)
    fullAt: {},           // gid → 전체를 읽은 시각
    terms: [], hlRe: null, list: [], sel: null,
    dense: false, shown: true, size: '', want: null, saved: null,
    showEmpty: false,     // 내용이 하나도 없는 열도 보기 ('빈 열 보기' 단추)
  };
  try { S.rowsKnown = JSON.parse(localStorage.getItem(LS_ROWS) || '{}') || {}; } catch (e) { S.rowsKnown = {}; }

  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 저장 못 해도 화면은 그대로 */ } };
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const pad2 = n => String(n).padStart(2, '0');
  const hhmm = t => { const d = new Date(t); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`; };
  const ago = t => { const s = Math.round((Date.now() - t) / 1000); return s < 50 ? '방금' : s < 3600 ? `${Math.round(s / 60)}분 전` : `${Math.floor(s / 3600)}시간 전`; };
  const colName = i => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };
  const norm = s => String(s || '').replace(/\s+/g, '');
  const fmt = n => Number.isInteger(n) ? n.toLocaleString('ko-KR') : n.toLocaleString('ko-KR', {maximumFractionDigits: 2});
  const tabOf = gid => S.tabs.find(t => t.gid === gid);
  const tabKey = name => String(name || '').replace(/\d{1,2}\.\d{1,2}/g, '').trim();   // '11.19야르송장출력' → '야르송장출력' (날짜는 매일 바뀜)
  const vstate = () => S.view[S.cur] || (S.view[S.cur] = {sort: null, cat: null, kpi: null, part: 0});
  const curAll = () => { const c = S.cache.get(S.cur); return c && c.data ? c.data : null; };
  const curData = () => { const all = curAll(); return all ? all.parts[Math.min(vstate().part || 0, all.parts.length - 1)] : null; };
  function hash(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36) + '.' + s.length; }
  function numOf(s) {
    const t = String(s || '').replace(/[,\s]/g, '').replace(/^[₩￦$￥¥]/, '').replace(/(원|개)$/, '');
    return /^-?\d+(\.\d+)?$/.test(t) ? parseFloat(t) : null;
  }

  /* ── 탭 이름 → 메뉴 자리 (재고 · 공홈 주문 원본 · 플토 · 불량 · 기타) ── */
  const brandOf = s => BRANDS.find(b => b.re.test(s)) || null;
  function classify(name) {
    const n = String(name || '').trim();
    let m = n.match(/^(\d{1,2}\.\d{1,2})?\s*(.+?)\s*송장출력$/);
    if (m) { const b = brandOf(m[2]); return {sec: 'stock', brand: b, date: m[1] || '', label: b ? b.name : m[2], key: 'stock:' + (b ? b.k : m[2])}; }
    m = n.match(/^플토\s*(\d{1,2}\.\d{1,2})?$/);
    if (m) return {sec: 'plato', brand: null, date: m[1] || '', label: '플토', key: 'plato'};
    m = n.match(/^(.{1,8}?)\s*(\d{1,2}\.\d{1,2})$/);
    if (m && brandOf(m[1])) { const b = brandOf(m[1]); return {sec: 'home', brand: b, date: m[2], label: b.name, key: 'home:' + b.k}; }
    if (/불량|반품/.test(n)) return {sec: 'defect', brand: null, date: '', label: n === 'BB불량건' ? '불량건 (BB)' : n, key: 'defect:' + n};
    return {sec: 'etc', brand: null, date: '', label: n, key: 'etc:' + n};
  }
  function dateVal(d) {   // '11.19' → 1119 (지금보다 두 달 넘게 앞선 달은 작년으로)
    const m = String(d || '').match(/(\d{1,2})\.(\d{1,2})/);
    if (!m) return 0;
    const mo = +m[1];
    return mo * 100 + +m[2] - (mo > new Date().getMonth() + 2 ? 1200 : 0);
  }

  /* ── 구글에서 받기 — 시간 제한 · 429 는 잠깐 쉬고 다시 · 연결 끊김은 한 번 더 ── */
  async function getText(url) {
    for (let i = 0; ; i++) {
      const ac = new AbortController(), timer = setTimeout(() => ac.abort(), TIMEOUT_MS);
      try {
        const r = await fetch(url, {cache: 'no-store', credentials: 'omit', signal: ac.signal});
        if (r.status === 429 && i < 4) { await sleep(900 * 2 ** i); continue; }
        if (!r.ok) throw Object.assign(new Error('http_' + r.status), {fatal: true});
        if (/accounts\.google\.com|ServiceLogin/.test(r.url)) throw Object.assign(new Error('login'), {fatal: true});
        return await r.text();
      } catch (e) {
        if (e.fatal) throw e;
        if (i < 1) { await sleep(1200); continue; }
        throw new Error(e && e.name === 'AbortError' ? 'timeout' : 'network');
      } finally { clearTimeout(timer); }
    }
  }

  /* ── 탭 목록 = 시트 웹 보기의 시트 메뉴 (보이는 탭만 · 시트 순서) ── */
  function unesc(s) { try { return JSON.parse('"' + s.replace(/\\x([0-9a-fA-F]{2})/g, '\\u00$1') + '"'); } catch (e) { return s; } }
  function loadTabs() {
    if (S.tabsBusy) return S.tabsBusy;
    S.tabsBusy = (async () => {
      try {
        const h = await getText(`${BASE}/htmlview`), out = [];
        const re = /items\.push\(\{name: "((?:[^"\\]|\\.)*)", pageUrl: "[^"]*", gid: "(\d+)"/g;
        let m;
        while ((m = re.exec(h))) { const name = unesc(m[1]); out.push({name, gid: m[2], meta: classify(name)}); }
        if (!out.length) throw new Error(/waffle|sheets-viewport/.test(h) ? 'no_tabs' : 'login');
        S.tabs = out;
        S.tabsAt = Date.now();
        const live = new Set(out.map(t => t.gid)), known = Object.keys(S.rowsKnown);   // 지워진 날짜 탭 기록은 버린다
        if (known.some(g => !live.has(g))) { known.forEach(g => { if (!live.has(g)) delete S.rowsKnown[g]; }); lsSet(LS_ROWS, JSON.stringify(S.rowsKnown)); }
        if (!S.cur) { hideMsg(); openTab(pickTab(S.want, S.saved)); }                       // 처음 · 실패 뒤 다시 읽힘
        else if (!tabOf(S.cur)) openTab(pickTab(null, {key: tabKey(S.lastName)}));        // 보던 탭이 지워짐
        else { renderNav(); renderHead(); saveTab(); }
        return out;
      } catch (e) {
        S.tabsAt = Date.now() - TABS_MS + RETRY_MS;   // 실패하면 30초 뒤 다시
        throw e;
      } finally { S.tabsBusy = null; }
    })();
    return S.tabsBusy;
  }
  function pickTab(want, saved) {
    const tabs = S.tabs;
    if (!tabs.length) return '';
    if (want) {
      const k = tabKey(want);
      const t = tabs.find(x => x.name === want) || tabs.find(x => x.gid === want) || tabs.find(x => k && tabKey(x.name) === k) || tabs.find(x => x.name.includes(want));
      if (t) return t.gid;
    }
    if (saved) {
      const t = tabs.find(x => x.gid === saved.gid) || (saved.key ? tabs.find(x => tabKey(x.name) === saved.key) : null);
      if (t) return t.gid;
    }
    return tabs[0].gid;
  }

  /* ── 한 탭 읽기 (웹 보기 → 칸 자료) ──
     브라우저가 받는 웹 보기는 <style> 이 여러 개이고, 큰 탭은 200줄쯤씩 여러 <table>(grid-chunk)로 나뉘어 온다 — 둘 다 전부 읽는다.
     칸마다 글자 · 칩(드롭다운) · 체크박스 · 사진 · 링크와 시트 서식(글자색 · 굵게 · 칸 색)만 뽑는다 (시트 HTML 을 그대로 넣지 않음). */
  const NOSTYLE = {};
  const cleanText = s => s.replace(/ /g, ' ').replace(/[​-‍﻿]/g, '').replace(/[ \t]+\n/g, '\n').trim();   // 빈 칩은 폭 0 글자만 있다

  }

  /* ── 개인정보 가리기 — 날짜별 주문 원본 탭(코페리11.19 · 야르11.19 …)의 주문자 이름 등. 머리글(위 6줄 안) 이름으로 칸을 찾는다 ── */
  const PII = [
    ['name', /^(주문자|수령인|수취인|구매자|주문인|받는(분|사람|이)|고객|보내는(분|사람|이)|발송인)(이름|명|성명)?$/],
    ['phone', /(연락처|전화|휴대폰|핸드폰|휴대전화)/],
    ['addr', /(주소|우편번호)/],
    ['mail', /(이메일|메일주소|e-?mail)/i],

      if (!t || t.length > 12 || cols[c.p]) return;
      const hit = PII.find(x => x[1].test(t));

    if (!Object.keys(cols).length) return 0;
    let n = 0;
    rows.forEach((row, i) => row.cells.forEach(c => {

  }

  /* ── 칸 자료 → 업무 표 ──
     맨 위 ⚠ 줄(여러 열에 걸친 긴 글) = 안내, 그다음 이름 줄 = 열 머리글, 나머지 = 자료 (빈 줄은 뺌).

  // 빈 열로 떨어진 옆 표(구글시트 피벗 집계 등)는 따로 뗀다 — 내용이 가장 많은 덩어리가 본 목록, 나머지는 '집계 표' 단추로

  function buildData(model, tab, pa, pb, side) {

    }));
    let i = 0;
    const banner = [];
    while (i < Math.min(3, rows.length)) {
      const ne = rows[i].cells.filter(hasVal);
      if (ne.length === 1 && (ne[0].cs >= 4 || ne[0].t.length > 40)) { banner.push(ne[0].t); i++; } else break;
    }
    // 머리글 = 첫 내용 줄 (옆 표는 위에 제목 줄이 하나 더 있을 수 있다 — 피벗의 '주문수량의 SUM · 쇼핑몰' 줄)

    for (let k = i; k < rows.length && firsts.length < 2; k++) if (rows[k].cells.some(c => c.t)) firsts.push(k);   // 옆 표는 시트 아래쪽에서 시작하기도 한다

    for (let k = hi >= 0 ? hi + 1 : start; k < rows.length; k++) if (grid2[k].some(hasVal)) dataIdx.push(k);

    const cols = [], seen = {};
    for (let p = pa; p <= pb; p++) {

      if (!name && !filled.length) continue;                     // 머리글도 내용도 없는 열

      if (seen[name]) name = `${name} (${++seen[name]})`; else seen[name] = 1;

      if (vals.filter(c => c.cb).length >= Math.max(1, vals.length * 0.6)) type = 'check';
      else if (filled.filter(c => c.img).length >= Math.max(1, filled.length * 0.5)) type = 'img';
      else if (texts.length && nums >= texts.length * 0.8 && !ID_RE.test(name) && !texts.some(t => t.replace(/\D/g, '').length >= 9)) type = 'num';
      else if (texts.length && texts.filter(t => DATE_RE.test(t)).length >= texts.length * 0.8) type = 'date';   // 값 전체가 날짜일 때만 ('2026-09-30 1000개' 는 글)
      else if (texts.length && ID_RE.test(name)) type = 'id';

        link: filled.length > 0 && filled.filter(c => c.href).length >= filled.length * 0.5,
        align: type === 'num' ? 'r' : (type === 'check' || type === 'img') ? 'c' : '',

        sum: !side && type === 'num' && SUM_RE.test(name)});   // 옆 표(피벗)는 자체 '총계' 줄이 있어 합계를 또 내지 않는다
    }
    const outRows = dataIdx.map(k => {
      const byP = grid2[k];
      let txt = '';
      cols.forEach(col => { const c = byP[col.p]; if (c) txt += ' ' + c.t; });
      const kk = txt.toLowerCase();
      return {r: rows[k].r, byP, k: kk, k2: kk.replace(/\s+/g, '')};
    });
    const keyIdx = cols.findIndex(c => c.key);

    // 위 요약 카드 — 누르면 그 줄만 (재고 탭은 시트 숫자를 세기만 한다, 새 기준 없음)
    const byName = n => cols.find(c => norm(c.name) === n);
    const val = (row, col) => { const c = col && row.byP[col.p]; return c ? c.t : ''; };
    const cnt = pred => outRows.filter(pred).length;
    const kpis = [];
    if (meta.sec === 'stock' && !side) {
      const cName = keyIdx >= 0 ? cols[keyIdx] : null, cSum = byName('합계'), cStock = byName('남은재고'), cAlert = byName('리오더알림'), cSold = byName('품절/예정'), cCatS = byName('카테고리');
      // 시트가 카테고리에 '중복 — 안 셈' · '묶음 → 낱개'(회색)라고 적은 줄은 시트처럼 세지 않는다 (표에는 그대로 보임)
      const counted = row => !cCatS || !/안\s*셈|묶음\s*→\s*낱개/.test(val(row, cCatS));
      const isItem = row => counted(row) && (!cName || val(row, cName) !== '');
      kpis.push({id: '', label: '품목', val: cnt(isItem)});
      if (cSum) {
        const out = row => counted(row) && (numOf(val(row, cSum)) || 0) > 0;
        kpis.push({id: 'out', label: '출고 합계', unit: '개', tone: 'blue', val: outRows.reduce((s, row) => s + (counted(row) ? numOf(val(row, cSum)) || 0 : 0), 0), sub: `${fmt(cnt(out))}품목`, pred: out});
      }
      if (cStock) {
        const zero = row => { const n = numOf(val(row, cStock)); return isItem(row) && n !== null && n <= 0; };
        kpis.push({id: 'zero', label: '재고 0 이하', tone: 'red', val: cnt(zero), pred: zero});
        const blank = row => isItem(row) && val(row, cStock) === '';
        if (cnt(blank)) kpis.push({id: 'blank', label: '남은 재고 빈칸', tone: 'amber', val: cnt(blank), pred: blank});
      }
      if (cAlert) { const urg = row => counted(row) && /^리오더/.test(val(row, cAlert)); kpis.push({id: 'urgent', label: '리오더 시급', tone: 'amber', val: cnt(urg), pred: urg}); }
      if (cSold) { const sold = row => { const c = row.byP[cSold.p]; return counted(row) && !!c && c.cb === 2; }; if (cnt(sold)) kpis.push({id: 'sold', label: '품절 체크', val: cnt(sold), pred: sold}); }
    } else {
      kpis.push({id: '', label: '줄', val: outRows.length});
      const cOrder = cols.find(c => /주문번호/.test(norm(c.name)));
      if (cOrder) kpis.push({label: '주문', unit: '건', val: new Set(outRows.map(r => val(r, cOrder)).filter(Boolean)).size});
      const cQty = cols.find(c => c.type === 'num' && /수량/.test(c.name) && !/SUM/i.test(c.name));
      if (cQty) kpis.push({label: `${cQty.name} 합계`, unit: '개', val: outRows.reduce((s, r) => s + (numOf(val(r, cQty)) || 0), 0)});
    }
    // 걸러보기 칩 — 카테고리 · 쇼핑몰 · 브랜드 열
    let cat = null;
    const cCat = cols.find(c => /^(카테고리|쇼핑몰|브랜드)$/.test(norm(c.name)));
    if (cCat) {
      const mm = new Map();
      outRows.forEach(r => { const v = catVal(r, cCat.p); if (v) mm.set(v, (mm.get(v) || 0) + 1); });
      if (mm.size >= 2 && mm.size <= 30) cat = {p: cCat.p, values: [...mm.entries()].sort((x, y) => y[1] - x[1])};
    }
    const d = {cols, rows: outRows, banner: side ? [] : banner, keyIdx, kpis, cat: side ? null : cat, sec: meta.sec, side: !!side, caption};
    fitCols(d);
    return d;
  }
  const catVal = (row, p) => { const c = row.byP[p]; return c ? (c.t || (c.chips[0] && c.chips[0].t) || '') : ''; };

  /* ── 칸 너비 = 들어간 글자 · 숫자 길이로 자동 ──
     2026-11-19 사용자 "글자 칸이 많이 남는 건 당겨서 한 화면에서 웬만하면 다 보이게" →

    $('title').textContent = !m ? '불러오는 중…' : m.sec === 'stock' ? `${m.label} 재고 · 송장출력` : m.sec === 'home' ? `${m.label} 공홈 주문 원본` : m.sec === 'plato' ? '플랫폼 주문 (플토)' : m.label;
    const multi = !!it && it.tabs.length > 1;
    $('dates').innerHTML = multi ? it.tabs.map(x => `<button type="button" class="${x.gid === S.cur ? 'on' : ''}" data-gid="${x.gid}">${esc(x.meta.date || x.name)}</button>`).join('') : '';
    const td = $('tDate');
    td.hidden = multi || !(m && m.date);
    td.textContent = m && m.date ? `${m.date} 기준` : '';
    const nEmpty = d ? d.cols.filter(c => c.empty && !c.key).length : 0, et = $('eTog');
    et.hidden = !nEmpty;
    et.textContent = S.showEmpty ? `빈 열 ${nEmpty}개 숨기기` : `빈 열 ${nEmpty}개 보기`;
    et.title = nEmpty ? `내용이 하나도 없는 열: ${d.cols.filter(c => c.empty && !c.key).map(c => c.name).join(', ')}` : '';
    const all = curAll(), pt = $('parts');
    if (all && all.parts.length > 1) {
      const isSum = x => /SUM|합계|총계/i.test(x.caption + ' ' + x.cols.map(c => c.name).join(' '));   // 구글시트 피벗 = 집계 표
      const label = (x, i) => i === 0 ? '목록' : isSum(x) ? (all.parts.length > 2 ? `집계 표 ${i}` : '집계 표') : x.caption ? x.caption.slice(0, 16) : `옆 표 ${i}`;
      pt.innerHTML = all.parts.map((x, i) => `<button type="button" class="${(v.part || 0) === i ? 'on' : ''}" data-part="${i}" title="${esc(x.caption || '')}">${esc(label(x, i))}</button>`).join('');
      pt.hidden = false;
    } else { pt.innerHTML = ''; pt.hidden = true; }
    const al = $('alert');
    if (d && d.banner.length) {
      const lines = d.banner.join('\n').split(/\s*▶\s*|\n|\s+\|\s+/).map(s => s.replace(/^⚠️?\s*/, '').trim()).filter(Boolean);
      al.innerHTML = `${ICON_WARN}<ul>${lines.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`;
      al.hidden = false;
    } else al.hidden = true;
    $('kpis').innerHTML = d ? d.kpis.map(k => {
      const click = k.id === '' || !!k.pred, on = click && ((k.id === '' && !v.kpi) || (k.id && v.kpi === k.id));
      return `<button type="button" class="kpi${click ? ' click' : ''}${k.tone ? ' ' + k.tone : ''}${on ? ' on' : ''}"${click ? ` data-kpi="${k.id}"` : ' tabindex="-1"'}><b>${fmt(k.val)}${k.unit ? `<small>${k.unit}</small>` : ''}</b><span>${esc(k.label)}${k.sub ? ` · ${esc(k.sub)}` : ''}</span></button>`;
    }).join('') : '';
    const ch = $('chips');
    if (d && d.cat) {
      ch.innerHTML = `<button type="button" class="chip${v.cat == null ? ' on' : ''}" data-all="1">전체 <em>${fmt(d.rows.length)}</em></button>`
        + d.cat.values.map(([val, n]) => `<button type="button" class="chip${v.cat === val ? ' on' : ''}" data-cat="${esc(val)}">${esc(val)} <em>${fmt(n)}</em></button>`).join('');
      ch.hidden = false;
    } else { ch.innerHTML = ''; ch.hidden = true; }
    const href = S.cur ? `${BASE}/edit#gid=${S.cur}` : `${BASE}/edit`;
    $('btnSheet').href = href;
    $('sideSheet').href = href;
    document.title = `${m ? (m.sec === 'stock' ? m.label + ' 재고' : t.name) + ' · ' : ''}ERP전산팀`;
  }
  $('kpis').addEventListener('click', e => {
    const b = e.target.closest('.kpi[data-kpi]');
    if (!b) return;
    const v = vstate(), id = b.dataset.kpi;
    v.kpi = !id || v.kpi === id ? null : id;
    renderHead();
    renderGrid({pos: {t: 0, l: grid.scrollLeft}});
  });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    const v = vstate();
    v.cat = b.dataset.all ? null : (v.cat === b.dataset.cat ? null : b.dataset.cat);
    renderHead();
    renderGrid({pos: {t: 0, l: grid.scrollLeft}});
  });
  $('dates').addEventListener('click', e => { const b = e.target.closest('button[data-gid]'); if (b) openTab(b.dataset.gid); });
  $('parts').addEventListener('click', e => {
    const b = e.target.closest('button[data-part]');
    if (!b) return;
    const v = vstate();
    if ((v.part || 0) === +b.dataset.part) return;
    Object.assign(v, {part: +b.dataset.part, sort: null, cat: null, kpi: null});
    closeDetail();
    renderHead();
    renderGrid();
  });

  /* ── 왼쪽 메뉴 ── 같은 브랜드 · 같은 종류의 날짜 탭은 한 줄로 묶고 (최신 날짜), 날짜는 제목 옆 단추로 고른다 */
  function renderNav() {
    const items = new Map();
    S.tabs.forEach((t, i) => {
      const m = t.meta || (t.meta = classify(t.name));
      let it = items.get(m.key);
      if (!it) items.set(m.key, it = {key: m.key, sec: m.sec, label: m.label, brand: m.brand, tabs: [], order: i});
      it.tabs.push(t);
    });
    const list = [...items.values()], bi = it => it.brand ? BRANDS.indexOf(it.brand) : 99;
    list.forEach(it => it.tabs.sort((x, y) => dateVal(y.meta.date) - dateVal(x.meta.date)));
    list.sort((x, y) => SEC_ORDER.indexOf(x.sec) - SEC_ORDER.indexOf(y.sec) || bi(x) - bi(y) || x.order - y.order);
    S.nav = list;
    let h = '', sec = '';
    for (const it of list) {
      if (it.sec !== sec) { sec = it.sec; h += `<div class="nav-sec">${esc(SECS[sec])}</div>`; }
      const on = it.tabs.some(t => t.gid === S.cur), d = it.tabs[0].meta.date;
      h += `<button type="button" class="nav-item${on ? ' on' : ''}" data-gid="${it.tabs[0].gid}"><i class="dot"${it.brand ? ` style="background:${it.brand.color}"` : ''}></i><span class="nm">${esc(it.label)}</span>${d ? `<span class="nd">${esc(d)}</span>` : ''}</button>`;
    }
    $('nav').innerHTML = h;
  }
  const curItem = () => S.nav.find(it => it.tabs.some(t => t.gid === S.cur)) || null;
  function setNav(open) { app.classList.toggle('nav-open', open); $('scrim').hidden = !open; }
  // PC 는 메뉴를 접어 표를 넓게 (접힌 상태는 기억), 좁은 화면은 서랍
  const wide = matchMedia('(min-width:1001px)');
  function setSide(open, save) {
    app.classList.toggle('side-off', !open);
    if (save) lsSet(LS_SIDE, open ? '1' : '0');
    renderGrid({keep: true});
  }
  $('btnFold').addEventListener('click', () => { if (wide.matches) setSide(false, true); else setNav(false); });
  $('eTog').addEventListener('click', () => {
    S.showEmpty = !S.showEmpty;
    lsSet(LS_EMPTY, S.showEmpty ? '1' : '0');
    renderHead();
    renderGrid({keep: true});
  });
  $('nav').addEventListener('click', e => { const b = e.target.closest('.nav-item'); if (b) { openTab(b.dataset.gid); setNav(false); } });
  $('btnMenu').addEventListener('click', () => { if (wide.matches) setSide(app.classList.contains('side-off'), true); else setNav(!app.classList.contains('nav-open')); });
  $('scrim').addEventListener('click', () => setNav(false));

  function saveTab() {
    const t = tabOf(S.cur);
    if (t) lsSet(LS_TAB, JSON.stringify({gid: t.gid, key: tabKey(t.name), name: t.name}));
  }
  function cachePut(gid, v) {
    S.cache.delete(gid);
    S.cache.set(gid, v);
    for (const k of S.cache.keys()) { if (S.cache.size <= CACHE_MAX) break; if (k !== S.cur) S.cache.delete(k); }
  }
  function openTab(gid) {
    if (!gid) return;
    if (S.cur && S.cur !== gid) { S.pos[S.cur] = {t: grid.scrollTop, l: grid.scrollLeft}; closeDetail(); }
    S.cur = gid;
    hideMsg();
    const t = tabOf(gid);
    if (t) S.lastName = t.name;
    saveTab();
    renderNav();
    const c = S.cache.get(gid);
    renderHead();
    renderGrid({pos: S.pos[gid]});
    if (!c || Date.now() - c.at > STALE_MS) loadSheet(gid);
    paintStatus();
  }

  /* ── 표 조작 — 머리글 = 정렬, 줄 = 상세 창, 사진 = 크게 ── */
  grid.addEventListener('click', e => {
    const th = e.target.closest('th');
    if (th) {
      if (th.classList.contains('fill')) return;
      const v = vstate();
      if (th.dataset.sort === 'rn') v.sort = null;
      else {
        const p = +th.dataset.p;
        v.sort = !v.sort || v.sort.p !== p ? {p, dir: 1} : v.sort.dir > 0 ? {p, dir: -1} : null;   // 오름 → 내림 → 원래 순서
      }
      renderGrid({keep: true});
      return;
    }
    const img = e.target.closest('img.thumb');
    if (img) { e.stopPropagation(); openLb(img.currentSrc || img.src); return; }
    if (e.target.closest('a')) return;
    const tr = e.target.closest('tbody tr[data-r]');
    if (tr) openDetail(+tr.dataset.r, false);
    if (document.activeElement !== grid && !matchMedia('(pointer:coarse)').matches) grid.focus({preventScroll: true});
  });
  grid.addEventListener('keydown', e => {
    if (e.target !== grid) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSel(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Escape') closeDetail();
  });
  function moveSel(dir) {
    if (!S.list.length) return;
    let i = S.sel && S.sel.gid === S.cur ? S.list.findIndex(r => r.r === S.sel.r) : -1;
    i = i < 0 ? (dir > 0 ? 0 : S.list.length - 1) : Math.max(0, Math.min(S.list.length - 1, i + dir));
    openDetail(S.list[i].r, true);
  }
  function ensureRowVisible(tr) {
    const g = grid.getBoundingClientRect(), r = tr.getBoundingClientRect();
    const th = grid.querySelector('thead'), tf = grid.querySelector('tfoot');
    const top = g.top + (th ? th.getBoundingClientRect().height : 0), bottom = g.top + grid.clientHeight - (tf ? tf.getBoundingClientRect().height : 0);
    if (r.top < top) grid.scrollTop -= top - r.top;
    else if (r.bottom > bottom) grid.scrollTop += r.bottom - bottom;
  }

  /* ── 상세 창 — 그 줄의 모든 칸을 이름 · 값으로 (휴대폰은 아래에서 올라옴) ── */
  function detailVal(col, c) {
    if (!c || (!hasVal(c) && !c.cb)) return '<span class="none">—</span>';
    if (col.type === 'check' || (c.cb && !c.t)) return c.cb === 2 ? `${CK1}<span class="ckt">체크</span>` : '<span class="none">체크 안 함</span>';
    if (c.img) return `<img class="dimg" src="${esc(c.img)}" alt="" loading="lazy" referrerpolicy="no-referrer">`;
    if (c.chips.length) return c.chips.map(tagHtml).join(' ');
    if (col.status) return statusHtml(c.t, true);
    const st = c.st.fg ? ` style="color:${c.st.fg}"` : '';
    if (c.href) return `<a class="lnk" href="${esc(c.href)}" target="_blank" rel="noopener noreferrer">${esc(c.t)}</a>`;
    if (col.type === 'num') { const n = numOf(c.t); return `<span class="${n !== null && n < 0 && !c.st.fg ? 'neg' : ''}"${st}>${esc(display(col, c))}</span>`; }
    return `<span${st}>${esc(c.t)}</span>`;
  }
  function openDetail(r, scroll) {
    const d = curData();
    if (!d) return;
    const row = d.rows.find(x => x.r === r);
    if (!row) { closeDetail(); return; }
    S.sel = {gid: S.cur, r};
    grid.querySelectorAll('tbody tr.on').forEach(tr => tr.classList.remove('on'));
    const tr = grid.querySelector(`tbody tr[data-r="${r}"]`);
    if (tr) { tr.classList.add('on'); if (scroll) ensureRowVisible(tr); }
    const key = d.keyIdx >= 0 ? d.cols[d.keyIdx] : d.cols.find(c => c.type === 'text');
    const kv = key ? catVal(row, key.p) : '';
    const subs = [];
    d.cols.forEach(c => { if (c !== key && /^(옵션|상품옵션정보|카테고리|브랜드|쇼핑몰)$/.test(norm(c.name))) { const x = catVal(row, c.p); if (x) subs.push(x); } });
    const t = tabOf(S.cur);
    $('dCap').textContent = t ? t.name : '상세';
    $('dTitle').textContent = kv || `${r}행`;
    $('dSub').textContent = [...subs, `시트 ${r}행`].join(' · ');
    $('dSheet').href = `${BASE}/edit#gid=${S.cur}&range=A${r}`;
    $('dList').innerHTML = d.cols.map(c => `<dt>${esc(c.name)}</dt><dd${c.type === 'num' ? ' class="r"' : ''}>${detailVal(c, row.byP[c.p])}</dd>`).join('');
    const det = $('detail'), was = det.hidden;
    det.hidden = false;
    app.classList.add('has-detail');
    $('dscrim').hidden = !narrow.matches;
    if (was) det.querySelector('.dbody').scrollTop = 0;
  }
  function closeDetail() {
    $('detail').hidden = true;
    $('dscrim').hidden = true;
    app.classList.remove('has-detail');
    S.sel = null;
    grid.querySelectorAll('tbody tr.on').forEach(tr => tr.classList.remove('on'));
  }
  $('dClose').addEventListener('click', closeDetail);
  $('dscrim').addEventListener('click', closeDetail);
  $('dPrev').addEventListener('click', () => moveSel(-1));
  $('dNext').addEventListener('click', () => moveSel(1));
  $('dList').addEventListener('click', e => { const im = e.target.closest('img.dimg'); if (im) openLb(im.currentSrc || im.src); });
  function openLb(src) { $('lbImg').src = src; $('lb').hidden = false; }
  $('lb').addEventListener('click', () => { $('lb').hidden = true; $('lbImg').removeAttribute('src'); });
  // 칸 사진이 <img> 로 안 열리면 한 번 받아서 띄운다 (구글 사진 주소는 CORS 허용)
  document.addEventListener('error', e => {
    const im = e.target;
    if (!im || im.tagName !== 'IMG' || im.dataset.tried || !/^https:/.test(im.src)) return;
    im.dataset.tried = '1';
    fetch(im.src, {mode: 'cors', credentials: 'omit'}).then(r => r.ok ? r.blob() : Promise.reject(new Error('img')))
      .then(b => { im.src = URL.createObjectURL(b); }).catch(() => { im.style.visibility = 'hidden'; });
  }, true);

  /* ── 읽기 · 상태 ── */
  function sigOf(html) {
    const a = html.indexOf('<table'), b = html.lastIndexOf('</table>');
    return hash(styleText(html).length + ':' + (a >= 0 ? html.slice(a, b) : html));   // 매번 바뀌는 nonce 는 빼고 표 · 서식만
  }
  function loadSheet(gid, opt) {
    if (S.busy[gid]) return S.busy[gid];
    const known = +S.rowsKnown[gid] || 0;
    const lim = (opt && opt.full) || known > RANGE_FULL_OVER ? 0 : Math.max(RANGE_MIN, Math.ceil(known * 1.3) + 200);
    let next = '';
    S.st[gid] = {k: 'load', at: Date.now()};
    if (gid === S.cur) paintStatus();
    const p = getText(`${BASE}/htmlview/sheet?headers=true&gid=${gid}${lim ? `&range=1:${lim}` : ''}`).then(html => {
      const old = S.cache.get(gid), sig = sigOf(html) + (lim ? '' : '.f');
      let model = old && old.model.sig === sig ? old.model : null;
      if (model) old.at = Date.now();
      else {
        model = parseSheet(html, sig);
        cachePut(gid, {model, at: Date.now(), data: buildAll(model, tabOf(gid))});
        if (gid === S.cur) {
          renderHead();
          renderGrid(old ? {keep: true} : {pos: S.pos[gid]});
          if (S.sel && S.sel.gid === gid && !$('detail').hidden) openDetail(S.sel.r, false);   // 상세 창도 새 값으로
        }
      }
      const lastR = model.rows.length ? model.rows[model.rows.length - 1].r : 0;
      if (S.rowsKnown[gid] !== lastR) { S.rowsKnown[gid] = lastR; lsSet(LS_ROWS, JSON.stringify(S.rowsKnown)); }
      if (!lim) S.fullAt[gid] = Date.now();
      else if (lastR > lim - 60) next = 'now';          // 범위 끝까지 내용 → 전체 다시
      else if (!S.fullAt[gid]) next = 'later';          // 이 탭은 아직 전체를 한 번도 안 읽음
      S.st[gid] = {k: 'ok', at: Date.now()};
      if (gid === S.cur) hideMsg();
    }).catch(e => {
      S.st[gid] = {k: 'err', err: (e && e.message) || String(e), at: Date.now()};
      if (gid === S.cur && !S.cache.get(gid)) showErr(S.st[gid].err);
    }).finally(() => {
      delete S.busy[gid];
      if (gid === S.cur) paintStatus();
      if (next === 'now') loadSheet(gid, {full: true});
      else if (next === 'later') setTimeout(() => { if (gid === S.cur && shown() && !S.fullAt[gid]) loadSheet(gid, {full: true}); }, 4000);
    });
    S.busy[gid] = p;
    return p;
  }
  const ERR = {
    login: ['구글시트를 열 수 없어요', "시트 공유가 '링크가 있는 모든 사용자 · 뷰어'여야 이 화면이 읽을 수 있어요. 시트 공유 설정을 확인해 주세요."],
    timeout: ['구글시트 응답이 늦어요', '잠시 뒤 다시 시도해 주세요. 계속 그러면 구글시트를 직접 열어 확인해 주세요.'],
    network: ['구글시트에 연결하지 못했어요', '인터넷 연결을 확인하고 다시 시도해 주세요.'],
  };
  function errShort(e) {
    if (e === 'login') return '시트 공유가 꺼져 있어요';
    if (e === 'timeout') return '응답이 늦어요 · 다시';
    if (e === 'network') return '연결 실패 · 다시';
    if (e === 'http_429') return '잠깐 막힘 · 곧 다시';
    return `읽기 실패 (${e}) · 다시`;
  }
  function showErr(e) {
    const [t, d] = ERR[e] || ['구글시트를 읽지 못했어요', `(${e}) 잠시 뒤 다시 시도해 주세요.`];
    const m = $('msg');
    m.innerHTML = `<b>${esc(t)}</b>${esc(d)}<br><button type="button" data-act="retry">다시 불러오기</button>`;
    m.hidden = false;
  }
  function hideMsg() { $('msg').hidden = true; }
  $('msg').addEventListener('click', e => { if (e.target.closest('[data-act="retry"]')) reloadNow(); });
  function paintStatus() {
    const st = $('st'), s = S.st[S.cur] || {k: 'load'}, c = S.cache.get(S.cur);
    const k = s.k;
    st.className = `st is-${k}`;
    $('stText').textContent = k === 'load' ? (c ? '갱신 중…' : '불러오는 중…') : k === 'err' ? errShort(s.err) : c ? `${hhmm(c.at)} 갱신 · ${ago(c.at)}` : '';
    const m = c && c.model;
    st.title = (c ? `구글시트에서 ${hhmm(c.at)} 에 읽음 · 보고 있으면 1분마다 다시 읽어요` : '구글시트에서 읽는 중')
      + (m && m.masked ? `\n주문자 이름 등 개인정보 ${m.masked.toLocaleString('ko-KR')}칸은 가려서 보여 줌` : '')
      + '\n누르면 지금 다시 읽기';
  }
  function paintCount() { $('qn').textContent = S.terms.length && curData() ? `${fmt(S.list.length)}줄` : ''; }
  function reloadNow() {
    if (S.cur) loadSheet(S.cur, {full: true});
    if (!S.tabsBusy) loadTabs().catch(() => {});
  }
  $('st').addEventListener('click', reloadNow);

  /* ── 줄 간격 · 전체 화면 ── */
  function setDense(on, save) {
    S.dense = !!on;
    app.classList.toggle('dense', S.dense);
    $('btnDense').classList.toggle('on', S.dense);
    $('btnDense').title = S.dense ? '줄 간격 넓게' : '줄 간격 촘촘하게';
    if (save) lsSet(LS_DENSE, S.dense ? '1' : '0');
  }
  $('btnDense').addEventListener('click', () => setDense(!S.dense, true));
  const fsOk = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (!fsOk) $('btnFull').hidden = true;
  $('btnFull').addEventListener('click', () => {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  });

  /* ── 찾기 ── */
  function setQuery(v) {
    S.terms = String(v || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    S.hlRe = S.terms.length ? new RegExp(S.terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi') : null;
    $('qx').hidden = !v;
    renderGrid({pos: {t: 0, l: grid.scrollLeft}});
  }
  let qT = 0;
  qIn.addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => setQuery(qIn.value), 140); });
  qIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qT); if (S.terms.join(' ') !== qIn.value.trim().toLowerCase().split(/\s+/).filter(Boolean).join(' ')) setQuery(qIn.value); moveSel(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { qIn.value = ''; setQuery(''); grid.focus({preventScroll: true}); }
  });
  $('qx').addEventListener('click', () => { qIn.value = ''; setQuery(''); qIn.focus(); });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); qIn.focus(); qIn.select(); }
    else if (e.key === 'Escape' && !$('lb').hidden) { $('lb').hidden = true; }
    else if (e.key === 'Escape' && !$('detail').hidden && e.target !== qIn) closeDetail();
    else if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.nav.length) {   // Alt+↑↓ = 위 · 아래 메뉴
      e.preventDefault();
      const i = S.nav.findIndex(it => it.tabs.some(t => t.gid === S.cur));
      openTab(S.nav[(i + (e.key === 'ArrowDown' ? 1 : -1) + S.nav.length) % S.nav.length].tabs[0].gid);
    }
  });

  /* ── 보일 때만 자동 갱신 (오피스 안 화면은 홈으로 나가도 살아 있어서 숨었는지 직접 본다) ── */
  function shown() {
    if (document.visibilityState === 'hidden') return false;
    try { const fe = window.frameElement; if (fe && !fe.getClientRects().length) return false; } catch (e) { /* 다른 출처 */ }
    return true;
  }
  function tick() {
    const vis = shown(), wasHidden = !S.shown;
    S.shown = vis;
    if (!vis) return;
    paintStatus();
    if (sizeKey() !== S.size && grid.clientWidth) renderGrid({keep: true});
    if (Date.now() - S.tabsAt > TABS_MS && !S.tabsBusy) loadTabs().catch(() => {});
    if (!S.cur || S.busy[S.cur]) return;
    const c = S.cache.get(S.cur), s = S.st[S.cur];
    const age = c ? Date.now() - c.at : Infinity;
    if (c ? age > (wasHidden ? STALE_MS : REFRESH_MS) : (s && s.k === 'err' && Date.now() - s.at > RETRY_MS)) loadSheet(S.cur);
  }
  setInterval(tick, 5000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(tick, 300); });
  let rzT = 0;
  window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(tick, 180); });
  narrow.addEventListener && narrow.addEventListener('change', () => { if (!narrow.matches) setNav(false); $('dscrim').hidden = !narrow.matches || $('detail').hidden; renderGrid({keep: true}); });

  /* ── 시작 — 지난번 탭은 탭 목록을 기다리지 않고 바로 읽는다 ── */
  (async function boot() {
    setDense(lsGet(LS_DENSE) === '1', false);
    if (lsGet(LS_SIDE) === '0') app.classList.add('side-off');
    S.showEmpty = lsGet(LS_EMPTY) === '1';
    if (document.fonts && document.fonts.load) { try { document.fonts.load(F_CELL, '재고ABC123'); document.fonts.load(F_BOLD, '재고ABC123'); } catch (e) { /* noop */ } }
    let saved = null;
    try { saved = JSON.parse(lsGet(LS_TAB) || 'null'); } catch (e) { saved = null; }
    let want = null;
    try { want = new URLSearchParams(location.search).get('tab'); } catch (e) { want = null; }
    S.want = want;     // 탭 목록이 늦게(실패 뒤 다시) 읽혀도 같은 규칙으로 고른다 (loadTabs)
    S.saved = saved;
    renderGrid();
    if (saved && saved.gid && !want) {
      S.tabs = [{name: saved.name || '…', gid: String(saved.gid), meta: classify(saved.name || '')}];
      openTab(String(saved.gid));
    }
    try { await loadTabs(); }
    catch (e) {
      if (!S.cur) { S.st[''] = {k: 'err', err: e.message, at: Date.now()}; paintStatus(); showErr(e.message); }
      return;
    }
    const pick = pickTab(want, saved);
    if (pick && pick !== S.cur) openTab(pick);
  })();
})();
</script>
