    }, {passive: false});
    const end = () => {
      if (!sw) return;
      const dy = sw.dy, fast = dy > 40 && dy / Math.max(1, Date.now() - sw.t) > 0.6;
      sw = null;
      if (dy <= 6) { reset(); return; }   // 그냥 누름 (단추 · 링크)
      det.style.transition = 'transform .18s ease';
      if (dy > 110 || fast) {
        det.style.transform = 'translateY(100%)';
        setTimeout(() => { closeEditor(); closeDetail(); reset(); }, 180);
      } else { det.style.transform = ''; setTimeout(reset, 200); }
    };
    dh.addEventListener('touchend', end);
    dh.addEventListener('touchcancel', end);
  })();
  $('dPrev').addEventListener('click', () => moveSel(-1));
  $('dNext').addEventListener('click', () => moveSel(1));
  $('dList').addEventListener('click', e => {
    const im = e.target.closest('img.dimg');
    if (im) { openLb(im.currentSrc || im.src); return; }
    if (e.target.closest('a') || !S.sel) return;
    const dd = e.target.closest('dd[data-p]');
    if (dd && !(window.getSelection && String(window.getSelection()).length)) openEditor(S.cur, S.sel.r, +dd.dataset.p, dd);   // 글자를 끌어 고르는 중이면 안 염
  });
  function openLb(src) { $('lbImg').src = src; $('lb').hidden = false; }
  $('lb').addEventListener('click', () => { $('lb').hidden = true; $('lbImg').removeAttribute('src'); });
  // 칸 사진이 <img> 로 안 열리면 한 번 받아서 띄운다 (구글 사진 주소는 CORS 허용)
  document.addEventListener('error', e => {
    const im = e.target;
    if (!im || im.tagName !== 'IMG' || im.dataset.tried || !/^https:/.test(im.src)) return;
    im.dataset.tried = '1';
    fetch(im.src, {mode: 'cors', credentials: 'omit'}).then(r => r.ok ? r.blob() : Promise.reject(new Error('img')))
      .then(b => { im.src = URL.createObjectURL(b); }).catch(() => { im.style.visibility = 'hidden'; });
  }, true);

  /* ── 고치기 ──
     2026-11-19 사용자 "ERP에서 수정하는건 다 구글시트에서도 같이 연결되어 수정되게" → 2026-11-20 "엑셀처럼 수정할 곳 누르면 바로 수정 가능하게"
     · PC(마우스): 표 칸을 한 번 누르면 그 자리에 고칠 칸이 뜬다 (글자가 골라져 있어 바로 치면 바뀌고, 한 번 더 누르면 글자 사이에).
       Enter = 저장하고 아래 칸 · Shift+Enter = 위 칸 · Tab / Shift+Tab = 오른쪽 · 왼쪽 칸 · ↑↓(한 줄 칸) = 저장하고 위 · 아래 · Esc = 취소 ·
       Alt+Enter = 칸 안 줄바꿈 · 다른 칸을 누르면 저장하고 그 칸으로 (엑셀과 같음). 고른 칸(파란 테두리)에서 영문 · 숫자를 치면 바로 고치기,
       F2 · Enter = 글자 그대로 고치기, Delete = 비우고 고치기, 화살표 = 칸 옮기기. 체크 칸은 누르면 바로 바뀜. 행 번호를 누르면 그 줄 상세 창.
     · 휴대폰 · 터치: 줄을 누르면 상세 창 → 값을 누르면 고칠 칸 (예전과 같음).
     · 저장 = 구글시트 그 칸 (MD팀과 같은 Apps Script 브리지 — scripts/md-sheets-bridge.gs, book 'invoice', URL · 토큰은 Supabase md_sheet_config.
       그사이 시트 값이 바뀌었으면 덮어쓰기 전에 묻는다) → 오피스 저장소 같은 줄 (erp_cell_edit — 시트가 돌려준 줄 전체라 합계 같은 수식 칸도 새 값).
       화면은 누르자마자 새 값으로 바뀌고(칸 오른쪽 위 파란 점 = 쓰는 중), 못 쓰면 원래 값으로 돌아가며 까닭을 알려 준다. 여러 칸을 빠르게 고쳐도 차례로 쓴다.
     · 못 고치는 칸: 수식 칸(합계 · 잔량 · 리오더 알림 같은 자동 계산 — 맥미니가 15분마다 수식 위치를 저장소에 적음) · 가린 개인정보 칸 · 사진 · 집계 표 ·
       자동 계산(QUERY 등)이 든 탭 · 브리지가 막는 탭(플토 · 코페리/아페티/코즈미 날짜별 주문 원본 = 개인정보 탭).
     · 상품명 · 옵션 칸은 식스샵 주문 이름과 글자가 같아야 재고가 빠져서, 고칠 때 한 줄 경고를 띄운다.
     · 고친 기록 = 저장소 erp_history (누가 · 언제 · 전 값, 트리거) + md_sheet_edit_log (MD팀과 같은 기록 — 누가 뒤에 '· ERP'). */
  const BOOK = 'invoice', PEND_MS = 120e3, WRITE_TIMEOUT = 45e3;
  const E = {cfg: null, cfgP: null, pend: new Map(), x: null, at: null, anchor: null, busy: false, q: Promise.resolve()};
  const whoAmI = () => lsGet('brightbeed_diary_me') || (lsGet('brightbeed_role') === 'master' ? '관리자' : '');
  const piiCol = name => { const n = norm(name); return PII.some(x => x[1].test(n)); };
  const short = s => { s = String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); return s ? (s.length > 18 ? s.slice(0, 17) + '…' : s) : '(빈칸)'; };
  const EDIT_ERR = {
    sheet_not_allowed: '이 탭은 오피스에서 고칠 수 없게 막혀 있어요 (플토 · 날짜별 주문 원본) — 구글시트에서 고쳐 주세요',
    unauthorized: '구글시트 연결 토큰이 맞지 않아요 — 관리자에게 알려 주세요',
    not_connected: '구글시트 연결 정보가 없어요 — 관리자에게 알려 주세요',
    formula_cell: '수식 칸이라 자동으로 계산돼요 — 고치려면 구글시트에서 수식을 바꿔 주세요',
    timeout: '구글시트 응답이 늦어요 — 잠시 뒤 다시 저장해 주세요',
    bad_cell: '칸 위치를 찾지 못했어요 — 새로 불러온 뒤 다시 해 주세요',
    pii_cell: '가린 개인정보 칸은 오피스에서 고칠 수 없어요 — 구글시트에서 고쳐 주세요',
  };
  const RO_TAB = '자동 계산(QUERY 등)이 들어간 탭이라 오피스에서는 고치지 않아요 — 구글시트에서 고쳐 주세요';
  const editErr = m => EDIT_ERR[m] || (/^http_|^cfg$|Failed to fetch|NetworkError|Load failed/.test(m) ? '구글시트에 저장하지 못했어요 — 인터넷 연결을 확인하고 다시 해 주세요' : `저장하지 못했어요 (${m})`);

  function bridgeCfg() {
    if (E.cfg) return Promise.resolve(E.cfg);
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) {   // 로컬 시험용 가짜 브리지 (localStorage erp_dev_bridge = {"url","token"})
      try { const dev = JSON.parse(lsGet('erp_dev_bridge') || 'null'); if (dev && dev.url) return Promise.resolve(E.cfg = dev); } catch (e) { /* noop */ }
    }
    if (!E.cfgP) {
      E.cfgP = fetch(`${SB_URL}/rest/v1/md_sheet_config?select=key,value`, {headers: sbH(), cache: 'no-store'})
        .then(r => r.ok ? r.json() : Promise.reject(new Error('cfg')))
        .then(rows => {
          const m = {};
          (rows || []).forEach(x => { m[x.key] = x.value; });
          if (!m.bridge_url || !m.bridge_token) throw new Error('not_connected');
          return (E.cfg = {url: m.bridge_url, token: m.bridge_token});
        })
        .finally(() => { E.cfgP = null; });
    }
    return E.cfgP;
  }
  // text/plain POST 라 preflight 없이 Apps Script 로 간다 (MD팀과 같은 방식)
  async function bridge(action, extra) {
    const cfg = await bridgeCfg();
    const ac = new AbortController(), timer = setTimeout(() => ac.abort(), WRITE_TIMEOUT);
    try {
      const r = await fetch(cfg.url, {method: 'POST', body: JSON.stringify(Object.assign({action, token: cfg.token}, extra || {})), signal: ac.signal});
      if (!r.ok) throw new Error('http_' + r.status);
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'error');
      return j;
    } catch (e) {
      if (e && e.message === 'unauthorized') E.cfg = null;   // 관리자가 다시 연결했을 수 있음 → 다음엔 새로 받기
      throw e && e.name === 'AbortError' ? new Error('timeout') : e;
    } finally { clearTimeout(timer); }
  }
  // 수식 칸 · 막힌 탭 = 맥미니가 저장소 erp_tabs 에 적은 것 (fx = [[열, 시작줄, 끝줄]] 0부터 · fx_ro · fx_deny). 아직 모르면 고치게 두고 브리지가 수식 칸은 거절한다
  const tabInfo = gid => { const t = tabOf(gid); return t && t.info ? t.info : null; };
  const isFxCell = (info, r, p) => !!(info && Array.isArray(info.fx) && info.fx.some(run => run[0] === p && r - 1 >= run[1] && r - 1 <= run[2]));
  // 고칠 칸 정보 + 화면만 보고 아는 못 고치는 까닭(why)
  function editCtx(gid, r, p) {
    const d = curData(), ent = S.cache.get(gid), t = tabOf(gid);
    if (gid !== S.cur || !d || !ent || !ent.model || !t) return null;
    const col = d.cols.find(c => c.p === p), row = d.rows.find(x => x.r === r), mc = ent.model.cols[p];
    if (!col || !row || !mc) return null;
    const cell = row.byP[p] || null;
    const why = d.side ? '집계 표는 시트가 자동으로 만든 표라 고칠 수 없어요'
      : (cell && cell.pii) || piiCol(col.name) ? EDIT_ERR.pii_cell
      : cell && cell.img ? '사진 칸은 구글시트에서 바꿔 주세요'
      : !cell ? '이 칸은 구글시트에서 고쳐 주세요' : '';
    return {gid, name: t.name, col, cell, p, row: r, r: (cell && cell.r) || r, sc: mc.i + 1,
      check: col.type === 'check' || !!(cell && cell.cb && !cell.t), why};
  }
  function roWhy(x) {
    if (!x) return '고칠 수 없는 칸이에요';
    if (x.why) return x.why;
    const info = tabInfo(x.gid);
    if (info && info.fx_deny) return editErr(info.fx_deny);
    if (info && info.fx_ro) return RO_TAB;
    return isFxCell(info, x.r, x.p) ? `'${x.col.name}' 칸은 시트 수식이 자동으로 계산해요 — 고칠 수 없어요` : '';
  }
  function markEditable() {
    const t = tabOf(S.cur), d = curData(), hint = $('dHint');
    if (!S.sel || !t || !d) return;
    const info = tabInfo(S.cur);
    const tabWhy = d.side ? '집계 표는 고칠 수 없어요' : info && info.fx_deny ? editErr(info.fx_deny) : info && info.fx_ro ? RO_TAB : '';
    hint.textContent = tabWhy || '값을 누르면 고칠 수 있어요 · 저장하면 구글시트와 오피스 저장소에 바로 적혀요 (합계 같은 수식 칸은 자동 계산)';
    hint.classList.toggle('no', !!tabWhy);
    $('dList').querySelectorAll('dd[data-p]').forEach(dd => {
      const why = roWhy(editCtx(S.cur, S.sel.r, +dd.dataset.p));
      dd.classList.toggle('ed-ok', !why);
      dd.classList.toggle('ed-ro', !!why);
      dd.title = why || '눌러서 고치기 — 저장하면 구글시트에 바로 적혀요';
    });
  }

  /* ── 한 칸 쓰기 — 화면 먼저 새 값(pend) → 구글시트(브리지) → 오피스 저장소(erp_cell_edit). 칸마다 차례로(E.q) ──
     돌려줌: {ok} · {conflict, current} (그사이 시트 값이 바뀜) · 실패면 throw. 실패 · 충돌이면 화면은 원래(또는 시트) 값으로 돌아간다. */
  const pkey = x => `${x.gid}|${x.r}|${x.p}`;
  function writeCell(x, v, old, prev) {
    const key = pkey(x);
    const job = E.q.then(() => { showPending(x, v, key); return writeOnce(x, v, old, prev, key); });
    E.q = job.catch(() => {});
    showPending(x, v, key);
    return job;
  }
  // 저장하는 동안 화면에 새 값 (줄 자료를 그 자리에서 바꾸고 다시 그림 — 고치는 중인 칸은 그대로)
  function showPending(x, v, key) {
    const ent = S.cache.get(x.gid);
    if (!ent || !ent.rows) return;
    const row = ent.rows.get(x.r);
    if (!row) return;
    const pd = E.pend.get(key);
    if (!pd) E.pend.set(key, {gid: x.gid, r: x.r, p: x.p, busy: true, at: Date.now(), was: row.v[x.p] == null ? '' : row.v[x.p], now: v});
    else Object.assign(pd, {busy: true, at: Date.now(), now: v});
    const nv = row.v.slice();
    while (nv.length <= x.p) nv.push('');
    nv[x.p] = v;
    ent.rows.set(x.r, Object.assign({}, row, {v: nv}));
    rerender(x.gid);
  }
  // 다 쓴 뒤: ok = 저장소 줄(가린 개인정보 그대로)로, 아니면 원래 값(충돌이면 시트의 지금 값)으로
  // keep = 저장소엔 못 썼음 — 맥미니가 1분 안에 시트와 맞출 때까지 2분 동안은 저장소의 옛 값이 와도 화면은 고친 값
  function settle(x, key, ok, v, current, keep) {
    const pd = E.pend.get(key), ent = S.cache.get(x.gid);
    if (ent && ent.rows && ent.rows.get(x.r)) {
      const row = ent.rows.get(x.r);
      if (ok && Array.isArray(v)) ent.rows.set(x.r, Object.assign({}, row, {v: v.slice(), src: 'office', edited_by: whoAmI() || row.edited_by, edited_at: new Date().toISOString()}));
      else if (!ok && pd) {
        const nv = row.v.slice();
        while (nv.length <= x.p) nv.push('');
        nv[x.p] = current != null ? current : pd.was;
        ent.rows.set(x.r, Object.assign({}, row, {v: nv}));
      }
    }
    if (pd) {
      if (ok && keep) { pd.busy = false; pd.at = Date.now(); }
      else E.pend.delete(key);
    }
    rerender(x.gid);
  }
  async function writeOnce(x, v, old, prev, key) {
    try {
      const j = await bridge('write', {book: BOOK, sheet: (tabOf(x.gid) || {}).name || x.name, edits: [{r: x.r, c: x.sc, v, old}]});
      const res = (j.results || [])[0] || {};
      if (!res.ok && res.error === 'conflict') {
        if (norm(res.current) === norm(old)) return writeOnce(x, v, null, prev, key);   // 띄어쓰기 · 줄바꿈만 다름 = 같은 값
        if (norm(res.current) !== norm(v)) { settle(x, key, false, null, res.current); return {conflict: true, current: res.current}; }
      } else if (!res.ok) throw new Error(res.error || 'error');
      const arr = j.rows && (j.rows[x.r] || j.rows[String(x.r)]);
      let dbv = null, dbErr = '';
      try {
        const d = await sbRpc('erp_cell_edit', {p_gid: x.gid, p_r: x.r, p_p: x.p, p_new: String(v), p_row: Array.isArray(arr) ? arr.map(t => t == null ? '' : String(t)) : null, p_who: whoAmI() || null});
        dbv = d && Array.isArray(d.v) ? d.v : null;
        const t = tabOf(x.gid);
        if (d && d.rows_ver && t && t.info) {   // 내가 쓴 것 — 다음 확인 때 다시 받지 않게 번호표를 앞당긴다
          const ent = S.cache.get(x.gid);
          if (ent && ent.rowsVer >= +t.info.rows_ver) ent.rowsVer = +d.rows_ver;
          t.info.rows_ver = Math.max(+t.info.rows_ver, +d.rows_ver);
        }
      } catch (e) { dbErr = (e && e.message) || String(e); }
      if (!dbv && Array.isArray(arr)) {   // 저장소에 못 썼으면 시트가 돌려준 줄로 (가린 개인정보 칸은 지금 값 그대로) — 맥미니가 맞출 때까지 2분은 이 값
        const info = tabInfo(x.gid), pii = new Set((info && info.pii_cols) || []), cur = (S.cache.get(x.gid) || {rows: new Map()}).rows.get(x.r);
        const base = arr.map((t, i) => pii.has(i) && cur ? (cur.v[i] || '') : String(t == null ? '' : t));
        let e = base.length;
        while (e > 0 && base[e - 1] === '') e--;
        settle(x, key, true, base.slice(0, e), null, true);
      } else settle(x, key, true, dbv, null, !dbv);
      if (dbErr) S.dbErrAt = Date.now();
      logEdit(x, prev, v, true);
      return {ok: true, shown: arr ? arr[x.sc - 1] : null, dbErr};
    } catch (e) {
      settle(x, key, false);
      logEdit(x, prev, v, false, (e && e.message) || String(e));
      throw e;
    }
  }
  // 저장 직후 · 쓰는 중에 저장소에서 옛 값이 오면 고친 값으로 (2분 동안 · 그사이 누가 또 바꿨으면 그 값)
  function applyPending(gid, model) {
    for (const [k, pd] of E.pend) {
      if (pd.gid !== gid) continue;
      if (!pd.busy && Date.now() - pd.at > PEND_MS) { E.pend.delete(k); continue; }
      const mrow = model.rows.find(rw => rw.r === pd.r), c = mrow && mrow.cells.find(z => z.p === pd.p);
      if (!c) continue;
      const raw = c.cb ? (c.cb === 2 ? 'TRUE' : 'FALSE') : c.t;
      if (raw === pd.now) continue;
      if (pd.busy || raw === pd.was) setCellText(model, c, pd.now);
      else E.pend.delete(k);
    }
  }
  function setCellText(model, c, val) {
    if (c.img) return;
    const s = String(val);
    if (c.cb && /^(TRUE|FALSE)$/i.test(s)) { c.cb = /^TRUE$/i.test(s) ? 2 : 1; return; }
    c.t = s;
    c.href = /^https?:\/\/\S+$/i.test(s) ? s : '';
  }
  // 줄 자료가 바뀌었을 때 다시 그리기 — 지금 보는 탭만, 손으로 넘기는 중이면 멈춘 뒤 (softRender)
  function rerender(gid) {
    const ent = S.cache.get(gid);
    if (!ent || !ent.rows) return;
    build(gid, ent);
    saveRows(gid, ent, true);
    if (gid !== S.cur) return;
    renderHead();
    renderGrid({keep: true});
    if (S.sel && S.sel.gid === gid && !$('detail').hidden) openDetail(S.sel.r, false);
  }
  function logEdit(x, oldv, newv, ok, err) {
    fetch(`${SB_URL}/rest/v1/md_sheet_edit_log`, {method: 'POST', headers: sbH({Prefer: 'return=minimal'}),
      body: JSON.stringify({who: `${whoAmI() || '이름 모름'} · ERP`, book: BOOK, sheet: x.name, cell: `${colName(x.sc - 1)}${x.r}`,
        old_value: oldv == null ? null : String(oldv), new_value: String(newv), ok: !!ok, error: err || null})}).catch(() => {});
  }
  // 저장 결과 알리기 (표 · 상세 창 공통) — 성공은 짧게, 충돌은 덮어쓸지 묻는 상자, 실패는 까닭
  function afterWrite(x, v, old, p, anchorOf) {
    return p.then(res => {
      if (res && res.conflict) { askConflict(x, v, res.current, anchorOf); return res; }
      toast(`저장됨 · ${x.col.name} ${short(old)} → ${short(res && res.shown != null ? res.shown : v)}${res && res.dbErr ? ' (구글시트엔 저장 · 오피스 저장소는 1분 안에 맞춰져요)' : ''}`);
      return res;
    }, e => { toast(editErr((e && e.message) || String(e)), true); throw e; });
  }
  // 그사이 시트 값이 바뀜 → 덮어쓸지 묻는다 (표 칸 · 상세 값 바로 위)
  function askConflict(x, v, current, anchorOf) {
    closeEditor();
    const box = $('edbox');
    box.innerHTML = `<div class="ed-cap">${esc(x.col.name)} · 시트 ${colName(x.sc - 1)}${x.r}</div>`
      + `<div class="ed-row"><div class="ed-msg err">그사이 시트 값이 '${esc(short(current))}'(으)로 바뀌었어요. '${esc(short(v))}'(으)로 덮어쓸까요?</div></div>`
      + '<div class="ed-row"><div class="ed-msg"></div><button type="button" class="ed-cancel">시트 값 두기</button><button type="button" class="ed-force">덮어쓰기</button></div>';
    E.x = x;
    E.at = {kind: 'ask', r: x.row, p: x.p};
    E.anchor = (anchorOf && anchorOf()) || cellTd(x.row, x.p) || null;
    box.hidden = false;
    placeEditor(E.anchor);
    box.querySelector('.ed-cancel').onclick = () => closeEditor();
    box.querySelector('.ed-force').onclick = () => {
      const anchor = E.anchor;
      closeEditor();
      const x2 = editCtx(x.gid, x.row, x.p) || x;
      afterWrite(x2, v, current, writeCell(x2, v, null, current), () => anchor).catch(() => {});
    };
  }

  /* 상세 창 · 휴대폰 고칠 칸 상자 — 상세 값 바로 위에 겹쳐 뜬다 (휴대폰은 화면 위쪽) */
  function setEdMsg(t, kind) { const m = $('edbox').querySelector('.ed-msg'); if (m) { m.textContent = t; m.className = 'ed-msg' + (kind ? ' ' + kind : ''); } }
  function placeEditor(anchor) {
    const box = $('edbox');
    if (box.hidden) return;
    const vw = innerWidth, vh = innerHeight, rc = anchor && anchor.isConnected ? anchor.getBoundingClientRect() : null;
    if (narrow.matches || !rc) { box.style.width = Math.min(vw - 16, 460) + 'px'; box.style.left = Math.max(8, (vw - Math.min(vw - 16, 460)) / 2) + 'px'; box.style.top = '12px'; return; }
    const w = Math.min(vw - 16, Math.max(300, rc.width + 8));
    box.style.width = w + 'px';
    const h = box.offsetHeight;
    let top = rc.top - 6;
    if (top + h > vh - 8) top = rc.bottom - h + 6;
    box.style.left = Math.max(8, Math.min(rc.left - 6, vw - w - 8)) + 'px';
    box.style.top = Math.max(8, Math.min(top, vh - h - 8)) + 'px';
  }
  function reanchor() {   // 표 · 상세 창을 다시 그렸으면 같은 칸을 다시 찾아 상자를 맞춘다
    if (CE.x) { const td = cellTd(CE.at.r, CE.at.p); if (td) placeCell(td); else if (!S.vr || !S.vr.on) closeCell(true); }
    if (!E.x || !E.at || (E.anchor && E.anchor.isConnected)) return;
    const el = E.at.kind === 'dd' ? (S.sel && S.sel.r === E.at.r ? $('dList').querySelector(`dd[data-p="${E.at.p}"]`) : null) : cellTd(E.at.r, E.at.p);
    E.anchor = el || null;
    if (el) { el.classList.add('ed-on'); placeEditor(el); }
  }
  function closeEditor() {
    if (E.busy) return false;
    const box = $('edbox');
    box.hidden = true;
    box.innerHTML = '';
    if (E.anchor) E.anchor.classList.remove('ed-on');
    E.x = E.at = E.anchor = null;
    return true;
  }
  function colValues(x) {   // 같은 열에 쓰인 값 (카테고리 · 쇼핑몰처럼 몇 가지뿐인 열만) → 입력 칸 추천 목록
    const d = curData();
    if (!d || x.col.type !== 'text' || x.col.key) return [];
    const m = new Map();
    d.rows.forEach(rw => { const v = catVal(rw, x.p); if (v && v.length <= 40 && !/^⚠|묶음|중복/.test(v)) m.set(v.trim(), (m.get(v.trim()) || 0) + 1); });
    return m.size >= 2 && m.size <= 80 ? [...m.entries()].sort((a, b) => b[1] - a[1]).map(e => e[0]) : [];
  }
  const nameWarn = x => KEY_RE.test(norm(x.col.name)) || OPT_RE.test(norm(x.col.name)) ? '상품명 · 옵션은 식스샵 주문 이름과 글자가 같아야 재고가 빠져요 — 바꿀 땐 식스샵도 같이' : '';
  function openEditor(gid, r, p, anchor) {
    if (E.busy) return;
    closeEditor();
    const x = editCtx(gid, r, p);
    const why = roWhy(x);
    if (why) { toast(why, true); return; }
    if (x.check) { toggleCheck(x, anchor); return; }
    E.x = x;
    E.at = {kind: anchor && anchor.tagName === 'TD' ? 'td' : 'dd', r, p};
    E.anchor = anchor || null;
    if (anchor) anchor.classList.add('ed-on');
    const old = x.cell.t, multi = /\n/.test(old) || old.length > 60;
    const box = $('edbox');
    box.innerHTML = (multi ? '<textarea rows="3" spellcheck="false"></textarea>' : '<input type="text" spellcheck="false" autocomplete="off">')
      + '<div class="ed-row"><div class="ed-msg"></div><button type="button" class="ed-cancel">취소</button><button type="button" class="ed-save">저장</button></div>';
    const inp = box.firstChild, btn = box.querySelector('.ed-save');
    inp.value = old;
    const opts = multi ? [] : colValues(x);
    if (opts.length) { $('edList').innerHTML = opts.map(v => `<option value="${esc(v)}">`).join(''); inp.setAttribute('list', 'edList'); }
    const warn = nameWarn(x);
    setEdMsg(warn || `${x.col.name} · 시트 ${colName(x.sc - 1)}${x.r}` + (hoverMQ.matches ? ` — ${multi ? 'Ctrl+Enter' : 'Enter'} 저장 · Esc 취소` : ''), warn ? 'err' : '');   // 휴대폰엔 Esc 가 없다

  $('msg').addEventListener('click', e => {
    if (e.target.closest('[data-act="retry"]')) reloadNow();
    else if (e.target.closest('[data-act="direct"]') && S.cur) loadDirect(S.cur);
  });
  function syncLimits(gid) {
    const t = tabOf(gid), m = t ? (t.meta || classify(t.name)) : null;
    const today = (() => { const k = new Date(Date.now() + (S.skew || 0) + 9 * 3600e3), y = new Date(k - 864e5); return [`${k.getUTCMonth() + 1}.${k.getUTCDate()}`, `${y.getUTCMonth() + 1}.${y.getUTCDate()}`]; })();
    const hot = m && (m.sec === 'plato' || m.sec === 'defect' || (m.sec === 'home' && today.includes(String(m.date).replace(/^0/, '').replace(/\.0/, '.'))));
    const every = (m && m.sec === 'stock' ? SYNC_EVERY.stock : hot ? SYNC_EVERY.hot : SYNC_EVERY.cold) * 60e3;
    return {warn: every * 2 + 2 * 60e3, bad: every * 3 + 7 * 60e3};
  }
  // 맥미니가 이 탭을 시트와 마지막으로 맞춘 뒤 지난 시간 (서버 시계 기준)
  function syncAge(gid) {
    const at = Date.parse(S.synced[gid] || '');
    return at ? Math.max(0, Date.now() + (S.skew || 0) - at) : Infinity;
  }
  const agoMs = ms => ms < 50e3 ? '방금' : ms < 3600e3 ? `${Math.round(ms / 60e3)}분 전` : ms < 86400e3 ? `${Math.floor(ms / 3600e3)}시간 전` : `${Math.floor(ms / 86400e3)}일 전`;
  function paintStatus() {
    const st = $('st'), s = S.st[S.cur] || {k: 'load'}, c = S.cache.get(S.cur), age = syncAge(S.cur), lim = syncLimits(S.cur);
    let k = s.k, txt = '', tip = '';
    const late = c && !c.direct && age > lim.bad ? 'bad' : c && !c.direct && age > lim.warn ? 'warn' : '';
    if (k === 'load') txt = c ? (c.stored ? (narrow.matches ? '저장본' : `${hhmm(c.at)} 저장본 · 새로 받는 중…`) : s.direct ? '구글시트 읽는 중…' : '갱신 중…') : '불러오는 중…';
    else if (k === 'err') txt = errShort(s.err);
    else if (c && c.direct) txt = narrow.matches ? '구글시트 바로' : `구글시트에서 바로 읽음 · ${hhmm(c.at)}`;
    else if (c && c.stored) txt = `${hhmm(c.at)} 저장본`;
    else if (late) txt = narrow.matches ? `맞춤 ${agoMs(age)}` : `시트와 맞춘 지 ${agoMs(age)} · ${late === 'bad' ? '누르면 구글시트에서 바로' : '맥미니 확인 중'}`;
    else if (c) txt = narrow.matches ? '최신' : `시트와 맞춤 ${isFinite(age) ? agoMs(age) : '—'} · 오피스 저장소`;
    if (k === 'ok' && late === 'bad') k = 'err';
    st.className = `st is-${k}`;
    if (c && c.stored) st.classList.add('is-stored');   // 저장본을 보고 있음 (주황) — 새 자료가 오면 꺼짐
    if (k === 'ok' && (late === 'warn' || (c && c.direct))) st.classList.add('is-stored');
    $('stText').textContent = txt;
    const m = c && c.model;
    tip = c && c.direct ? `오피스 저장소가 ${isFinite(age) ? agoMs(age) : '오래'} 맞춰지지 않아 이 탭은 구글시트를 바로 읽어 보여 주는 중 (${hhmm(c.at)})`
      : c && c.stored ? `이 브라우저에 저장해 둔 ${hhmm(c.at)} 자료를 먼저 보여 주는 중 — 새 자료가 오면 바로 바뀌어요`
      : `오피스 저장소에서 읽음 — 맥미니가 구글시트와 맞추고(재고 탭 1분 · 오늘 주문 탭 2분 · 지난 탭 15분마다), 화면은 ${POLL_MS / 1000}초마다 바뀐 줄만 받아요`
        + (isFinite(age) ? `\n이 탭을 시트와 마지막으로 맞춘 때: ${agoMs(age)}` : '');
    st.title = tip + (m && m.masked ? `\n주문자 이름 등 개인정보 ${m.masked.toLocaleString('ko-KR')}칸은 가려서 보여 줌` : '')
      + (late === 'bad' || (s.k === 'err' && !(c && c.direct)) ? '\n누르면 구글시트에서 이 탭을 바로 읽기' : '\n누르면 지금 다시 받기');
  }
  function paintCount() { $('qn').textContent = S.terms.length && curData() ? `${fmt(S.list.length)}줄` : ''; }
  function reloadNow() {
    const c = S.cache.get(S.cur), s = S.st[S.cur] || {};
    if (S.cur && (syncAge(S.cur) > syncLimits(S.cur).bad || (s.k === 'err' && !s.direct && !c))) { loadDirect(S.cur); return; }
    if (S.cur) loadSheet(S.cur, {full: true});
    if (!S.tabsBusy) loadTabs().catch(() => {});
  }
  $('st').addEventListener('click', reloadNow);

  /* ── 줄 간격 · 전체 화면 ── */
  function setDense(on, save) {
    S.dense = !!on;
    app.classList.toggle('dense', S.dense);
    $('btnDense').classList.toggle('on', S.dense);
    $('btnDense').title = S.dense ? '줄 간격 넓게' : '줄 간격 촘촘하게';
    if (save) { lsSet(LS_DENSE, S.dense ? '1' : '0'); renderGrid({keep: true}); }   // 줄 높이가 바뀌니 다시 그린다 (보이는 줄만 그리기)
  }
  $('btnDense').addEventListener('click', () => setDense(!S.dense, true));
  const fsOk = document.fullscreenEnabled || document.webkitFullscreenEnabled;
  if (!fsOk) $('btnFull').hidden = true;
  $('btnFull').addEventListener('click', () => {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
    else { const el = d.documentElement; (el.requestFullscreen || el.webkitRequestFullscreen).call(el); }
  });

  /* ── 찾기 ── */
  function setQuery(v) {
    S.terms = String(v || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
    S.stick.clear();
    S.hlRe = S.terms.length ? new RegExp(S.terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'gi') : null;
    $('qx').hidden = !v;
    renderGrid({pos: {t: 0, l: grid.scrollLeft}});
  }
  let qT = 0;
  qIn.addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => setQuery(qIn.value), 140); });
  qIn.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qT); if (S.terms.join(' ') !== qIn.value.trim().toLowerCase().split(/\s+/).filter(Boolean).join(' ')) setQuery(qIn.value); moveSel(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { qIn.value = ''; setQuery(''); grid.focus({preventScroll: true}); }
  });
  $('qx').addEventListener('click', () => { qIn.value = ''; setQuery(''); qIn.focus(); });
  // 휴대폰: 찾기 칸을 누르면 자판이 올라오니 위쪽을 접어 결과를 넓게, 찾을 말 없이 나가면 다시 편다
  qIn.addEventListener('focus', () => { if (compactMQ.matches) setHmin(true); });
  qIn.addEventListener('blur', () => { if (!qIn.value.trim() && grid.scrollTop < 56) setHmin(false); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !$('edbox').hidden) { closeEditor(); return; }
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && !e.altKey && (e.key === 'f' || e.key === 'F')) { e.preventDefault(); qIn.focus(); qIn.select(); }
    else if (e.key === 'Escape' && !$('lb').hidden) { $('lb').hidden = true; }
    else if (e.key === 'Escape' && !$('detail').hidden && e.target !== qIn) closeDetail();
    else if (e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp') && S.nav.length) {   // Alt+↑↓ = 위 · 아래 메뉴
      e.preventDefault();
      const i = S.nav.findIndex(it => it.tabs.some(t => t.gid === S.cur));
      openTab(S.nav[(i + (e.key === 'ArrowDown' ? 1 : -1) + S.nav.length) % S.nav.length].tabs[0].gid);
    }
  });

  /* ── 보일 때만 자동 갱신 (오피스 안 화면은 홈으로 나가도 살아 있어서 숨었는지 직접 본다) ── */
  function shown() {
    if (document.visibilityState === 'hidden') return false;
    try { const fe = window.frameElement; if (fe && !fe.getClientRects().length) return false; } catch (e) { /* 다른 출처 */ }
    return true;
  }
  function tick() {
    const vis = shown();
    S.shown = vis;
    if (!vis) return;
    paintStatus();
    if (sizeKey() !== S.size && grid.clientWidth) renderGrid({keep: true});
    else paintRows();
    if (!S.tabsOk) {   // 탭 목록을 아직 못 받음 (처음 · 연결 끊김) → 30초마다 다시
      if (!S.tabsBusy && Date.now() - (S.tabsTry || 0) > RETRY_MS) { S.tabsTry = Date.now(); loadTabs().catch(() => {}); }
      return;
    }
    if (Date.now() - S.pollAt >= POLL_MS - 500) poll();
    const s = S.st[S.cur];   // 받다가 실패한 탭은 30초 뒤 다시
    if (S.cur && !S.busy[S.cur] && s && s.k === 'err' && !s.direct && Date.now() - s.at > RETRY_MS) loadSheet(S.cur);
  }
  setInterval(tick, 2000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') setTimeout(tick, 300); });
  let rzT = 0;
  window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(tick, 180); });
  narrow.addEventListener && narrow.addEventListener('change', () => { if (!narrow.matches) setNav(false); $('dscrim').hidden = !narrow.matches || $('detail').hidden; renderGrid({keep: true}); });
  compactMQ.addEventListener && compactMQ.addEventListener('change', () => { if (!compactMQ.matches) setHmin(false); });

  /* ── 시작 — 지난번 탭은 탭 목록을 기다리지 않고 바로 읽는다 ── */
  (async function boot() {
    setDense(lsGet(LS_DENSE) === '1', false);
    if (lsGet(LS_SIDE) === '0') app.classList.add('side-off');
    S.showEmpty = lsGet(LS_EMPTY) === '1';
    if (document.fonts && document.fonts.load) { try { document.fonts.load(F_CELL, '재고ABC123'); document.fonts.load(F_BOLD, '재고ABC123'); } catch (e) { /* noop */ } }
    let saved = null;
    try { saved = JSON.parse(lsGet(LS_TAB) || 'null'); } catch (e) { saved = null; }
    let want = null;
    try { want = new URLSearchParams(location.search).get('tab'); } catch (e) { want = null; }
    S.want = want;     // 탭 목록이 늦게(실패 뒤 다시) 읽혀도 같은 규칙으로 고른다 (loadTabs)
    S.saved = saved;
    renderGrid();
    // 지난번 탭 목록으로 메뉴를 바로 그리고 고른 탭을 연다 (저장본이 있으면 표도 바로) — 새 탭 목록은 뒤에서
    let known = null;
    try { known = JSON.parse(lsGet(LS_TABS) || 'null'); } catch (e) { known = null; }
    if (Array.isArray(known) && known.length) S.tabs = known.filter(t => t && t.gid).map(t => ({name: String(t.name || ''), gid: String(t.gid), meta: classify(t.name)}));
    else if (saved && saved.gid && !want) S.tabs = [{name: saved.name || '…', gid: String(saved.gid), meta: classify(saved.name || '')}];
    if (S.tabs.length) {
      const first = pickTab(want, saved);
      if (first && (!want || known)) openTab(first);
    }
    S.tabsTry = Date.now();
    try { await loadTabs(); }   // 보던 탭이 없거나 지워졌으면 loadTabs 가 고른다 (그 사이 사용자가 고른 탭은 그대로)
    catch (e) {
      S.st[S.cur || ''] = {k: 'err', err: e.message, at: Date.now()};
      paintStatus();
      if (!S.cur || !S.cache.get(S.cur)) showErr(e.message);   // 저장본도 없으면 '구글시트에서 바로 보기' 단추
    }
  })();
})();
</script>
</body>
</html>
