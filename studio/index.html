<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>컨텐츠 스튜디오 · 브라이트비드 오피스</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<script>
  /* 오피스 잠금 연동 — 오피스에서 PIN 을 넣은 브라우저만 들어올 수 있음 */
  (function () {
    try { if (localStorage.getItem('brightbeed_unlocked') !== '1') location.replace('../?from=studio'); } catch (e) { /* noop */ }
  })();
</script>
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard-dynamic-subset.css">
<link rel="stylesheet" href="studio.css?v=5">
<!-- 배포할 때마다 v 숫자를 올린다: 모듈이 브라우저 캐시(최대 10분)에 섞여 남지 않게 (css · main.js · 아래 목록 전부) -->
<script type="importmap">
{
 "imports": {
  "./js/actions.js": "./js/actions.js?v=5",
  "./js/bulk.js": "./js/bulk.js?v=5",
  "./js/core.js": "./js/core.js?v=5",
  "./js/editor.js": "./js/editor.js?v=5",
  "./js/exporter.js": "./js/exporter.js?v=5",
  "./js/fonts.js": "./js/fonts.js?v=5",
  "./js/modal.js": "./js/modal.js?v=5",
  "./js/overlay.js": "./js/overlay.js?v=5",
  "./js/pages.js": "./js/pages.js?v=5",
  "./js/panels.js": "./js/panels.js?v=5",
  "./js/render.js": "./js/render.js?v=5",
  "./js/templates.js": "./js/templates.js?v=5",
  "./js/tpl-fashion-living.js": "./js/tpl-fashion-living.js?v=5",
  "./js/tpl-jewelry.js": "./js/tpl-jewelry.js?v=5",
  "./js/tpl-kit.js": "./js/tpl-kit.js?v=5",
  "./js/tpl-more.js": "./js/tpl-more.js?v=5",
  "./js/tpl-sale.js": "./js/tpl-sale.js?v=5",
  "./js/tpl-sns.js": "./js/tpl-sns.js?v=5",
  "./js/ui.js": "./js/ui.js?v=5"
 }
}
</script>
</head>
<body class="booting">
<div class="app" id="app">

  <header class="topbar">
    <a class="tb-back" href="../" title="오피스로 돌아가기">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
      오피스
    </a>
    <div class="tb-brand"><span class="tb-logo">▶</span><b>컨텐츠 스튜디오</b><span class="tb-tag">릴스·스토리 9:16</span></div>
    <div class="tb-proj">
      <input id="projName" class="tb-name" type="text" maxlength="60" spellcheck="false" aria-label="프로젝트 이름">
      <button id="projMenuBtn" class="tb-btn" type="button" title="프로젝트 (목록 · 새로 만들기 · 파일)">프로젝트 ▾</button>
    </div>
    <span id="saveStatus" class="tb-save" data-s="saved">저장됨</span>
    <span class="tb-spacer"></span>
    <button id="undoBtn" class="tb-ic" type="button" title="되돌리기 (Ctrl/⌘+Z)" disabled>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
    </button>
    <button id="redoBtn" class="tb-ic" type="button" title="다시 하기 (Ctrl/⌘+Shift+Z)" disabled>
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
    </button>
    <button id="previewBtn" class="tb-btn" type="button" title="실제 피드처럼 보기 (P)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
      미리보기
    </button>
    <button id="bulkBtnTop" class="tb-btn" type="button" title="사진·문구만 바꿔서 여러 장 한 번에">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="10" height="15" rx="2"/><rect x="11" y="3" width="10" height="15" rx="2"/></svg>
      대량 제작
    </button>
    <button id="exportBtn" class="tb-primary" type="button" title="PNG/JPG · ZIP 저장">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
      내보내기
    </button>
    <button id="helpBtn" class="tb-ic" type="button" title="단축키 (?)">?</button>
  </header>

  <aside class="left">
    <nav class="tabs" role="tablist">
      <button type="button" data-tab="add" class="on">추가</button>
      <button type="button" data-tab="layers">레이어 <span class="tab-n" id="layersCount">0</span></button>
      <button type="button" data-tab="templates">템플릿</button>
    </nav>
    <div class="tab-pane on" id="pane-add"></div>
    <div class="tab-pane" id="pane-layers">
      <p class="hint pad">위가 앞쪽이에요. 끌어서 순서 변경 · 더블클릭으로 이름 변경</p>
      <div id="layersList" class="layers"></div>
    </div>
    <div class="tab-pane" id="pane-templates"></div>
  </aside>

  <main class="center">
    <div class="canvas-bar">
      <label class="cb-sel" title="어느 지면 기준으로 가림 영역을 볼지">
        <span>지면</span>
        <select id="placementSel"></select>
      </label>
      <button id="uiToggle" class="cb-tog" type="button" title="릴스·스토리 UI(프로필·캡션·CTA 버튼 등) 시뮬레이션 (U)">
        <i class="cb-dot"></i>UI 가림 보기
      </button>
      <input id="uiOpacity" class="cb-op" type="range" min="10" max="100" step="5" title="UI 시뮬레이션 불투명도">
      <button id="safeToggle" class="cb-tog" type="button" title="안전영역 빗금 표시 (G)">
        <i class="cb-dot"></i>안전영역
      </button>
      <span class="spacer"></span>
      <div class="cb-zoom">
        <button id="zoomOut" type="button" title="축소 (Ctrl/⌘ -)">−</button>
        <button id="zoomLabel" type="button" title="화면에 맞추기">100%</button>
        <button id="zoomIn" type="button" title="확대 (Ctrl/⌘ +)">+</button>
        <button id="zoomFit" type="button" title="화면에 맞추기 (Ctrl/⌘ 0)">맞춤</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <canvas id="pageCanvas" class="page-canvas"></canvas>
      <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
      <div class="preview-nav" id="previewNav">
        <button id="pvPrev" type="button" title="이전 페이지 (←)">‹</button>
        <span id="pvCount">1 / 1</span>
        <button id="pvNext" type="button" title="다음 페이지 (→)">›</button>
        <button id="pvClose" type="button" class="pv-close" title="편집으로 돌아가기 (Esc)">편집으로</button>
      </div>
    </div>
    <div class="status-bar" id="statusBar"></div>
  </main>

  <aside class="right" id="props"></aside>

  <footer class="pages">
    <div class="pages-head">
      <b>페이지</b>
      <span id="pagesCount" class="pages-count"></span>
      <button id="addPageBtn" type="button" class="btn btn-ghost btn-xs" title="빈 페이지 추가">＋ 새 페이지</button>
      <button id="dupPageBtn" type="button" class="btn btn-ghost btn-xs" title="지금 페이지 복제">복제</button>
      <button id="bulkBtn" type="button" class="btn btn-accent btn-xs" title="지금 디자인으로 사진·문구만 바꿔 여러 장 만들기">대량 제작</button>
      <button id="exportAllBtn" type="button" class="btn btn-ghost btn-xs" title="전체 페이지를 ZIP으로 저장">전체 저장</button>
    </div>
    <div class="pages-list" id="pagesList"></div>
  </footer>
</div>

<div class="boot">
  <div class="boot-in"><span class="tb-logo">▶</span> 컨텐츠 스튜디오 여는 중…</div>
  <div id="bootError" class="boot-err" hidden></div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" class="toasts" aria-live="polite"></div>
<script type="module" src="js/main.js?v=5"></script>
</body>
</html>
