<script>
  /* 오피스 안 화면(iframe, index.html 의 TOOL_PAGES 'store')이면 '← 오피스' 는 그 화면을 닫는다 (bbToolClose). 혼자 열면 이 페이지의 잠금 화면. */
  (function () {
    var inOffice = false, home = '';
    try { inOffice = window.parent !== window && typeof window.parent.bbToolClose === 'function'; } catch (e) { /* 다른 출처 */ }
    if (inOffice) { try { home = window.parent.location.href.split('#')[0]; } catch (e) { /* noop */ } }
    if (!home) { try { home = new URL('../', location.href).href; } catch (e) { home = '../'; } }
    window.__inOffice = inOffice;
    document.addEventListener('DOMContentLoaded', function () {
      Array.prototype.forEach.call(document.querySelectorAll('a[href="../"]'), function (a) {
        a.href = home;
        if (inOffice) a.addEventListener('click', function (e) {
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button) return;
          e.preventDefault();
          try { window.parent.bbToolClose(); } catch (err) { location.href = home; }
        });
      });
    });
  })();
</script>

<style>
  /* 직원 할인 스토어 — 오피스 업무용 툴 (2026-11-26)

     · 상품 = 맥미니 프록시 GET /erp/store (재고 연동 5분마다 식스샵프로 판매중 옵션 → 재고 ERP 줄 · 남은 재고)
     · 주문 · 설정 = 슈퍼베이스 엣지 함수 staff-store (표 staff_orders — 전화 · 주소는 가려서만 돌려줌, 이 화면 · 깃허브에 남기지 않음)
     · 재고 차감 = 프록시 POST /erp/moves dest 'staff' (원장 ch '직원 구매'), 접수ID 는 주문번호로 정해져 한 번만 빠짐 · 취소하면 되돌림('직원 구매 취소')

  :root { --bg: #f3f5f8; --panel: #fff; --line: #e5e7eb; --line2: #d5dae2; --text: #0f172a; --t2: #475569; --t3: #7a8698; --ink: #0f172a; --red: #e11d48; --top: 58px;

<script>
(function () {
  'use strict';
  const PIN_HASH = { '1ca028f07214879e7a13ac5fddab2db2f66149572a62e814e97e7ad4ba286f4c': 'viewer', '61bac9d4e564d8096a969a0af7ec131066991620a2807be2b6b889cf8b24193e': 'master' };
  const AUTH_VERSION = '4', MASTER_PIN_VER = '1', PAGE = 60;
  const FN = 'https://ckyjkxbqsyjoqpuqwoce.supabase.co/functions/v1/staff-store';
  const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNreWpreGJxc3lqb3FwdXF3b2NlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MjI2NzEsImV4cCI6MjA5Mzk5ODY3MX0.C8WIGqf-zIYkCq0dGWTMjIYuPM-IVInMn1p6FaWbVKA';
  const BR = { '6A': '식스에이', YAR: '야르', PP: '프피', AKOI: '아코이', APT: '아페티', KOP: '코페리', KOZ: '코즈미' };
  const ORDER = ['6A', 'YAR', 'APT', 'KOZ', 'PP', 'KOP', 'AKOI'];
  const LS_CART = 'store_cart_v1', LS_ME = 'store_me_v1', LS_ADDR = 'store_addr_v1', LS_SENT = 'store_sent_v1';
  const $ = id => document.getElementById(id);
  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 꽉 차도 화면은 그대로 */ } };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) { /* noop */ } };
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const safe = u => /^https:\/\//.test(String(u || '')) ? String(u) : '';
  const won = v => Number(v || 0).toLocaleString('ko-KR') + '원';
  const p2 = v => String(v).padStart(2, '0');
  const when = s => { const d = new Date(s); return `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`; };
  const ME = () => (lsGet('brightbeed_diary_me') || lsGet('seed_me_v1') || lsGet(LS_ME) || '').trim().slice(0, 40);
  // 대표 전용 (2026-11-26 사장님 "관리자 전용 … 절대 직원한테 보이면안돼 대표한테만") — 관리자 PIN + 오피스 이름 전승훈 · 전수빈 (index.html EXEC_ALLOWED · mileage/ 와 같게)
  const BOSS = new Set(['전승훈', '전수빈']);
  const isAdmin = () => lsGet('brightbeed_role') === 'master' && BOSS.has((lsGet('brightbeed_diary_me') || '').trim());
  /** 직원가 = 공홈 판매가 × (1 − 할인율), 10원 단위 버림 (엣지 함수 staffPrice 와 같아야 함) */
  const staff = (p, b) => Math.floor((p * (100 - Math.max(0, Math.min(90, Number(S.cfg.rates[b] || 0))))) / 100 / 10) * 10;
  /** 공홈 정가 (옵션) — 맥미니 목록의 po, 아직 없으면(옛 목록) 옵션 하나짜리 상품만 상품 정가 */
  const poOf = (x, v) => v.po || (x.v.length === 1 && x.org && x.org >= v.p ? x.org : null);
  const priceBox = (po, p, b) => { const r = Number(S.cfg.rates[b] || 0); return `<div class="pz"><div><span>공홈 정가</span>${po ? `<s>${won(po)}</s>` : '<span>—</span>'}</div><div><span>상시할인가</span><s>${won(p)}</s></div><div class="sp"><span>직원가</span>${r ? `<em>-${r}%</em>` : '<em></em>'}<b>${won(staff(p, b))}</b></div></div>`; };
  const p3 = (po, p, unit) => `<span class="p3">${po && po > p ? `정가 <s>${won(po)}</s>` : ''}상시 <s>${won(p)}</s>직원가 <b style="color:var(--text)">${won(unit)}</b></span>`;
  const S = { items: [], at: 0, erpAt: 0, cfg: { rates: {}, ship: 2000, bank: '', account: '', holder: '', on: true, notice: '' }, cjEnv: 'dev',
    brand: '', cat: '', q: '', sort: lsGet('store_sort') || 'new', n: PAGE, pick: {}, qty: {}, cart: [], view: 'shop', mine: null, all: null, base: '', busy: false, aFilter: 'open' };
  try { S.cart = (JSON.parse(lsGet(LS_CART) || '[]') || []).filter(x => x && x.vid && x.qty > 0); } catch (e) { S.cart = []; }
  const saveCart = () => lsSet(LS_CART, JSON.stringify(S.cart));

  let toastT = 0;
  function toast(msg, err) { const t = $('toast'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, err ? 5000 : 2400); }
  function overlay(html, opt) {
    const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = html + (opt && opt.noX ? '' : '<button class="x" type="button" aria-label="닫기">×</button>');
    $('ovs').innerHTML = ''; $('ovs').appendChild(o);
    o.addEventListener('click', e => { if ((e.target === o && !(opt && opt.sticky)) || e.target.closest('.x') || (e.target.tagName === 'IMG' && e.target.parentNode === o)) o.remove(); });
    return o;
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('ovs').firstChild) $('ovs').innerHTML = ''; else side(false); } });
  async function copy(t, msg) { try { await navigator.clipboard.writeText(t); toast(msg); } catch (e) { toast('복사가 막혀 있어요 — 숫자를 길게 눌러 복사해 주세요', true); } }

  /* ── 서버 ── */
  function pin() { for (const w of [window.parent !== window ? window.parent : null, window.opener]) { try { if (w && typeof w.ghPin === 'function') return w.ghPin(); } catch (e) { /* 다른 출처 */ } } return '0017'; }
  async function proxy(path, body) {
    if (!S.base) { const t = await fetch('https://raw.githubusercontent.com/j65209/beaduniverse/main/tunnel.json?cb=' + Date.now(), { cache: 'no-store' }).then(r => r.json()); S.base = String(t.url || '').replace(/\/$/, ''); }
    const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 60000);
    try {
      const r = await fetch(S.base + path, { method: body ? 'POST' : 'GET', cache: 'no-store', signal: ac.signal,
        headers: Object.assign({ 'X-Brightbeed-PIN': pin(), Accept: 'application/json' }, body ? { 'Content-Type': 'application/json' } : {}), body: body ? JSON.stringify(body) : undefined });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) { const e = new Error(j.error || 'HTTP ' + r.status); e.no = r.status === 400; throw e; }
      return j;
    } catch (e) { if (e && e.name === 'AbortError') throw new Error('재고 서버 응답이 늦어요'); throw e; } finally { clearTimeout(tm); }
  }
  async function fn(body) {
    const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + ANON, apikey: ANON }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.error || 'HTTP ' + r.status);
    return j;
  }
  async function loadItems(fresh) {
    const j = await proxy('/erp/store' + (fresh ? '?fresh=1' : ''));
    S.items = (j.items || []).filter(x => BR[x.b] && x.v && x.v.length);
    S.items.forEach(x => { x.key = x.b + '|' + x.id; x.hay = (x.name + ' ' + x.v.map(v => v.o).join(' ') + ' ' + (x.cat || []).join(' ') + ' ' + BR[x.b]).toLowerCase(); x.t = Date.parse(x.at) || 0; });
    S.byV = new Map(); S.items.forEach(x => x.v.forEach(v => S.byV.set(x.b + '|' + v.id, { x, v })));
    S.at = Date.parse(j.at) || 0; S.erpAt = j.erpAt || 0;
  }
  async function loadCfg() { const j = await fn({ action: 'config' }); S.cfg = j.cfg; S.cjEnv = j.cj_env; }
  function stamp() {
    const st = $('stamp'), m = S.at ? (Date.now() - S.at) / 6e4 : 999, d = new Date(S.at);
    st.className = 'stamp' + (m > 30 ? ' bad' : '');
    st.textContent = S.at ? `판매중 상품 ${p2(d.getHours())}:${p2(d.getMinutes())} 기준 · 재고 ERP 바로${m > 30 ? ' · 상품 갱신이 밀렸어요' : ''}` : '';
  }

  /* ── 전광판 ── */
  function paintBoard() {
    const r = S.cfg.rates || {}, cnt = {}; S.items.forEach(x => { cnt[x.b] = (cnt[x.b] || 0) + 1; });
    $('board').innerHTML = `<div class="hd"><b>직원 할인 스토어</b><span>공홈 상시할인가에서 브랜드별 추가 할인 · 판매중 ${S.items.length.toLocaleString()}개</span></div>
      <div class="rates">${['', ...ORDER].map(b => b ? `<button class="rate${S.brand === b ? ' on' : ''}" data-b="${b}" type="button"><span class="k"><i class="dot"></i>${BR[b]} <em style="font-style:normal;opacity:.6">${cnt[b] || 0}</em></span><span class="v">${Number(r[b] || 0)}<small>%</small></span></button>`
        : `<button class="rate${!S.brand ? ' on' : ''}" data-b="" type="button"><span class="k">전 브랜드</span><span class="v" style="font-size:16px;line-height:1.7">${S.items.length.toLocaleString()}<small>개</small></span></button>`).join('')}</div>
      <div class="ship"><b>배송비 ${won(S.cfg.ship)}</b>대한통운 · 주문마다 한 번</div>`;
    $('board').querySelectorAll('.rate').forEach(b => b.onclick = () => { S.brand = b.dataset.b; S.cat = ''; S.n = PAGE; if (S.view !== 'shop') go('shop'); paintBoard(); paintShop(); });
    const n = $('notice'), msgs = [];
    if (S.cfg.on === false) msgs.push('<b>지금은 주문을 받지 않아요.</b> 둘러보기만 돼요.');
    if (S.cfg.notice) msgs.push(esc(S.cfg.notice));
    n.innerHTML = msgs.join('<br>'); n.hidden = !msgs.length; n.className = 'notice' + (S.cfg.on === false ? ' bad' : '');
  }

  /* ── 상품 ── */
  const catOf = x => (x.cat && x.cat[0] ? String(x.cat[0]).split(' > ')[0] : '기타');
  const vOf = x => x.v.find(v => v.id === S.pick[x.key]) || x.v.find(v => v.av !== 0) || x.v[0];
  const minP = x => Math.min(...x.v.map(v => v.p));
  function list() {
    const q = S.q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let xs = S.items.filter(x => (!S.brand || x.b === S.brand) && x.v.some(v => v.av !== 0));
    if (S.cat) xs = xs.filter(x => catOf(x) === S.cat);
    if (q.length) xs = xs.filter(x => q.every(w => x.hay.includes(w)));
    const save = x => minP(x) - staff(minP(x), x.b);
    const by = { new: (a, b) => b.t - a.t, low: (a, b) => staff(minP(a), a.b) - staff(minP(b), b.b), high: (a, b) => staff(minP(b), b.b) - staff(minP(a), a.b), save: (a, b) => save(b) - save(a), name: (a, b) => a.name.localeCompare(b.name) }[S.sort];
    return xs.sort(by);
  }
  function paintCats() {
    const base = S.items.filter(x => (!S.brand || x.b === S.brand) && x.v.some(v => v.av !== 0)), c = {};
    base.forEach(x => { const k = catOf(x); c[k] = (c[k] || 0) + 1; });
    const ks = Object.keys(c).sort((a, b) => c[b] - c[a]).slice(0, 9);
    if (S.cat && !ks.includes(S.cat)) S.cat = '';
    $('catSeg').innerHTML = [['', '전체', base.length], ...ks.map(k => [k, k, c[k]])].map(([k, t, n]) => `<button type="button" class="${S.cat === k ? 'on' : ''}" data-c="${esc(k)}">${esc(t)}<em>${n}</em></button>`).join('');
    $('catSeg').querySelectorAll('button').forEach(b => b.onclick = () => { S.cat = b.dataset.c; S.n = PAGE; paintShop(); });
  }
  function cardHtml(x) {
    const v = vOf(x), rate = Number(S.cfg.rates[x.b] || 0), img = safe(v.img) || safe(x.img[0]), inCart = S.cart.some(c => c.b === x.b && c.pid === x.id);
    const few = v.av != null && v.av > 0 && v.av <= 5 ? `<span class="few">${v.av}개 남음</span>` : '';
    const opts = x.v.length > 1 ? `<select class="inp" data-k="${esc(x.key)}" aria-label="옵션">${x.v.map(o => `<option value="${esc(o.id)}"${o.id === v.id ? ' selected' : ''}${o.av === 0 ? ' disabled' : ''}>${esc(o.o || '기본')}${o.av === 0 ? ' (품절)' : o.p !== x.v[0].p ? ' · ' + won(staff(o.p, x.b)) : ''}</option>`).join('')}</select>` : (v.o && v.o !== '단일' ? `<div style="font-size:12px;color:var(--t3)">${esc(v.o)}</div>` : '');
    const q = S.qty[x.key] || 1;
    return `<article class="card${inCart ? ' in' : ''}" data-k="${esc(x.key)}">
      <div class="ph" data-k="${esc(x.key)}">${img ? `<img src="${esc(img)}" alt="${esc(x.name)}" loading="lazy" decoding="async" referrerpolicy="no-referrer">` : ''}
        ${rate ? `<span class="off">-${rate}%</span>` : ''}${few}${x.img.length > 1 ? `<span class="pc">${x.img.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</span>` : ''}</div>
      <div class="bd">
        <div class="br"><i class="dot"></i>${BR[x.b]}</div>
        <div class="nm" title="${esc(x.name)}">${esc(x.name)}</div>
        ${priceBox(poOf(x, v), v.p, x.b)}
        ${opts}
        <div class="buy"><span class="qty"><button type="button" data-d="-1" aria-label="빼기">−</button><span>${q}</span><button type="button" data-d="1" aria-label="더하기">+</button></span>
          <button class="btn pri" type="button" data-add${S.cfg.on === false || v.av === 0 ? ' disabled' : ''}>${v.av === 0 ? '품절' : inCart ? '더 담기' : '담기'}</button></div>
      </div></article>`;
  }
  function paintShop() {
    paintCats();
    const xs = list(), shown = xs.slice(0, S.n);
    $('grid').innerHTML = shown.map(cardHtml).join('');
    $('cnt').textContent = `${xs.length.toLocaleString()}개`;
    $('empty').hidden = !!xs.length; $('empty').textContent = S.q ? `'${S.q}' 에 맞는 판매중 상품이 없어요` : '판매중 상품이 없어요';
    $('more').hidden = xs.length <= S.n; $('more').textContent = `더 보기 (${(xs.length - S.n).toLocaleString()}개 더)`;
  }
  const itemOf = k => S.items.find(x => x.key === k);
  $('grid').addEventListener('change', e => { const s = e.target.closest('select[data-k]'); if (!s) return; S.pick[s.dataset.k] = s.value; repaintCard(s.dataset.k); });
  $('grid').addEventListener('click', e => {
    const card = e.target.closest('.card'); if (!card) return; const k = card.dataset.k, x = itemOf(k); if (!x) return;
    const d = e.target.closest('[data-d]');
    if (d) { const v = vOf(x), max = v.av == null ? 50 : Math.min(50, v.av); S.qty[k] = Math.max(1, Math.min(max, (S.qty[k] || 1) + Number(d.dataset.d))); card.querySelector('.qty span').textContent = S.qty[k]; return; }
    if (e.target.closest('[data-add]')) { add(x, vOf(x), S.qty[k] || 1); return; }
    if (e.target.closest('.ph')) { const im = safe(vOf(x).img) || safe(x.img[0]); if (im) overlay(`<img src="${esc(im)}" alt="">`); }
  });
  function repaintCard(k) { const x = itemOf(k), el = [...$('grid').children].find(c => c.dataset.k === k); if (x && el) el.outerHTML = cardHtml(x); }
  $('more').onclick = () => { S.n += PAGE; paintShop(); };
  let qT = 0; $('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { S.q = $('q').value; S.n = PAGE; if (S.view !== 'shop') go('shop'); paintShop(); }, 150); });
  $('sort').value = S.sort; $('sort').onchange = () => { S.sort = $('sort').value; lsSet('store_sort', S.sort); S.n = PAGE; paintShop(); };

  /* 마우스 올리면 크게 — 사진이 여러 장이면 가로로 움직여 넘김 */
  const Z = $('zoom'), canHover = window.matchMedia && matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (canHover) {
    $('grid').addEventListener('mousemove', e => {
      const ph = e.target.closest('.ph'); if (!ph) { Z.hidden = true; return; }
      const x = itemOf(ph.dataset.k); if (!x) return;
      const r = ph.getBoundingClientRect(), imgs = x.img.map(safe).filter(Boolean), v = vOf(x);
      let i = imgs.length > 1 ? Math.min(imgs.length - 1, Math.floor(((e.clientX - r.left) / r.width) * imgs.length)) : 0;
      const src = (i === 0 && safe(v.img)) || imgs[i] || safe(v.img);
      if (!src) return;
      const zi = Z.querySelector('img'); if (zi.getAttribute('src') !== src) zi.src = src;
      Z.querySelector('div').textContent = x.name + (imgs.length > 1 ? `  ·  ${i + 1}/${imgs.length}` : '');
      ph.querySelectorAll('.pc i').forEach((d, k) => d.classList.toggle('on', k === i));
      const W = 440, gap = 16, vw = innerWidth, vh = innerHeight;

  /* ── 주문 ── */
  const newKey = () => 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  $('orderBtn').onclick = async () => {

    try {
      // 주문 직전에 재고를 다시 — 그 사이 팔린 것 막기
      await loadItems(true).catch(() => {});
      const ls = cartLines();
      if (ls.some(l => l.gone)) throw new Error('그 사이 판매가 끝난 상품이 있어요 — 장바구니에서 빼 주세요');
      const short = ls.find(l => l.v.av != null && l.c.qty > l.v.av);

  function cjLine(o) {

  function done(o, pay) {

  async function refreshDone(id) {

  /* ── 재고 ERP 차감 · 되돌리기 (프록시 /erp/moves, dest 'staff') ── */
  const mid = (o, i) => 'ms' + Number(o.id).toString(36).padStart(5, '0') + 'x' + i.toString(36);
  function movesOf(o) { const out = []; let i = 0; (o.items || []).forEach(it => (it.rows || []).forEach(r => { out.push({ id: mid(o, i++), brand: r.b, product: r.n, option: r.o || '', category: r.c || '', kind: 'out', dest: 'staff', qty: it.qty * (r.q || 1) }); })); return out; }
  async function waitMoves(ids, ms) {

      if (!bad.length) await fn({ action: 'erp', id: o.id, status: 'done' });

  async function erpUndo(o) {

  }

        <span><span class="pill ${ek}">${ek === 'ok' ? '✓' : ek === 'bad' ? '!' : '…'}</span> ${esc(et)}</span><span><span class="pill ${ck}">${ck === 'ok' ? '✓' : ck === 'bad' ? '!' : '…'}</span> ${esc(ct)}</span>
        ${o.paid_at ? `<span style="color:var(--t3)">입금 확인 ${when(o.paid_at)}${o.paid_by ? ' · ' + esc(o.paid_by) : ''}</span>` : ''}${o.cancelled_at ? `<span style="color:var(--t3)">취소 ${when(o.cancelled_at)}${o.cancelled_by ? ' · ' + esc(o.cancelled_by) : ''}</span>` : ''}
        <div class="acts">${admin ? adminActs(o) : o.status === 'ordered' ? `<button class="btn" data-acc type="button">송금 계좌 보기</button>` : ''}</div></div></div>`;
  }
  function adminActs(o) {
    if (o.status === 'cancelled') return o.erp_status === 'done' ? '<button class="btn red" data-act="undo" type="button">재고 되돌리기</button>' : '';
    return [o.status === 'paid' ? '<button class="btn" data-act="unpay" type="button">입금 확인 취소</button>' : '<button class="btn pri" data-act="pay" type="button">입금 확인</button>',
      (o.cj_status === 'failed' && S.cjEnv === 'prod') ? '<button class="btn" data-act="rebook" type="button">택배 다시 접수</button>' : '',
      (o.erp_status === 'fail' || o.erp_status === 'wait') ? '<button class="btn" data-act="erp" type="button">재고 다시 빼기</button>' : '',
      '<button class="btn red" data-act="cancel" type="button">주문 취소</button>'].join('');
  }
  async function loadMine() { const who = ME() || lsGet(LS_ME) || ''; const j = await fn({ action: 'list', buyer: who, limit: 100 }); S.mine = j.orders; healErp(S.mine); }
  function paintMine() {
    const el = $('mine'), who = ME() || lsGet(LS_ME) || '';
    if (!who) { el.innerHTML = '<div class="empty">오피스에서 이름을 고르거나, 한 번 주문하면 여기에 내 주문이 보여요</div>'; return; }
    if (!S.mine) { el.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
    el.innerHTML = S.mine.length ? `<div style="font-size:13px;color:var(--t2)"><b>${esc(who)}</b> 님 주문 ${S.mine.length}건</div>` + S.mine.map(o => ordHtml(o, false)).join('') : `<div class="empty">${esc(who)} 님 주문이 아직 없어요</div>`;
    el.querySelectorAll('[data-acc]').forEach(b => b.onclick = () => { const o = S.mine.find(x => x.id === +b.closest('.ord').dataset.id); if (o) done(o, { total: o.total, bank: S.cfg.bank, account: S.cfg.account, holder: S.cfg.holder }); });
  }

  /* ── 주문 관리 (관리자 PIN) ── */
  async function loadAll() { const j = await fn({ action: 'list', all: true, limit: 300 }); S.all = j.orders; healErp(S.all); }
  function paintAdmin() {
    const el = $('vAdmin'); if (!isAdmin()) { el.innerHTML = '<div class="empty">관리자 PIN 기기에서만 보여요</div>'; return; }
    if (!S.all) { el.innerHTML = '<div class="empty">불러오는 중…</div>'; return; }
    const os = S.all, live = os.filter(o => o.status !== 'cancelled'), wait = live.filter(o => o.status === 'ordered');
    const m0 = new Date(); m0.setDate(1); m0.setHours(0, 0, 0, 0); const month = live.filter(o => Date.parse(o.created_at) >= m0.getTime());
    const need = os.filter(o => (o.status !== 'cancelled' && (o.erp_status === 'fail' || ['failed', 'unknown'].includes(o.cj_status))) || (o.status === 'cancelled' && o.erp_status === 'done'));
    const F = { open: ['입금 대기', wait], need: ['확인 필요', need], all: ['전체', os], cx: ['취소', os.filter(o => o.status === 'cancelled')] };
    const r = S.cfg.rates || {};
    el.innerHTML = `<div style="display:flex;flex-direction:column;gap:12px">
      <div class="kpis"><div class="kpi"><span>입금 대기</span><b>${wait.length}건 · ${won(wait.reduce((s, o) => s + o.total, 0))}</b></div><div class="kpi"><span>이번 달 주문</span><b>${month.length}건 · ${won(month.reduce((s, o) => s + o.total, 0))}</b></div>
        <div class="kpi"><span>이번 달 할인해 준 금액</span><b>${won(month.reduce((s, o) => s + (o.list_total - o.goods_total), 0))}</b></div><div class="kpi"><span>확인 필요</span><b style="${need.length ? 'color:var(--red)' : ''}">${need.length}건</b></div>
        <div class="kpi"><span>대한통운</span><b style="font-size:15px;line-height:30px">${S.cjEnv === 'prod' ? '운영 — 바로 접수' : '운영 승인 전 — 대기'}</b></div></div>
      <div class="tools"><div class="seg" id="aSeg">${Object.entries(F).map(([k, [t, l]]) => `<button type="button" data-f="${k}" class="${S.aFilter === k ? 'on' : ''}">${t}<em>${l.length}</em></button>`).join('')}</div><button class="btn" id="aReload" type="button">새로고침</button></div>
      <div class="orders">${F[S.aFilter][1].map(o => ordHtml(o, true)).join('') || '<div class="empty">없어요</div>'}</div>
      <div class="set"><h4>할인율 · 배송비 · 입금 계좌</h4>
        <div class="rs">${ORDER.map(b => `<label>${BR[b]} 할인 %<input class="inp" type="number" min="0" max="90" step="1" data-rate="${b}" value="${Number(r[b] || 0)}"></label>`).join('')}<label>배송비 (원)<input class="inp" type="number" min="0" step="100" id="sShip" value="${Number(S.cfg.ship || 0)}"></label></div>
        <div class="rs"><label>은행<input class="inp" id="sBank" value="${esc(S.cfg.bank)}"></label><label>계좌번호<input class="inp" id="sAcc" value="${esc(S.cfg.account)}"></label><label>예금주<input class="inp" id="sHolder" value="${esc(S.cfg.holder)}"></label></div>
        <label style="font-size:12px;color:var(--t3);display:flex;flex-direction:column;gap:4px">전광판 안내 글 (선택)<input class="inp" id="sNotice" value="${esc(S.cfg.notice || '')}" placeholder="예) 12월 31일까지 1인 5개"></label>
        <label style="display:flex;flex-direction:row;gap:6px;align-items:center;font-size:13px;color:var(--text)"><input type="checkbox" id="sOn"${S.cfg.on !== false ? ' checked' : ''}> 주문 받기</label>
        <div><button class="btn pri" id="sSave" type="button">저장</button> <span style="font-size:12px;color:var(--t3)">할인율은 공홈 판매가(할인가) 기준 · 10원 단위 버림 · 바꾸면 그 뒤 주문부터</span></div></div></div>`;
    el.querySelectorAll('#aSeg button').forEach(b => b.onclick = () => { S.aFilter = b.dataset.f; paintAdmin(); });
    $('aReload').onclick = () => { S.all = null; paintAdmin(); loadAll().then(paintAdmin).catch(e => toast(e.message, true)); };
    $('sSave').onclick = async () => {
      const rates = {}; el.querySelectorAll('[data-rate]').forEach(i => { rates[i.dataset.rate] = Number(i.value); });
      try { const j = await fn({ action: 'config_save', by: ME(), cfg: { rates, ship: Number($('sShip').value), bank: $('sBank').value, account: $('sAcc').value, holder: $('sHolder').value, notice: $('sNotice').value, on: $('sOn').checked } }); S.cfg = j.cfg; paintBoard(); paintShop(); toast('저장했어요'); }
      catch (e) { toast('저장 못 함: ' + e.message, true); }
    };
    el.querySelectorAll('[data-act]').forEach(b => b.onclick = () => act(b.dataset.act, S.all.find(o => o.id === +b.closest('.ord').dataset.id), b));
  }
  async function act(a, o, btn) {
    if (!o) return;
    const by = ME() || '관리자';
    const up = n => { const i = S.all.findIndex(x => x.id === n.id); if (i >= 0) S.all[i] = n; paintAdmin(); };
    btn.disabled = true;
    try {
      if (a === 'pay' || a === 'unpay') up((await fn({ action: 'pay', id: o.id, paid: a === 'pay', by })).order);
      else if (a === 'rebook') { const j = await fn({ action: 'rebook', id: o.id, by }); if (j.order) up(j.order); toast(j.order && j.order.cj_status === 'booked' ? '접수했어요' : '접수 못 함 — ' + ((j.order && j.order.cj_detail) || ''), !(j.order && j.order.cj_status === 'booked')); }
      else if (a === 'erp') { await erpOut(Object.assign({}, o, { erp_status: 'wait' })); await loadAll(); paintAdmin(); }
      else if (a === 'undo') { await erpUndo(o); await loadAll(); paintAdmin(); toast('재고를 되돌렸어요'); }
      else if (a === 'cancel') {
        if (!confirm(`${o.no} ${o.buyer} 님 주문을 취소할까요?\n대한통운 접수도 취소하고, 뺀 재고는 ERP 에 되돌려요.`)) { btn.disabled = false; return; }
        const j = await fn({ action: 'cancel', id: o.id, by }); up(j.order);
        if (j.cj_msg) toast(j.cj_msg, true);
        if (o.erp_status === 'done' || o.erp_status === 'wait' || o.erp_status === 'fail') { try { await erpUndo(o); } catch (e) { toast('재고 되돌리기 못 함 — [재고 되돌리기] 를 다시 눌러 주세요 (' + e.message + ')', true); } }
        await loadAll(); paintAdmin(); if (!j.cj_msg) toast('취소했어요');
      }
    } catch (e) { toast(e.message, true); btn.disabled = false; }
  }

  /* ── 화면 전환 ── */
  function go(v) {
    S.view = v; $('vShop').hidden = v !== 'shop'; $('vMine').hidden = v !== 'mine'; $('vAdmin').hidden = v !== 'admin';
    [['tabShop', 'shop'], ['tabMine', 'mine'], ['tabAdmin', 'admin']].forEach(([id, k]) => $(id).classList.toggle('pri', v === k));
    $('cartBtn').classList.toggle('pri', true);
    if (v === 'shop') paintShop();
    if (v === 'mine') { paintMine(); loadMine().then(paintMine).catch(e => { $('mine').innerHTML = `<div class="empty">못 불러왔어요 — ${esc(e.message)}</div>`; }); }
    if (v === 'admin') { paintAdmin(); loadAll().then(paintAdmin).catch(e => { $('vAdmin').innerHTML = `<div class="empty">못 불러왔어요 — ${esc(e.message)}</div>`; }); }
    scrollTo(0, 0);
  }
  $('tabShop').onclick = () => go('shop'); $('tabMine').onclick = () => go('mine'); $('tabAdmin').onclick = () => go('admin');

  /* ── 잠금 · 시작 ── */
  function isUnlocked() { if (window.__inOffice) return true; return lsGet('brightbeed_unlocked') === '1' && (lsGet('brightbeed_role') === 'master' || lsGet('brightbeed_viewer_ver') === '2') && lsGet('brightbeed_auth_ver') === AUTH_VERSION && !(lsGet('brightbeed_role') === 'master' && lsGet('brightbeed_master_ver') !== MASTER_PIN_VER); }
  async function sha256hex(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
  $('lockForm').addEventListener('submit', async e => {
    e.preventDefault(); const v = $('lockPin').value.trim(); let role = null;
    try { role = PIN_HASH[await sha256hex(v)] || null; } catch (err) { role = null; }
    if (!role) { $('lockErr').textContent = '접속 코드가 올바르지 않아요'; $('lockPin').value = ''; $('lockPin').focus(); return; }
    if (role !== 'master' && window.BossGuard) BossGuard.drop();
    if (role !== 'master') lsSet('brightbeed_viewer_ver', '2'); lsSet('brightbeed_role', role); lsSet('brightbeed_auth_ver', AUTH_VERSION); if (role === 'master') lsSet('brightbeed_master_ver', MASTER_PIN_VER); lsSet('brightbeed_unlocked', '1');
    $('lock').hidden = true; start();
  });
  /* 대표 전용 — 대표가 아니면 아무것도 안 불러오고 '준비 중'만 (직원에게 열 때 STAFF_OPEN = true) */
  const STAFF_OPEN = false;
  async function start() {
    if (!STAFF_OPEN && !isAdmin()) { $('stamp').textContent = ''; $('cartBtn').hidden = $('tabShop').hidden = $('tabMine').hidden = true; $('board').hidden = true; document.body.insertAdjacentHTML('beforeend', '<div class="empty" style="margin:40px 16px">준비 중인 화면이에요</div>'); return; }
    $('tabAdmin').hidden = !isAdmin();
    try { await Promise.all([loadItems(false), loadCfg()]); } catch (e) {
      $('stamp').className = 'stamp bad'; $('stamp').style.display = 'block';
      $('stamp').innerHTML = '못 불러왔어요 — ' + esc(e.message) + ' <button class="btn" id="retry" type="button">다시</button>'; $('retry').onclick = () => { S.base = ''; $('stamp').textContent = '불러오는 중…'; start(); }; return;
    }
    $('app').hidden = false; stamp(); paintBoard(); paintCartN(); go(S.view);
    if (S.cart.length) paintCartN();
    loadMine().catch(() => {});
    if (start.on) return; start.on = true;
    // 5분마다 상품 · 재고 — 안 보일 때 · 입력 중 · 주문 넣는 중엔 다시 그리지 않음
    setInterval(() => {
      const a = document.activeElement; if (document.hidden || S.busy || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.id !== 'q')) return;
      Promise.all([loadItems(false), loadCfg()]).then(() => { stamp(); paintBoard(); if (S.view === 'shop') paintShop(); if ($('side').classList.contains('open') && !(document.activeElement && /INPUT/.test(document.activeElement.tagName))) paintSide(); }).catch(() => {});
    }, 5 * 60e3);
  }
  if (isUnlocked()) start(); else { $('lock').hidden = false; setTimeout(() => $('lockPin').focus(), 50); }
})();
</script>
</body>
</html>
